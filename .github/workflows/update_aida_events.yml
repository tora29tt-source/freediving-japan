name: Update AIDA Events

on:
  schedule:
    # 毎日 JST 08:00 (UTC 23:00 前日) に実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Install xvfb (仮想ディスプレイ)
        run: sudo apt-get install -y xvfb

      - name: Fetch AIDA events (headless=False + xvfb)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            python3 scripts/fetch_aida_events.py --year 2026

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/aida_events_2026.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git commit -m "chore: update AIDA events $(date -u +%Y-%m-%d)"
          # 実行中に他ワークフローがpushしていても競合しないよう、rebaseしてから最大5回リトライ
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "push成功 (試行 $i)"; exit 0; }
            echo "push競合。リトライします ($i/5)..."
            sleep $((RANDOM % 5 + 3))
          done
          echo "5回試行してもpushに失敗しました" >&2
          exit 1
