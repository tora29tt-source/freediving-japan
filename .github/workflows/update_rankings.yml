name: Update Rankings & Records

on:
  schedule:
    # 毎週月曜 JST 06:00 (UTC 日曜 21:00)
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: 今年のランキングを更新
        run: python3 scripts/fetch_all_rankings.py

      - name: 日本記録を更新
        run: python3 scripts/fetch_jp_records.py

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/rankings_*.json data/jp_official_records.json
          git diff --staged --quiet || git commit -m "chore: update rankings & records $(date -u +%Y-%m-%d)"
          git push
