name: Update Rankings & Records

on:
  schedule:
    # 毎日 JST 06:00 (UTC 前日 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests playwright beautifulsoup4
          python3 -m playwright install chromium --with-deps

      - name: 今年のランキングを更新
        run: python3 scripts/fetch_all_rankings.py

      - name: 日本記録を更新
        run: python3 scripts/fetch_jp_records.py

      - name: all_rankings_data.json を再生成
        run: python3 scripts/merge_rankings.py

      - name: ワイルドカードを更新
        run: python3 scripts/fetch_wildcards.py

      # 大会カレンダー(AIDA)取得は専用ワークフロー update_aida_events.yml が担当するため
      # ここでは実行しない（重複 & bot対策のためheadful+xvfbが必要なため）。

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/rankings_*.json data/jp_official_records.json data/national_team.json data/all_rankings_data.json data/wildcard_data.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git commit -m "chore: update rankings & records $(date -u +%Y-%m-%d)"
          # 実行中に他ワークフローがpushしていても競合しないよう、rebaseしてから最大5回リトライ
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "push成功 (試行 $i)"; exit 0; }
            echo "push競合。リトライします ($i/5)..."
            sleep $((RANDOM % 5 + 3))
          done
          echo "5回試行してもpushに失敗しました" >&2
          exit 1
