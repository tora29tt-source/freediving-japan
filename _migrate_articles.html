const articles = [{"title": "フリーダイビングのライセンスとは？種類・取り方・必要性を徹底解説", "slug": "freediving-license", "lead_text": "フリーダイビングのライセンス（資格）の種類、取り方、必要性を徹底解説。AIDA・PADIの違いから費用・日程まで。", "content": "<div class=\"breadcrumb\">\n  <a href=\"/\">ホーム</a>\n  <span>›</span>\n  <a href=\"/media/\">メディア</a>\n  <span>›</span>\n  フリーダイビングのライセンスとは\n</div>\n\n\n<div class=\"hero\">\n  <div class=\"hero-inner\">\n    <div class=\"hero-category\">入門・ライセンス</div>\n    <h1>フリーダイビングのライセンスとは？<br>種類・取り方・必要性を徹底解説</h1>\n    <div class=\"hero-meta\">\n      <span class=\"by\">By <strong>Freediving Japan 編集部</strong></span>\n      <span class=\"date\">2026年6月</span>\n      <span class=\"read-time\">約10分で読めます</span>\n    </div>\n  </div>\n</div>\n\n\n<div class=\"article-wrap\">\n\n  \n  <p class=\"lead\">\n    「フリーダイビングにもライセンスがあるの？」——スキューバのCカードは知っていても、フリーダイビングにも認定資格があることを知らない人は多い。実はフリーダイビングのライセンスは、単なるお墨付きではなく、不安を解消し、自分の限界を知り、安全に水中世界を楽しむための実践的なスキルパッケージだ。この記事では、認定団体の違い、レベル別の取得内容、費用・期間の目安、そして「結局どこで取ればいいのか」に答えていく。\n  </p>\n\n  \n  <div class=\"toc\">\n    <div class=\"toc-title\">この記事の内容</div>\n    <ol>\n      <li><a href=\"#why\">ライセンスがなくても潜れる。でも、なぜ取るのか</a></li>\n      <li><a href=\"#orgs\">主な認定団体は4つ</a></li>\n      <li><a href=\"#table\">団体別・レベル早見表</a></li>\n      <li><a href=\"#detail\">各団体の特徴を詳しく</a></li>\n      <li><a href=\"#cost\">費用と期間の目安</a></li>\n      <li><a href=\"#choose\">どの団体を選ぶべきか</a></li>\n    </ol>\n  </div>\n\n  <div class=\"article-body\">\n\n    \n    <h2 id=\"why\">ライセンスがなくても潜れる。でも、なぜ取るのか</h2>\n\n    <p>まず大前提として、フリーダイビング（息こらえ潜水）そのものに法的な資格要件はない。素潜りは誰でもできる。</p>\n\n    <p>それでも世界中のダイバーがライセンスを取得するのには理由がある。耳抜きを自己流でやり続けることは耳のトラブルの最大要因になるし、ブラックアウト（水中失神）のリスクを知らないまま潜ることは、本当に命に直結する。</p>\n\n    <div class=\"pullquote\">\n      <p>フリーダイビングは「気合と根性」でなんとかなる競技ではない。生理学的な知識もバディシステムもないまま一人で潜ると、本当に簡単に人は死ぬ。</p>\n    </div>\n\n    <p>ブラックアウトは本人に自覚症状がほとんどないまま起こり、水面でも水中でも一瞬で意識を失う。誰かがそばにいて、正しい救助の手順を知っていなければ、それだけで命を落とす。講習では生理学とバディシステムを体系的に学べる——これがライセンスを取る最大の理由だ。</p>\n\n    <p>もう一つ見落とされがちなのが、<strong>インストラクターから直接フィードバックをもらえる価値</strong>だ。耳抜きのコツも、力の抜き方も、フィンキックの効率も、文章や動画だけでは伝わりきらない。「肩に力が入りすぎている」「フィンキックが膝から曲がっている」——こうした的確な指摘は独学では絶対に得られない。ライセンス講習の本当の価値は、紙の認定証ではなくこの「目の前で見てもらえる時間」にある。</p>\n\n    <p>そして実務的な理由として、<strong>多くのダイビングショップやリゾートは一定レベルの認定がないと深く潜らせてくれない</strong>。海外の有名なディーププール施設も同様で、ライセンスの提示がないと利用自体を断られることが珍しくない。タンクを使わない自由な潜水だからこそ、「どこまで潜れる人か」を客観的に示す手段が必要になる。</p>\n\n    \n    <h2 id=\"orgs\">主な認定団体は4つ</h2>\n\n    <p>フリーダイビングのライセンスを発行している団体は世界に複数あるが、日本でよく見かけるのは<strong>AIDA International・PADI・SSI・Apnea Academy</strong>の4つだ。</p>\n\n    <div class=\"info-box\">\n      <div class=\"info-box-title\">💡 団体選びに優劣はない</div>\n      <p>スキューバダイビングと同じく、指導団体そのものに大きな質の差はないとされている。重要なのは「どの団体か」より「どのインストラクター・ショップか」だ。</p>\n      <p>また、一度ある団体でライセンスを取得しても縛られるわけではない。団体間のクロスオーバー（乗り換え）はいつでも可能で、AIDAで取得した後にApnea Academyで上のレベルを受講する、といった形も珍しくない。<strong>「最初に選んだ団体で一生固定」と気負う必要はまったくない。</strong></p>\n    </div>\n\n    \n    <h2 id=\"table\">団体別・レベル早見表</h2>\n\n    <p>団体ごとに名称や基準は異なるが、いずれも「初級→中級→上級」の3段階構造を軸にしている。</p>\n\n    <div class=\"level-table-wrap\">\n      <table class=\"level-table\">\n        <thead>\n          <tr>\n            <th style=\"width:28%\">レベル</th>\n            <th style=\"width:20%\">深度の目安</th>\n            <th style=\"width:30%\">プール種目の目安</th>\n            <th style=\"width:22%\">期間目安</th>\n          </tr>\n        </thead>\n        <tbody>\n\n          \n          <tr class=\"org-row\">\n            <td colspan=\"4\">\n              AIDA International\n              <span class=\"org-badge\">世界記録認定機関</span>\n            </td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">AIDA 1</span>\n              <span class=\"level-sub\">入門</span>\n            </td>\n            <td><span class=\"depth-badge\">〜10m</span></td>\n            <td>基礎的な息こらえ、フィンワーク</td>\n            <td>1日</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">AIDA 2</span>\n              <span class=\"level-sub\">初級</span>\n            </td>\n            <td><span class=\"depth-badge\">16〜20m</span></td>\n            <td>STA 2分 ／ DYN 40m</td>\n            <td>2〜3日</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">AIDA 3</span>\n              <span class=\"level-sub\">中級</span>\n            </td>\n            <td><span class=\"depth-badge\">24〜30m</span></td>\n            <td>STA 2分45秒 ／ DYN 60m</td>\n            <td>2〜3日</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">AIDA 4 以上</span>\n              <span class=\"level-sub\">上級〜競技</span>\n            </td>\n            <td><span class=\"depth-badge\">30m〜</span></td>\n            <td>パッキング、アシスタントインストラクター養成</td>\n            <td>数日〜</td>\n          </tr>\n\n          \n          <tr class=\"org-row\">\n            <td colspan=\"4\">\n              PADI\n              <span class=\"org-badge\">世界最大の認定団体</span>\n            </td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">フリーダイバー</span>\n              <span class=\"level-sub\">初級</span>\n            </td>\n            <td><span class=\"depth-badge\">10〜15m</span></td>\n            <td>STA 1分30秒 ／ DYN 25m</td>\n            <td>1〜2日</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">アドバンスド</span>\n              <span class=\"level-sub\">中級</span>\n            </td>\n            <td><span class=\"depth-badge\">20〜24m</span></td>\n            <td>STA 2分30秒 ／ DYN 50m</td>\n            <td>2〜3日</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">マスター</span>\n              <span class=\"level-sub\">上級</span>\n            </td>\n            <td><span class=\"depth-badge\">エリート準備</span></td>\n            <td>ライフスタイル・トレーニング調整、CPR必須</td>\n            <td>数日</td>\n          </tr>\n\n          \n          <tr class=\"org-row\">\n            <td colspan=\"4\">\n              SSI\n              <span class=\"org-badge\">世界共通プログラム</span>\n            </td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">レベル1〜</span>\n              <span class=\"level-sub\">初級〜上級</span>\n            </td>\n            <td><span class=\"depth-badge\">段階による</span></td>\n            <td>AIDA・PADIと同様の段階制、世界共通プログラム</td>\n            <td>段階による</td>\n          </tr>\n\n          \n          <tr class=\"org-row\">\n            <td colspan=\"4\">\n              Apnea Academy\n              <span class=\"org-badge\">ウンベルト・ペリッツァーリ創設</span>\n            </td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">ファーストレベル</span>\n              <span class=\"level-sub\">初級</span>\n            </td>\n            <td><span class=\"depth-badge\">〜10m前後</span></td>\n            <td>DYN 30m ／ DNF 25m ／ STA 1分45秒</td>\n            <td>3日（プール2+海洋1）</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">セカンドレベル</span>\n              <span class=\"level-sub\">中級</span>\n            </td>\n            <td><span class=\"depth-badge\">より深く</span></td>\n            <td>上級耳抜き、フリーイマージョン</td>\n            <td>2日</td>\n          </tr>\n          <tr>\n            <td>\n              <span class=\"level-name\">サードレベル</span>\n              <span class=\"level-sub\">上級〜競技</span>\n            </td>\n            <td><span class=\"depth-badge\">競技レベル</span></td>\n            <td>競技種目を通じたリラックスの追求、自立した安全管理</td>\n            <td>要相談</td>\n          </tr>\n\n        </tbody>\n      </table>\n    </div>\n\n    <div class=\"table-note\">\n      ※ <strong>STA</strong>：静止した息こらえ（水面）　<strong>DYN</strong>：フィンありの水平潜水　<strong>DNF</strong>：フィンなし水平潜水　<strong>CWT</strong>：垂直潜水（錘あり）<br>\n      数値は各ショップ・講習によって多少前後する。正式な検定基準は受講予定の団体・ショップで必ず確認してほしい。\n    </div>\n\n    \n    <h2 id=\"detail\">各団体の特徴を詳しく</h2>\n\n    <div class=\"org-cards\">\n\n      <div class=\"org-card\">\n        <div class=\"org-card-header\">\n          <div class=\"org-icon\">AIDA</div>\n          <div>\n            <div class=\"org-name\">AIDA International</div>\n            <div class=\"org-tagline\">競技フリーダイビングの世界基準を作る機関</div>\n          </div>\n        </div>\n        <div class=\"org-card-body\">\n          <p>世界最大のフリーダイビング記録認定機関であり、公式な深度記録や大会のほとんどがAIDAルールに基づいている。「いずれ大会に出たい」「記録を狙いたい」という人はAIDA系列が王道。記録認定の仕組みがそのまま使えるため、競技志向の人には一択に近い選択肢だ。</p>\n        </div>\n      </div>\n\n      <div class=\"org-card\">\n        <div class=\"org-card-header\">\n          <div class=\"org-icon\">PADI</div>\n          <div>\n            <div class=\"org-name\">PADI</div>\n            <div class=\"org-tagline\">スキューバでも世界最大。国際的な知名度の高さが強み</div>\n          </div>\n        </div>\n        <div class=\"org-card-body\">\n          <p>スキューバダイビングで世界最大のシェアを持つ指導団体で、フリーダイビング専用プログラムも展開している。各コースには明確な達成基準があり、STA・DYN・CWT（コンスタント・ウェイト）それぞれにタイムや距離の条件が設定されている。苦手種目だけの再受講で合格することも可能だ。</p>\n        </div>\n      </div>\n\n      <div class=\"org-card\">\n        <div class=\"org-card-header\">\n          <div class=\"org-icon\">SSI</div>\n          <div>\n            <div class=\"org-name\">SSI（Scuba Schools International）</div>\n            <div class=\"org-tagline\">1970年設立。世界共通の段階制プログラム</div>\n          </div>\n        </div>\n        <div class=\"org-card-body\">\n          <p>もともとPADI出身者が立ち上げた団体として知られる。フリーダイビング部門でもAIDAやPADIと同様の段階制プログラムを提供しており、世界中のショップで共通の基準が使われている。</p>\n        </div>\n      </div>\n\n      <div class=\"org-card\">\n        <div class=\"org-card-header\">\n          <div class=\"org-icon\" style=\"font-size:10px;letter-spacing:-.3px;\">AA</div>\n          <div>\n            <div class=\"org-name\">Apnea Academy</div>\n            <div class=\"org-tagline\">ジャック・マイヨールの系譜。指導品質へのこだわり</div>\n          </div>\n        </div>\n        <div class=\"org-card-body\">\n          <p>イタリアに本拠地を置く、ジャック・マイヨールの愛弟子ウンベルト・ペリッツァーリが創設したフリーダイビング専門の教育団体。アジア支部のアプネア・アカデミー・ジャパン（AAJ）はプロフリーダイバー松元恵選手が中心となり、日本含めアジア各国を統括している。<br><br>最大の特徴は<strong>インストラクター・トレーナー制度を持たないこと</strong>。ウンベルトが自ら直接指導し、AAインストラクターとしてふさわしいと認めた者にしか認定を出さない。品質に対するこだわりが強く、ジャック・マイヨールの系譜というブランドとロマンに惹かれる人も多い。</p>\n        </div>\n      </div>\n\n    </div>\n\n    \n    <h2 id=\"cost\">費用と期間の目安</h2>\n\n    <div class=\"cost-grid\">\n      <div class=\"cost-card\">\n        <div class=\"cost-label\">入門コース（1日）</div>\n        <div class=\"cost-amount\">2.5〜3万円</div>\n        <div class=\"cost-sub\">講習料・教材・認定料込み</div>\n      </div>\n      <div class=\"cost-card\">\n        <div class=\"cost-label\">中級コース（2〜3日）</div>\n        <div class=\"cost-amount\">5〜8万円</div>\n        <div class=\"cost-sub\">AIDA3相当・地域によって変動</div>\n      </div>\n    </div>\n\n    <p>費用はショップや地域によって変動するため、あくまで目安として参照してほしい。体験コースから始めて相性を確かめてから本コースに進む、というルートも一般的だ。</p>\n\n    \n    <h2 id=\"choose\">どの団体を選ぶべきか</h2>\n\n    <p>迷ったら、次の3つの軸で考えるとシンプルだ。</p>\n\n    <ul class=\"choice-list\">\n      <li>\n        <div class=\"choice-num\">1</div>\n        <div class=\"choice-body\">\n          <div class=\"choice-cond\">将来、大会や公式記録を狙いたい</div>\n          <div class=\"choice-rec\">→ AIDA 一択。記録認定の仕組みがそのまま使える。</div>\n        </div>\n      </li>\n      <li>\n        <div class=\"choice-num\">2</div>\n        <div class=\"choice-body\">\n          <div class=\"choice-cond\">スキューバも含めて世界共通の知名度を重視したい</div>\n          <div class=\"choice-rec\">→ PADI または SSI。海外でも通用する認知度の高さが強み。</div>\n        </div>\n      </li>\n      <li>\n        <div class=\"choice-num\">3</div>\n        <div class=\"choice-body\">\n          <div class=\"choice-cond\">指導の質や専門性、コミュニティの濃さを重視したい</div>\n          <div class=\"choice-rec\">→ Apnea Academy。ジャック・マイヨールの系譜を継ぐウンベルト直系というブランドに惹かれる人も多い。</div>\n        </div>\n      </li>\n    </ul>\n\n    <p>そして最も大事なのは<strong>団体名より「誰に教わるか」</strong>だ。フリーダイビングは耳抜き・力の抜き方・恐怖心のコントロールなど、座学だけでは身につかない感覚的な要素が大きい。体験講習や無料説明会でインストラクターとの相性を確かめてから決めることを強くすすめたい。</p>\n\n  </div>\n\n  \n  <div class=\"tags\">\n    <a href=\"#\" class=\"tag\">ライセンス</a>\n    <a href=\"#\" class=\"tag\">AIDA</a>\n    <a href=\"#\" class=\"tag\">PADI</a>\n    <a href=\"#\" class=\"tag\">SSI</a>\n    <a href=\"#\" class=\"tag\">Apnea Academy</a>\n    <a href=\"#\" class=\"tag\">初心者</a>\n    <a href=\"#\" class=\"tag\">認定資格</a>\n    <a href=\"#\" class=\"tag\">始め方</a>\n  </div>\n\n  \n  <div class=\"cta-box\">\n    <h3>スクール・インストラクターを探す</h3>\n    <p>全国のフリーダイビングスクール・インストラクターをFreediving Japanで検索できます。</p>\n    <a href=\"/explore/\" class=\"cta-btn\">スクールを探してみる →</a>\n  </div>\n\n  \n  <div class=\"author-box\">\n    <div class=\"author-icon\">🌊</div>\n    <div class=\"author-info\">\n      <div class=\"name\">Freediving Japan 編集部</div>\n      <div class=\"desc\">日本記録保持者・寺島拓哉が設立したフリーダイビングプラットフォーム「Freediving Japan」の編集部。競技者・インストラクター・初心者が使える情報と道具を届けます。</div>\n    </div>\n  </div>\n\n  \n  <div class=\"related\">\n    <div class=\"related-title\">関連記事</div>\n    <div class=\"related-list\">\n      <a href=\"/articles/article-what-is-freediving.html\" class=\"related-item\">\n        <div>\n          <div class=\"r-cat\">入門・基礎知識</div>\n          <div class=\"r-title\">フリーダイビングとは？スキューバとの違い、始め方まで</div>\n        </div>\n        <span class=\"arrow\">›</span>\n      </a>\n      <a href=\"#\" class=\"related-item\">\n        <div>\n          <div class=\"r-cat\">入門・体験</div>\n          <div class=\"r-title\">「耳抜きができない」を解決する3つのアプローチ</div>\n        </div>\n        <span class=\"arrow\">›</span>\n      </a>\n      <a href=\"#\" class=\"related-item\">\n        <div>\n          <div class=\"r-cat\">人物メディア</div>\n          <div class=\"r-title\">IBM辞めてフリーダイバーになった話——収入・不安・後悔してるか</div>\n        </div>\n        <span class=\"arrow\">›</span>\n      </a>\n    </div>\n  </div>\n\n</div>", "category": "A", "tags": ["ライセンス", "資格", "AIDA", "PADI", "入門"], "read_time_min": 10, "author_type": "Freediving Japan 編集部", "is_published": true, "status": "published", "published_at": "2026-06-20T00:00:00+09:00", "updated_at": "2026-06-20T00:00:00+09:00"}];

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  log('ログイン中...');
  const { error } = await _sb.auth.signInWithPassword({ email, password });
  if (error) {
    log('ログインエラー: ' + error.message);
    return;
  }
  log('ログイン成功。インポート開始...');
  await runImport();
}

async function runImport() {
  for (const a of articles) {
    const { data: existing } = await _sb.from('articles').select('id').eq('slug', a.slug).maybeSingle();
    if (existing) {
      log(`SKIP: ${a.slug} はすでに存在します`);
      continue;
    }
    const { data, error } = await _sb.from('articles').insert(a).select('id').single();
    if (error) {
      log(`ERROR: ${a.slug} → ${error.message}`);
    } else {
      log(`OK: ${a.slug} → id=${data.id.slice(0,8)}`);
    }
  }
  log('完了 ✅');
}
</script>
</body>
