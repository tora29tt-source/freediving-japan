<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>メディア管理 — Freediving Japan</title>
<style>
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --foam:        #f0f9fb;
  --warm:        #f97316;
  --sand:        #fdf8f2;
  --radius: 10px;
  --font: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: #f0f4f7; color: var(--ocean-deep); min-height: 100vh; padding-bottom: 80px; }

/* HEADER */
.header {
  background: var(--ocean-deep);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; background: var(--teal); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
.header-title { color: white; font-size: 14px; font-weight: 600; }
.header-sub { color: var(--teal-light); font-size: 11px; opacity: .7; }

/* STATS BAR */
.stats-bar {
  background: var(--ocean-mid);
  padding: 10px 16px;
  display: flex; gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat {
  flex: 1; min-width: 64px;
  text-align: center;
  padding: 6px 8px;
  border-right: 1px solid rgba(255,255,255,.1);
}
.stat:last-child { border-right: none; }
.stat .n { font-size: 20px; font-weight: 700; color: var(--teal); line-height: 1; }
.stat .l { font-size: 10px; color: rgba(255,255,255,.5); margin-top: 2px; }
.progress-bar-wrap { padding: 8px 16px; background: var(--ocean-mid); }
.progress-track { background: rgba(255,255,255,.1); border-radius: 4px; height: 4px; }
.progress-fill { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--teal), #0b9488); transition: width .6s; }
.progress-label { display: flex; justify-content: space-between; margin-top: 4px; }
.progress-label span { font-size: 10px; color: rgba(255,255,255,.4); }

/* CONTROLS */
.controls { background: white; padding: 10px 16px; border-bottom: 1px solid #e4eaf0; position: sticky; top: 48px; z-index: 90; }
.search-wrap { position: relative; margin-bottom: 8px; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .35; pointer-events: none; }
.search-wrap input {
  width: 100%; padding: 9px 10px 9px 32px;
  border: 1.5px solid #dde3ea; border-radius: 8px;
  font-size: 14px; font-family: var(--font);
  outline: none; transition: border-color .15s;
}
.search-wrap input:focus { border-color: var(--teal); }

.filter-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filter-scroll::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid #dde3ea; background: white;
  font-size: 12px; font-family: var(--font); font-weight: 500;
  cursor: pointer; color: #5a6a7a; white-space: nowrap;
  transition: all .15s;
}
.chip.active { background: var(--ocean-deep); border-color: var(--ocean-deep); color: white; }
.chip.cat-A.active { background: #6366f1; border-color: #6366f1; }
.chip.cat-B.active { background: #ec4899; border-color: #ec4899; }
.chip.cat-C.active { background: #10b981; border-color: #10b981; }
.chip.cat-D.active { background: #f59e0b; border-color: #f59e0b; }
.chip.cat-E.active { background: #f97316; border-color: #f97316; }
.chip.cat-P.active { background: #8b5cf6; border-color: #8b5cf6; }
.chip.cat-Q.active { background: #06b6d4; border-color: #06b6d4; }
.chip.cat-S.active { background: #0ea5e9; border-color: #0ea5e9; }
.chip.cat-T.active { background: #f43f5e; border-color: #f43f5e; }

/* COUNT */
.list-meta { padding: 8px 16px 4px; display: flex; justify-content: space-between; align-items: center; }
.list-meta span { font-size: 12px; color: #8a97a6; }
.sort-btn { font-size: 12px; color: var(--ocean-light); background: none; border: none; font-family: var(--font); cursor: pointer; }

/* LIST */
.article-list { padding: 0 12px; }
.article-item {
  background: white; border-radius: 10px; margin-bottom: 6px;
  overflow: hidden; box-shadow: 0 1px 3px rgba(11,45,69,.06);
  transition: box-shadow .15s;
}
.article-item.priority { border-left: 3px solid var(--warm); }
.article-main {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer;
}
.article-left { flex: 1; min-width: 0; }
.article-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cat-dot.A { background: #6366f1; }
.cat-dot.B { background: #ec4899; }
.cat-dot.C { background: #10b981; }
.cat-dot.D { background: #f59e0b; }
.cat-dot.E { background: #f97316; }
.cat-dot.P { background: #8b5cf6; }
.cat-dot.Q { background: #06b6d4; }
.cat-dot.S { background: #0ea5e9; }
.cat-dot.T { background: #f43f5e; }
.cat-label { font-size: 10px; color: #8a97a6; font-weight: 500; }
.star { font-size: 11px; color: var(--warm); }
.article-title { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--ocean-deep); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.article-keyword { font-size: 11px; color: var(--ocean-light); margin-top: 3px; opacity: .7; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.article-right { flex-shrink: 0; }

/* status pill tap */
.status-pill {
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; font-family: var(--font);
  border: none; cursor: pointer; white-space: nowrap;
}
.s-todo { background: #f1f5f9; color: #64748b; }
.s-wip  { background: #fef3c7; color: #d97706; }
.s-done { background: #ccfbf1; color: #0e9488; }
.s-live { background: var(--teal-light); color: var(--ocean-deep); }

/* EXPAND */
.article-expand { display: none; padding: 0 12px 12px; border-top: 1px solid #f0f4f7; }
.article-expand.open { display: block; }
.expand-row { margin-top: 10px; }
.expand-label { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #a0aeba; margin-bottom: 4px; }
.expand-text { font-size: 13px; color: #5a6a7a; }
.memo-field {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid #e4eaf0; border-radius: 8px;
  font-size: 13px; font-family: var(--font); color: var(--ocean-deep);
  outline: none; resize: none;
}
.memo-field:focus { border-color: var(--teal); }
.status-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.status-opt {
  padding: 6px 14px; border-radius: 20px; border: 1.5px solid #e4eaf0;
  font-size: 12px; font-family: var(--font); font-weight: 600;
  background: white; cursor: pointer; transition: all .15s;
}
.status-opt.sel-todo { background: #f1f5f9; border-color: #64748b; color: #64748b; }
.status-opt.sel-wip  { background: #fef3c7; border-color: #d97706; color: #d97706; }
.status-opt.sel-done { background: #ccfbf1; border-color: #0e9488; color: #0e9488; }
.status-opt.sel-live { background: var(--teal-light); border-color: var(--ocean-mid); color: var(--ocean-mid); }
.expand-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
.expand-btn {
  padding: 7px 14px; border-radius: 8px; border: none;
  font-size: 12px; font-family: var(--font); font-weight: 600;
  cursor: pointer;
}
.btn-delete { background: #fef2f2; color: #ef4444; }
.btn-save   { background: var(--teal); color: white; }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--teal); color: white;
  border: none; font-size: 24px; line-height: 1;
  box-shadow: 0 4px 16px rgba(46,196,182,.4);
  cursor: pointer; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, background .15s;
}
.fab:active { transform: scale(.93); background: #25a99c; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(11,45,69,.5); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white; border-radius: 18px 18px 0 0;
  width: 100%; max-height: 90vh; overflow-y: auto;
  padding-bottom: env(safe-area-inset-bottom, 16px);
  animation: slideUp .2s ease;
}
@keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
.modal-handle { width: 36px; height: 4px; background: #dde3ea; border-radius: 2px; margin: 12px auto 4px; }
.modal-header { padding: 8px 20px 14px; border-bottom: 1px solid #f0f4f7; display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 18px; color: #b0bec5; padding: 4px 8px; cursor: pointer; }
.modal-body { padding: 16px 20px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #7a8fa0; margin-bottom: 5px; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid #dde3ea; border-radius: 8px;
  font-size: 14px; font-family: var(--font);
  outline: none; color: var(--ocean-deep);
  transition: border-color .15s;
  -webkit-appearance: none;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--teal); }
.form-row textarea { min-height: 70px; resize: none; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.priority-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5a6a7a; }
.priority-check input { accent-color: var(--warm); width: 16px; height: 16px; }
.modal-footer { padding: 10px 20px 16px; display: flex; gap: 10px; }
.modal-footer .btn-ghost { flex: 1; padding: 12px; background: var(--foam); color: #5a6a7a; border: none; border-radius: 10px; font-size: 14px; font-family: var(--font); font-weight: 600; cursor: pointer; }
.modal-footer .btn-primary { flex: 2; padding: 12px; background: var(--teal); color: white; border: none; border-radius: 10px; font-size: 14px; font-family: var(--font); font-weight: 600; cursor: pointer; }

/* EMPTY */
.empty { text-align: center; padding: 48px 16px; color: #b0bec5; font-size: 14px; }

/* TOAST */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--ocean-deep); color: white;
  padding: 10px 20px; border-radius: 20px; font-size: 13px;
  z-index: 300; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="dot"></div>
    <span class="header-title">メディア管理</span>
  </div>
  <span class="header-sub">Freediving Japan</span>
</header>

<div class="stats-bar" id="statsBar"></div>
<div class="progress-bar-wrap" id="progressWrap"></div>

<div class="controls">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="タイトル・キーワードで検索…" oninput="renderList()">
  </div>
  <div class="filter-scroll" id="filterRow"></div>
</div>

<div class="list-meta">
  <span id="listCount"></span>
  <button class="sort-btn" onclick="cycleSort()">並び替え: <span id="sortLabel">番号順</span></button>
</div>

<div class="article-list" id="articleList"></div>

<button class="fab" onclick="openModal()" title="記事を追加">＋</button>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modalTitle">記事を追加</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>タイトル</label>
        <input type="text" id="f_title" placeholder="記事タイトルを入力…">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>カテゴリ</label>
          <select id="f_category">
            <option value="A">A. 入門・体験</option>
            <option value="B">B. 身体・科学</option>
            <option value="C">C. 海・スポット</option>
            <option value="D">D. 競技・大会</option>
            <option value="E">E. インタビュー</option>
            <option value="P">P. 人物メディア</option>
            <option value="Q">Q. 業界×期待感</option>
            <option value="S">S. シリーズ連載</option>
            <option value="T">T. エンタメ</option>
          </select>
        </div>
        <div class="form-row">
          <label>ステータス</label>
          <select id="f_status">
            <option value="todo">未着手</option>
            <option value="wip">執筆中</option>
            <option value="done">完成</option>
            <option value="live">公開済み</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>キーワード</label>
        <input type="text" id="f_keyword" placeholder="例：フリーダイビング 始め方">
      </div>
      <div class="form-row">
        <label>ターゲット層</label>
        <input type="text" id="f_target" placeholder="例：完全初心者">
      </div>
      <div class="form-row">
        <label>メモ</label>
        <textarea id="f_memo" placeholder="ポイント・進捗メモなど…"></textarea>
      </div>
      <div class="form-row">
        <label class="priority-check">
          <input type="checkbox" id="f_priority">
          優先記事（★）
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn-primary" onclick="saveArticle()">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let articles = [];
let nextId   = 87;
let currentFilter = 'all';
let priorityOnly  = false;
let sortIdx  = 0;
let expandedId = null;
let editingId  = null;

function load() {
  const s = localStorage.getItem('fdj_media_v3');
  if (s) { const p = JSON.parse(s); articles = p.articles; nextId = p.nextId || 87; }
  else   { articles = DEFAULT_ARTICLES.map(a=>({...a})); save(); }
}
function save() {
  localStorage.setItem('fdj_media_v3', JSON.stringify({articles, nextId}));
}

function renderStats() {
  const total = articles.length;
  const live  = articles.filter(a=>a.status==='live').length;
  const done  = articles.filter(a=>a.status==='done').length;
  const wip   = articles.filter(a=>a.status==='wip').length;
  const pct   = Math.round((live/total)*100);
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">記事数</div></div>
    <div class="stat"><div class="n" style="color:#f97316">${wip}</div><div class="l">執筆中</div></div>
    <div class="stat"><div class="n" style="color:#0e9488">${done}</div><div class="l">完成</div></div>
    <div class="stat"><div class="n" style="color:#a8ece8">${live}</div><div class="l">公開済み</div></div>
  `;
  document.getElementById('progressWrap').innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>公開進捗 ${pct}%</span><span>${live} / ${total} 本</span></div>
  `;
}

function renderFilters() {
  const cats = ['all','A','B','C','D','E','P','Q','S','T'];
  const labels = {all:'すべて', A:'A 入門', B:'B 身体', C:'C 海', D:'D 競技', E:'E インタビュー', P:'P 人物', Q:'Q 期待感', S:'S 連載', T:'T エンタメ'};
  document.getElementById('filterRow').innerHTML =
    cats.map(c=>`<button class="chip ${c==='all'?'':'cat-'+c} ${currentFilter===c?'active':''}" onclick="setFilter('${c}',this)">${labels[c]}</button>`).join('')
    + `<button class="chip ${priorityOnly?'active':''}" onclick="togglePriority(this)">★ 優先</button>`;
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return articles.filter(a=>{
    if (currentFilter!=='all' && a.category!==currentFilter) return false;
    if (priorityOnly && !a.priority) return false;
    if (q && !a.title.toLowerCase().includes(q) && !(a.keyword||'').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    const k = SORTS[sortIdx];
    if (k==='status') return STATUS_ORDER[a.status]-STATUS_ORDER[b.status];
    if (k==='category') return a.category.localeCompare(b.category);
    return a.id-b.id;
  });
}

function renderList() {
  const filtered = getFiltered();
  document.getElementById('listCount').textContent = `${filtered.length} 件`;
  document.getElementById('sortLabel').textContent = SORT_LABELS[SORTS[sortIdx]];

  if (!filtered.length) {
    document.getElementById('articleList').innerHTML = '<div class="empty">条件に一致する記事がありません</div>';
    return;
  }

  document.getElementById('articleList').innerHTML = filtered.map(a=>{
    const isOpen = expandedId===a.id;
    return `
    <div class="article-item ${a.priority?'priority':''}" id="item-${a.id}">
      <div class="article-main" onclick="toggleExpand(${a.id})">
        <div class="article-left">
          <div class="article-top">
            <div class="cat-dot ${a.category}"></div>
            <span class="cat-label">${CAT_LABELS[a.category]||a.category}</span>
            ${a.priority?'<span class="star">★</span>':''}
          </div>
          <div class="article-title">${esc(a.title)}</div>
          ${a.keyword?`<div class="article-keyword">${esc(a.keyword)}</div>`:''}
        </div>
        <div class="article-right">
          <button class="status-pill s-${a.status}" onclick="quickStatus(event,${a.id})">${STATUS_LABELS[a.status]}</button>
        </div>
      </div>
      <div class="article-expand ${isOpen?'open':''}" id="expand-${a.id}">
        ${a.target?`<div class="expand-row"><div class="expand-label">ターゲット</div><div class="expand-text">${esc(a.target)}</div></div>`:''}
        <div class="expand-row">
          <div class="expand-label">ステータスを変更</div>
          <div class="status-row">
            ${['todo','wip','done','live'].map(s=>`<button class="status-opt ${a.status===s?'sel-'+s:''}" onclick="setStatus(${a.id},'${s}')">${STATUS_LABELS[s]}</button>`).join('')}
          </div>
        </div>
        <div class="expand-row">
          <div class="expand-label">メモ</div>
          <textarea class="memo-field" id="memo-${a.id}" rows="2">${esc(a.memo)}</textarea>
        </div>
        <div class="expand-actions">
          <button class="expand-btn btn-delete" onclick="deleteArticle(${a.id})">削除</button>
          <button class="expand-btn btn-save" onclick="openModal(${a.id})">編集</button>
          <button class="expand-btn btn-save" onclick="saveMemo(${a.id})">メモ保存</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleExpand(id) {
  expandedId = expandedId===id ? null : id;
  renderList();
}

function quickStatus(e, id) {
  e.stopPropagation();
  const order = ['todo','wip','done','live'];
  const a = articles.find(x=>x.id===id);
  a.status = order[(order.indexOf(a.status)+1)%4];
  save(); renderStats(); renderList();
  showToast(STATUS_LABELS[a.status]+'に変更');
}

function setStatus(id, val) {
  const a = articles.find(x=>x.id===id);
  a.status = val; save(); renderStats(); renderList();
  showToast(STATUS_LABELS[val]+'に変更');
}

function saveMemo(id) {
  const a = articles.find(x=>x.id===id);
  const el = document.getElementById('memo-'+id);
  if (el) { a.memo = el.value; save(); showToast('メモを保存しました'); }
}

function deleteArticle(id) {
  if (!confirm('この記事を削除しますか？')) return;
  articles = articles.filter(x=>x.id!==id);
  expandedId = null; save(); renderStats(); renderList();
  showToast('削除しました');
}

function setFilter(cat, btn) {
  currentFilter = cat; renderFilters(); renderList();
}

function togglePriority() {
  priorityOnly = !priorityOnly; renderFilters(); renderList();
}

function cycleSort() {
  sortIdx = (sortIdx+1)%SORTS.length; renderList();
}

// MODAL
function openModal(id) {
  editingId = id||null;
  if (id) {
    const a = articles.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent = '記事を編集';
    document.getElementById('f_title').value    = a.title;
    document.getElementById('f_category').value = a.category;
    document.getElementById('f_status').value   = a.status;
    document.getElementById('f_keyword').value  = a.keyword||'';
    document.getElementById('f_target').value   = a.target||'';
    document.getElementById('f_memo').value     = a.memo||'';
    document.getElementById('f_priority').checked = !!a.priority;
  } else {
    document.getElementById('modalTitle').textContent = '記事を追加';
    ['f_title','f_keyword','f_target','f_memo'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f_category').value = 'P';
    document.getElementById('f_status').value   = 'todo';
    document.getElementById('f_priority').checked = false;
  }
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('f_title').focus(),150);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function handleOverlayClick(e) { if (e.target===e.currentTarget) closeModal(); }

function saveArticle() {
  const title = document.getElementById('f_title').value.trim();
  if (!title) { document.getElementById('f_title').focus(); return; }
  const data = {
    title,
    category: document.getElementById('f_category').value,
    status:   document.getElementById('f_status').value,
    keyword:  document.getElementById('f_keyword').value.trim(),
    target:   document.getElementById('f_target').value.trim(),
    memo:     document.getElementById('f_memo').value.trim(),
    priority: document.getElementById('f_priority').checked,
  };
  if (editingId) {
    Object.assign(articles.find(x=>x.id===editingId), data);
    showToast('更新しました');
  } else {
    articles.push({id:nextId++, ...data});
    showToast('追加しました');
  }
  save(); closeModal(); renderStats(); renderList();
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
}

document.addEventListener('keydown', e=>{
  if (e.key==='Escape') closeModal();
});

load(); renderStats(); renderFilters(); renderList();
</script>
</body>
</html>
