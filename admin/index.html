<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 — Freediving Japan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --abyss:       #04161f;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --warm:        #f97316;
  --red:         #ef4444;
  --green:       #22c55e;
  --yellow:      #eab308;
  --on-dark:         rgba(255,255,255,0.92);
  --on-dark-mid:     rgba(255,255,255,0.62);
  --on-dark-soft:    rgba(255,255,255,0.38);
  --hairline:        rgba(168,236,232,0.14);
  --glass:           rgba(255,255,255,0.045);
}
html { background: var(--abyss); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: linear-gradient(180deg, var(--ocean-mid) 0%, var(--ocean-deep) 22%, #06283a 55%, var(--abyss) 100%);
  background-attachment: fixed;
  color: var(--on-dark);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,32,46,0.7); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hairline);
  padding: 0 20px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 15px; font-weight: 600; color: var(--on-dark); letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }
.logo span { color: var(--teal); }
.role-badge {
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 100px; margin-left: 10px;
}
.role-badge.admin  { background: rgba(249,115,22,0.2);  border: 1px solid rgba(249,115,22,0.4);  color: var(--warm); }
.role-badge.staff  { background: rgba(46,196,182,0.15); border: 1px solid rgba(46,196,182,0.35); color: var(--teal); }
.role-badge.editor { background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.35); color: #a78bfa; }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-info { font-size: 12px; color: var(--on-dark-soft); }
.logout-btn { font-size: 12px; color: var(--on-dark-mid); background: none; border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: border-color 0.2s; }
.logout-btn:hover { border-color: var(--red); color: var(--red); }

/* ── Tabs ── */
.tabs-wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 28px; }
.tab {
  padding: 10px 20px; font-size: 13px; font-weight: 500;
  color: var(--on-dark-soft); border-bottom: 2px solid transparent;
  cursor: pointer; transition: all 0.2s; margin-bottom: -1px;
  background: none; border-left: none; border-right: none; border-top: none;
}
.tab:hover { color: var(--on-dark-mid); }
.tab.active { color: var(--teal); border-bottom-color: var(--teal); }

/* ── Main ── */
.main { max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }

/* ── Section header ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.section-title { font-size: 13px; font-weight: 600; color: var(--on-dark-mid); letter-spacing: 0.1em; text-transform: uppercase; }
.btn-primary {
  display: flex; align-items: center; gap: 6px;
  background: var(--teal); color: var(--ocean-deep);
  border: none; border-radius: 10px; padding: 9px 16px;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: background 0.2s; white-space: nowrap;
}
.btn-primary:hover { background: var(--teal-light); }
.btn-danger {
  background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-edit {
  background: rgba(46,196,182,0.12); color: var(--teal); border: 1px solid rgba(46,196,182,0.3);
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-edit:hover { background: rgba(46,196,182,0.22); }

/* ── Table ── */
.table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--hairline); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: rgba(255,255,255,0.04); }
th { padding: 11px 14px; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-dark-soft); white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--hairline); color: var(--on-dark-mid); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,0.025); }
td.name { color: var(--on-dark); font-weight: 500; }
.actions { display: flex; gap: 6px; }

/* ── Status badges ── */
.badge {
  display: inline-block; padding: 3px 9px; border-radius: 100px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em; white-space: nowrap;
}
.badge-pending  { background: rgba(234,179,8,0.15);  color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
.badge-paid     { background: rgba(46,196,182,0.15); color: var(--teal);   border: 1px solid rgba(46,196,182,0.3); }
.badge-confirmed{ background: rgba(34,197,94,0.15);  color: var(--green);  border: 1px solid rgba(34,197,94,0.3); }
.badge-cancelled{ background: rgba(239,68,68,0.12);  color: var(--red);    border: 1px solid rgba(239,68,68,0.25); }
.badge-refunded { background: rgba(148,163,184,0.15); color: #94a3b8;       border: 1px solid rgba(148,163,184,0.25); }
.badge-active   { background: rgba(34,197,94,0.12);  color: var(--green);  border: 1px solid rgba(34,197,94,0.25); }
.badge-inactive { background: rgba(148,163,184,0.12); color: #94a3b8;       border: 1px solid rgba(148,163,184,0.2); }
.badge-admin    { background: rgba(249,115,22,0.15); color: var(--warm);   border: 1px solid rgba(249,115,22,0.3); }
.badge-staff    { background: rgba(46,196,182,0.12); color: var(--teal);   border: 1px solid rgba(46,196,182,0.3); }
.role-select { background: var(--surface); color: var(--on-dark); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }

/* ── Status select ── */
.status-select {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--on-dark); font-size: 12px;
  padding: 5px 8px; cursor: pointer; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.status-select:focus { border-color: var(--teal); }
.status-select option { background: #0e3d5c; }

/* ── Empty state ── */
.empty { text-align: center; padding: 48px 20px; color: var(--on-dark-soft); font-size: 13px; }

/* ── Loading spinner ── */
.spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 48px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--hairline); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Modal ── */
.modal-backdrop {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--ocean-mid); border: 1px solid var(--hairline);
  border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--on-dark-mid); letter-spacing: 0.05em; margin-bottom: 6px; }
.form-group input,
.form-group select {
  width: 100%; padding: 11px 13px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.form-group textarea {
  width: 100%; padding: 11px 13px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
  resize: vertical; min-height: 80px;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--teal); background: rgba(255,255,255,0.1); }
.form-group select option { background: var(--ocean-mid); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.modal-actions .btn-primary { flex: 1; justify-content: center; }
.btn-cancel {
  flex: 1; padding: 11px 16px; background: transparent; border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark-mid); font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-cancel:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ocean-mid); border: 1px solid var(--hairline);
  border-radius: 100px; padding: 12px 20px;
  font-size: 13px; color: var(--on-dark);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  z-index: 300; transition: opacity 0.3s; pointer-events: none;
  white-space: nowrap;
}
.toast.success { border-color: rgba(46,196,182,0.4); }
.toast.error   { border-color: rgba(239,68,68,0.4); }
.toast.hidden  { opacity: 0; }

/* ── Filters ── */
.filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-select {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark-mid); font-size: 12px;
  padding: 8px 12px; cursor: pointer; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.filter-select:focus { border-color: var(--teal); }
.filter-select option { background: #0e3d5c; }

/* ── Checkbox toggle ── */
.toggle-wrap { display: flex; align-items: center; gap: 8px; }
.toggle { position: relative; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0; cursor: pointer;
  background: rgba(255,255,255,0.12); border-radius: 100px;
  transition: background 0.2s;
}
.toggle input:checked + .toggle-track { background: var(--teal); }
.toggle-track::after {
  content: ''; position: absolute; width: 16px; height: 16px;
  left: 3px; top: 3px; background: white; border-radius: 50%;
  transition: transform 0.2s;
}
.toggle input:checked + .toggle-track::after { transform: translateX(18px); }
.toggle-label { font-size: 13px; color: var(--on-dark-mid); }

/* ── Auth guard ── */
#auth-guard { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
.auth-message { text-align: center; }
.auth-message h2 { font-size: 18px; margin-bottom: 12px; }
.auth-message p { color: var(--on-dark-soft); font-size: 13px; margin-bottom: 20px; }

/* ── User management ── */
.user-add-form {
  background: rgba(255,255,255,0.04); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 20px; margin-bottom: 24px;
  display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
}
.user-add-form .form-group { margin-bottom: 0; flex: 1; min-width: 200px; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr; }
  th, td { padding: 10px 10px; }
  .role-badge { display: none; }
  .user-info { display: none; }
}

/* ── Live Editor (contenteditable, article.html同スタイル) ── */
#ae-body-live {
  flex: 1; overflow-y: auto; outline: none;
  background: white; color: #1a2b38;
  font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  font-size: 16px; line-height: 1.9;
  padding: 36px 40px 60px;
  min-height: 300px;
}
#ae-body-live:empty::before {
  content: '本文をここに入力...'; color: #aaa; pointer-events: none;
}
/* article.htmlと同じ見出しスタイル */
#ae-body-live h2 {
  font-size: 22px; font-weight: 800; color: #0b2d45;
  margin: 48px 0 16px; padding-bottom: 10px;
  border-bottom: 2px solid #a8ece8; line-height: 1.4;
}
#ae-body-live h3 { font-size: 17px; font-weight: 700; color: #0e3d5c; margin: 32px 0 12px; }
#ae-body-live p  { margin-bottom: 20px; }
#ae-body-live strong { color: #0b2d45; font-weight: 700; }
#ae-body-live a  { color: #1a5f82; text-decoration: underline; }
#ae-body-live ul, #ae-body-live ol { padding-left: 24px; margin-bottom: 20px; }
#ae-body-live li { margin-bottom: 8px; line-height: 1.8; }
#ae-body-live blockquote {
  border-left: 4px solid #2ec4b6; margin: 28px 0;
  padding: 16px 20px; background: #f0f9fb; border-radius: 0 10px 10px 0;
  font-style: italic; color: #0e3d5c;
}
#ae-body-live img { max-width: 100%; border-radius: 10px; margin: 20px 0; display: block; }
/* テーブル（article.htmlと同スタイル） */
#ae-body-live table {
  width: 100%; border-collapse: collapse; margin: 28px 0;
  font-size: 14px; box-shadow: 0 1px 6px rgba(11,45,69,.1);
}
#ae-body-live table th {
  background: #0b2d45; color: white; padding: 12px 16px;
  text-align: left; font-size: 12px; font-weight: 600;
}
#ae-body-live table td {
  padding: 11px 14px; border-bottom: 1px solid #eef2f6;
  color: #3d5166; line-height: 1.6; vertical-align: top;
}
#ae-body-live table tr:last-child td { border-bottom: none; }
#ae-body-live table tbody tr:nth-child(even) td { background: #f0f9fb; }
#ae-body-live table td[colspan] {
  background: #0e3d5c !important; color: white !important;
  font-weight: 700; font-size: 13px;
}
/* ブロック要素（article.html と同スタイル） */
#ae-body-live .pullquote,
.ae-preview-pane .pullquote {
  border-left: 4px solid #2ec4b6; margin: 36px 0;
  padding: 20px 24px; background: #f0f9fb; border-radius: 0 12px 12px 0;
}
#ae-body-live .pullquote p,
.ae-preview-pane .pullquote p { font-size: 17px; font-weight: 500; color: #0e3d5c; line-height: 1.75; margin: 0; font-style: italic; }
#ae-body-live .pullquote cite,
.ae-preview-pane .pullquote cite { display: block; margin-top: 12px; font-size: 12px; color: #6b8091; font-style: normal; }

#ae-body-live .info-box,
.ae-preview-pane .info-box {
  background: #fff8f3; border: 1.5px solid #fddcbb; border-radius: 12px;
  padding: 20px 22px; margin: 32px 0;
}
#ae-body-live .info-box-title,
.ae-preview-pane .info-box-title {
  font-size: 13px; font-weight: 700; color: #f97316;
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
#ae-body-live .info-box p,
.ae-preview-pane .info-box p { font-size: 14px; color: #3d5166; margin-bottom: 10px; }
#ae-body-live .info-box p:last-child,
.ae-preview-pane .info-box p:last-child { margin-bottom: 0; }

#ae-body-live .step-list,
.ae-preview-pane .step-list { list-style: none; margin: 20px 0 28px; padding: 0; }
#ae-body-live .step-list li,
.ae-preview-pane .step-list li { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
#ae-body-live .step-num,
.ae-preview-pane .step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: #0b2d45; color: white; font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
#ae-body-live .step-body,
.ae-preview-pane .step-body { flex: 1; }
#ae-body-live .step-body strong,
.ae-preview-pane .step-body strong { display: block; font-size: 15px; margin-bottom: 4px; color: #0b2d45; }

#ae-body-live .compare-table,
.ae-preview-pane .compare-table {
  width: 100%; border-collapse: collapse; margin: 28px 0;
  font-size: 14px; box-shadow: 0 1px 6px rgba(11,45,69,.1);
  border-radius: 10px; overflow: hidden; display: table;
}
#ae-body-live .compare-table thead th,
.ae-preview-pane .compare-table thead th {
  background: #0b2d45; color: white;
  padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600;
}
#ae-body-live .compare-table td,
.ae-preview-pane .compare-table td {
  padding: 11px 14px; border-bottom: 1px solid #eef2f6; color: #3d5166; vertical-align: top;
}
#ae-body-live .compare-table tr:last-child td,
.ae-preview-pane .compare-table tr:last-child td { border-bottom: none; }
#ae-body-live .compare-table tbody tr:nth-child(even) td,
.ae-preview-pane .compare-table tbody tr:nth-child(even) td { background: #f0f9fb; }
#ae-body-live .compare-table .label-col,
.ae-preview-pane .compare-table .label-col { font-weight: 600; color: #0e3d5c; }

/* ブロック挿入ドロップダウン */
.tb-block-wrap { position: relative; }
.tb-block-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 200;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  padding: 6px; min-width: 200px;
}
.tb-block-menu.open { display: block; }
.tb-block-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 7px; cursor: pointer;
  font-size: 13px; color: var(--on-dark-soft);
  transition: background .15s;
}
.tb-block-item:hover { background: var(--hover); color: var(--on-dark); }
.tb-block-item .tb-block-icon { font-size: 16px; width: 22px; text-align: center; }
.tb-block-item .tb-block-label { font-weight: 600; }
.tb-block-item .tb-block-desc { font-size: 11px; color: var(--on-dark-muted); margin-left: auto; }
/* HTMLモードテキストエリア */
#ae-html-source {
  flex:1; width:100%; min-height:400px;
  font-family: monospace; font-size: 13px; line-height: 1.6;
  padding: 24px 40px; background: #0b1a24; color: #a8ece8;
  border: none; resize: none; outline: none; display: none;
}
/* ツールバー（エディタ上に固定） */
#ae-live-toolbar {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  padding: 5px 14px; flex-shrink: 0;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--hairline);
}
#ae-live-toolbar button, #ae-live-toolbar select {
  background: none; border: none; border-radius: 5px;
  padding: 4px 8px; color: var(--on-dark-soft); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
#ae-live-toolbar button:hover { background: rgba(255,255,255,0.09); color: var(--on-dark); }
#ae-live-toolbar select { color: var(--on-dark-soft); }
#ae-live-toolbar .tb-sep { width: 1px; height: 16px; background: var(--hairline); margin: 0 3px; flex-shrink: 0; }
#ae-html-toggle-btn {
  margin-left: auto;
  color: #2ec4b6 !important;
  border: 1px solid rgba(46,196,182,.3) !important;
  border-radius: 6px !important;
  font-family: monospace !important;
}
#ae-html-toggle-btn.active {
  background: rgba(46,196,182,.2) !important; color: white !important;
}

/* ════════════════════════════════════════════
   Article Full-Page Editor
   ════════════════════════════════════════════ */
#article-editor-page {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--abyss);
  flex-direction: column;
  overflow: hidden;
}
#article-editor-page.open { display: flex; }

/* Top bar */
.ae-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(6,32,46,0.97);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
  gap: 12px;
}
.ae-back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: 1px solid var(--hairline);
  border-radius: 8px; padding: 6px 12px;
  color: var(--on-dark-mid); font-size: 13px; cursor: pointer;
  font-family: inherit; white-space: nowrap; transition: all 0.2s;
}
.ae-back-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }
.ae-mode-tabs {
  display: flex;
  background: rgba(255,255,255,0.07);
  border-radius: 8px; padding: 3px; gap: 2px;
}
.ae-mode-tab {
  padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
  color: var(--on-dark-soft); background: none; border: none;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.ae-mode-tab.active { background: rgba(255,255,255,0.14); color: var(--on-dark); }
.ae-topbar-right { display: flex; gap: 8px; align-items: center; }
.ae-settings-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 7px 12px; color: var(--on-dark-mid);
  cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.2s;
}
.ae-settings-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }
.ae-settings-btn.active { border-color: var(--teal); color: var(--teal); background: rgba(46,196,182,0.1); }
.ae-draft-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 7px 14px; color: var(--on-dark-mid);
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
  transition: all 0.2s; white-space: nowrap;
}
.ae-draft-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }
.ae-publish-btn {
  background: var(--teal); border: none; border-radius: 8px; padding: 7px 16px;
  color: var(--ocean-deep); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background 0.2s; white-space: nowrap;
}
.ae-publish-btn:hover { background: var(--teal-light); }
.ae-publish-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Toolbar */
.ae-toolbar {
  display: flex; align-items: center; gap: 2px;
  padding: 5px 14px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0; flex-wrap: wrap;
}
.ae-tool {
  background: none; border: none; border-radius: 5px;
  padding: 4px 8px; color: var(--on-dark-soft); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
}
.ae-tool:hover { background: rgba(255,255,255,0.09); color: var(--on-dark); }
.ae-tool-sep { width: 1px; height: 16px; background: var(--hairline); margin: 0 3px; flex-shrink: 0; }

/* Main editor area */
.ae-main {
  display: flex; flex: 1; overflow: hidden; position: relative;
}

/* Editor pane */
.ae-editor-pane {
  display: flex; flex-direction: column; flex: 1; overflow: hidden; min-width: 0;
}
.ae-title-input {
  width: 100%; background: none; border: none; outline: none;
  color: var(--on-dark); font-size: 26px; font-weight: 700;
  padding: 24px 32px 14px; font-family: inherit;
  border-bottom: 1px solid var(--hairline); flex-shrink: 0;
}
.ae-title-input::placeholder { color: var(--on-dark-soft); }
.ae-meta-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 32px; flex-shrink: 0;
  border-bottom: 1px solid var(--hairline);
}
.ae-word-count { font-size: 11px; color: var(--on-dark-soft); }
.ae-pub-badge {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 100px;
}
.ae-pub-badge.draft     { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
.ae-pub-badge.published { background: rgba(34,197,94,0.12);  color: var(--green); border: 1px solid rgba(34,197,94,0.25); }

/* ── PREVIEW PANE: article.html と完全一致 ── */
.ae-preview-pane {
  border-left: 1px solid var(--hairline);
  overflow-y: auto; display: none; min-width: 0;
  background: white; padding: 0;
  font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  font-size: 16px; line-height: 1.8; color: #1a2b38;
}
/* HERO */
.ae-preview-pane .pv-hero {
  background: #0b2d45; padding: 52px 24px 40px;
  position: relative; overflow: hidden;
  background-size: cover; background-position: center;
}
.ae-preview-pane .pv-hero::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(4,22,31,.5) 0%, rgba(4,22,31,.82) 60%, rgba(4,22,31,.95) 100%);
  pointer-events: none;
}
.ae-preview-pane .pv-hero.no-thumb::before {
  background: linear-gradient(135deg, rgba(14,61,92,.95) 0%, rgba(4,22,31,.98) 100%);
}
.ae-preview-pane .pv-hero-inner { max-width: 700px; margin: 0 auto; position: relative; }
.ae-preview-pane .pv-cat {
  display: inline-flex; align-items: center;
  background: rgba(46,196,182,.15); color: #2ec4b6;
  font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  padding: 5px 14px; border-radius: 20px; margin-bottom: 16px;
  border: 1px solid rgba(46,196,182,.25);
}
.ae-preview-pane .pv-hero h1 {
  font-size: clamp(20px, 4vw, 32px); font-weight: 800;
  color: white; line-height: 1.3; margin-bottom: 20px;
  text-shadow: 0 2px 12px rgba(0,0,0,.3);
}
.ae-preview-pane .pv-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ae-preview-pane .pv-meta .by { color: rgba(255,255,255,.55); font-size: 13px; }
.ae-preview-pane .pv-meta .by strong { color: rgba(255,255,255,.85); }
.ae-preview-pane .pv-meta .date { color: rgba(255,255,255,.4); font-size: 12px; }
.ae-preview-pane .pv-meta .rt {
  color: #2ec4b6; font-size: 12px; font-weight: 600;
  background: rgba(46,196,182,.12); padding: 3px 10px;
  border-radius: 10px; border: 1px solid rgba(46,196,182,.2);
}
/* SHARE BAR */
.ae-preview-pane .pv-share {
  background: white; border-bottom: 1px solid #eef2f6;
  padding: 10px 20px; display: flex; align-items: center; gap: 8px;
}
.ae-preview-pane .pv-share-label { font-size: 12px; color: #6b8091; margin-right: 4px; }
.ae-preview-pane .pv-share-btn {
  display: inline-flex; align-items: center; padding: 5px 12px;
  border-radius: 20px; font-size: 12px; font-weight: 600; text-decoration: none;
}
.ae-preview-pane .pv-share-x    { background: #000; color: white; }
.ae-preview-pane .pv-share-line { background: #06C755; color: white; }
.ae-preview-pane .pv-share-copy { background: #f0f9fb; color: #1a5f82; border: 1px solid #d4e8f0; }
/* ARTICLE WRAP */
.ae-preview-pane .pv-wrap { max-width: 700px; margin: 0 auto; padding: 0 24px 80px; }
.ae-preview-pane .pv-lead {
  font-size: 17px; line-height: 1.9; color: #3d5166;
  padding: 32px 0 24px; border-bottom: 2px solid #eef2f6; margin-bottom: 36px;
}
/* ARTICLE BODY */
.ae-preview-pane .article-body h2,
.ae-preview-pane .pv-wrap h2 {
  font-size: 22px; font-weight: 800; color: #0b2d45;
  margin: 52px 0 18px; padding-bottom: 12px;
  border-bottom: 2px solid #a8ece8; line-height: 1.4;
}
.ae-preview-pane .article-body h3,
.ae-preview-pane .pv-wrap h3 { font-size: 17px; font-weight: 700; color: #0e3d5c; margin: 36px 0 14px; }
.ae-preview-pane .article-body p,
.ae-preview-pane .pv-wrap p  { margin-bottom: 22px; color: #1a2b38; line-height: 1.95; }
.ae-preview-pane .article-body strong,
.ae-preview-pane .pv-wrap strong { color: #0b2d45; font-weight: 700; }
.ae-preview-pane .article-body ul,  .ae-preview-pane .article-body ol,
.ae-preview-pane .pv-wrap ul,  .ae-preview-pane .pv-wrap ol { padding-left: 24px; margin-bottom: 22px; }
.ae-preview-pane .article-body li,
.ae-preview-pane .pv-wrap li  { margin-bottom: 10px; color: #1a2b38; line-height: 1.85; }
.ae-preview-pane .article-body a,
.ae-preview-pane .pv-wrap a {
  color: #1a5f82; text-decoration: none;
  border-bottom: 1px solid rgba(26,95,130,.3);
  transition: color .15s, border-color .15s;
}
.ae-preview-pane .article-body a:hover,
.ae-preview-pane .pv-wrap a:hover { color: #2ec4b6; border-color: #2ec4b6; }
.ae-preview-pane .pullquote {
  border-left: 4px solid #2ec4b6; margin: 36px 0;
  padding: 20px 24px; background: #f0f9fb; border-radius: 0 12px 12px 0;
}
.ae-preview-pane .pullquote p { font-size: 17px; font-weight: 500; color: #0e3d5c; line-height: 1.75; margin: 0; font-style: italic; }
.ae-preview-pane .pullquote cite { display: block; margin-top: 12px; font-size: 12px; color: #6b8091; font-style: normal; }
/* TABLES */
.ae-preview-pane .pv-wrap table,
.ae-preview-pane .article-body table,
.ae-preview-pane .compare-table,
.ae-preview-pane .level-table {
  width: 100%; border-collapse: collapse; margin: 28px 0;
  font-size: 14px; box-shadow: 0 1px 6px rgba(11,45,69,.1);
  border-radius: 10px; overflow: hidden; display: table;
}
.ae-preview-pane .pv-wrap table thead th,
.ae-preview-pane .article-body table thead th {
  background: #0b2d45; color: white;
  padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600;
}
.ae-preview-pane .pv-wrap table tbody tr:first-child td,
.ae-preview-pane .pv-wrap table tr:first-child td {
  background: #0b2d45; color: white; font-size: 12px; font-weight: 600; padding: 12px 16px;
}
.ae-preview-pane .pv-wrap table td,
.ae-preview-pane .article-body table td {
  padding: 11px 14px; border-bottom: 1px solid #eef2f6; color: #3d5166; vertical-align: top;
}
.ae-preview-pane .pv-wrap table tr:last-child td { border-bottom: none; }
.ae-preview-pane .pv-wrap table tbody tr:nth-child(even) td { background: #f0f9fb; }
.ae-preview-pane .pv-wrap table td[colspan],
.ae-preview-pane .org-row td {
  background: #0e3d5c !important; color: white !important;
  font-weight: 700; font-size: 13px; padding: 9px 14px !important;
}
.ae-preview-pane .article-body img {
  width: 100%; border-radius: 12px; margin: 32px 0; display: block;
  box-shadow: 0 4px 20px rgba(11,45,69,.12);
}
/* TAGS */
.ae-preview-pane .pv-tags { margin: 36px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.ae-preview-pane .pv-tag {
  font-size: 12px; color: #1a5f82; background: #f0f9fb;
  border: 1px solid #d4e8f0; border-radius: 20px; padding: 4px 12px;
}
/* DIVIDER */
.ae-preview-pane .pv-divider { border: none; border-top: 1px solid #eef2f6; margin: 48px 0 0; }
/* CTA */
.ae-preview-pane .pv-cta {
  background: #0b2d45; border-radius: 16px;
  padding: 32px 28px; margin: 40px 0 0; text-align: center;
  position: relative; overflow: hidden;
}
.ae-preview-pane .pv-cta::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(46,196,182,.2) 0%, transparent 60%);
}
.ae-preview-pane .pv-cta h3 { color: white; font-size: 18px; font-weight: 700; margin-bottom: 8px; position: relative; }
.ae-preview-pane .pv-cta p { color: rgba(255,255,255,.55); font-size: 14px; margin-bottom: 22px; position: relative; }
.ae-preview-pane .pv-cta-btn {
  display: inline-block; background: #2ec4b6; color: white;
  padding: 14px 32px; border-radius: 10px; font-size: 15px; font-weight: 700;
  text-decoration: none; position: relative;
}
/* AUTHOR */
.ae-preview-pane .pv-author {
  display: flex; gap: 16px; align-items: flex-start;
  background: #f0f9fb; border-radius: 14px; padding: 22px;
  margin: 32px 0 0; border: 1px solid #ddeef4;
}
.ae-preview-pane .pv-author-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: #0e3d5c; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; font-size: 22px;
}
.ae-preview-pane .pv-author-name { font-size: 15px; font-weight: 700; color: #0b2d45; margin-bottom: 5px; }
.ae-preview-pane .pv-author-desc { font-size: 13px; color: #6b8091; line-height: 1.65; }

/* Mode variants */
.ae-mode-write .ae-editor-pane { flex: 1; }
.ae-mode-write .ae-preview-pane { display: none; }
.ae-mode-split .ae-editor-pane { width: 50%; flex: none; }
.ae-mode-split .ae-preview-pane { display: block; flex: 1; }
.ae-mode-preview .ae-editor-pane { display: none; }
.ae-mode-preview .ae-sidebar { display: none !important; }
.ae-mode-preview { background: #f5f7fa; }
.ae-mode-preview .ae-preview-pane {
  display: block; flex: 1; max-width: 760px;
  margin: 32px auto; border-left: none;
  border-radius: 12px; overflow-y: auto;
  box-shadow: 0 2px 20px rgba(11,45,69,.1);
  padding: 0;
}
.ae-mode-split .ae-preview-pane { border-radius: 0; box-shadow: none; }
.ae-editor-pane #ae-body-live,
.ae-editor-pane #ae-html-source { flex: 1; overflow-y: auto; }

/* Sidebar */
.ae-sidebar {
  width: 290px; flex-shrink: 0;
  border-left: 1px solid var(--hairline);
  background: rgba(255,255,255,0.018);
  overflow-y: auto; display: none;
}
.ae-sidebar.open { display: block; }
.ae-sidebar-inner { padding: 20px; }
.ae-sidebar-section-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--on-dark-soft);
  margin: 0 0 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--hairline);
}
.ae-sidebar .form-group { margin-bottom: 14px; }
.ae-sidebar .form-group label {
  font-size: 11px; font-weight: 600; color: var(--on-dark-soft);
  letter-spacing: 0.04em; margin-bottom: 5px; display: block;
}
.ae-sidebar .form-group input,
.ae-sidebar .form-group select,
.ae-sidebar .form-group textarea {
  width: 100%; padding: 9px 11px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--hairline);
  border-radius: 9px; color: var(--on-dark); font-size: 13px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.ae-sidebar .form-group input:focus,
.ae-sidebar .form-group select:focus,
.ae-sidebar .form-group textarea:focus { border-color: var(--teal); background: rgba(255,255,255,0.1); }
.ae-sidebar .form-group select option { background: var(--ocean-mid); }
.ae-sidebar .form-group textarea { resize: vertical; min-height: 72px; }
.ae-slug-row { display: flex; gap: 6px; }
.ae-slug-row input { flex: 1; }
.ae-slug-gen {
  background: rgba(46,196,182,0.12); border: 1px solid rgba(46,196,182,0.3);
  color: var(--teal); border-radius: 8px; padding: 0 10px;
  font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
  white-space: nowrap; transition: all 0.2s;
}
.ae-slug-gen:hover { background: rgba(46,196,182,0.22); }
.ae-cover-row { display: flex; gap: 8px; align-items: stretch; }
.ae-cover-row input { flex: 1; }
.ae-cover-upload-btn {
  background: rgba(46,196,182,0.12); border: 1px solid rgba(46,196,182,0.3);
  color: var(--teal); border-radius: 8px; padding: 0 12px;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
}
.ae-cover-upload-btn:hover { background: rgba(46,196,182,0.22); }
.ae-cover-upload-btn:disabled { opacity: .5; cursor: wait; }
.ae-cover-preview {
  width: 100%; height: 130px; object-fit: cover;
  border-radius: 8px; margin-top: 8px; display: none;
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
}
.ae-cover-preview.visible { display: block; }
.ae-pub-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-top: 1px solid var(--hairline);
  margin-top: 8px;
}
.ae-pub-toggle-label { font-size: 13px; font-weight: 600; color: var(--on-dark-mid); }

/* Responsive */
@media (max-width: 768px) {
  .ae-mode-split .ae-preview-pane { display: none; }
  .ae-mode-split .ae-editor-pane { width: 100%; }
  .ae-sidebar { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; z-index: 10; border-radius: 0; }
  .ae-title-input { font-size: 20px; padding: 16px; }
  .ae-preview-pane { padding: 16px; }
  .ae-mode-tabs { display: none; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div style="display:flex;align-items:center;">
    <a href="../index.html" class="logo">FREEDIVING <span>JAPAN</span></a>
    <span class="role-badge" id="role-badge"></span>
  </div>
  <div class="header-right">
    <span class="user-info" id="user-email"></span>
    <button class="logout-btn" onclick="handleLogout()">ログアウト</button>
  </div>
</header>

<!-- Auth guard -->
<div id="auth-guard" style="display:none;">
  <div class="auth-message">
    <h2>アクセス権限がありません</h2>
    <p>このページを表示する権限がありません。</p>
    <a href="../index.html" class="btn-primary" style="display:inline-flex;text-decoration:none;">トップへ戻る</a>
  </div>
</div>

<!-- Main content -->
<div id="app" style="display:none;">
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" id="tab-btn-slots"       onclick="switchTab('slots')">空き枠管理</button>
      <button class="tab"        id="tab-btn-bookings"    onclick="switchTab('bookings')">予約一覧</button>
      <button class="tab"        id="tab-btn-instructors" onclick="switchTab('instructors')">インストラクター</button>
      <button class="tab"        id="tab-btn-listings"    onclick="switchTab('listings')">リスティング</button>
      <button class="tab"        id="tab-btn-media"       onclick="switchTab('media')">メディア</button>
      <button class="tab"        id="tab-btn-users"       onclick="switchTab('users')" style="display:none;">ユーザー管理</button>
    </div>
  </div>

  <div class="main">

    <!-- ── 空き枠管理 ── -->
    <div id="tab-slots">
      <div class="section-header">
        <span class="section-title">空き枠一覧</span>
        <button class="btn-primary" onclick="openSlotModal()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
          空き枠を追加
        </button>
      </div>

      <div class="filters">
        <select class="filter-select" id="slot-filter-instructor" onchange="loadSlots()">
          <option value="">すべてのインストラクター</option>
        </select>
        <select class="filter-select" id="slot-filter-shop" onchange="loadSlots()">
          <option value="">すべてのショップ</option>
        </select>
        <select class="filter-select" id="slot-filter-status" onchange="loadSlots()">
          <option value="">すべてのステータス</option>
          <option value="active">有効のみ</option>
          <option value="inactive">無効のみ</option>
        </select>
      </div>

      <div id="slots-content">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- ── 予約一覧 ── -->
    <div id="tab-bookings" style="display:none;">
      <div class="section-header">
        <span class="section-title">予約一覧</span>
      </div>

      <div class="filters">
        <select class="filter-select" id="booking-filter-status" onchange="loadBookings()">
          <option value="">すべてのステータス</option>
          <option value="pending">pending</option>
          <option value="paid">paid</option>
          <option value="confirmed">confirmed</option>
          <option value="cancelled">cancelled</option>
          <option value="refunded">refunded</option>
        </select>
        <select class="filter-select" id="booking-filter-instructor" onchange="loadBookings()">
          <option value="">すべてのインストラクター</option>
        </select>
        <select class="filter-select" id="booking-filter-shop" onchange="loadBookings()">
          <option value="">すべてのショップ</option>
        </select>
      </div>

      <div id="bookings-content">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- ── インストラクター管理 ── -->
    <div id="tab-instructors" style="display:none;">
      <div class="section-header">
        <span class="section-title">インストラクター一覧</span>
        <button class="btn-primary" onclick="openInstructorModal()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
          追加
        </button>
      </div>
      <div class="filters">
        <select class="filter-select" id="instructor-filter-status" onchange="loadInstructors()">
          <option value="">すべて</option>
          <option value="pending">承認待ち</option>
          <option value="approved">承認済み</option>
          <option value="rejected">却下</option>
        </select>
      </div>
      <div id="instructors-content">
        <div class="spinner-wrap"><div class="spinner"></div></div>

          </select>
        </div>

        <div class="form-group">
          <label>スラッグ（URL）</label>
          <div class="ae-slug-row">

        <div class="form-group">
          <label>カバー画像</label>

              width:100%;height:110px;border-radius:6px;overflow:hidden;

              cursor:grab;position:relative;user-select:none;
              border:1px solid var(--hairline);
            ">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
                <div style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.9);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,0.35),0 1px 5px rgba(0,0,0,0.6);"></div>
              </div>
              <div style="position:absolute;bottom:5px;right:8px;font-size:10px;color:rgba(255,255,255,0.55);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,0.8);">ドラッグ / スクロールで調整</div>

              <button type="button" onclick="aeMovePos(-5,0)" style="width:30px;height:28px;font-size:13px;border:1px solid var(--hairline);background:transparent;color:var(--on-dark-mid);border-radius:6px;cursor:pointer;line-height:1;">←</button>
              <button type="button" onclick="aeMovePos(0,-5)" style="width:30px;height:28px;font-size:13px;border:1px solid var(--hairline);background:transparent;color:var(--on-dark-mid);border-radius:6px;cursor:pointer;line-height:1;">↑</button>
              <button type="button" onclick="aeResetPos()"    style="width:30px;height:28px;font-size:11px;border:1px solid var(--hairline);background:transparent;color:var(--on-dark-mid);border-radius:6px;cursor:pointer;line-height:1;">⊙</button>
              <button type="button" onclick="aeMovePos(0,5)"  style="width:30px;height:28px;font-size:13px;border:1px solid var(--hairline);background:transparent;color:var(--on-dark-mid);border-radius:6px;cursor:pointer;line-height:1;">↓</button>
              <button type="button" onclick="aeMovePos(5,0)"  style="width:30px;height:28px;font-size:13px;border:1px solid var(--hairline);background:transparent;color:var(--on-dark-mid);border-radius:6px;cursor:pointer;line-height:1;">→</button>
            </div>
          </div>
          <input type="hidden" id="ae-cover-pos" value="50% 50%">
        </div>

        <div class="form-group">
          <label>タグ（カンマ区切り）</label>
          <input type="text" id="ae-tags" placeholder="初心者, 入門, フリーダイビング">
        </div>

        <div class="form-group">
          <label>読了時間（分）</label>
          <input type="number" id="ae-read-time" min="1" placeholder="自動計算">
        </div>

        <div class="form-group">
          <label>著者</label>
          <input type="text" id="ae-author" placeholder="FreeDive Japan編集部">
        </div>

        <div class="ae-pub-toggle-row">
          <span class="ae-pub-toggle-label">公開する</span>
          <label class="toggle">
            <input type="checkbox" id="ae-published" onchange="aeUpdatePubBadge()">
            <span class="toggle-track"></span>
          </label>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast hidden" id="toast"></div>

<script>
// ============================================================
// State
// ============================================================
let currentUser  = null;
let currentRole  = null; // 'admin' | 'staff'
let allInstructors = [];
let allListings    = [];
let allShops       = [];
let editingSlotId        = null;
let editingInstructorId  = null;
let editingListingId     = null;
let editingArticleId     = null;

// ============================================================
// Boot: auth + role check
// ============================================================
async function boot() {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    showAccessDenied('ログインが必要です', 'このページを使用するにはログインしてください。', '../auth.html', 'ログインへ');
    return;
  }
  currentUser = session.user;

  // user_roles からロール取得
  const { data: roles } = await _sb
    .from('user_roles')
    .select('role')
    .eq('user_id', currentUser.id);

  const roleList = (roles || []).map(r => r.role);
  const isAdmin  = roleList.includes('admin');
  const isStaff  = roleList.includes('staff');
  const isEditor = roleList.includes('editor');

  if (!isAdmin && !isStaff && !isEditor) {
    showAccessDenied('アクセス権限がありません', 'このページを表示する権限がありません。', '../index.html', 'トップへ戻る');
    return;
  }

  currentRole = isAdmin ? 'admin' : isStaff ? 'staff' : 'editor';

  // ヘッダー表示
  document.getElementById('user-email').textContent = currentUser.email;
  const badge = document.getElementById('role-badge');
  badge.textContent = currentRole.toUpperCase();
  badge.classList.add(currentRole);

  // タブ表示制御
  // admin: 全タブ表示（ユーザー管理含む）
  // staff: 空き枠・予約・インストラクター・リスティング・メディア（ユーザー管理なし）
  // editor: メディアのみ
  if (isAdmin) {
    document.getElementById('tab-btn-users').style.display = '';
  }
  if (isEditor && !isAdmin && !isStaff) {
    ['slots', 'bookings', 'instructors', 'listings'].forEach(t => {
      document.getElementById(`tab-btn-${t}`).style.display = 'none';
    });
    // デフォルトタブをメディアに変更
    document.querySelector('.tab.active')?.classList.remove('active');
    document.getElementById('tab-btn-media').classList.add('active');
    document.getElementById('tab-slots').style.display = 'none';
    document.getElementById('tab-media').style.display = '';
  }

  document.getElementById('app').style.display = 'block';

  if (isEditor && !isAdmin && !isStaff) {
    // editor はメディアのみ — slots/masterdata不要
    await loadArticles();
  } else {
    await loadMasterData();
    await loadSlots();
  }
}

function showAccessDenied(title, msg, href, label) {
  const guard = document.getElementById('auth-guard');
  guard.querySelector('h2').textContent  = title;
  guard.querySelector('p').textContent   = msg;
  const a = guard.querySelector('a');
  a.href        = href;
  a.textContent = label;
  guard.style.display = 'flex';
}

async function handleLogout() {
  await _sb.auth.signOut();
  location.href = '../auth.html';
}

// ============================================================
// Master data (instructors & listings)
// ============================================================
async function loadMasterData() {
  const [{ data: instructors }, { data: listings }, { data: shops }] = await Promise.all([
    _sb.from('instructors').select('id, name').order('name'),
    _sb.from('listings').select('id, title, instructor_id, shop_id').order('title'),
    _sb.from('shops').select('id, name').order('name'),
  ]);
  allInstructors = instructors || [];
  allListings    = listings    || [];
  allShops       = shops       || [];

  ['slot-filter-instructor', 'booking-filter-instructor', 'slot-instructor', 'listing-filter-instructor'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const keep = el.querySelector('option[value=""]');
    el.innerHTML = '';
    el.appendChild(keep);
    allInstructors.forEach(inst => {
      const opt = document.createElement('option');
      opt.value = inst.id;
      opt.textContent = inst.name;
      el.appendChild(opt);
    });
  });

  ['slot-filter-shop', 'booking-filter-shop', 'slot-shop', 'listing-filter-shop', 'listing-shop'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const keep = el.querySelector('option[value=""]');
    el.innerHTML = '';
    el.appendChild(keep);
    allShops.forEach(shop => {
      const opt = document.createElement('option');
      opt.value = shop.id;
      opt.textContent = shop.name;
      el.appendChild(opt);
    });
  });
}

// 空き枠モーダル：担当インストラクター or ショップの選択に応じてコース一覧を絞り込む
function onSlotOwnerChange() {
  const instId   = document.getElementById('slot-instructor').value;
  const shopId   = document.getElementById('slot-shop').value;
  const listEl   = document.getElementById('slot-listing');
  const filtered = allListings.filter(l =>
    (instId && l.instructor_id === instId) || (shopId && l.shop_id === shopId)
  );
  listEl.innerHTML = '<option value="">選択してください</option>';
  filtered.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = l.title;
    listEl.appendChild(opt);
  });
}

// ============================================================
// Tabs
// ============================================================
function switchTab(name) {
  const tabNames = ['slots', 'bookings', 'instructors', 'listings', 'media', 'users'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', tabNames[i] === name);
  });
  tabNames.forEach(n => {
    const el = document.getElementById('tab-' + n);
    if (el) el.style.display = n === name ? '' : 'none';
  });

  if (name === 'bookings')    loadBookings();
  if (name === 'instructors') loadInstructors();
  if (name === 'listings')    loadListings();
  if (name === 'media')       loadArticles();
  if (name === 'users')       loadUsers();
}

// ============================================================
// Slots
// ============================================================
async function loadSlots() {
  const el     = document.getElementById('slots-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const instFilter   = document.getElementById('slot-filter-instructor').value;
  const shopFilter   = document.getElementById('slot-filter-shop').value;
  const statusFilter = document.getElementById('slot-filter-status').value;

  let query = _sb
    .from('availability_slots')
    .select('*, instructors(name), shops(name), listings(title)')
    .order('slot_date', { ascending: false })
    .order('start_time', { ascending: true });

  if (instFilter)   query = query.eq('instructor_id', instFilter);
  if (shopFilter)   query = query.eq('shop_id', shopFilter);
  if (statusFilter === 'active')   query = query.eq('is_active', true);
  if (statusFilter === 'inactive') query = query.eq('is_active', false);

  const { data: slots, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!slots || slots.length === 0) { el.innerHTML = '<div class="empty">空き枠がありません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>日付</th>
            <th>時間</th>
            <th>インストラクター</th>
            <th>コース</th>
            <th>枠</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${slots.map(s => slotRow(s)).join('')}
        </tbody>
      </table>
    </div>`;
}

function slotRow(s) {
  const date  = s.slot_date ? fmtDate(s.slot_date) : '—';
  const time  = `${(s.start_time||'').slice(0,5)}〜${(s.end_time||'').slice(0,5)}`;
  const inst  = s.instructors?.name || (s.shops?.name ? `${s.shops.name}（ショップ）` : '—');
  const title = s.listings?.title   || '—';
  const seats = `${s.booked_count || 0} / ${s.max_participants}`;
  const badge = s.is_active
    ? '<span class="badge badge-active">有効</span>'
    : '<span class="badge badge-inactive">無効</span>';
  return `
    <tr>
      <td><span title="${s.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${s.id.slice(0,8)}</span></td>
      <td class="name">${date}</td>
      <td>${time}</td>
      <td>${inst}</td>
      <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${title}</td>
      <td>${seats}</td>
      <td>${badge}</td>
      <td>
        <div class="actions">
          <button class="btn-edit" onclick="openSlotModal('${s.id}')">編集</button>
          <button class="btn-danger" onclick="deleteSlot('${s.id}')">削除</button>
        </div>
      </td>
    </tr>`;
}

// ── Slot Modal ──
function openSlotModal(slotId = null) {
  editingSlotId = slotId;
  document.getElementById('slot-modal-title').textContent = slotId ? '空き枠を編集' : '空き枠を追加';
  document.getElementById('slot-save-label').textContent  = slotId ? '更新する' : '保存する';

  ['slot-instructor','slot-shop','slot-listing','slot-date','slot-start','slot-end'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('slot-max').value = 4;
  document.getElementById('slot-active').checked = true;
  document.getElementById('slot-listing').innerHTML = '<option value="">インストラクター/ショップを先に選択</option>';

  if (slotId) {
    _sb.from('availability_slots')
      .select('*')
      .eq('id', slotId)
      .single()
      .then(({ data: s }) => {
        if (!s) return;
        document.getElementById('slot-instructor').value = s.instructor_id || '';
        document.getElementById('slot-shop').value       = s.shop_id || '';
        onSlotOwnerChange();
        setTimeout(() => {
          document.getElementById('slot-listing').value = s.listing_id || '';
        }, 50);
        document.getElementById('slot-date').value   = s.slot_date   || '';
        document.getElementById('slot-start').value  = (s.start_time||'').slice(0,5);
        document.getElementById('slot-end').value    = (s.end_time||'').slice(0,5);
        document.getElementById('slot-max').value    = s.max_participants || 4;
        document.getElementById('slot-active').checked = s.is_active !== false;
      });
  }

  document.getElementById('slot-modal').classList.add('open');
}

function closeSlotModal() {
  document.getElementById('slot-modal').classList.remove('open');
  editingSlotId = null;
}

async function saveSlot() {
  const instructorId = document.getElementById('slot-instructor').value || null;
  const shopId       = document.getElementById('slot-shop').value || null;
  const listingId    = document.getElementById('slot-listing').value;
  const slotDate     = document.getElementById('slot-date').value;
  const startTime    = document.getElementById('slot-start').value;
  const endTime      = document.getElementById('slot-end').value;
  const maxP         = parseInt(document.getElementById('slot-max').value) || 1;
  const isActive     = document.getElementById('slot-active').checked;

  if ((!instructorId && !shopId) || !slotDate || !startTime || !endTime) {
    showToast('インストラクターまたはショップ・日付・時間は必須です', 'error'); return;
  }
  if (startTime >= endTime) {
    showToast('開始時刻は終了時刻より前にしてください', 'error'); return;
  }

  const payload = {
    instructor_id:    instructorId,
    shop_id:          shopId,
    listing_id:       listingId || null,
    slot_date:        slotDate,
    start_time:       startTime,
    end_time:         endTime,
    max_participants: maxP,
    is_active:        isActive,
  };

  let error;
  if (editingSlotId) {
    ({ error } = await _sb.from('availability_slots').update(payload).eq('id', editingSlotId));
  } else {
    payload.booked_count = 0;
    ({ error } = await _sb.from('availability_slots').insert(payload));
  }

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }
  showToast(editingSlotId ? '空き枠を更新しました' : '空き枠を追加しました', 'success');
  closeSlotModal();
  loadSlots();
}

async function deleteSlot(slotId) {
  if (!confirm('この空き枠を削除しますか？\n予約済みの場合は削除できません。')) return;
  const { error } = await _sb.from('availability_slots').update({ deleted_at: new Date().toISOString() }).eq('id', slotId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('空き枠を削除しました', 'success');
  loadSlots();
}

// ============================================================
// Bookings
// ============================================================
async function loadBookings() {
  const el     = document.getElementById('bookings-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const statusFilter = document.getElementById('booking-filter-status').value;
  const instFilter   = document.getElementById('booking-filter-instructor').value;
  const shopFilter   = document.getElementById('booking-filter-shop').value;

  let query = _sb
    .from('bookings')
    .select('*, availability_slots(slot_date, start_time, end_time), listings(title), instructors(name), shops(name)')
    .order('created_at', { ascending: false });

  if (statusFilter) query = query.eq('status', statusFilter);
  if (instFilter)   query = query.eq('instructor_id', instFilter);
  if (shopFilter)   query = query.eq('shop_id', shopFilter);

  const { data: bookings, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!bookings || bookings.length === 0) { el.innerHTML = '<div class="empty">予約がありません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>日時</th>
            <th>ゲスト</th>
            <th>コース</th>
            <th>人数</th>
            <th>金額</th>
            <th>ステータス</th>
            <th>変更</th>
          </tr>
        </thead>
        <tbody>
          ${bookings.map(b => bookingRow(b)).join('')}
        </tbody>
      </table>
    </div>`;
}

function bookingRow(b) {
  const slot  = b.availability_slots;
  const date  = slot?.slot_date ? fmtDate(slot.slot_date) : '—';
  const time  = slot ? `${(slot.start_time||'').slice(0,5)}〜${(slot.end_time||'').slice(0,5)}` : '—';
  const title = b.listings?.title || '—';
  const amt   = b.total_amount ? `¥${b.total_amount.toLocaleString()}` : '—';
  const statusBadge = `<span class="badge badge-${b.status}">${b.status}</span>`;

  const statusOpts = ['pending','paid','confirmed','cancelled','refunded']
    .map(s => `<option value="${s}"${b.status===s?' selected':''}>${s}</option>`)
    .join('');

  return `
    <tr>
      <td><span title="${b.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${b.id.slice(0,8)}</span></td>
      <td>
        <div class="name">${date}</div>
        <div style="font-size:11px;color:var(--on-dark-soft);">${time}</div>
      </td>
      <td>
        <div class="name">${escHtml(b.client_name || '—')}</div>
        <div style="font-size:11px;color:var(--on-dark-soft);">${escHtml(b.client_email || '')}</div>
      </td>
      <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(title)}</td>
      <td>${b.participant_count || 1}名</td>
      <td>${amt}</td>
      <td>${statusBadge}</td>
      <td>
        <select class="status-select" onchange="updateBookingStatus('${b.id}', this.value, this)">
          ${statusOpts}
        </select>
      </td>
    </tr>`;
}

async function updateBookingStatus(bookingId, newStatus, selectEl) {
  const prev = selectEl.dataset.prev || selectEl.value;
  const { error } = await _sb
    .from('bookings')
    .update({ status: newStatus })
    .eq('id', bookingId);

  if (error) {
    showToast('更新に失敗しました: ' + error.message, 'error');
    selectEl.value = prev;
    return;
  }
  selectEl.dataset.prev = newStatus;
  const badge = selectEl.closest('tr').querySelector('.badge');
  if (badge) {
    badge.className = `badge badge-${newStatus}`;
    badge.textContent = newStatus;
  }
  showToast('ステータスを更新しました', 'success');
}

// ============================================================
// Instructors
// ============================================================
async function loadInstructors() {
  const el = document.getElementById('instructors-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const statusFilter = document.getElementById('instructor-filter-status')?.value || '';

  let query = _sb
    .from('instructors')
    .select('id, name, prefecture, city, is_verified, is_public, experience_years, status')
    .order('status', { ascending: true })   // pending が先頭に来るようにソート
    .order('created_at', { ascending: false });

  if (statusFilter) query = query.eq('status', statusFilter);

  const { data, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">インストラクターがいません</div>'; return; }

  const statusBadge = s => {
    if (s === 'approved') return '<span class="badge badge-confirmed">承認済み</span>';
    if (s === 'pending')  return '<span class="badge" style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.35);color:#f59e0b;">承認待ち</span>';
    if (s === 'rejected') return '<span class="badge badge-danger">却下</span>';
    return '<span class="badge badge-inactive">—</span>';
  };

  const approveBtn = inst => inst.status !== 'approved'
    ? `<button class="btn-edit" style="background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.4);color:#22c55e;" onclick="setInstructorStatus('${inst.id}','${escHtml(inst.name)}','approved')">承認</button>`
    : '';
  const rejectBtn = inst => inst.status !== 'rejected'
    ? `<button class="btn-danger" onclick="setInstructorStatus('${inst.id}','${escHtml(inst.name)}','rejected')">却下</button>`
    : '';

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>名前</th>
            <th>エリア</th>
            <th>申請ステータス</th>
            <th>公開</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(inst => `
            <tr>
              <td class="name">${escHtml(inst.name)}</td>
              <td>${escHtml([inst.prefecture, inst.city].filter(Boolean).join(' ') || '—')}</td>
              <td>${statusBadge(inst.status)}</td>
              <td>${inst.is_public ? '<span class="badge badge-active">公開</span>' : '<span class="badge badge-inactive">非公開</span>'}</td>
              <td>
                <div class="actions">
                  ${approveBtn(inst)}
                  ${rejectBtn(inst)}
                  <button class="btn-edit" onclick="openInstructorModal('${inst.id}')">編集</button>
                  <button class="btn-danger" onclick="deleteInstructor('${inst.id}', '${escHtml(inst.name)}')">削除</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  // マスタデータも更新（空き枠モーダルのプルダウンに反映）
  await loadMasterData();
}

async function setInstructorStatus(id, name, newStatus) {
  const label = newStatus === 'approved' ? '承認' : '却下';
  if (!confirm(`${name} を${label}しますか？`)) return;

  const { error } = await _sb
    .from('instructors')
    .update({ status: newStatus })
    .eq('id', id);

  if (error) { showToast(`更新失敗: ${error.message}`, 'error'); return; }
  showToast(`${name} を${label}しました`, 'success');
  loadInstructors();
}

function openInstructorModal(instId = null) {

      document.getElementById('inst-bio').value            = d.bio || '';

function closeInstructorModal() {
  document.getElementById('instructor-modal').classList.remove('open');

function splitTrim(str) {
  return str.split(',').map(s => s.trim()).filter(Boolean);
}

function toggleListingAreaOther(sel) {
  document.getElementById('listing-area-other').style.display = sel.value === '__other__' ? '' : 'none';
}

function toggleListingPrefOther(sel) {
  document.getElementById('listing-pref-other').style.display = sel.value === '海外' ? '' : 'none';
}

async function saveInstructor() {
  const name = document.getElementById('inst-name').value.trim();
  if (!name) { showToast('名前は必須です', 'error'); return; }

  const payload = {
    name,
    name_en:          document.getElementById('inst-name-en').value.trim() || null,
    bio:              document.getElementById('inst-bio').value.trim() || null,
    prefecture:       document.getElementById('inst-prefecture').value.trim() || null,
    city:             document.getElementById('inst-city').value.trim() || null,
    areas:            splitTrim(document.getElementById('inst-areas').value),
    certifications:   splitTrim(document.getElementById('inst-certifications').value),
    specialties:      splitTrim(document.getElementById('inst-specialties').value),
    experience_years: parseInt(document.getElementById('inst-experience').value) || null,
    photo_url:        document.getElementById('inst-photo').value.trim() || null,
    instagram_url:    document.getElementById('inst-instagram').value.trim() || null,
    youtube_url:      document.getElementById('inst-youtube').value.trim() || null,
    is_public:        document.getElementById('inst-public').checked,
    is_verified:      document.getElementById('inst-verified').checked,
  };

  let error;
  if (editingInstructorId) {
    ({ error } = await _sb.from('instructors').update(payload).eq('id', editingInstructorId));
  } else {
    ({ error } = await _sb.from('instructors').insert(payload));
  }

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }
  showToast(editingInstructorId ? '更新しました' : '追加しました', 'success');
  closeInstructorModal();
  loadInstructors();
}

async function deleteInstructor(instId, name) {
  if (!confirm(`「${name}」を削除しますか？\nリスティング・空き枠も削除されます。`)) return;
  const _now = new Date().toISOString();
  // 論理削除：配下のリスティング・空き枠も連鎖して非表示化する（物理削除時のCASCADE相当）
  await _sb.from('availability_slots').update({ deleted_at: _now }).eq('instructor_id', instId);
  await _sb.from('listings').update({ deleted_at: _now }).eq('instructor_id', instId);
  const { error } = await _sb.from('instructors').update({ deleted_at: _now }).eq('id', instId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  loadInstructors();
}

async function loadListings() {
  const el = document.getElementById('listings-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const instFilter   = document.getElementById('listing-filter-instructor').value;
  const shopFilter   = document.getElementById('listing-filter-shop').value;
  const intentFilter = document.getElementById('listing-filter-intent').value;

  let query = _sb
    .from('listings')
    .select('id, title, intent, area, price, is_public, instructors(name), shops(name)')
    .order('created_at', { ascending: false });

  if (instFilter)   query = query.eq('instructor_id', instFilter);
  if (shopFilter)   query = query.eq('shop_id', shopFilter);
  if (intentFilter) query = query.eq('intent', intentFilter);

  const { data, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">リスティングがありません</div>'; return; }

  el.innerHTML = `

        <thead>
          <tr>
            <th>ID</th>
            <th>タイトル</th>
            <th>インストラクター</th>
            <th>カテゴリ</th>
            <th>都道府県</th>
            <th>価格</th>
            <th>公開</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(l => `
            <tr>
              <td><span title="${l.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${l.id.slice(0,8)}</span></td>
              <td class="name" style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(l.title)}</td>
              <td>${escHtml(l.instructors?.name || (l.shops?.name ? l.shops.name + '（ショップ）' : '—'))}</td>
              <td><span class="badge badge-${l.intent === 'try' ? 'pending' : l.intent === 'learn' ? 'paid' : 'confirmed'}">${intentLabel[l.intent] || l.intent}</span></td>
              <td>${escHtml(l.prefecture || '—')}${l.area ? `<br><span style="font-size:11px;color:var(--on-dark-soft);">${escHtml(l.area)}</span>` : ''}</td>
              <td>${l.price ? '¥' + l.price.toLocaleString() : '—'}</td>
              <td>${l.is_public ? '<span class="badge badge-active">公開</span>' : '<span class="badge badge-inactive">非公開</span>'}</td>
              <td>
                <div class="actions">
                  <button class="btn-edit"   onclick="openListingModal('${l.id}')">編集</button>

function openListingModal(listingId = null) {
  editingListingId = listingId;
  document.getElementById('listing-modal-title').textContent = listingId ? 'リスティングを編集' : 'リスティングを追加';
  document.getElementById('listing-save-label').textContent  = listingId ? '更新する' : '保存する';

  // インストラクタープルダウンを更新
  const sel = document.getElementById('listing-instructor');
  const keep = sel.querySelector('option[value=""]');
  sel.innerHTML = '';
  sel.appendChild(keep);
  allInstructors.forEach(inst => {
    const opt = document.createElement('option');
    opt.value = inst.id;
    opt.textContent = inst.name;
    sel.appendChild(opt);
  });

  // リセット
  ['listing-title','listing-description','listing-category','listing-pref','listing-pref-other','listing-area','listing-area-other','listing-tags'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('listing-pref-other').style.display = 'none';
  document.getElementById('listing-area-other').style.display = 'none';
  document.getElementById('listing-intent').value      = 'try';
  document.getElementById('listing-price').value       = '';
  document.getElementById('listing-price-unit').value  = '〜/人';
  document.getElementById('listing-public').checked    = true;
  document.getElementById('listing-instructor').value  = '';
  document.getElementById('listing-shop').value        = '';

  if (listingId) {
    _sb.from('listings').select('*').eq('id', listingId).single().then(({ data: d }) => {
      if (!d) return;
      document.getElementById('listing-instructor').value  = d.instructor_id || '';
      document.getElementById('listing-shop').value        = d.shop_id || '';
      document.getElementById('listing-title').value       = d.title || '';
      document.getElementById('listing-description').value = d.description || '';
      document.getElementById('listing-category').value    = d.category || '';
      document.getElementById('listing-intent').value      = d.intent || 'try';
      // 都道府県：47都道府県+海外に無い値（旧・自由入力時代のデータ）は「海外」＋自由入力欄に復元
      const prefSel = document.getElementById('listing-pref');
      const prefKnown = [...prefSel.options].some(o => o.value === (d.prefecture || ''));
      if (d.prefecture && !prefKnown) {
        prefSel.value = '海外';
        document.getElementById('listing-pref-other').value = d.prefecture;
        document.getElementById('listing-pref-other').style.display = '';
      } else {
        prefSel.value = d.prefecture || '';
        document.getElementById('listing-pref-other').style.display = prefSel.value === '海外' ? '' : 'none';
        if (prefSel.value === '海外') document.getElementById('listing-pref-other').value = d.country || '';
      }
      // エリア：既存の値が選択肢にあればそれを選択、無ければ「その他」＋自由入力欄に復元
      const areaSel = document.getElementById('listing-area');
      const areaKnown = [...areaSel.options].some(o => o.value === (d.area || ''));
      if (d.area && !areaKnown) {
        areaSel.value = '__other__';
        document.getElementById('listing-area-other').value = d.area;
        document.getElementById('listing-area-other').style.display = '';
      } else {
        areaSel.value = d.area || '';
        document.getElementById('listing-area-other').style.display = 'none';
      }
      document.getElementById('listing-price').value       = d.price || '';
      document.getElementById('listing-price-unit').value  = d.price_unit || '〜/人';
      document.getElementById('listing-tags').value        = (d.tags || []).join(', ');
      document.getElementById('listing-public').checked    = d.is_public !== false;
    });
  }

  document.getElementById('listing-modal').classList.add('open');
}

function closeListingModal() {
  document.getElementById('listing-modal').classList.remove('open');
  editingListingId = null;
}

async function saveListing() {
  const instructorId = document.getElementById('listing-instructor').value || null;
  const shopId       = document.getElementById('listing-shop').value || null;
  const title        = document.getElementById('listing-title').value.trim();
  if (!instructorId && !shopId) { showToast('インストラクターまたはショップを選択してください', 'error'); return; }
  if (!title)        { showToast('タイトルは必須です', 'error'); return; }

  const payload = {
    instructor_id: instructorId,
    shop_id:       shopId,
    title,
    description:  document.getElementById('listing-description').value.trim() || null,
    category:     document.getElementById('listing-category').value.trim() || null,
    intent:       document.getElementById('listing-intent').value,
    prefecture:   document.getElementById('listing-pref').value               || null,
    country:      document.getElementById('listing-pref').value === '海外'
                     ? (document.getElementById('listing-pref-other').value.trim() || null)
                     : null,
    area:         (document.getElementById('listing-area').value === '__other__'
                      ? document.getElementById('listing-area-other').value.trim()
                      : document.getElementById('listing-area').value)         || null,
    price:        parseInt(document.getElementById('listing-price').value) || null,
    price_unit:   document.getElementById('listing-price-unit').value.trim() || '〜/人',
    tags:         splitTrim(document.getElementById('listing-tags').value),
    is_public:    document.getElementById('listing-public').checked,
  };

  let error;
  if (editingListingId) {
    ({ error } = await _sb.from('listings').update(payload).eq('id', editingListingId));
  } else {
    ({ error } = await _sb.from('listings').insert(payload));
  }

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }
  showToast(editingListingId ? '更新しました' : '追加しました', 'success');
  closeListingModal();
  loadListings();
  loadMasterData(); // 空き枠モーダルのリスティング一覧を更新
}

async function deleteListing(listingId) {
  if (!confirm('このリスティングを削除しますか？\n紐づく空き枠も削除されます。')) return;
  const _now = new Date().toISOString();
  // 論理削除：配下の空き枠も連鎖して非表示化する（物理削除時のCASCADE相当）
  await _sb.from('availability_slots').update({ deleted_at: _now }).eq('listing_id', listingId);
  const { error } = await _sb.from('listings').update({ deleted_at: _now }).eq('id', listingId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  loadListings();
}

const ARTICLE_CATEGORY_LABEL = {
  A:'入門・体験', B:'身体・科学', C:'海・スポット', D:'競技・大会',
  E:'インタビュー', P:'人物メディア', Q:'業界×期待感', S:'シリーズ連載', T:'エンタメ',
};
const ARTICLE_CATEGORY_BADGE = {
  A:'badge-paid', B:'badge-confirmed', C:'badge-pending',
  D:'badge-admin', E:'badge-staff', P:'badge-staff',
  Q:'badge-active', S:'badge-active', T:'badge-active',
};

async function loadArticles() {
  const el = document.getElementById('articles-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  try {
  const catFilter    = document.getElementById('article-filter-category').value;
  const statusFilter = document.getElementById('article-filter-status').value;

  let query = _sb
    .from('articles')
    .select('id, title, slug, category, is_published, published_at, read_time_min, author_type, author_name, created_at, thumbnail_url')
    .order('created_at', { ascending: false });

  if (catFilter)              query = query.eq('category', catFilter);
  if (statusFilter === 'published') query = query.eq('is_published', true);
  if (statusFilter === 'draft')     query = query.eq('is_published', false);

  const { data, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">記事がありません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>画像</th>
            <th>ID</th>
            <th>タイトル</th>
            <th>カテゴリ</th>
            <th>担当者</th>
            <th>ステータス</th>
            <th>公開日</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(a => articleRow(a)).join('')}
        </tbody>
      </table>
    </div>`;
  } catch(e) {
    el.innerHTML = `<div class="empty">JS エラー: ${e.message}</div>`;
    console.error('loadArticles error:', e);
  }
}

function articleRow(a) {
  const catBadge = a.category
    ? `<span class="badge ${ARTICLE_CATEGORY_BADGE[a.category] || ''}">${ARTICLE_CATEGORY_LABEL[a.category] || a.category}</span>`
    : '<span style="color:var(--on-dark-soft);">—</span>';
  const statusBadge = a.is_published
    ? '<span class="badge badge-active">公開中</span>'
    : a.status === 'review'
      ? '<span class="badge" style="background:#fef3c7;color:#d97706;">レビュー待ち</span>'
      : '<span class="badge badge-inactive">下書き</span>';
  const pubDate = a.published_at ? fmtDate(a.published_at.slice(0,10)) : '—';
  const isEditorOnly = currentRole === 'editor';
  const reviewComment = a.review_comment
    ? `<div style="font-size:11px;color:#d97706;margin-top:4px;">💬 ${escHtml(a.review_comment)}</div>` : '';
  const thumb = a.thumbnail_url
    ? `<img src="${escHtml(a.thumbnail_url)}" alt="" style="width:56px;height:40px;object-fit:cover;border-radius:4px;display:block;">`
    : `<div style="width:56px;height:40px;border-radius:4px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:16px;">📷</div>`;
  return `
    <tr>
      <td style="padding:8px 10px;">${thumb}</td>
      <td><span title="${a.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${a.id.slice(0,8)}</span></td>
      <td class="name">${escHtml(a.title)}${reviewComment}</td>
      <td>${catBadge}</td>
      <td style="font-size:12px;color:var(--on-dark-mid);">${escHtml(a.author_name || a.author_type || '—')}</td>
      <td>${statusBadge}</td>
      <td style="font-size:12px;">${pubDate}</td>
      <td>
        <div class="actions">
          <button class="btn-edit" onclick="openArticleModal('${a.id}')">編集</button>
          ${a.is_published && a.slug
            ? `<a href="../media/article.html?slug=${encodeURIComponent(a.slug)}" target="_blank" class="btn-edit" style="background:rgba(46,196,182,0.15);color:var(--ocean-light);text-decoration:none;display:inline-flex;align-items:center;gap:4px;">↗ 公開ページ</a>`
            : ''
          }
          ${!isEditorOnly && a.status === 'review'
            ? `<button class="btn-edit" style="background:#d1fae5;color:#065f46;" onclick="approveArticleAdmin('${a.id}')">✓ 承認</button>
               <button class="btn-danger" style="background:#fef3c7;color:#92400e;border:none;" onclick="rejectArticleAdmin('${a.id}')">差し戻す</button>`
            : ''
          }
          ${!isEditorOnly
            ? `<button class="btn-danger" onclick="deleteArticle('${a.id}')">削除</button>`
            : ''
          }
        </div>
      </td>
    </tr>`;
}
