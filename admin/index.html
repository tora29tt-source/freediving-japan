// ── 本文内画像挿入 ──
let _savedRange = null;

function _saveSelection() {
  const sel = window.getSelection();
  return sel && sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
}
function _restoreSelection(range) {
  if (!range) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function tbInsertImage() {
  if (_htmlMode) return;
  // ファイルダイアログを開くとフォーカスが外れるのでカーソル位置を先に保存
  _savedRange = _saveSelection();
  document.getElementById('ae-inline-img-file').click();
}

async function aeUploadInlineImage(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    alert('ファイルサイズは5MB以下にしてください');
    input.value = '';
    return;
  }

  const ext  = file.name.split('.').pop().toLowerCase();
  const safe = file.name.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9\-_.]/g, '').replace(/\.[^.]+$/, '');
  const path = `inline/${Date.now()}_${safe}.${ext}`;

  // アップロード中はボタンを一時的に無効化
  const btn = document.querySelector('[onclick="tbInsertImage()"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }

  const { error } = await _sb.storage
    .from('article-images')
    .upload(path, file, { contentType: file.type, upsert: false });

  if (btn) { btn.disabled = false; btn.textContent = '📷 写真'; }

  if (error) {
    alert('アップロード失敗: ' + error.message);
    input.value = '';
    return;
  }

  const { data: { publicUrl } } = _sb.storage
    .from('article-images')
    .getPublicUrl(path);

  // カーソル位置に img を挿入
  const editor = getLiveEditor();
  editor.focus();
  if (_savedRange) _restoreSelection(_savedRange);
  document.execCommand('insertHTML', false,
    `<img src="${publicUrl}" alt="" loading="lazy">`);

  input.value = '';
  _savedRange = null;
  _isDirty = true;
  clearTimeout(_aeDebounce);
  _aeDebounce = setTimeout(aeRenderPreview, 400);
}

// article.html のテンプレート要素（CTA・関連記事・フッター・タグ等）が
// コンテンツに混入しないよう除去する。ロード時・保存時の両方で使用。
function sanitizeArticleContent(html) {
  if (!html) return html;
  // ① <!-- /.article-body --> より後はすべてゴミ
  const cutMarker = '<!-- /.article-body -->';
  const cutIdx = html.indexOf(cutMarker);
  if (cutIdx !== -1) {
    const divClose = html.lastIndexOf('</div>', cutIdx);
    html = divClose !== -1 ? html.slice(0, divClose + 6) : html.slice(0, cutIdx);
  }
  // ② DOMパーサで不要要素を除去
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const junkSelectors = [
    '.cta-box', '.related-section', '.related-list', '.related-item',
    '.author-box', '.share-bar', '.site-footer', 'footer',
    '.tags > a[href="#"]',  // href="#" の旧ダミータグのみ除去
  ];
  junkSelectors.forEach(sel => {
    doc.querySelectorAll(sel).forEach(el => el.remove());
  });
  // ③ <!-- CTA --> / <!-- /.article-wrap --> などテンプレートコメントを除去
  const walker = document.createTreeWalker(doc.body, NodeFilter.SHOW_COMMENT);
  const comments = [];
  while (walker.nextNode()) comments.push(walker.currentNode);
  comments.forEach(c => c.remove());

  return doc.body.innerHTML;
}

function aeUpdateCover() {
  const url     = document.getElementById('ae-cover').value.trim();
  const img     = document.getElementById('ae-cover-preview');
  const posWrap = document.getElementById('ae-pos-wrap');
  const posPrev = document.getElementById('ae-pos-preview');
  if (url) {
    // imgは非表示のまま（onerror検知用に残す）
    img.src = url;
    const pos = document.getElementById('ae-cover-pos').value || '50% 50%';
    posWrap.style.display = '';
    if (posPrev) {
      posPrev.style.backgroundImage = `url('${url}')`;
      posPrev.style.backgroundPosition = pos;
    }
    initPosDrag();
  } else {
    posWrap.style.display = 'none';
  }
}

// pos を "X% Y%" 形式に正規化してパース
function _parsePosXY() {
  const val = (document.getElementById('ae-cover-pos').value || '50% 50%').trim();
  if (val === 'top')    return [50, 0];
  if (val === 'center') return [50, 50];
  if (val === 'bottom') return [50, 100];
  const m = val.match(/(\d+(?:\.\d+)?)%\s*(\d+(?:\.\d+)?)%/);
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : [50, 50];
}

function _applyPosXY(x, y) {
  x = Math.max(0, Math.min(100, Math.round(x)));
  y = Math.max(0, Math.min(100, Math.round(y)));
  const pos = `${x}% ${y}%`;
  document.getElementById('ae-cover-pos').value = pos;
  const label = document.getElementById('ae-pos-label');
  if (label) label.textContent = pos;
  const prev = document.getElementById('ae-pos-preview');
  if (prev) prev.style.backgroundPosition = pos;
  const img = document.getElementById('ae-cover-preview');
  if (img) img.style.objectPosition = pos;
}

// 矢印ボタン用 (dx: 水平%, dy: 垂直%)
function aeMovePos(dx, dy) {
  const [x, y] = _parsePosXY();
  _applyPosXY(x + dx, y + dy);
}

function aeResetPos() { _applyPosXY(50, 50); }

// 旧API互換 (top/center/bottom 文字列 or "X% Y%")
function aeSetPos(posStr) {
  if (!posStr || posStr === 'center') { _applyPosXY(50, 50); return; }
  if (posStr === 'top')    { _applyPosXY(50, 0);   return; }
  if (posStr === 'bottom') { _applyPosXY(50, 100);  return; }
  const m = posStr.match(/(\d+(?:\.\d+)?)%\s*(\d+(?:\.\d+)?)%/);
  if (m) _applyPosXY(parseFloat(m[1]), parseFloat(m[2]));
  else   _applyPosXY(50, 50);
}

// ドラッグ＋スクロール初期化（1回のみ）
function initPosDrag() {
  const prev = document.getElementById('ae-pos-preview');
  if (!prev || prev._dragReady) return;
  prev._dragReady = true;

  let dragging = false, sx, sy, spx, spy;

  prev.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    [spx, spy] = _parsePosXY();
    prev.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    // 200px のドラッグ ≒ 50% 移動
    _applyPosXY(spx + (e.clientX - sx) * 0.25, spy + (e.clientY - sy) * 0.25);
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; prev.style.cursor = 'grab'; }
  });

  // スクロールで縦方向微調整
  prev.addEventListener('wheel', e => {
    e.preventDefault();
    const [x, y] = _parsePosXY();
    _applyPosXY(x, y + (e.deltaY > 0 ? 3 : -3));
  }, { passive: false });

  // タッチ対応
  prev.addEventListener('touchstart', e => {
    const t = e.touches[0];
    dragging = true; sx = t.clientX; sy = t.clientY;
    [spx, spy] = _parsePosXY();
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    _applyPosXY(spx + (t.clientX - sx) * 0.25, spy + (t.clientY - sy) * 0.25);
  });
  document.addEventListener('touchend', () => { dragging = false; });
}

function aeAutoSlug() {
  const title = document.getElementById('ae-title').value.trim();
  if (!title) { showToast('タイトルを先に入力してください', 'error'); return; }
  document.getElementById('ae-slug').value = aeSlugify(title);

function aeSlugify(str) {
  return str.toLowerCase()
    .replace(/[^\w\s-]/g, '').replace(/[\s_]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 80) || 'article';
}

async function saveArticleFromEditor(publish) {
  const title = document.getElementById('ae-title').value.trim();
  if (!title) { showToast('タイトルは必須です', 'error'); return; }

  const pubBtn = document.getElementById('ae-publish-btn');
  pubBtn.disabled = true;
  pubBtn.textContent = '保存中...';

  const html    = sanitizeArticleContent(aeGetContentHTML());
  const rtVal   = parseInt(document.getElementById('ae-read-time').value);
  const chars   = (getLiveEditor().textContent || '').trim().length;
  const autoRT  = Math.max(1, Math.round(chars / 500));
  const isPublished = publish || document.getElementById('ae-published').checked;

  const payload = {
    title,
    slug:          document.getElementById('ae-slug').value.trim() || aeSlugify(title),
    lead_text:     document.getElementById('ae-excerpt').value.trim() || null,
    content:       html || null,
    thumbnail_url:      document.getElementById('ae-cover').value.trim() || null,
    thumbnail_position: document.getElementById('ae-cover-pos').value || 'center',
    category:           document.getElementById('ae-category').value || null,
    tags:          splitTrim(document.getElementById('ae-tags').value),
    read_time_min: rtVal || autoRT,
    author_type:   document.getElementById('ae-author').value.trim() || '編集部',
    is_published:  isPublished,
    status:        isPublished ? 'published' : 'draft',
    updated_at:    new Date().toISOString(),
  };

  if (editingArticleId || !isPublished) delete payload.published_at;
  if (!editingArticleId && isPublished) payload.published_at = new Date().toISOString();

  let error;
  if (editingArticleId) {
    ({ error } = await _sb.from('articles').update(payload).eq('id', editingArticleId));
  } else {
    ({ error } = await _sb.from('articles').insert(payload));
  }

  pubBtn.disabled = false;
  pubBtn.textContent = editingArticleId ? '更新する' : '公開する';

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }

  _isDirty = false;
  document.getElementById('ae-published').checked = isPublished;
  aeUpdatePubBadge();

  const msg = editingArticleId
    ? (isPublished ? '記事を更新しました' : '下書きを保存しました')
    : (isPublished ? '記事を公開しました 🎉' : '下書きを保存しました');
  showToast(msg, 'success');
  loadArticles();
  if (!editingArticleId && isPublished) setTimeout(() => closeArticleEditor(), 1200);
}

function saveArticle() { saveArticleFromEditor(document.getElementById('ae-published')?.checked || false); }

async function deleteArticle(articleId) {
  if (!confirm('この記事を削除しますか？')) return;
  const { error } = await _sb.from('articles').update({ deleted_at: new Date().toISOString() }).eq('id', articleId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  loadArticles();
}

async function approveArticleAdmin(articleId) {
  if (!confirm('この記事を承認して公開しますか？')) return;
  const { error } = await _sb.from('articles').update({
    is_published:   true,
    status:         'published',
    published_at:   new Date().toISOString(),
    review_comment: null,
  }).eq('id', articleId);
  if (error) { showToast('エラー: ' + error.message, 'error'); return; }
  showToast('承認・公開しました', 'success');
  loadArticles();
}

async function rejectArticleAdmin(articleId) {
  const reason = prompt('差し戻しコメント（任意。記事カードに表示されます）:');
  if (reason === null) return; // キャンセル
  const { error } = await _sb.from('articles').update({
    status:         'draft',
    review_comment: reason || null,
  }).eq('id', articleId);
  if (error) { showToast('エラー: ' + error.message, 'error'); return; }
  showToast('下書きに差し戻しました', 'success');
  loadArticles();
}

// ============================================================
// Users (admin only)
// ============================================================
async function loadUsers() {
  const el     = document.getElementById('users-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const { data: users, error } = await _sb
    .from('user_roles')
    .select('user_id, role, email')
    .order('role');

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!users || users.length === 0) { el.innerHTML = '<div class="empty">ユーザーがいません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>メールアドレス</th>
            <th>ロール</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => userRow(u)).join('')}
        </tbody>
      </table>
    </div>`;
}

function userRow(u) {
  const email  = escHtml(u.email || u.user_id);
  const isSelf = u.user_id === currentUser.id;

  const roleCell = isSelf
    ? `<span class="badge badge-${u.role}">${u.role}</span>`
    : `<select class="role-select" onchange="changeRole('${u.user_id}', this)">
        <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>editor</option>
        <option value="staff"  ${u.role === 'staff'  ? 'selected' : ''}>staff</option>
        <option value="admin"  ${u.role === 'admin'  ? 'selected' : ''}>admin</option>
       </select>`;

  const actions = isSelf
    ? '<span style="font-size:12px;color:var(--on-dark-soft);">（自分）</span>'
    : `<button class="btn-danger" onclick="removeUser('${u.user_id}', '${escHtml(u.email || '')}')">削除</button>`;

  return `
    <tr>
      <td class="name">${email}</td>
      <td>${roleCell}</td>
      <td>${actions}</td>
    </tr>`;
}

async function addUser() {
  const email = document.getElementById('new-user-email').value.trim();
  const role  = document.getElementById('new-user-role').value;

  if (!email) { showToast('メールアドレスを入力してください', 'error'); return; }

  // メールからユーザーIDを取得（RPC経由）
  const { data: userId, error: rpcErr } = await _sb.rpc('get_user_id_by_email', { p_email: email });
  if (rpcErr || !userId) {
    showToast('そのメールアドレスのユーザーが見つかりません', 'error'); return;
  }

  const { error } = await _sb.from('user_roles').insert({ user_id: userId, role, email });
  if (error) {
    showToast('追加できませんでした: ' + (error.message.includes('duplicate') ? 'すでに登録済みです' : error.message), 'error');
    return;
  }

  showToast(`${email} を ${role} として追加しました`, 'success');
  document.getElementById('new-user-email').value = '';
  loadUsers();
}

async function changeRole(userId, selectEl) {
  const newRole = selectEl.value;
  const { error } = await _sb.from('user_roles').update({ role: newRole }).eq('user_id', userId);
  if (error) {
    showToast('ロール変更に失敗しました: ' + error.message, 'error');
    loadUsers(); // 元に戻す
    return;
  }
  showToast(`ロールを ${newRole} に変更しました`, 'success');
}

async function removeUser(userId, email) {
  if (!confirm(`${email || userId} を削除しますか？`)) return;
  const { error } = await _sb.from('user_roles').delete().eq('user_id', userId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  loadUsers();
}

// ============================================================
// Helpers
// ============================================================
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `toast ${type}`;
  setTimeout(() => el.classList.add('hidden'), 2800);
}

document.getElementById('instructor-modal').addEventListener('click', function(e) {

// ⌘S saves draft when editor is open
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's'
      && document.getElementById('article-editor-page').classList.contains('open')) {
    e.preventDefault();
    saveArticleFromEditor(false);
  }
  // Escape closes sidebar
  if (e.key === 'Escape' && document.getElementById('ae-sidebar').classList.contains('open')) {
    toggleAeSidebar();
  }
});
