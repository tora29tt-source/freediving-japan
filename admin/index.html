<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 — Freediving Japan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css">
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --abyss:       #04161f;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --warm:        #f97316;
  --red:         #ef4444;
  --green:       #22c55e;
  --yellow:      #eab308;
  --on-dark:         rgba(255,255,255,0.92);
  --on-dark-mid:     rgba(255,255,255,0.62);
  --on-dark-soft:    rgba(255,255,255,0.38);
  --hairline:        rgba(168,236,232,0.14);
  --glass:           rgba(255,255,255,0.045);
}
html { background: var(--abyss); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: linear-gradient(180deg, var(--ocean-mid) 0%, var(--ocean-deep) 22%, #06283a 55%, var(--abyss) 100%);
  background-attachment: fixed;
  color: var(--on-dark);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,32,46,0.7); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hairline);
  padding: 0 20px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 15px; font-weight: 600; color: var(--on-dark); letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }
.logo span { color: var(--teal); }
.role-badge {
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 100px; margin-left: 10px;
}
.role-badge.admin  { background: rgba(249,115,22,0.2);  border: 1px solid rgba(249,115,22,0.4);  color: var(--warm); }
.role-badge.staff  { background: rgba(46,196,182,0.15); border: 1px solid rgba(46,196,182,0.35); color: var(--teal); }
.role-badge.editor { background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.35); color: #a78bfa; }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-info { font-size: 12px; color: var(--on-dark-soft); }
.logout-btn { font-size: 12px; color: var(--on-dark-mid); background: none; border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: border-color 0.2s; }
.logout-btn:hover { border-color: var(--red); color: var(--red); }

/* ── Tabs ── */
.tabs-wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 28px; }
.tab {
  padding: 10px 20px; font-size: 13px; font-weight: 500;
  color: var(--on-dark-soft); border-bottom: 2px solid transparent;
  cursor: pointer; transition: all 0.2s; margin-bottom: -1px;
  background: none; border-left: none; border-right: none; border-top: none;
}
.tab:hover { color: var(--on-dark-mid); }
.tab.active { color: var(--teal); border-bottom-color: var(--teal); }

/* ── Main ── */
.main { max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }

/* ── Section header ── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.section-title { font-size: 13px; font-weight: 600; color: var(--on-dark-mid); letter-spacing: 0.1em; text-transform: uppercase; }
.btn-primary {
  display: flex; align-items: center; gap: 6px;
  background: var(--teal); color: var(--ocean-deep);
  border: none; border-radius: 10px; padding: 9px 16px;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: background 0.2s; white-space: nowrap;
}
.btn-primary:hover { background: var(--teal-light); }
.btn-danger {
  background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-edit {
  background: rgba(46,196,182,0.12); color: var(--teal); border: 1px solid rgba(46,196,182,0.3);
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-edit:hover { background: rgba(46,196,182,0.22); }

/* ── Table ── */
.table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--hairline); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: rgba(255,255,255,0.04); }
th { padding: 11px 14px; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-dark-soft); white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--hairline); color: var(--on-dark-mid); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,0.025); }
td.name { color: var(--on-dark); font-weight: 500; }
.actions { display: flex; gap: 6px; }

/* ── Status badges ── */
.badge {
  display: inline-block; padding: 3px 9px; border-radius: 100px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.05em; white-space: nowrap;
}
.badge-pending  { background: rgba(234,179,8,0.15);  color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
.badge-paid     { background: rgba(46,196,182,0.15); color: var(--teal);   border: 1px solid rgba(46,196,182,0.3); }
.badge-confirmed{ background: rgba(34,197,94,0.15);  color: var(--green);  border: 1px solid rgba(34,197,94,0.3); }
.badge-cancelled{ background: rgba(239,68,68,0.12);  color: var(--red);    border: 1px solid rgba(239,68,68,0.25); }
.badge-refunded { background: rgba(148,163,184,0.15); color: #94a3b8;       border: 1px solid rgba(148,163,184,0.25); }
.badge-active   { background: rgba(34,197,94,0.12);  color: var(--green);  border: 1px solid rgba(34,197,94,0.25); }
.badge-inactive { background: rgba(148,163,184,0.12); color: #94a3b8;       border: 1px solid rgba(148,163,184,0.2); }
.badge-admin    { background: rgba(249,115,22,0.15); color: var(--warm);   border: 1px solid rgba(249,115,22,0.3); }
.badge-staff    { background: rgba(46,196,182,0.12); color: var(--teal);   border: 1px solid rgba(46,196,182,0.3); }
.role-select { background: var(--surface); color: var(--on-dark); border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }

/* ── Status select ── */
.status-select {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--on-dark); font-size: 12px;
  padding: 5px 8px; cursor: pointer; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.status-select:focus { border-color: var(--teal); }
.status-select option { background: #0e3d5c; }

/* ── Empty state ── */
.empty { text-align: center; padding: 48px 20px; color: var(--on-dark-soft); font-size: 13px; }

/* ── Loading spinner ── */
.spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 48px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--hairline); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Modal ── */
.modal-backdrop {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--ocean-mid); border: 1px solid var(--hairline);
  border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
}
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--on-dark-mid); letter-spacing: 0.05em; margin-bottom: 6px; }
.form-group input,
.form-group select {
  width: 100%; padding: 11px 13px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.form-group textarea {
  width: 100%; padding: 11px 13px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
  resize: vertical; min-height: 80px;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--teal); background: rgba(255,255,255,0.1); }
.form-group select option { background: var(--ocean-mid); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.modal-actions .btn-primary { flex: 1; justify-content: center; }
.btn-cancel {
  flex: 1; padding: 11px 16px; background: transparent; border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark-mid); font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-cancel:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ocean-mid); border: 1px solid var(--hairline);
  border-radius: 100px; padding: 12px 20px;
  font-size: 13px; color: var(--on-dark);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  z-index: 300; transition: opacity 0.3s; pointer-events: none;
  white-space: nowrap;
}
.toast.success { border-color: rgba(46,196,182,0.4); }
.toast.error   { border-color: rgba(239,68,68,0.4); }
.toast.hidden  { opacity: 0; }

/* ── Filters ── */
.filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-select {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 10px; color: var(--on-dark-mid); font-size: 12px;
  padding: 8px 12px; cursor: pointer; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.filter-select:focus { border-color: var(--teal); }
.filter-select option { background: #0e3d5c; }

/* ── Checkbox toggle ── */
.toggle-wrap { display: flex; align-items: center; gap: 8px; }
.toggle { position: relative; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0; cursor: pointer;
  background: rgba(255,255,255,0.12); border-radius: 100px;
  transition: background 0.2s;
}
.toggle input:checked + .toggle-track { background: var(--teal); }
.toggle-track::after {
  content: ''; position: absolute; width: 16px; height: 16px;
  left: 3px; top: 3px; background: white; border-radius: 50%;
  transition: transform 0.2s;
}
.toggle input:checked + .toggle-track::after { transform: translateX(18px); }
.toggle-label { font-size: 13px; color: var(--on-dark-mid); }

/* ── Auth guard ── */
#auth-guard { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
.auth-message { text-align: center; }
.auth-message h2 { font-size: 18px; margin-bottom: 12px; }
.auth-message p { color: var(--on-dark-soft); font-size: 13px; margin-bottom: 20px; }

/* ── User management ── */
.user-add-form {
  background: rgba(255,255,255,0.04); border: 1px solid var(--hairline);
  border-radius: 14px; padding: 20px; margin-bottom: 24px;
  display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
}
.user-add-form .form-group { margin-bottom: 0; flex: 1; min-width: 200px; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr; }
  th, td { padding: 10px 10px; }
  .role-badge { display: none; }
  .user-info { display: none; }
}

/* ── Quill dark-theme overrides ── */
.ql-toolbar.ql-snow {
  border: none !important;
  border-bottom: 1px solid var(--hairline) !important;
  background: rgba(255,255,255,0.025);
  padding: 6px 14px;
  flex-shrink: 0;
}
.ql-toolbar.ql-snow .ql-formats { margin-right: 10px; }
.ql-toolbar .ql-stroke { stroke: var(--on-dark-soft) !important; }
.ql-toolbar .ql-fill   { fill:   var(--on-dark-soft) !important; }
.ql-toolbar .ql-picker-label { color: var(--on-dark-soft) !important; border-color: var(--hairline) !important; border-radius: 5px !important; }
.ql-toolbar button { border-radius: 5px !important; }
.ql-toolbar button:hover .ql-stroke, .ql-toolbar button.ql-active .ql-stroke { stroke: var(--teal) !important; }
.ql-toolbar button:hover .ql-fill,   .ql-toolbar button.ql-active .ql-fill   { fill:   var(--teal) !important; }
.ql-toolbar button:hover, .ql-toolbar button.ql-active { background: rgba(46,196,182,0.1) !important; }
.ql-toolbar .ql-picker-label:hover { color: var(--teal) !important; }
.ql-toolbar .ql-picker-label:hover .ql-stroke { stroke: var(--teal) !important; }
.ql-snow .ql-picker-options {
  background: var(--ocean-mid) !important; border-color: var(--hairline) !important;
  border-radius: 8px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
}
.ql-snow .ql-picker-item { color: var(--on-dark-mid) !important; }
.ql-snow .ql-picker-item:hover { color: var(--teal) !important; }
.ql-container.ql-snow { border: none !important; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.ql-editor {
  flex: 1; padding: 20px 32px !important;
  color: rgba(255,255,255,0.88) !important; font-size: 15px !important;
  line-height: 1.85 !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif !important;
  overflow-y: auto;
}
.ql-editor.ql-blank::before { color: var(--on-dark-soft) !important; font-style: normal !important; }
.ql-editor h1 { font-size: 24px; font-weight: 700; margin: 0 0 12px; }
.ql-editor h2 { font-size: 19px; font-weight: 700; margin: 28px 0 10px; color: var(--teal); padding-bottom: 6px; border-bottom: 1px solid var(--hairline); }
.ql-editor h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
.ql-editor p  { margin-bottom: 14px; }
.ql-editor a  { color: var(--teal); }
.ql-editor img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
.ql-editor blockquote { border-left: 3px solid var(--teal) !important; padding: 10px 18px !important; background: rgba(46,196,182,0.06) !important; border-radius: 0 8px 8px 0 !important; margin: 14px 0 !important; }
.ql-editor pre.ql-syntax { background: rgba(255,255,255,0.07) !important; border-radius: 8px !important; padding: 14px 18px !important; border: 1px solid var(--hairline) !important; color: var(--teal-light) !important; }
.ql-editor ul li, .ql-editor ol li { color: rgba(255,255,255,0.82) !important; }
.ql-snow .ql-tooltip {
  background: var(--ocean-mid) !important; border-color: var(--hairline) !important;
  color: var(--on-dark) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
  border-radius: 8px !important; z-index: 9999;
}
.ql-snow .ql-tooltip input[type=text] {
  background: rgba(255,255,255,0.1) !important; border-color: var(--hairline) !important;
  color: var(--on-dark) !important; border-radius: 6px !important;
}
.ql-snow .ql-tooltip a.ql-action::after { color: var(--teal) !important; }
.ql-snow .ql-tooltip a.ql-remove::before { color: rgba(239,68,68,0.8) !important; }

/* ════════════════════════════════════════════
   Article Full-Page Editor
   ════════════════════════════════════════════ */
#article-editor-page {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--abyss);
  flex-direction: column;
  overflow: hidden;
}
#article-editor-page.open { display: flex; }

/* Top bar */
.ae-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: rgba(6,32,46,0.97);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
  gap: 12px;
}
.ae-back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: 1px solid var(--hairline);
  border-radius: 8px; padding: 6px 12px;
  color: var(--on-dark-mid); font-size: 13px; cursor: pointer;
  font-family: inherit; white-space: nowrap; transition: all 0.2s;
}
.ae-back-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }
.ae-mode-tabs {
  display: flex;
  background: rgba(255,255,255,0.07);
  border-radius: 8px; padding: 3px; gap: 2px;
}
.ae-mode-tab {
  padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
  color: var(--on-dark-soft); background: none; border: none;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.ae-mode-tab.active { background: rgba(255,255,255,0.14); color: var(--on-dark); }
.ae-topbar-right { display: flex; gap: 8px; align-items: center; }
.ae-settings-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 7px 12px; color: var(--on-dark-mid);
  cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.2s;
}
.ae-settings-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }
.ae-settings-btn.active { border-color: var(--teal); color: var(--teal); background: rgba(46,196,182,0.1); }
.ae-draft-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 7px 14px; color: var(--on-dark-mid);
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
  transition: all 0.2s; white-space: nowrap;
}
.ae-draft-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--on-dark); }
.ae-publish-btn {
  background: var(--teal); border: none; border-radius: 8px; padding: 7px 16px;
  color: var(--ocean-deep); font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background 0.2s; white-space: nowrap;
}
.ae-publish-btn:hover { background: var(--teal-light); }
.ae-publish-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Toolbar */
.ae-toolbar {
  display: flex; align-items: center; gap: 2px;
  padding: 5px 14px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0; flex-wrap: wrap;
}
.ae-tool {
  background: none; border: none; border-radius: 5px;
  padding: 4px 8px; color: var(--on-dark-soft); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
}
.ae-tool:hover { background: rgba(255,255,255,0.09); color: var(--on-dark); }
.ae-tool-sep { width: 1px; height: 16px; background: var(--hairline); margin: 0 3px; flex-shrink: 0; }

/* Main editor area */
.ae-main {
  display: flex; flex: 1; overflow: hidden; position: relative;
}

/* Editor pane */
.ae-editor-pane {
  display: flex; flex-direction: column; flex: 1; overflow: hidden; min-width: 0;
}
.ae-title-input {
  width: 100%; background: none; border: none; outline: none;
  color: var(--on-dark); font-size: 26px; font-weight: 700;
  padding: 24px 32px 14px; font-family: inherit;
  border-bottom: 1px solid var(--hairline); flex-shrink: 0;
}
.ae-title-input::placeholder { color: var(--on-dark-soft); }
.ae-meta-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 32px; flex-shrink: 0;
  border-bottom: 1px solid var(--hairline);
}
.ae-word-count { font-size: 11px; color: var(--on-dark-soft); }
.ae-pub-badge {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 100px;
}
.ae-pub-badge.draft     { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
.ae-pub-badge.published { background: rgba(34,197,94,0.12);  color: var(--green); border: 1px solid rgba(34,197,94,0.25); }

/* Preview pane */
.ae-preview-pane {
  border-left: 1px solid var(--hairline);
  overflow-y: auto;
  padding: 24px 32px;
  background: rgba(255,255,255,0.012);
  display: none; min-width: 0;
}
/* Markdown styles inside preview */

<body>

<!-- Header -->
<header class="header">
  <div style="display:flex;align-items:center;">

</div>

<!-- Main content -->

  <div class="main">

    <!-- ── 予約一覧 ── -->

      </div>

          <option value="review">レビュー待ち</option>
          <option value="draft">下書き</option>

      <div id="articles-content">

            <button class="ae-slug-gen" onclick="aeAutoSlug()" title="タイトルから自動生成">自動</button>

          <label>概要（カード表示用）</label>

          <input type="text" id="ae-tags" placeholder="初心者, 入門, フリーダイビング">

          <input type="number" id="ae-read-time" min="1" placeholder="自動計算">

          <label>著者</label>
          <input type="text" id="ae-author" placeholder="FreeDive Japan編集部">
        </div>

          <span class="ae-pub-toggle-label">公開する</span>

<!-- ── Toast ── -->
<div class="toast hidden" id="toast"></div>

<script>
// ============================================================
// State
// ============================================================
let currentUser  = null;
let currentRole  = null; // 'admin' | 'staff'
let allInstructors = [];
let allListings    = [];
let editingSlotId        = null;
let editingInstructorId  = null;
let editingListingId     = null;
let editingArticleId     = null;

// ============================================================
// Boot: auth + role check
// ============================================================
async function boot() {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    showAccessDenied('ログインが必要です', 'このページを使用するにはログインしてください。', '../auth.html', 'ログインへ');
    return;
  }
  currentUser = session.user;

  // user_roles からロール取得
  const { data: roles } = await _sb
    .from('user_roles')
    .select('role')
    .eq('user_id', currentUser.id);

  const roleList = (roles || []).map(r => r.role);
  const isAdmin  = roleList.includes('admin');
  const isStaff  = roleList.includes('staff');
  const isEditor = roleList.includes('editor');

  if (!isAdmin && !isStaff && !isEditor) {
    showAccessDenied('アクセス権限がありません', 'このページを表示する権限がありません。', '../index.html', 'トップへ戻る');
    return;
  }

  currentRole = isAdmin ? 'admin' : isStaff ? 'staff' : 'editor';

  // ヘッダー表示
  document.getElementById('user-email').textContent = currentUser.email;
  const badge = document.getElementById('role-badge');
  badge.textContent = currentRole.toUpperCase();
  badge.classList.add(currentRole);

  // タブ表示制御
  // admin: 全タブ表示（ユーザー管理含む）
  // staff: 空き枠・予約・インストラクター・リスティング・メディア（ユーザー管理なし）
  // editor: メディアのみ
  if (isAdmin) {
    document.getElementById('tab-btn-users').style.display = '';
  }
  if (isEditor && !isAdmin && !isStaff) {
    ['slots', 'bookings', 'instructors', 'listings'].forEach(t => {
      document.getElementById(`tab-btn-${t}`).style.display = 'none';
    });
    // デフォルトタブをメディアに変更
    document.querySelector('.tab.active')?.classList.remove('active');
    document.getElementById('tab-btn-media').classList.add('active');
    document.getElementById('tab-slots').style.display = 'none';
    document.getElementById('tab-media').style.display = '';
  }

  document.getElementById('app').style.display = 'block';

  if (isEditor && !isAdmin && !isStaff) {
    // editor はメディアのみ — slots/masterdata不要
    await loadArticles();
  } else {
    await loadMasterData();
    await loadSlots();
  }
}

function showAccessDenied(title, msg, href, label) {
  const guard = document.getElementById('auth-guard');
  guard.querySelector('h2').textContent  = title;
  guard.querySelector('p').textContent   = msg;
  const a = guard.querySelector('a');
  a.href        = href;
  a.textContent = label;
  guard.style.display = 'flex';
}

async function handleLogout() {
  await _sb.auth.signOut();
  location.href = '../auth.html';
}

// ============================================================
// Master data (instructors & listings)
// ============================================================
async function loadMasterData() {
  const [{ data: instructors }, { data: listings }] = await Promise.all([
    _sb.from('instructors').select('id, name').order('name'),
    _sb.from('listings').select('id, title, instructor_id').order('title'),
  ]);
  allInstructors = instructors || [];
  allListings    = listings    || [];

  ['slot-filter-instructor', 'booking-filter-instructor', 'slot-instructor', 'listing-filter-instructor'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const keep = el.querySelector('option[value=""]');
    el.innerHTML = '';
    el.appendChild(keep);
    allInstructors.forEach(inst => {
      const opt = document.createElement('option');
      opt.value = inst.id;
      opt.textContent = inst.name;
      el.appendChild(opt);
    });
  });
}

function onInstructorChange() {
  const instId   = document.getElementById('slot-instructor').value;
  const listEl   = document.getElementById('slot-listing');
  const filtered = allListings.filter(l => l.instructor_id === instId);
  listEl.innerHTML = '<option value="">選択してください</option>';
  filtered.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.id;
    opt.textContent = l.title;
    listEl.appendChild(opt);
  });
}

// ============================================================
// Tabs
// ============================================================
function switchTab(name) {
  const tabNames = ['slots', 'bookings', 'instructors', 'listings', 'media', 'users'];
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', tabNames[i] === name);
  });
  tabNames.forEach(n => {
    const el = document.getElementById('tab-' + n);
    if (el) el.style.display = n === name ? '' : 'none';
  });

  if (name === 'bookings')    loadBookings();
  if (name === 'instructors') loadInstructors();
  if (name === 'listings')    loadListings();
  if (name === 'media')       loadArticles();
  if (name === 'users')       loadUsers();
}

// ============================================================
// Slots
// ============================================================
async function loadSlots() {
  const el     = document.getElementById('slots-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const instFilter   = document.getElementById('slot-filter-instructor').value;
  const statusFilter = document.getElementById('slot-filter-status').value;

  let query = _sb
    .from('availability_slots')
    .select('*, instructors(name), listings(title)')
    .order('slot_date', { ascending: false })
    .order('start_time', { ascending: true });

  if (instFilter)   query = query.eq('instructor_id', instFilter);
  if (statusFilter === 'active')   query = query.eq('is_active', true);
  if (statusFilter === 'inactive') query = query.eq('is_active', false);

  const { data: slots, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!slots || slots.length === 0) { el.innerHTML = '<div class="empty">空き枠がありません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>日付</th>
            <th>時間</th>
            <th>インストラクター</th>
            <th>コース</th>
            <th>枠</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${slots.map(s => slotRow(s)).join('')}
        </tbody>
      </table>
    </div>`;
}

function slotRow(s) {
  const date  = s.slot_date ? fmtDate(s.slot_date) : '—';
  const time  = `${(s.start_time||'').slice(0,5)}〜${(s.end_time||'').slice(0,5)}`;
  const inst  = s.instructors?.name || '—';
  const title = s.listings?.title   || '—';
  const seats = `${s.booked_count || 0} / ${s.max_participants}`;
  const badge = s.is_active
    ? '<span class="badge badge-active">有効</span>'
    : '<span class="badge badge-inactive">無効</span>';
  return `
    <tr>
      <td><span title="${s.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${s.id.slice(0,8)}</span></td>
      <td class="name">${date}</td>
      <td>${time}</td>
      <td>${inst}</td>
      <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${title}</td>
      <td>${seats}</td>
      <td>${badge}</td>
      <td>
        <div class="actions">
          <button class="btn-edit" onclick="openSlotModal('${s.id}')">編集</button>
          <button class="btn-danger" onclick="deleteSlot('${s.id}')">削除</button>
        </div>
      </td>
    </tr>`;
}

// ── Slot Modal ──
function openSlotModal(slotId = null) {
  editingSlotId = slotId;
  document.getElementById('slot-modal-title').textContent = slotId ? '空き枠を編集' : '空き枠を追加';
  document.getElementById('slot-save-label').textContent  = slotId ? '更新する' : '保存する';

  ['slot-instructor','slot-listing','slot-date','slot-start','slot-end'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('slot-max').value = 4;
  document.getElementById('slot-active').checked = true;
  document.getElementById('slot-listing').innerHTML = '<option value="">インストラクターを先に選択</option>';

  if (slotId) {
    _sb.from('availability_slots')
      .select('*')
      .eq('id', slotId)
      .single()
      .then(({ data: s }) => {
        if (!s) return;
        document.getElementById('slot-instructor').value = s.instructor_id || '';
        onInstructorChange();
        setTimeout(() => {
          document.getElementById('slot-listing').value = s.listing_id || '';
        }, 50);
        document.getElementById('slot-date').value   = s.slot_date   || '';
        document.getElementById('slot-start').value  = (s.start_time||'').slice(0,5);
        document.getElementById('slot-end').value    = (s.end_time||'').slice(0,5);
        document.getElementById('slot-max').value    = s.max_participants || 4;
        document.getElementById('slot-active').checked = s.is_active !== false;
      });
  }

  document.getElementById('slot-modal').classList.add('open');
}

function closeSlotModal() {
  document.getElementById('slot-modal').classList.remove('open');
  editingSlotId = null;
}

async function saveSlot() {
  const instructorId = document.getElementById('slot-instructor').value;
  const listingId    = document.getElementById('slot-listing').value;
  const slotDate     = document.getElementById('slot-date').value;
  const startTime    = document.getElementById('slot-start').value;
  const endTime      = document.getElementById('slot-end').value;
  const maxP         = parseInt(document.getElementById('slot-max').value) || 1;
  const isActive     = document.getElementById('slot-active').checked;

  if (!instructorId || !slotDate || !startTime || !endTime) {
    showToast('インストラクター・日付・時間は必須です', 'error'); return;
  }
  if (startTime >= endTime) {
    showToast('開始時刻は終了時刻より前にしてください', 'error'); return;
  }

  const payload = {
    instructor_id:    instructorId,
    listing_id:       listingId || null,
    slot_date:        slotDate,
    start_time:       startTime,
    end_time:         endTime,
    max_participants: maxP,
    is_active:        isActive,
  };

  let error;
  if (editingSlotId) {
    ({ error } = await _sb.from('availability_slots').update(payload).eq('id', editingSlotId));
  } else {
    payload.booked_count = 0;
    ({ error } = await _sb.from('availability_slots').insert(payload));
  }

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }
  showToast(editingSlotId ? '空き枠を更新しました' : '空き枠を追加しました', 'success');
  closeSlotModal();
  loadSlots();
}

async function deleteSlot(slotId) {
  if (!confirm('この空き枠を削除しますか？\n予約済みの場合は削除できません。')) return;
  const { error } = await _sb.from('availability_slots').delete().eq('id', slotId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('空き枠を削除しました', 'success');
  loadSlots();
}

// ============================================================
// Bookings
// ============================================================
async function loadBookings() {
  const el     = document.getElementById('bookings-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const statusFilter = document.getElementById('booking-filter-status').value;
  const instFilter   = document.getElementById('booking-filter-instructor').value;

  let query = _sb
    .from('bookings')
    .select('*, availability_slots(slot_date, start_time, end_time), listings(title), instructors(name)')
    .order('created_at', { ascending: false });

  if (statusFilter) query = query.eq('status', statusFilter);
  if (instFilter)   query = query.eq('instructor_id', instFilter);

  const { data: bookings, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!bookings || bookings.length === 0) { el.innerHTML = '<div class="empty">予約がありません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>日時</th>
            <th>ゲスト</th>
            <th>コース</th>
            <th>人数</th>
            <th>金額</th>
            <th>ステータス</th>
            <th>変更</th>
          </tr>
        </thead>
        <tbody>
          ${bookings.map(b => bookingRow(b)).join('')}
        </tbody>
      </table>
    </div>`;
}

function bookingRow(b) {
  const slot  = b.availability_slots;
  const date  = slot?.slot_date ? fmtDate(slot.slot_date) : '—';
  const time  = slot ? `${(slot.start_time||'').slice(0,5)}〜${(slot.end_time||'').slice(0,5)}` : '—';
  const title = b.listings?.title || '—';
  const amt   = b.total_amount ? `¥${b.total_amount.toLocaleString()}` : '—';
  const statusBadge = `<span class="badge badge-${b.status}">${b.status}</span>`;

  const statusOpts = ['pending','paid','confirmed','cancelled','refunded']
    .map(s => `<option value="${s}"${b.status===s?' selected':''}>${s}</option>`)
    .join('');

  return `
    <tr>
      <td><span title="${b.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${b.id.slice(0,8)}</span></td>
      <td>
        <div class="name">${date}</div>
        <div style="font-size:11px;color:var(--on-dark-soft);">${time}</div>
      </td>
      <td>
        <div class="name">${escHtml(b.client_name || '—')}</div>
        <div style="font-size:11px;color:var(--on-dark-soft);">${escHtml(b.client_email || '')}</div>
      </td>
      <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(title)}</td>
      <td>${b.participant_count || 1}名</td>
      <td>${amt}</td>
      <td>${statusBadge}</td>
      <td>
        <select class="status-select" onchange="updateBookingStatus('${b.id}', this.value, this)">
          ${statusOpts}
        </select>
      </td>
    </tr>`;
}

async function updateBookingStatus(bookingId, newStatus, selectEl) {
  const prev = selectEl.dataset.prev || selectEl.value;
  const { error } = await _sb
    .from('bookings')
    .update({ status: newStatus })
    .eq('id', bookingId);

  if (error) {
    showToast('更新に失敗しました: ' + error.message, 'error');
    selectEl.value = prev;
    return;
  }
  selectEl.dataset.prev = newStatus;
  const badge = selectEl.closest('tr').querySelector('.badge');
  if (badge) {
    badge.className = `badge badge-${newStatus}`;
    badge.textContent = newStatus;
  }
  showToast('ステータスを更新しました', 'success');
}

// ============================================================
// Instructors
// ============================================================
async function loadInstructors() {
  const el = document.getElementById('instructors-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const statusFilter = document.getElementById('instructor-filter-status')?.value || '';

  let query = _sb
    .from('instructors')
    .select('id, name, prefecture, city, is_verified, is_public, experience_years, status')
    .order('status', { ascending: true })   // pending が先頭に来るようにソート
    .order('created_at', { ascending: false });

  if (statusFilter) query = query.eq('status', statusFilter);

  const { data, error } = await query;

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">インストラクターがいません</div>'; return; }

  const statusBadge = s => {
    if (s === 'approved') return '<span class="badge badge-confirmed">承認済み</span>';
    if (s === 'pending')  return '<span class="badge" style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.35);color:#f59e0b;">承認待ち</span>';
    if (s === 'rejected') return '<span class="badge badge-danger">却下</span>';
    return '<span class="badge badge-inactive">—</span>';
  };

  const approveBtn = inst => inst.status !== 'approved'
    ? `<button class="btn-edit" style="background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.4);color:#22c55e;" onclick="setInstructorStatus('${inst.id}','${escHtml(inst.name)}','approved')">承認</button>`
    : '';
  const rejectBtn = inst => inst.status !== 'rejected'
    ? `<button class="btn-danger" onclick="setInstructorStatus('${inst.id}','${escHtml(inst.name)}','rejected')">却下</button>`
    : '';

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>名前</th>
            <th>エリア</th>
            <th>申請ステータス</th>
            <th>公開</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(inst => `
            <tr>
              <td class="name">${escHtml(inst.name)}</td>
              <td>${escHtml([inst.prefecture, inst.city].filter(Boolean).join(' ') || '—')}</td>
              <td>${statusBadge(inst.status)}</td>
              <td>${inst.is_public ? '<span class="badge badge-active">公開</span>' : '<span class="badge badge-inactive">非公開</span>'}</td>
              <td>
                <div class="actions">
                  ${approveBtn(inst)}
                  ${rejectBtn(inst)}
                  <button class="btn-edit" onclick="openInstructorModal('${inst.id}')">編集</button>
                  <button class="btn-danger" onclick="deleteInstructor('${inst.id}', '${escHtml(inst.name)}')">削除</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  // マスタデータも更新（空き枠モーダルのプルダウンに反映）
  await loadMasterData();
}

async function setInstructorStatus(id, name, newStatus) {
  const label = newStatus === 'approved' ? '承認' : '却下';
  if (!confirm(`${name} を${label}しますか？`)) return;

  const { error } = await _sb

function articleRow(a) {
  const catBadge = a.category
    ? `<span class="badge ${ARTICLE_CATEGORY_BADGE[a.category] || ''}">${ARTICLE_CATEGORY_LABEL[a.category] || a.category}</span>`
    : '<span style="color:var(--on-dark-soft);">—</span>';
  const statusBadge = a.is_published
    ? '<span class="badge badge-active">公開中</span>'
    : a.status === 'review'
      ? '<span class="badge" style="background:#fef3c7;color:#d97706;">レビュー待ち</span>'
      : '<span class="badge badge-inactive">下書き</span>';
  const pubDate = a.published_at ? fmtDate(a.published_at.slice(0,10)) : '—';
  const isEditorOnly = currentRole === 'editor';
  const reviewComment = a.review_comment
    ? `<div style="font-size:11px;color:#d97706;margin-top:4px;">💬 ${escHtml(a.review_comment)}</div>` : '';
  return `
    <tr>
      <td><span title="${a.id}" style="font-family:monospace;font-size:11px;color:var(--on-dark-soft);cursor:default;">${a.id.slice(0,8)}</span></td>
      <td class="name" style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(a.title)}${reviewComment}</td>
      <td>${catBadge}</td>
      <td>${statusBadge}</td>
      <td style="font-size:12px;">${pubDate}</td>
      <td>
        <div class="actions">
          <button class="btn-edit" onclick="openArticleModal('${a.id}')">編集</button>
          ${!isEditorOnly && a.status === 'review'
            ? `<button class="btn-edit" style="background:#d1fae5;color:#065f46;" onclick="approveArticleAdmin('${a.id}')">✓ 承認</button>
               <button class="btn-danger" style="background:#fef3c7;color:#92400e;border:none;" onclick="rejectArticleAdmin('${a.id}')">差し戻す</button>`
            : ''
          }
          ${!isEditorOnly
            ? `<button class="btn-danger" onclick="deleteArticle('${a.id}')">削除</button>`
            : ''
          }
        </div>
      </td>
    </tr>`;
}

// ============================================================
// Article Full-Page Editor  (Quill WYSIWYG)
// ============================================================
let _aeMode = 'write';
let _aeDebounce = null;
let quill = null;

function initQuill() {
  if (quill) return;
  quill = new Quill('#ae-body-quill', {
    theme: 'snow',
    modules: {
      toolbar: '#ae-quill-toolbar',
      history: { delay: 1000, maxStack: 200 },
    },
    placeholder: '本文をここに入力してください...\n\nツールバーから見出し・太字・リスト・リンクなどを挿入できます。',
  });

  quill.on('text-change', () => {
    _isDirty = true;
    aeUpdateWordCount();
    clearTimeout(_aeDebounce);
    _aeDebounce = setTimeout(aeRenderPreview, 300);
  });
}

function openArticleModal(articleId = null) {
  editingArticleId = articleId;
  initQuill();

  // Reset fields
  ['ae-title','ae-excerpt','ae-slug','ae-cover','ae-tags','ae-author'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('ae-read-time').value   = '';
  document.getElementById('ae-category').value    = '';
  document.getElementById('ae-published').checked = false;
  document.getElementById('ae-cover-preview').classList.remove('visible');
  quill.setContents([]);
  aeUpdateWordCount();
  aeUpdatePubBadge();

  document.getElementById('ae-publish-btn').textContent = articleId ? '更新する' : '公開する';

  if (articleId) {
    _sb.from('articles').select('*').eq('id', articleId).single().then(({ data: d }) => {
      if (!d) return;
      document.getElementById('ae-title').value     = d.title || '';
      document.getElementById('ae-excerpt').value   = d.lead_text || '';
      document.getElementById('ae-slug').value      = d.slug || '';
      document.getElementById('ae-cover').value     = d.thumbnail_url || '';
      document.getElementById('ae-tags').value      = (d.tags || []).join(', ');
      document.getElementById('ae-read-time').value = d.read_time_min || '';
      document.getElementById('ae-author').value    = d.author_type || 'FreeDive Japan編集部';
      document.getElementById('ae-category').value  = d.category || '';
      document.getElementById('ae-published').checked = d.is_published === true;
      // Load content into Quill
      if (d.content) quill.clipboard.dangerouslyPasteHTML(0, d.content);
      aeUpdateCover();
      aeUpdateWordCount();
      aeUpdatePubBadge();
    });
  }

  setEditorMode('write');
  document.getElementById('ae-sidebar').classList.remove('open');
  document.getElementById('ae-settings-toggle').classList.remove('active');
  document.getElementById('article-editor-page').classList.add('open');
  document.body.style.overflow = 'hidden';
  _isDirty = false;

  setTimeout(() => document.getElementById('ae-title').focus(), 80);
}

function closeArticleModal() { closeArticleEditor(); }

function closeArticleEditor() {
  if (_isDirty && !confirm('未保存の変更があります。閉じますか？')) return;
  document.getElementById('article-editor-page').classList.remove('open');
  document.body.style.overflow = '';
  editingArticleId = null;
  _isDirty = false;
}

function setEditorMode(mode) {
  _aeMode = mode;
  document.getElementById('ae-main').className = `ae-main ae-mode-${mode}`;
  document.getElementById('ae-tab-write').classList.toggle('active',   mode === 'write');
  document.getElementById('ae-tab-split').classList.toggle('active',   mode === 'split');
  document.getElementById('ae-tab-preview').classList.toggle('active', mode === 'preview');
  if (mode !== 'write') aeRenderPreview();
  if (quill) quill.focus();
}

function toggleAeSidebar() {
  document.getElementById('ae-sidebar').classList.toggle('open');
  document.getElementById('ae-settings-toggle').classList.toggle('active');
}

function aeRenderPreview() {
  if (!quill) return;
  const title = document.getElementById('ae-title').value;
  const html  = quill.getSemanticHTML ? quill.getSemanticHTML() : quill.root.innerHTML;
  let out = '';
  if (title) out += `<h1 style="font-size:26px;font-weight:700;margin:0 0 16px;line-height:1.3;">${escHtml(title)}</h1>`;
  out += html;
  document.getElementById('ae-preview-content').innerHTML = out;
}

function aeUpdateWordCount() {
  if (!quill) return;
  const text  = quill.getText();
  const chars = Math.max(0, text.length - 1); // Quill adds trailing \n
  const mins  = Math.max(1, Math.round(chars / 500));
  document.getElementById('ae-word-count').textContent = `${chars.toLocaleString()} 文字 · 推定 ${mins} 分`;
  const rt = document.getElementById('ae-read-time');
  if (!rt.value) rt.placeholder = `自動: ${mins} 分`;
}

function aeUpdateCover() {
  const url = document.getElementById('ae-cover').value.trim();
  const img = document.getElementById('ae-cover-preview');
  if (url) {
    img.src = url;
    img.classList.add('visible');
    img.onerror = () => img.classList.remove('visible');
  } else {
    img.classList.remove('visible');
  }
}

function aeUpdatePubBadge() {
  const published = document.getElementById('ae-published').checked;
  const badge = document.getElementById('ae-pub-badge');
  badge.textContent = published ? '公開中' : '下書き';
  badge.className = `ae-pub-badge ${published ? 'published' : 'draft'}`;
}

function aeAutoSlug() {
  const title = document.getElementById('ae-title').value.trim();
  if (!title) { showToast('タイトルを先に入力してください', 'error'); return; }
  document.getElementById('ae-slug').value = aeSlugify(title);
}

function aeSlugify(str) {
  return str.toLowerCase()
    .replace(/[^\w\s-]/g, '').replace(/[\s_]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 80) || 'article';
}

async function saveArticleFromEditor(publish) {
  const title = document.getElementById('ae-title').value.trim();
  if (!title) { showToast('タイトルは必須です', 'error'); return; }

  const pubBtn = document.getElementById('ae-publish-btn');
  pubBtn.disabled = true;
  pubBtn.textContent = '保存中...';

  const html    = quill ? (quill.getSemanticHTML ? quill.getSemanticHTML() : quill.root.innerHTML) : '';
  const rtVal   = parseInt(document.getElementById('ae-read-time').value);
  const chars   = quill ? Math.max(0, quill.getText().length - 1) : 0;
  const autoRT  = Math.max(1, Math.round(chars / 500));
  const isPublished = publish || document.getElementById('ae-published').checked;

  const payload = {
    title,
    slug:          document.getElementById('ae-slug').value.trim() || aeSlugify(title),
    lead_text:     document.getElementById('ae-excerpt').value.trim() || null,
    content:       html || null,
    thumbnail_url: document.getElementById('ae-cover').value.trim() || null,
    category:      document.getElementById('ae-category').value || null,
    tags:          splitTrim(document.getElementById('ae-tags').value),
    read_time_min: rtVal || autoRT,
    author_type:   document.getElementById('ae-author').value.trim() || '編集部',
    is_published:  isPublished,
    status:        isPublished ? 'published' : 'draft',
    updated_at:    new Date().toISOString(),
  };

  if (editingArticleId || !isPublished) delete payload.published_at;
  if (!editingArticleId && isPublished) payload.published_at = new Date().toISOString();

  let error;
  if (editingArticleId) {
    ({ error } = await _sb.from('articles').update(payload).eq('id', editingArticleId));
  } else {
    ({ error } = await _sb.from('articles').insert(payload));
  }

  pubBtn.disabled = false;
  pubBtn.textContent = editingArticleId ? '更新する' : '公開する';

  if (error) { showToast('保存に失敗しました: ' + error.message, 'error'); return; }

  _isDirty = false;
  document.getElementById('ae-published').checked = isPublished;
  aeUpdatePubBadge();

  const msg = editingArticleId
    ? (isPublished ? '記事を更新しました' : '下書きを保存しました')
    : (isPublished ? '記事を公開しました 🎉' : '下書きを保存しました');
  showToast(msg, 'success');
  loadArticles();
  if (!editingArticleId && isPublished) setTimeout(() => closeArticleEditor(), 1200);
}

function saveArticle() { saveArticleFromEditor(document.getElementById('ae-published')?.checked || false); }

async function deleteArticle(articleId) {
  if (!confirm('この記事を削除しますか？')) return;
  const { error } = await _sb.from('articles').delete().eq('id', articleId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  loadArticles();
}

async function approveArticleAdmin(articleId) {
  if (!confirm('この記事を承認して公開しますか？')) return;
  const { error } = await _sb.from('articles').update({
    is_published:   true,
    status:         'published',
    published_at:   new Date().toISOString(),
    review_comment: null,
  }).eq('id', articleId);
  if (error) { showToast('エラー: ' + error.message, 'error'); return; }
  showToast('承認・公開しました', 'success');
  loadArticles();
}

async function rejectArticleAdmin(articleId) {
  const reason = prompt('差し戻しコメント（任意。記事カードに表示されます）:');
  if (reason === null) return; // キャンセル
  const { error } = await _sb.from('articles').update({
    status:         'draft',
    review_comment: reason || null,
  }).eq('id', articleId);
  if (error) { showToast('エラー: ' + error.message, 'error'); return; }
  showToast('下書きに差し戻しました', 'success');
  loadArticles();
}

// ============================================================
// Users (admin only)
// ============================================================
async function loadUsers() {
  const el     = document.getElementById('users-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const { data: users, error } = await _sb
    .from('user_roles')
    .select('user_id, role, email')
    .order('role');

  if (error) { el.innerHTML = `<div class="empty">取得エラー: ${error.message}</div>`; return; }
  if (!users || users.length === 0) { el.innerHTML = '<div class="empty">ユーザーがいません</div>'; return; }

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>メールアドレス</th>
            <th>ロール</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => userRow(u)).join('')}
        </tbody>
      </table>
    </div>`;
}

function userRow(u) {
  const email  = escHtml(u.email || u.user_id);
  const isSelf = u.user_id === currentUser.id;

  const roleCell = isSelf
    ? `<span class="badge badge-${u.role}">${u.role}</span>`
    : `<select class="role-select" onchange="changeRole('${u.user_id}', this)">
        <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>editor</option>
        <option value="staff"  ${u.role === 'staff'  ? 'selected' : ''}>staff</option>
        <option value="admin"  ${u.role === 'admin'  ? 'selected' : ''}>admin</option>
       </select>`;

  const actions = isSelf
    ? '<span style="font-size:12px;color:var(--on-dark-soft);">（自分）</span>'
    : `<button class="btn-danger" onclick="removeUser('${u.user_id}', '${escHtml(u.email || '')}')">削除</button>`;

  return `
    <tr>
      <td class="name">${email}</td>
      <td>${roleCell}</td>
      <td>${actions}</td>
    </tr>`;
}

async function addUser() {
  const email = document.getElementById('new-user-email').value.trim();
  const role  = document.getElementById('new-user-role').value;

  if (!email) { showToast('メールアドレスを入力してください', 'error'); return; }

  // メールからユーザーIDを取得（RPC経由）
  const { data: userId, error: rpcErr } = await _sb.rpc('get_user_id_by_email', { p_email: email });
  if (rpcErr || !userId) {
    showToast('そのメールアドレスのユーザーが見つかりません', 'error'); return;
  }

  const { error } = await _sb.from('user_roles').insert({ user_id: userId, role, email });
  if (error) {
    showToast('追加できませんでした: ' + (error.message.includes('duplicate') ? 'すでに登録済みです' : error.message), 'error');
    return;
  }

  showToast(`${email} を ${role} として追加しました`, 'success');
  document.getElementById('new-user-email').value = '';
  loadUsers();
}

async function changeRole(userId, selectEl) {
  const newRole = selectEl.value;
  const { error } = await _sb.from('user_roles').update({ role: newRole }).eq('user_id', userId);
  if (error) {
    showToast('ロール変更に失敗しました: ' + error.message, 'error');
    loadUsers(); // 元に戻す
    return;
  }
  showToast(`ロールを ${newRole} に変更しました`, 'success');
}

async function removeUser(userId, email) {
  if (!confirm(`${email || userId} を削除しますか？`)) return;
  const { error } = await _sb.from('user_roles').delete().eq('user_id', userId);
  if (error) { showToast('削除できませんでした: ' + error.message, 'error'); return; }
  showToast('削除しました', 'success');
  loadUsers();
}

// ============================================================
// Helpers
// ============================================================
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `toast ${type}`;
  setTimeout(() => el.classList.add('hidden'), 2800);
}

document.getElementById('slot-modal').addEventListener('click', function(e) {
  if (e.target === this) closeSlotModal();
});
document.getElementById('instructor-modal').addEventListener('click', function(e) {

});
document.getElementById('listing-modal').addEventListener('click', function(e) {

});

// ── Article editor live events ──
document.getElementById('ae-title').addEventListener('input', () => {
  _isDirty = true;
  aeRenderPreview();
});

// ⌘S saves draft when editor is open
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's'
      && document.getElementById('article-editor-page').classList.contains('open')) {
    e.preventDefault();
    saveArticleFromEditor(false);
  }
  // Escape closes sidebar
  if (e.key === 'Escape' && document.getElementById('ae-sidebar').classList.contains('open')) {
    toggleAeSidebar();
  }
});
