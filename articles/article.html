<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事 — Freediving Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --abyss:       #04161f;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --warm:        #f97316;
  --on-dark:         rgba(255,255,255,0.92);
  --on-dark-mid:     rgba(255,255,255,0.62);
  --on-dark-soft:    rgba(255,255,255,0.38);
  --hairline:        rgba(168,236,232,0.14);
  --glass:           rgba(255,255,255,0.045);
}
html { background: var(--abyss); }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: linear-gradient(180deg, var(--ocean-mid) 0%, var(--ocean-deep) 22%, #06283a 55%, var(--abyss) 100%); background-attachment: fixed; color: var(--on-dark); min-height: 100vh; -webkit-font-smoothing: antialiased; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* header */
.header { position: sticky; top: 0; z-index: 100; background: rgba(6,32,46,0.55); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 16px; font-weight: 600; color: var(--on-dark); letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }
.logo span { color: var(--teal); }
.back-btn { display: flex; align-items: center; gap: 6px; color: var(--on-dark-mid); font-size: 13px; text-decoration: none; }
.back-btn .icon { width: 16px; height: 16px; }

/* cover */
.cover { position: relative; width: 100%; height: 240px; overflow: hidden; background: var(--ocean-mid); }
.cover img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.75) saturate(0.9); }
.cover-grad { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: linear-gradient(transparent, rgba(4,22,31,0.85)); }

/* main */
.main { max-width: 640px; margin: 0 auto; padding: 0 20px 100px; }

/* article header */
.article-header { padding: 24px 0 20px; border-bottom: 1px solid var(--hairline); margin-bottom: 28px; }
.article-cat-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border-radius: 100px; margin-bottom: 12px; }
.cat-beginner    { background: rgba(46,196,182,0.15); color: var(--teal); }
.cat-technique   { background: rgba(99,102,241,0.18); color: #a5b4fc; }
.cat-gear        { background: rgba(249,115,22,0.15); color: #fdba74; }
.cat-competition { background: rgba(234,179,8,0.15); color: #fde047; }
.cat-interview   { background: rgba(236,72,153,0.15); color: #f9a8d4; }
.cat-news        { background: rgba(168,236,232,0.12); color: var(--teal-light); }
.article-title { font-size: 22px; font-weight: 500; line-height: 1.5; letter-spacing: 0.02em; margin-bottom: 14px; }
.article-meta-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--on-dark-soft); }
.meta-item .icon { width: 13px; height: 13px; }
.tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tag { font-size: 11px; padding: 4px 10px; border-radius: 100px; border: 1px solid var(--hairline); color: var(--on-dark-soft); }

/* article body (markdown rendered) */
.article-body { font-size: 15px; line-height: 1.9; color: var(--on-dark-mid); }
.article-body h2 { font-size: 18px; font-weight: 600; color: var(--on-dark); margin: 32px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--hairline); }
.article-body h3 { font-size: 15px; font-weight: 600; color: var(--on-dark); margin: 24px 0 10px; }
.article-body p { margin-bottom: 16px; }
.article-body strong { color: var(--on-dark); font-weight: 600; }
.article-body em { font-style: italic; color: var(--teal-light); }
.article-body ul, .article-body ol { margin: 0 0 16px 20px; }
.article-body li { margin-bottom: 6px; }
.article-body blockquote { border-left: 3px solid var(--teal); padding: 12px 16px; margin: 20px 0; background: rgba(46,196,182,0.06); border-radius: 0 8px 8px 0; color: var(--on-dark-mid); font-style: italic; }
.article-body table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
.article-body th { background: rgba(46,196,182,0.1); color: var(--teal-light); font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(46,196,182,0.2); }
.article-body td { padding: 10px 12px; border-bottom: 1px solid var(--hairline); color: var(--on-dark-mid); }
.article-body hr { border: none; border-top: 1px solid var(--hairline); margin: 28px 0; }
.article-body code { background: rgba(255,255,255,0.07); border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 6px; font-size: 13px; font-family: ui-monospace, monospace; color: var(--teal-light); }

/* back to list */
.back-to-list { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 40px; padding: 14px; border: 1px solid var(--hairline); border-radius: 12px; color: var(--on-dark-mid); font-size: 13px; text-decoration: none; transition: border-color 0.2s; }
.back-to-list:hover { border-color: rgba(46,196,182,0.35); color: var(--on-dark); }
.back-to-list .icon { width: 16px; height: 16px; }

/* loading */
.page-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 16px; color: var(--on-dark-soft); }
.spinner { width: 32px; height: 32px; border: 2px solid var(--hairline); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* bottom nav */
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on-dark-soft); cursor: pointer; background: none; border: none; transition: color 0.2s; }
.nav-item .icon { width: 20px; height: 20px; }
.nav-label { font-size: 10px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<header class="header">
  <a href="../index.html" class="back-btn">
    <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    記事一覧
  </a>
  <a href="../index.html" class="logo">Freediving <span>Japan</span></a>
</header>

<div id="pageContent">
  <div class="page-loading">
    <div class="spinner"></div>
    <span>読み込み中...</span>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<!-- marked.js: markdown → HTML -->
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script>
const catLabels = {
  beginner: '初心者向け', technique: 'テクニック', gear: 'ギア・道具',
  competition: '大会・競技', interview: 'インタビュー', news: 'ニュース'
};
const catClass = {
  beginner: 'cat-beginner', technique: 'cat-technique', gear: 'cat-gear',
  competition: 'cat-competition', interview: 'cat-interview', news: 'cat-news'
};

const params = new URLSearchParams(location.search);
const articleId = params.get('id');
const articleSlug = params.get('slug');

if (!articleId && !articleSlug) {
  document.getElementById('pageContent').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--on-dark-soft)">記事が見つかりませんでした。<br><a href="../index.html" style="color:var(--teal)">一覧に戻る</a></div>';
} else {
  loadArticle();
}

async function loadArticle() {
  try {
    let query = _sb.from('articles').select('*').eq('is_published', true);
    if (articleId) query = query.eq('id', articleId);
    else query = query.eq('slug', articleSlug);
    const { data, error } = await query.single();
    if (error) throw error;
    renderArticle(data);
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--on-dark-soft)">記事を読み込めませんでした。<br><a href="../index.html" style="color:var(--teal)">一覧に戻る</a></div>';
  }
}

function renderArticle(a) {
  document.title = `${a.title} — Freediving Japan`;

  const coverHtml = a.cover_image_url
    ? `<div class="cover"><img src="${a.cover_image_url}" alt="${a.title}"><div class="cover-grad"></div></div>` : '';

  const catBadge = a.category
    ? `<span class="article-cat-badge ${catClass[a.category] || ''}">${catLabels[a.category] || a.category}</span>` : '';

  const dateStr = a.published_at
    ? new Date(a.published_at).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' }) : '';

  const tagsHtml = (a.tags || []).length
    ? `<div class="tags-row">${a.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';

  const bodyHtml = a.body_md
    ? marked.parse(a.body_md) : '<p style="color:var(--on-dark-soft)">本文がありません</p>';

  document.getElementById('pageContent').innerHTML = `
    ${coverHtml}
    <div class="main">
      <div class="article-header">
        ${catBadge}
        <h1 class="article-title">${a.title}</h1>
        <div class="article-meta-row">
          ${a.author ? `<span class="meta-item"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${a.author}</span>` : ''}
          ${dateStr ? `<span class="meta-item"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${dateStr}</span>` : ''}
          ${a.read_time_min ? `<span class="meta-item"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${a.read_time_min}分で読める</span>` : ''}
        </div>
        ${tagsHtml}
      </div>
      <div class="article-body">${bodyHtml}</div>
      <!-- 探す CTA -->
      <div style="margin-top:40px;background:linear-gradient(135deg,rgba(46,196,182,0.10) 0%,rgba(26,95,130,0.12) 100%);border:1px solid rgba(46,196,182,0.22);border-radius:20px;padding:28px 24px;text-align:center;">
        <div style="font-size:28px;margin-bottom:12px;">🤿</div>
        <p style="font-size:16px;font-weight:600;color:var(--on-dark);margin-bottom:8px;">体験してみませんか？</p>
        <p style="font-size:13px;color:var(--on-dark-mid);line-height:1.8;margin-bottom:20px;">全国のフリーダイビング体験・スクールを探して、<br>まず一歩踏み出してみましょう。</p>
        <a href="../explore/index.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:var(--ocean-deep);font-size:14px;font-weight:700;padding:14px 28px;border-radius:100px;text-decoration:none;letter-spacing:0.04em;transition:background 0.2s;">
          インストラクター・体験を探す
          <svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <a class="back-to-list" href="../index.html">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        記事一覧に戻る
      </a>
    </div>
  `;
}
</script>
</body>
</html>
