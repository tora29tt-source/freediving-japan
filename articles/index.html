<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事・コラム — Freediving Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --abyss:       #04161f;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --warm:        #f97316;
  --on-dark:         rgba(255,255,255,0.92);
  --on-dark-mid:     rgba(255,255,255,0.62);
  --on-dark-soft:    rgba(255,255,255,0.38);
  --hairline:        rgba(168,236,232,0.14);
  --glass:           rgba(255,255,255,0.045);
}
html { background: var(--abyss); }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: linear-gradient(180deg, var(--ocean-mid) 0%, var(--ocean-deep) 22%, #06283a 55%, var(--abyss) 100%); background-attachment: fixed; color: var(--on-dark); min-height: 100vh; -webkit-font-smoothing: antialiased; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* header */
.header { position: sticky; top: 0; z-index: 100; background: rgba(6,32,46,0.55); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 16px; font-weight: 600; color: var(--on-dark); letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }
.logo span { color: var(--teal); }
.back-btn { display: flex; align-items: center; gap: 6px; color: var(--on-dark-mid); font-size: 13px; text-decoration: none; }
.back-btn .icon { width: 16px; height: 16px; }

/* hero */
.page-hero { padding: 36px 20px 28px; text-align: center; position: relative; overflow: hidden; }
.page-hero-glow { position: absolute; top: -60%; left: 50%; width: 120%; height: 100%; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(168,236,232,0.12) 0%, transparent 65%); pointer-events: none; }
.page-hero-inner { position: relative; z-index: 2; }
.page-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--teal-light); margin-bottom: 10px; }
.page-title { font-size: 22px; font-weight: 300; letter-spacing: 0.04em; color: var(--on-dark); margin-bottom: 8px; }
.page-title em { font-style: normal; font-weight: 500; color: var(--teal-light); }
.page-desc { font-size: 13px; color: var(--on-dark-mid); line-height: 1.8; }

/* main */
.main { max-width: 640px; margin: 0 auto; padding: 0 16px 100px; }

/* category filter */
.cat-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 24px; scrollbar-width: none; }
.cat-filter::-webkit-scrollbar { display: none; }
.cat-chip { flex-shrink: 0; padding: 7px 14px; border-radius: 100px; border: 1px solid var(--hairline); background: transparent; font-size: 12px; color: var(--on-dark-mid); cursor: pointer; transition: border-color 0.2s, background 0.2s, color 0.2s; white-space: nowrap; }
.cat-chip:hover { border-color: rgba(46,196,182,0.35); color: var(--on-dark); }
.cat-chip.active { border-color: var(--teal); background: rgba(46,196,182,0.12); color: var(--on-dark); }

/* result header */
.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.result-count { font-size: 12px; color: var(--on-dark-soft); }
.result-count span { color: var(--teal-light); font-weight: 600; }

/* article cards */
.articles { display: flex; flex-direction: column; gap: 14px; }
.article-card { display: flex; gap: 14px; background: var(--glass); border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; transition: border-color 0.2s, background 0.2s; }
.article-card:hover { border-color: rgba(46,196,182,0.3); background: rgba(255,255,255,0.06); }
.article-thumb { width: 110px; flex-shrink: 0; position: relative; overflow: hidden; }
.article-thumb img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85) saturate(0.9); }
.article-thumb-ph { width: 110px; min-height: 110px; background: var(--ocean-mid); display: flex; align-items: center; justify-content: center; color: var(--on-dark-soft); flex-shrink: 0; }
.article-body { flex: 1; padding: 14px 14px 14px 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.article-cat-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; width: fit-content; }
.cat-beginner    { background: rgba(46,196,182,0.15); color: var(--teal); }
.cat-technique   { background: rgba(99,102,241,0.18); color: #a5b4fc; }
.cat-gear        { background: rgba(249,115,22,0.15); color: #fdba74; }
.cat-competition { background: rgba(234,179,8,0.15); color: #fde047; }
.cat-interview   { background: rgba(236,72,153,0.15); color: #f9a8d4; }
.cat-news        { background: rgba(168,236,232,0.12); color: var(--teal-light); }
.article-title { font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--on-dark); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.article-excerpt { font-size: 12px; color: var(--on-dark-mid); line-height: 1.65; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.article-meta { display: flex; align-items: center; gap: 10px; margin-top: auto; }
.article-date { font-size: 11px; color: var(--on-dark-soft); }
.article-read-time { font-size: 11px; color: var(--on-dark-soft); display: flex; align-items: center; gap: 3px; }
.article-read-time .icon { width: 11px; height: 11px; }

/* skeleton */
.skeleton-card { display: flex; gap: 14px; background: var(--glass); border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; height: 110px; }
.skeleton-thumb { width: 110px; background: rgba(255,255,255,0.04); flex-shrink: 0; }
.skeleton-body { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0%{ background-position: -200% 0 } 100%{ background-position: 200% 0 } }

/* empty */
.empty-state { text-align: center; padding: 60px 24px; }
.empty-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(46,196,182,0.08); border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; color: var(--teal); margin: 0 auto 18px; }
.empty-icon .icon { width: 24px; height: 24px; }
.empty-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.empty-desc { font-size: 12px; color: var(--on-dark-soft); line-height: 1.8; }

/* bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 90; background: rgba(6,32,46,0.85); backdrop-filter: blur(18px); border-top: 1px solid var(--hairline); display: flex; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on-dark-soft); cursor: pointer; background: none; border: none; transition: color 0.2s; }
.nav-item.active { color: var(--teal); }
.nav-item .icon { width: 20px; height: 20px; }
.nav-label { font-size: 10px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<header class="header">
  <a href="../index.html" class="back-btn">
    <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    ホーム
  </a>
  <a href="../index.html" class="logo">Free<span>Dive</span> Japan</a>
</header>

<div class="page-hero">
  <div class="page-hero-glow"></div>
  <div class="page-hero-inner">
    <p class="page-eyebrow">Articles &amp; Columns</p>
    <h1 class="page-title">記事・<em>コラム</em></h1>
    <p class="page-desc">フリーダイビングをもっと深く知るための<br>記事をお届けします。</p>
  </div>
</div>

<main class="main">
  <div class="cat-filter" id="catFilter">
    <button class="cat-chip active" data-cat="" onclick="setCategory(this,'')">すべて</button>
    <button class="cat-chip" data-cat="beginner" onclick="setCategory(this,'beginner')">初心者向け</button>
    <button class="cat-chip" data-cat="technique" onclick="setCategory(this,'technique')">テクニック</button>
    <button class="cat-chip" data-cat="gear" onclick="setCategory(this,'gear')">ギア・道具</button>
    <button class="cat-chip" data-cat="competition" onclick="setCategory(this,'competition')">大会・競技</button>
    <button class="cat-chip" data-cat="interview" onclick="setCategory(this,'interview')">インタビュー</button>
    <button class="cat-chip" data-cat="news" onclick="setCategory(this,'news')">ニュース</button>
  </div>
  <div class="result-header">
    <p class="result-count"><span id="countNum">—</span> 件</p>
  </div>
  <div class="articles" id="articles">
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:30%"></div><div class="skeleton-line" style="width:85%"></div><div class="skeleton-line" style="width:65%"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:25%"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:35%"></div><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:70%"></div></div></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="../index.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">ホーム</span></a>
  <a href="../explore/index.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">探す</span></a>
  <a href="../2026_competitions.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="nav-label">大会</span></a>
  <a href="../mypage.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">マイページ</span></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
const catLabels = {
  beginner: '初心者向け', technique: 'テクニック', gear: 'ギア・道具',
  competition: '大会・競技', interview: 'インタビュー', news: 'ニュース'
};
const catClass = {
  beginner: 'cat-beginner', technique: 'cat-technique', gear: 'cat-gear',
  competition: 'cat-competition', interview: 'cat-interview', news: 'cat-news'
};

let allArticles = [];
let currentCat = '';

function setCategory(el, cat) {
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentCat = cat;
  renderArticles();
}

function renderArticles() {
  const filtered = currentCat
    ? allArticles.filter(a => a.category === currentCat)
    : allArticles;

  document.getElementById('countNum').textContent = filtered.length;
  const container = document.getElementById('articles');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
      <p class="empty-title">記事がありません</p>
      <p class="empty-desc">このカテゴリの記事はまだありません</p>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(a => {
    const thumb = a.cover_image_url
      ? `<div class="article-thumb"><img src="${a.cover_image_url}" alt="${a.title}" loading="lazy"></div>`
      : `<div class="article-thumb-ph"><svg class="icon" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>`;
    const catBadge = a.category
      ? `<span class="article-cat-badge ${catClass[a.category] || ''}">${catLabels[a.category] || a.category}</span>` : '';
    const dateStr = a.published_at
      ? new Date(a.published_at).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    const readTime = a.read_time_min ? `<span class="article-read-time"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${a.read_time_min}分で読める</span>` : '';

    return `<a class="article-card" href="article.html?id=${a.id}">
      ${thumb}
      <div class="article-body">
        ${catBadge}
        <p class="article-title">${a.title}</p>
        ${a.excerpt ? `<p class="article-excerpt">${a.excerpt}</p>` : ''}
        <div class="article-meta">
          ${dateStr ? `<span class="article-date">${dateStr}</span>` : ''}
          ${readTime}
        </div>
      </div>
    </a>`;
  }).join('');
}

async function loadArticles() {
  try {
    const { data, error } = await _sb
      .from('articles')
      .select('id, title, excerpt, cover_image_url, category, tags, read_time_min, published_at')
      .eq('is_published', true)
      .order('published_at', { ascending: false });
    if (error) throw error;
    allArticles = data || [];
    renderArticles();
  } catch (err) {
    console.error(err);
    document.getElementById('articles').innerHTML = `<div class="empty-state">
      <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <p class="empty-title">読み込みに失敗しました</p>
      <p class="empty-desc">しばらく経ってから再度お試しください</p>
    </div>`;
  }
}

loadArticles();
</script>
</body>
</html>
