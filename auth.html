<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | Freediving Japan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<link rel="stylesheet" href="css/design-system.css">
<style>
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px 16px;
  position: relative;
  overflow: hidden;
}

/* 背景グロー */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(46,196,182,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(26,95,130,0.15) 0%, transparent 60%);
}

/* ロゴ */
.auth-logo {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--on-dark);
  text-decoration: none;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.auth-logo span { color: var(--teal); }
.auth-logo-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal);
  animation: pulse-dot 2.4s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(0.7); }
}

/* カード */
.auth-card {
  width: 100%;
  max-width: 400px;
  background: rgba(12,39,56,0.80);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--hairline);
  border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 24px 64px rgba(4,22,31,0.7), 0 0 0 1px rgba(168,236,232,0.06);
  position: relative;
}

/* カード上部のハイライトライン */
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,236,232,0.4), transparent);
}

/* タブ */
.tabs {
  display: flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--hairline);
  border-radius: var(--r-pill);
  padding: 4px;
  margin-bottom: 28px;
  gap: 4px;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--on-dark-soft);
  cursor: pointer;
  border-radius: var(--r-pill);
  transition: all var(--t-base);
  letter-spacing: 0.03em;
}
.tab.active {
  background: var(--teal);
  color: var(--ocean-deep);
}

/* ソーシャルボタン */
.social-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 16px;
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  font-size: 13px;
  font-weight: 600;
  color: var(--on-dark-mid);
  background: var(--glass);
  cursor: pointer;
  margin-bottom: 10px;
  transition: border-color var(--t-base), color var(--t-base), background var(--t-base);
  font-family: inherit;
  backdrop-filter: blur(6px);
}
.social-btn:hover {
  border-color: rgba(46,196,182,0.45);
  color: var(--on-dark);
  background: rgba(46,196,182,0.06);
}
.social-btn svg { flex-shrink: 0; }

/* または区切り */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  color: var(--on-dark-soft);
  font-size: 11px;
  letter-spacing: 0.08em;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--hairline);
}

/* フォーム */
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-dark-soft);
  margin-bottom: 7px;
}
.form-group input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--hairline);
  border-radius: var(--r);
  font-size: 14px;
  color: var(--on-dark);
  outline: none;
  font-family: inherit;
  transition: border-color var(--t-base), background var(--t-base);
  -webkit-appearance: none;
}
.form-group input::placeholder { color: var(--on-dark-soft); }
.form-group input:focus {
  border-color: rgba(46,196,182,0.55);
  background: rgba(255,255,255,0.08);
}

/* 送信ボタン */
.btn {
  width: 100%;
  padding: 14px;
  background: var(--teal);
  color: var(--ocean-deep);
  border: none;
  border-radius: var(--r);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 6px;
  transition: background var(--t-base), transform var(--t-fast);
  font-family: inherit;
  -webkit-appearance: none;
  letter-spacing: 0.04em;
}
.btn:hover   { background: var(--teal-light); transform: translateY(-1px); }
.btn:active  { transform: translateY(0); }
.btn:disabled { background: rgba(46,196,182,0.3); color: rgba(11,45,69,0.6); cursor: not-allowed; transform: none; }


/* メッセージ */
.message {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: var(--r-sm);
  font-size: 12px;
  text-align: center;
  display: none;
  line-height: 1.6;
}
.message.error {
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.25);
  color: #fca5a5;
  display: block;
}
.message.success {
  background: rgba(46,196,182,0.10);
  border: 1px solid rgba(46,196,182,0.25);
  color: var(--teal-light);
  display: block;
}

/* 戻るリンク */
.back-link {
  margin-top: 20px;
  font-size: 12px;
  color: var(--on-dark-soft);
  text-align: center;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: color var(--t-base);
}
.back-link:hover { color: var(--on-dark-mid); }
</style>
</head>
<body>
<div class="bg-glow"></div>

<a class="auth-logo" href="index.html">
  <span class="auth-logo-dot"></span>
  Freediving <span>Japan</span>
</a>

<div class="auth-card">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">ログイン</div>
    <div class="tab" onclick="switchTab('signup')">新規登録</div>
  </div>

  <!-- ── ログインフォーム ── -->
  <div id="loginForm">
    <button class="social-btn" onclick="signInGoogle()">
      <svg width="17" height="17" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      Googleでログイン
    </button>
    <!-- Apple login: disabled until Apple Developer credentials are configured
    <button class="social-btn" onclick="signInApple()">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="rgba(255,255,255,0.85)">
        <path d="M13.18 9.5c-.02-1.96 1.6-2.9 1.67-2.95-1.6-2.34-2.56-.9-3.22-.86-.83.08-1.64.5-2.07.5-.44 0-1.12-.48-1.84-.47-1.44.02-2.74.84-3.47 2.13-1.48 2.57-.38 6.36 1.06 8.44.7 1.02 1.54 2.16 2.63 2.12 1.06-.04 1.46-.68 2.74-.68 1.28 0 1.64.68 2.76.66 1.14-.02 1.86-1.04 2.55-2.06.51-.74.9-1.57 1.14-2.43-2.5-.96-2.95-4.4-.95-4.4zM11.1 4.1C11.67 3.42 12 2.5 11.9 1.6c-.8.04-1.77.53-2.34 1.2-.51.6-.96 1.55-.84 2.46.9.07 1.82-.46 2.38-1.16z"/>
      </svg>
      Appleでログイン
    </button>
    -->

    <div class="divider">または</div>

    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" onclick="handleLogin()">ログイン</button>
  </div>

  <!-- ── 新規登録フォーム ── -->
  <div id="signupForm" style="display:none;">
    <button class="social-btn" onclick="signInGoogle()">
      <svg width="17" height="17" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      Googleで登録
    </button>
    <!-- Apple signup: disabled until Apple Developer credentials are configured
    <button class="social-btn" onclick="signInApple()">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="rgba(255,255,255,0.85)">
        <path d="M13.18 9.5c-.02-1.96 1.6-2.9 1.67-2.95-1.6-2.34-2.56-.9-3.22-.86-.83.08-1.64.5-2.07.5-.44 0-1.12-.48-1.84-.47-1.44.02-2.74.84-3.47 2.13-1.48 2.57-.38 6.36 1.06 8.44.7 1.02 1.54 2.16 2.63 2.12 1.06-.04 1.46-.68 2.74-.68 1.28 0 1.64.68 2.76.66 1.14-.02 1.86-1.04 2.55-2.06.51-.74.9-1.57 1.14-2.43-2.5-.96-2.95-4.4-.95-4.4zM11.1 4.1C11.67 3.42 12 2.5 11.9 1.6c-.8.04-1.77.53-2.34 1.2-.51.6-.96 1.55-.84 2.46.9.07 1.82-.46 2.38-1.16z"/>
      </svg>
      Appleで登録
    </button>
    -->

    <div class="divider">または</div>

    <div class="form-group">
      <label>お名前</label>
      <input type="text" id="signupName" placeholder="山田 太郎" autocomplete="name">
    </div>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="signupEmail" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>パスワード（8文字以上）</label>
      <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn" onclick="handleSignup()">アカウント作成</button>
  </div>

  <div id="message" class="message"></div>
</div>

<a class="back-link" href="index.html">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
  トップページに戻る
</a>

<script>
// OAuthコールバック含めセッション確立を待ってからリダイレクト
_sb.auth.onAuthStateChange((event, session) => {
  if (session) window.location.replace('mypage.html');
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
  });
  document.getElementById('loginForm').style.display  = tab === 'login'  ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  clearMessage();
}

function showMessage(text, type) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = 'message ' + type;
}

function clearMessage() {
  const el = document.getElementById('message');
  el.className = 'message';
  el.textContent = '';
}

async function signInGoogle() {
  // in-app browser (LINE, Instagram等) ではGoogle OAuthがブロックされるため警告
  const ua = navigator.userAgent;
  const isInAppBrowser = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|GSA\//.test(ua)
    || (ua.includes('Safari') === false && ua.includes('Chrome') === false && /iPhone|iPad/.test(ua));
  if (isInAppBrowser) {
    showMessage('このブラウザではGoogleログインできません。SafariまたはChromeで開いてください。', 'error');
    return;
  }
  const { error } = await _sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/auth.html' }
  });
  if (error) showMessage(error.message || 'Googleログインに失敗しました', 'error');
}

async function signInApple() {
  const { error } = await _sb.auth.signInWithOAuth({
    provider: 'apple',
    options: { redirectTo: window.location.origin + '/auth.html' }
  });
  if (error) showMessage(error.message, 'error');
}

async function handleLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showMessage('メールとパスワードを入力してください', 'error');

  const btn = document.querySelector('#loginForm .btn');
  btn.disabled = true; btn.textContent = 'ログイン中...';

  const { error } = await _sb.auth.signInWithPassword({ email, password });
  if (error) {
    showMessage('メールアドレスまたはパスワードが正しくありません', 'error');
    btn.disabled = false; btn.textContent = 'ログイン';
  } else {
    window.location.href = 'mypage.html';
  }
}

async function handleSignup() {
  const name     = document.getElementById('signupName').value.trim();
  const email    = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  if (!name || !email || !password) return showMessage('すべての項目を入力してください', 'error');
  if (password.length < 8) return showMessage('パスワードは8文字以上にしてください', 'error');

  const btn = document.querySelector('#signupForm .btn');
  btn.disabled = true; btn.textContent = '登録中...';

  const { data, error } = await _sb.auth.signUp({
    email, password,
    options: { data: { name } }
  });
  if (error) {
    const msg = error.message || (error.code ? `エラー: ${error.code}` : 'アカウント作成に失敗しました');
    showMessage(msg, 'error');
    btn.disabled = false; btn.textContent = 'アカウント作成';
  } else if (data.session) {
    // メール確認不要 → すぐログイン
    window.location.href = 'mypage.html';
  } else {
    // メール確認が必要な場合
    showMessage(`${email} に確認メールを送信しました。メール内のリンクをクリックしてください。`, 'success');
    btn.disabled = false; btn.textContent = 'アカウント作成';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('loginForm').style.display !== 'none';
  if (loginVisible) handleLogin(); else handleSignup();
});
</script>
</body>
</html>
