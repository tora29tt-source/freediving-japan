<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | Freediving Japan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<style>
:root {
  --ocean-deep: #0b2d45;
  --ocean-mid: #0e3d5c;
  --ocean-light: #1a5f82;
  --teal: #2ec4b6;
  --teal-light: #a8ece8;
  --foam: #f0f9fb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--ocean-deep);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 40px 32px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
}

.logo { text-align: center; margin-bottom: 32px; }
.logo h1 { font-size: 22px; font-weight: 700; color: var(--ocean-deep); letter-spacing: -0.5px; }
.logo p { font-size: 13px; color: #888; margin-top: 4px; }

.tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 28px; }
.tab {
  flex: 1; text-align: center; padding: 10px;
  font-size: 14px; font-weight: 600; color: #aaa;
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: all 0.2s;
}
.tab.active { color: var(--teal); border-bottom-color: var(--teal); }

/* ソーシャルボタン */
.social-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 16px;
  border: 1.5px solid #ddd;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  background: white;
  cursor: pointer;
  margin-bottom: 10px;
  transition: all 0.2s;
  font-family: inherit;
}
.social-btn:hover { border-color: var(--teal); background: var(--foam); }

.divider {
  display: flex; align-items: center; gap: 10px;
  color: #aaa; font-size: 12px; margin: 16px 0;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: #eee;
}

.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid #ddd; border-radius: 10px;
  font-size: 15px; outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
input:focus { border-color: var(--teal); }

.btn {
  width: 100%; padding: 14px;
  background: var(--teal); color: white;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 8px;
  transition: background 0.2s; font-family: inherit;
  -webkit-appearance: none;
}
.btn:hover { background: #25a99d; }
.btn:disabled { background: #aaa; cursor: not-allowed; }

.message {
  margin-top: 16px; padding: 12px;
  border-radius: 8px; font-size: 13px;
  text-align: center; display: none;
}
.message.error { background: #fff0f0; color: #d00; display: block; }
.message.success { background: #f0fff8; color: #0a7; display: block; }

.role-selector { display: flex; gap: 8px; margin-bottom: 16px; }
.role-btn {
  flex: 1; padding: 10px 8px;
  border: 1.5px solid #ddd; border-radius: 10px;
  font-size: 13px; font-weight: 600; color: #666;
  cursor: pointer; background: white; text-align: center;
  transition: all 0.2s;
}
.role-btn.active { border-color: var(--teal); background: var(--foam); color: var(--ocean-deep); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>🤿 Freediving Japan</h1>
    <p>フリーダイビングのプラットフォーム</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">ログイン</div>
    <div class="tab" onclick="switchTab('signup')">新規登録</div>
  </div>

  <!-- ログインフォーム -->
  <div id="loginForm">
    <button class="social-btn" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      Googleでログイン
    </button>

    <button class="social-btn" onclick="signInApple()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="#000">
        <path d="M13.18 9.5c-.02-1.96 1.6-2.9 1.67-2.95-1.6-2.34-2.56-.9-3.22-.86-.83.08-1.64.5-2.07.5-.44 0-1.12-.48-1.84-.47-1.44.02-2.74.84-3.47 2.13-1.48 2.57-.38 6.36 1.06 8.44.7 1.02 1.54 2.16 2.63 2.12 1.06-.04 1.46-.68 2.74-.68 1.28 0 1.64.68 2.76.66 1.14-.02 1.86-1.04 2.55-2.06.51-.74.9-1.57 1.14-2.43-2.5-.96-2.95-4.4-.95-4.4zM11.1 4.1C11.67 3.42 12 2.5 11.9 1.6c-.8.04-1.77.53-2.34 1.2-.51.6-.96 1.55-.84 2.46.9.07 1.82-.46 2.38-1.16z"/>
      </svg>
      Appleでログイン
    </button>

    <div class="divider">または</div>

    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="loginPassword" placeholder="パスワード" autocomplete="current-password">
    </div>
    <button class="btn" onclick="handleLogin()">ログイン</button>
  </div>

  <!-- サインアップフォーム -->
  <div id="signupForm" style="display:none;">
    <button class="social-btn" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.04a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      Googleで登録
    </button>

    <button class="social-btn" onclick="signInApple()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="#000">
        <path d="M13.18 9.5c-.02-1.96 1.6-2.9 1.67-2.95-1.6-2.34-2.56-.9-3.22-.86-.83.08-1.64.5-2.07.5-.44 0-1.12-.48-1.84-.47-1.44.02-2.74.84-3.47 2.13-1.48 2.57-.38 6.36 1.06 8.44.7 1.02 1.54 2.16 2.63 2.12 1.06-.04 1.46-.68 2.74-.68 1.28 0 1.64.68 2.76.66 1.14-.02 1.86-1.04 2.55-2.06.51-.74.9-1.57 1.14-2.43-2.5-.96-2.95-4.4-.95-4.4zM11.1 4.1C11.67 3.42 12 2.5 11.9 1.6c-.8.04-1.77.53-2.34 1.2-.51.6-.96 1.55-.84 2.46.9.07 1.82-.46 2.38-1.16z"/>
      </svg>
      Appleで登録
    </button>

    <div class="divider">または</div>

    <div class="form-group">
      <label>ロールを選択</label>
      <div class="role-selector">
        <div class="role-btn active" onclick="selectRole('athlete')" id="role-athlete">🏊 選手・愛好家</div>
        <div class="role-btn" onclick="selectRole('instructor')" id="role-instructor">🎓 インストラクター</div>
      </div>
    </div>
    <div class="form-group">
      <label>お名前</label>
      <input type="text" id="signupName" placeholder="山田 太郎" autocomplete="name">
    </div>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="signupEmail" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>パスワード（8文字以上）</label>
      <input type="password" id="signupPassword" placeholder="パスワード" autocomplete="new-password">
    </div>
    <button class="btn" onclick="handleSignup()">アカウント作成</button>
  </div>

  <div id="message" class="message"></div>
</div>

<script>
let selectedRole = 'athlete';

_sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'mypage.html';
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
  });
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  clearMessage();
}

function selectRole(role) {
  selectedRole = role;
  document.getElementById('role-athlete').classList.toggle('active', role === 'athlete');
  document.getElementById('role-instructor').classList.toggle('active', role === 'instructor');
}

function showMessage(text, type) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = 'message ' + type;
}

function clearMessage() {
  const el = document.getElementById('message');
  el.className = 'message';
  el.textContent = '';
}

async function signInGoogle() {
  const { error } = await _sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/mypage.html' }
  });
  if (error) showMessage(error.message, 'error');
}

async function signInApple() {
  const { error } = await _sb.auth.signInWithOAuth({
    provider: 'apple',
    options: { redirectTo: window.location.origin + '/mypage.html' }
  });
  if (error) showMessage(error.message, 'error');
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showMessage('メールとパスワードを入力してください', 'error');

  const btn = document.querySelector('#loginForm .btn');
  btn.disabled = true; btn.textContent = 'ログイン中...';

  const { error } = await _sb.auth.signInWithPassword({ email, password });
  if (error) {
    showMessage('メールアドレスまたはパスワードが正しくありません', 'error');
    btn.disabled = false; btn.textContent = 'ログイン';
  } else {
    window.location.href = 'mypage.html';
  }
}

async function handleSignup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  if (!name || !email || !password) return showMessage('すべての項目を入力してください', 'error');
  if (password.length < 8) return showMessage('パスワードは8文字以上にしてください', 'error');

  const btn = document.querySelector('#signupForm .btn');
  btn.disabled = true; btn.textContent = '登録中...';

  const { error } = await _sb.auth.signUp({
    email, password,
    options: { data: { name, role: selectedRole } }
  });
  if (error) {
    showMessage(error.message, 'error');
    btn.disabled = false; btn.textContent = 'アカウント作成';
  } else {
    window.location.href = 'mypage.html';
    btn.disabled = false; btn.textContent = 'アカウント作成';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('loginForm').style.display !== 'none';
  if (loginVisible) handleLogin(); else handleSignup();
});
</script>
</body>
</html>
