<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探す — Freediving Japan</title>
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/home.css">
<style>
/* ── 互換エイリアス（JSが生成するインラインstyleで参照するため維持） ── */
:root {
  --on-dark: var(--ink);
  --on-dark-mid: var(--ink-mid);
  --on-dark-soft: var(--ink-soft);
  --hairline: var(--line);
  --glass: #ffffff;
  --teal-light: var(--teal-deep);
  --warm: #f97316;
}

.main { max-width: 640px; margin: 0 auto; padding: 0 16px 80px; }

/* ── 検索バーはホームと共通のsearchbar/sb-*コンポーネントをそのまま使用（CSSはhome.css側で定義済み） ── */

/* ── intent tabs ── */
.intent-tabs { display: flex; gap: 8px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.intent-tabs::-webkit-scrollbar { display: none; }
.intent-tab { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; transition: border-color 0.2s, background 0.2s; min-width: 100px; }
.intent-tab.active { border-color: var(--ink); background: var(--ink); }
.intent-tab-icon { width: 32px; height: 32px; border-radius: 50%; background: #f3f3f5; display: flex; align-items: center; justify-content: center; color: var(--teal-deep); }
.intent-tab.active .intent-tab-icon { background: rgba(255,255,255,0.16); color: #fff; }
.intent-tab-icon .icon { width: 16px; height: 16px; }
.intent-tab-label { font-size: 11px; font-weight: 600; color: var(--ink-mid); letter-spacing: 0.02em; text-align: center; line-height: 1.4; white-space: nowrap; }
.intent-tab.active .intent-tab-label { color: #fff; }
.intent-tab-count { font-size: 10px; color: var(--ink-soft); font-family: ui-monospace, monospace; }
.intent-tab.active .intent-tab-count { color: rgba(255,255,255,0.7); }

/* ── filters ── */
.filter-section { margin-bottom: 20px; }
.filter-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; font-weight: 600; }
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.date-clear-btn { font-size: 11px; font-weight: 600; color: var(--teal-deep); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline dotted var(--line-strong); text-underline-offset: 2px; }
.date-clear-btn:hover { color: var(--accent); }
.filter-hint { font-size: 11px; color: var(--ink-soft); margin: 8px 0 0; text-align: center; line-height: 1.6; }


/* ── divider ── */
.divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
.divider-line { flex: 1; height: 1px; background: var(--line); }
.divider-label { font-size: 11px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.06em; white-space: nowrap; }

/* ── result header ── */
.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.result-count { font-size: 12px; color: var(--ink-soft); }
.result-count span { color: var(--teal-deep); font-weight: 700; }
.sort-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-mid); background: #fff; border: 1px solid var(--line-strong); cursor: pointer; padding: 7px 14px; border-radius: 100px; transition: border-color 0.2s; }
.sort-btn:hover { border-color: var(--ink); }
.sort-btn .icon { width: 14px; height: 14px; }

/* ── listing cards ── */
.listings { display: flex; flex-direction: column; gap: 12px; }
.listing-card { border-radius: 16px; border: 1px solid var(--line); background: #fff; overflow: hidden; display: flex; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; }
.listing-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); }
.listing-thumb { width: 110px; flex-shrink: 0; position: relative; overflow: hidden; background: #eee; }
.listing-thumb img { width: 100%; height: 100%; object-fit: cover; }
.listing-thumb-ph { width: 100%; min-height: 110px; background: #f0f0f2; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); }
.listing-badge { position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; }
.badge-try { background: rgba(249,115,22,0.9); color: #fff; }
.badge-learn { background: rgba(31,111,120,0.92); color: #fff; }
.badge-fundive { background: rgba(10,39,49,0.9); color: #fff; }
.badge-training { background: rgba(91,60,196,0.9); color: #fff; }
.badge-coaching { background: rgba(16,110,90,0.9); color: #fff; }
.listing-body { flex: 1; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.listing-category { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal-deep); font-weight: 700; }
.listing-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.4; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.listing-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-soft); }
.meta-item .icon { width: 12px; height: 12px; }
.listing-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.listing-price { font-size: 13px; font-weight: 700; color: var(--ink); }
.listing-price span { font-size: 11px; font-weight: 400; color: var(--ink-soft); }
.instructor-name { font-size: 11px; color: var(--ink-mid); display: flex; align-items: center; gap: 3px; }

/* ── skeleton ── */
.skeleton { border-radius: 16px; border: 1px solid var(--line); background: #fff; overflow: hidden; display: flex; height: 110px; }
.skeleton-thumb { width: 110px; background: #f0f0f2; flex-shrink: 0; }
.skeleton-body { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #eee 0%, #f6f6f7 50%, #eee 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0%{ background-position: -200% 0 } 100%{ background-position: 200% 0 } }

/* ── empty state ── */
.empty-state { text-align: center; padding: 60px 24px; }
.empty-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(31,111,120,0.08); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--teal-deep); margin: 0 auto 18px; }
.empty-icon .icon { width: 24px; height: 24px; }
.empty-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.empty-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.8; }

@media (max-width: 480px) { .listing-thumb { width: 90px; } .listing-name { font-size: 13px; } }

/* ── インストラクター モーダル ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20,20,26,0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet {
  position: fixed; bottom: 0; left: 50%; z-index: 201;
  transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 640px;
  background: #fff;
  border-top: 1px solid var(--line);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(20,20,30,.18);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  max-height: 92dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.modal-sheet.open { transform: translateX(-50%) translateY(0); }
.modal-drag { width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 12px auto 0; }
.modal-close {
  position: absolute; top: 14px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  background: #f3f3f5; border: 1px solid var(--line);
  color: var(--ink-mid); display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.modal-close .icon { width: 16px; height: 16px; }
.modal-body { padding: 8px 20px 40px; }

/* プロフィールヘッダー */
.m-profile { display: flex; align-items: center; gap: 16px; padding: 16px 0 20px; border-bottom: 1px solid var(--line); }
.m-avatar {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  object-fit: cover; border: 2px solid var(--line);
  background: #f0f0f2;
}
.m-avatar-ph {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  background: #f0f0f2; border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center; color: var(--teal-deep);
}
.m-avatar-ph .icon { width: 30px; height: 30px; }
.m-info { flex: 1; min-width: 0; }
.m-name {
  font-size: 18px; font-weight: 700; color: var(--ink);
  display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
}
.m-verified { display: inline-flex; align-items: center; gap: 3px; background: rgba(31,111,120,0.10); border: 1px solid rgba(31,111,120,0.3); border-radius: 100px; padding: 2px 8px; font-size: 10px; color: var(--teal-deep); font-weight: 600; letter-spacing: 0.03em; flex-shrink: 0; }
.m-verified svg { width: 10px; height: 10px; fill: var(--teal-deep); stroke: none; }
.m-location { font-size: 12px; color: var(--ink-mid); display: flex; align-items: center; gap: 5px; }
.m-location .icon { width: 12px; height: 12px; color: var(--teal-deep); }

/* スタッツ */
.m-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.m-stat { text-align: center; }
.m-stat-val { font-size: 20px; font-weight: 700; color: var(--teal-deep); font-family: ui-monospace, monospace; line-height: 1; margin-bottom: 4px; }
.m-stat-label { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.06em; }

/* セクション共通 */
.m-section { padding: 18px 0; border-bottom: 1px solid var(--line); }
.m-section:last-of-type { border-bottom: none; }
.m-sec-title { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal-deep); margin-bottom: 12px; }

/* チップ */
.m-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.m-chip { display: inline-block; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--line); font-size: 11px; color: var(--ink-mid); background: #f7f7f8; }
.m-chip.cert { border-color: rgba(31,111,120,0.28); color: var(--teal-deep); background: rgba(31,111,120,0.06); }

/* エリア */
.m-areas { display: flex; flex-wrap: wrap; gap: 7px; }
.m-area-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--line); font-size: 11px; color: var(--ink-mid); }
.m-area-badge .icon { width: 11px; height: 11px; color: var(--teal-deep); }

/* bio */
.m-bio { font-size: 13px; color: var(--ink-mid); line-height: 1.85; }

/* SNS */
.m-sns { display: flex; gap: 10px; }
.m-sns-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 100px; border: 1px solid var(--line-strong); font-size: 11px; color: var(--ink-mid); background: transparent; text-decoration: none; transition: border-color 0.2s, color 0.2s; }
.m-sns-btn:hover { border-color: var(--ink); color: var(--ink); }
.m-sns-btn .icon { width: 14px; height: 14px; }

/* CTA */
.m-cta {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px;
  background: var(--accent); color: #fff;
  font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
  border-radius: 14px; text-decoration: none;
  margin-top: 20px; border: none; cursor: pointer;
  transition: background 0.2s;
}
.m-cta:hover { background: var(--accent-strong); }
.m-cta .icon { width: 16px; height: 16px; }

/* インストラクター名ボタン */
.instructor-btn {
  font-size: 11px; color: var(--ink-mid);
  display: inline-flex; align-items: center; gap: 3px;
  background: none; border: none; padding: 4px 0; cursor: pointer;
  text-decoration: underline dotted var(--line-strong);
  text-underline-offset: 2px;
  transition: color 0.15s;
}
.instructor-btn:hover { color: var(--teal-deep); }
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="../index.html">FREEDIVING <span>JAPAN</span></a>
    <div class="hdr-right">
      <a class="hdr-link" href="../mypage.html">
        <span class="avatar"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg></span>
        マイページ
      </a>
    </div>
  </div>
</header>
<main class="main">
  <a class="crumb" href="../index.html" style="margin:14px 0 0"><svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>ホームに戻る</a>

  <div style="margin:18px 0 4px;">
    <form class="searchbar" id="exploreSearchbar">
      <label class="sb-seg">
        <div class="sb-label">エリア</div>
        <input class="sb-input" name="area" id="searchInput" list="spotSuggestList" placeholder="都道府県・スポット名・スクール名で検索" autocomplete="off">
        <datalist id="spotSuggestList"></datalist>
      </label>
      <label class="sb-seg sb-when">
        <div class="sb-label">日程</div>
        <input class="sb-input" name="date" id="dateInput" type="date">
      </label>
      <button class="sb-btn" type="submit"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>検索</button>
    </form>
    <p class="filter-hint" id="dateHint" style="display:none">この日以降に空きがあるプランを表示中 · <button class="date-clear-btn" onclick="clearDate()" type="button">クリア</button></p>
  </div>

  <div class="intent-tabs" id="intentTabs">
    <button class="intent-tab active" data-intent="all" onclick="setIntent(this,'all')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <span class="intent-tab-label">すべて</span>
      <span class="intent-tab-count" id="count-all">—</span>
    </button>
    <button class="intent-tab" data-intent="try" onclick="setIntent(this,'try')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <span class="intent-tab-label">やってみたい</span>
      <span class="intent-tab-count" id="count-try">—</span>
    </button>
    <button class="intent-tab" data-intent="learn" onclick="setIntent(this,'learn')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
      <span class="intent-tab-label">ちゃんと学びたい</span>
      <span class="intent-tab-count" id="count-learn">—</span>
    </button>
    <button class="intent-tab" data-intent="dive" onclick="setIntent(this,'dive')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22V2m0 0l-4 4m4-4l4 4"/></svg></div>
      <span class="intent-tab-label">もっと潜りたい</span>
      <span class="intent-tab-count" id="count-dive">—</span>
    </button>
  </div>
  <div class="filter-section">
    <div class="filter-label-row">
      <p class="filter-label">都道府県から探す</p>
    </div>
    <div class="chip-row" id="areaChips">
      <button class="chip active" data-area="" onclick="togglePref(this)">全国</button>
    </div>
  </div>
  <div class="filter-section">
    <button class="adv-toggle" id="advToggle" onclick="toggleAdv()" type="button">
      <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      こだわり条件
      <span class="adv-badge" id="advBadge">0</span>
      <svg class="icon adv-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="adv-panel" id="advPanel">
      <p class="filter-label">条件</p>
      <div class="chip-row" id="conditionChips">
        <button class="chip" data-tag="当日予約OK" onclick="toggleTag(this)">当日予約OK</button>
        <button class="chip" data-tag="初心者OK" onclick="toggleTag(this)">初心者OK</button>
        <button class="chip" data-tag="資格取得コース" onclick="toggleTag(this)">資格取得コース</button>
        <button class="chip" data-tag="貸切可" onclick="toggleTag(this)">貸切可</button>
        <button class="chip" data-tag="英語対応" onclick="toggleTag(this)">英語対応</button>
        <button class="chip" data-tag="女性インストラクター" onclick="toggleTag(this)">女性インストラクター</button>
        <button class="chip" data-tag="子ども参加OK" onclick="toggleTag(this)">子ども参加OK</button>
      </div>
      <p class="filter-label">価格帯</p>
      <div class="chip-row" id="priceChips">
        <button class="chip active" data-price="" onclick="togglePrice(this)">すべて</button>
        <button class="chip" data-price="0-5000" onclick="togglePrice(this)">〜¥5,000</button>
        <button class="chip" data-price="5001-15000" onclick="togglePrice(this)">¥5,000〜¥15,000</button>
        <button class="chip" data-price="15001-999999" onclick="togglePrice(this)">¥15,000〜</button>
      </div>
    </div>
  </div>
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-label" id="intentLabel">すべての体験・スクール</span>
    <div class="divider-line"></div>
  </div>
  <div class="result-header">
    <p class="result-count"><span id="countNum">—</span> 件</p>
    <button class="sort-btn" id="sortBtn" onclick="cycleSort()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
      <span id="sortLabel">おすすめ順</span>
    </button>
  </div>
  <div class="listings" id="listings">
    <div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div></div></div>
    <div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:35%"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:50%"></div></div></div>
    <div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
  </div>
</main>
<!-- インストラクター詳細モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="modal-drag"></div>
  <button class="modal-close" onclick="closeModal()">
    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="modal-body" id="modalBody">
    <!-- JS で動的に描画 -->
  </div>
</div>

    </div>
  </div>
  <div class="foot-bottom"><div class="wrap">© 2026 FREEDIVING JAPAN（仮）</div></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/location-data.js"></script>
<script>
let allListings = [];
let currentIntent = 'all';
let currentPref = '';
let currentDate = '';
let slotsByListing = new Map(); // listing_id -> availability_slots[]（日程フィルタ用。空き枠データがないlistingは対象外＝常に表示）
let activeTags = new Set();
let currentPrice = '';
let currentSort = 'recommended'; // recommended | price_asc | price_desc | rating
const SORT_CYCLE = ['recommended','price_asc','price_desc','rating'];
const SORT_LABELS = { recommended:'おすすめ順', price_asc:'価格安い順', price_desc:'価格高い順', rating:'評価順' };
const intentLabels = { all: 'すべての体験・スクール', try: 'やってみたい — 体験・ツアー', learn: 'ちゃんと学びたい — スクール・資格', dive: 'もっと潜りたい — ファンダイブ・トレーニング・コーチング' };
const badgeLabel = { try: '体験', learn: '資格', fundive: 'ファンダイブ', training: 'トレーニング', coaching: 'コーチング' };
const badgeClass = { try: 'badge-try', learn: 'badge-learn', fundive: 'badge-fundive', training: 'badge-training', coaching: 'badge-coaching' };
// 検索タブ「もっと潜りたい」は fundive/training/coaching をまとめた1グループとして扱う
const INTENT_GROUPS = { dive: ['fundive', 'training', 'coaching'] };
const instructorCache = {};

// DB由来の値をHTMLへ挿入する前にエスケープ（S4: 属性ブレイクアウトXSS対策）
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// http(s) 以外のスキーム（javascript: 等）を弾く（S5: リンクXSS対策）
function safeUrl(u) {
  if (!u) return '';
  try {
    const parsed = new URL(u, location.href);
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
  } catch { return ''; }
}

/* ── スポット名サジェスト（js/location-data.js。事業者登録側と同じ考え方） ── */
if (window.FJLocations) {
  FJLocations.loadKnownSpots().then(spots => {
    const list = document.getElementById('spotSuggestList');
    if (!list) return;
    const all = [...new Set([...FJLocations.PREFECTURES, ...spots])];
    list.innerHTML = all.map(v => `<option value="${esc(v)}"></option>`).join('');
  });
}

/* ── こだわり条件（折りたたみ） ── */
function toggleAdv() {
  document.getElementById('advToggle').classList.toggle('open');
  document.getElementById('advPanel').classList.toggle('open');
}
function updateAdvBadge() {
  const n = activeTags.size + (currentPrice ? 1 : 0);
  const badge = document.getElementById('advBadge');
  badge.textContent = n;
  badge.classList.toggle('show', n > 0);
}

/* ── モーダル ── */
async function openInstructorModal(instructorId, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalSheet').classList.add('open');
  document.getElementById('modalBody').innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--on-dark-soft);font-size:13px">読み込み中…</div>`;
  document.body.style.overflow = 'hidden';

  try {
    if (!instructorCache[instructorId]) {
      const { data, error } = await _sb.from('instructors').select('*').eq('id', instructorId).single();
      if (error) throw error;
      instructorCache[instructorId] = data;
    }
    renderModal(instructorCache[instructorId]);
  } catch (err) {
    document.getElementById('modalBody').innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--on-dark-soft);font-size:13px">情報を取得できませんでした</div>`;
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalSheet').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderModal(inst) {
  const areas = (inst.areas || []);
  const certs = (inst.certifications || []);
  const specs = (inst.specialties || []);
  const listingCount = allListings.filter(l => l.instructor_id === inst.id).length;

  const avatarHtml = inst.photo_url
    ? `<img class="m-avatar" src="${esc(inst.photo_url)}" alt="${esc(inst.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="m-avatar-ph" style="display:none"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`
    : `<div class="m-avatar-ph"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;

  const verifiedBadge = inst.is_verified
    ? `<span class="m-verified"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>認定済み</span>` : '';

  const locationParts = esc([inst.prefecture, inst.city].filter(Boolean).join(' '));

  const snsLinks = [
    inst.instagram_url ? { url: inst.instagram_url, label: 'Instagram', icon: '<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>' } : null,
    inst.youtube_url  ? { url: inst.youtube_url,  label: 'YouTube',   icon: '<svg class="icon" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>' } : null,
    inst.website_url  ? { url: inst.website_url,  label: 'ウェブサイト', icon: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' } : null,
  ].filter(Boolean).map(l => {
    const safe = safeUrl(l.url);
    return safe ? `<a class="m-sns-btn" href="${esc(safe)}" target="_blank" rel="noopener">${l.icon}${l.label}</a>` : '';
  });
  const snsHtml = snsLinks.filter(Boolean).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="m-profile">
      ${avatarHtml}
      <div class="m-info">
        <div class="m-name">${esc(inst.name)}${verifiedBadge}</div>
        ${locationParts ? `<div class="m-location"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${locationParts}</div>` : ''}
      </div>
    </div>

    <div class="m-stats">
      <div class="m-stat">
        <div class="m-stat-val">${inst.experience_years != null ? esc(inst.experience_years) : '—'}<span style="font-size:12px;font-weight:400;color:var(--on-dark-soft)"> 年</span></div>
        <div class="m-stat-label">指導歴</div>
      </div>
      <div class="m-stat">
        <div class="m-stat-val">${listingCount}</div>
        <div class="m-stat-label">プラン数</div>
      </div>
      <div class="m-stat">
        <div class="m-stat-val">${certs.length || '—'}</div>
        <div class="m-stat-label">保有資格</div>
      </div>
    </div>

    ${certs.length ? `
    <div class="m-section">
      <p class="m-sec-title">保有資格</p>
      <div class="m-chips">${certs.map(c => `<span class="m-chip cert">${esc(c)}</span>`).join('')}</div>
    </div>` : ''}

    ${specs.length ? `
    <div class="m-section">
      <p class="m-sec-title">専門・得意分野</p>
      <div class="m-chips">${specs.map(s => `<span class="m-chip">${esc(s)}</span>`).join('')}</div>
    </div>` : ''}

    ${areas.length ? `
    <div class="m-section">
      <p class="m-sec-title">活動エリア</p>
      <div class="m-areas">${areas.map(a => `<span class="m-area-badge"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(a)}</span>`).join('')}</div>
    </div>` : ''}

    ${inst.bio ? `
    <div class="m-section">
      <p class="m-sec-title">自己紹介</p>
      <p class="m-bio">${esc(inst.bio)}</p>
    </div>` : ''}

    ${snsHtml ? `
    <div class="m-section">
      <p class="m-sec-title">リンク</p>
      <div class="m-sns">${snsHtml}</div>
    </div>` : ''}

    <a class="m-cta" href="profile.html?id=${esc(inst.id)}" onclick="closeModal()">
      このインストラクターのプロフィールを見る
      <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  `;
}

async function loadListings() {
  try {
    const today = new Date().toISOString().slice(0, 10);
    const [{ data, error }, slotsRes] = await Promise.all([
      _sb.from('listings').select('id, title, category, intent, area, prefecture, location_detail, price, price_unit, tags, image_url, instructor_id, shop_id, instructors ( id, name, is_verified, shops ( avg_rating, review_count ) ), shops ( id, name, avg_rating, review_count )').eq('is_public', true).order('sort_order', { ascending: true }),
      _sb.from('availability_slots').select('listing_id, slot_date, booked_count, max_participants').eq('is_active', true).gte('slot_date', today)
    ]);
    if (error) throw error;
    if (slotsRes.error) console.error(slotsRes.error); // 空き状況の取得に失敗しても日程フィルタが効かないだけにして一覧表示は継続する
    allListings = data || [];
    slotsByListing = new Map();
    (slotsRes.data || []).forEach(s => {
      if (!s.listing_id) return;
      if (!slotsByListing.has(s.listing_id)) slotsByListing.set(s.listing_id, []);
      slotsByListing.get(s.listing_id).push(s);
    });
    updateCounts();
    renderListings();
  } catch (err) {
    console.error(err);
    document.getElementById('listings').innerHTML = '<div class="empty-state"><div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><p class="empty-title">データを読み込めませんでした</p><p class="empty-desc">しばらく経ってから再度お試しください</p></div>';
  }
}

function updateCounts() {
  const counts = { all: allListings.length, try: 0, learn: 0, dive: 0 };
  const prefCounts = {};
  allListings.forEach(l => {
    if (INTENT_GROUPS.dive.includes(l.intent)) counts.dive++;
    else if (counts[l.intent] !== undefined) counts[l.intent]++;
    if (l.prefecture) prefCounts[l.prefecture] = (prefCounts[l.prefecture] || 0) + 1;
  });
  document.getElementById('count-all').textContent   = counts.all;
  document.getElementById('count-try').textContent   = counts.try;
  document.getElementById('count-learn').textContent = counts.learn;
  document.getElementById('count-dive').textContent  = counts.dive;
  renderPrefChips(prefCounts);
}

// 都道府県チップを動的に生成する（2026-07-10・エリア設計の刷新）。
// 「人気の都道府県」は0件でも薄く常時表示し、それ以外は実際に出品がある都道府県だけ追加で出す。
function renderPrefChips(prefCounts) {
  const container = document.getElementById('areaChips');
  const popular = (window.FJLocations && FJLocations.POPULAR_PREFECTURES) || [];
  const extra = Object.keys(prefCounts)
    .filter(p => prefCounts[p] > 0 && !popular.includes(p))
    .sort((a, b) => prefCounts[b] - prefCounts[a]);
  const prefs = [...popular, ...extra];

  let html = `<button class="chip${currentPref === '' ? ' active' : ''}" data-area="" onclick="togglePref(this)">全国</button>`;
  prefs.forEach(p => {
    const count = prefCounts[p] || 0;
    const cls = ['chip', currentPref === p ? 'active' : '', count === 0 ? 'dim' : ''].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-area="${esc(p)}" onclick="togglePref(this)">${esc(p)}</button>`;
  });
  container.innerHTML = html;
}

function applyIntent(intent) {
  currentIntent = intent;
  document.querySelectorAll('.intent-tab').forEach(t => t.classList.toggle('active', t.dataset.intent === intent));
  document.getElementById('intentLabel').textContent = intentLabels[intent];
  renderListings();
}
// 一覧上部のピル（すべて/やってみたい/…）から選んだ場合
function setIntent(el, intent) {
  applyIntent(intent);
}
function togglePref(el) {
  document.querySelectorAll('#areaChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentPref = el.dataset.area || '';
  renderListings();
}
function setDate(value) {
  currentDate = value || '';
  document.getElementById('dateHint').style.display = currentDate ? 'block' : 'none';
  renderListings();
}
function clearDate() {
  document.getElementById('dateInput').value = '';
  setDate('');
}
function toggleTag(el) {
  const tag = el.dataset.tag;
  if (activeTags.has(tag)) { activeTags.delete(tag); el.classList.remove('active'); }
  else { activeTags.add(tag); el.classList.add('active'); }
  updateAdvBadge();
  renderListings();
}
function togglePrice(el) {
  document.querySelectorAll('#priceChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentPrice = el.dataset.price || '';
  updateAdvBadge();
  renderListings();
}
function cycleSort() {
  const idx = SORT_CYCLE.indexOf(currentSort);
  currentSort = SORT_CYCLE[(idx + 1) % SORT_CYCLE.length];
  document.getElementById('sortLabel').textContent = SORT_LABELS[currentSort];
  renderListings();
}
function applyFilters() { renderListings(); }

function renderListings() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = allListings.filter(l => {
    if (currentIntent !== 'all') {
      const group = INTENT_GROUPS[currentIntent];
      if (group ? !group.includes(l.intent) : l.intent !== currentIntent) return false;
    }
    if (currentPref && l.prefecture !== currentPref) return false;
    if (currentDate) {
      const slots = slotsByListing.get(l.id);
      // 空き枠データを持つlistingだけ日程で絞り込む。データがないlisting（問い合わせベース等）は要相談として常に表示する
      if (slots && slots.length) {
        const hasOpenSlot = slots.some(s => s.slot_date >= currentDate && (s.booked_count ?? 0) < (s.max_participants ?? 0));
        if (!hasOpenSlot) return false;
      }
    }
    if (activeTags.size > 0 && !([...(l.tags || [])].some(t => activeTags.has(t)))) return false;
    if (currentPrice) {
      const [min, max] = currentPrice.split('-').map(Number);
      const p = l.price || 0;
      if (p < min || p > max) return false;
    }
    if (q) {
      const ownerName = l.instructors?.name || l.shops?.name || '';
      // 都道府県selectを廃止した代わりに、都道府県名もフリーテキスト検索の対象に含める
      const haystack = `${l.title} ${l.area} ${l.prefecture || ''} ${l.location_detail || ''} ${l.category} ${ownerName}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  // 表示用の評価（インストラクター名義: 所属ショップの評価 / ショップ名義: 自社の評価）
  const ratingOf = l => (l.instructors?.shops || l.shops || {});

  // ソート
  if (currentSort === 'price_asc')  filtered = [...filtered].sort((a, b) => (a.price || 0) - (b.price || 0));
  if (currentSort === 'price_desc') filtered = [...filtered].sort((a, b) => (b.price || 0) - (a.price || 0));
  if (currentSort === 'rating')     filtered = [...filtered].sort((a, b) => (ratingOf(b).avg_rating || 0) - (ratingOf(a).avg_rating || 0));

  document.getElementById('countNum').textContent = filtered.length;
  const container = document.getElementById('listings');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p class="empty-title">該当する結果がありません</p><p class="empty-desc">条件を変えてもう一度お試しください</p></div>';
    return;
  }
  container.innerHTML = filtered.map(l => {
    const inst = l.instructors;
    const ownerShop = l.shops; // ショップ名義（instructor_idがnull）の場合の直接のショップ
    const shop = inst?.shops || ownerShop;
    const verified = inst?.is_verified ? '<svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:var(--teal);stroke:none;flex-shrink:0"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' : '';
    const thumb = l.image_url ? `<img src="${esc(l.image_url)}" alt="${esc(l.title)}" loading="lazy">` : '<div class="listing-thumb-ph"><svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M3 9a2 2 0 0 1 2-2h.93a2 2 0 0 0 1.664-.89l.812-1.22A2 2 0 0 1 10.07 4h3.86a2 2 0 0 1 1.664.89l.812 1.22A2 2 0 0 0 18.07 7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg></div>';
    const ratingHtml = shop?.avg_rating
      ? `<span class="meta-item" style="color:var(--warm)">★ ${parseFloat(shop.avg_rating).toFixed(1)}<span style="color:var(--on-dark-soft);margin-left:2px">(${esc(shop.review_count)})</span></span>`
      : '';
    // インストラクター名義ならインストラクターページへ、ショップ名義（担当者未定）ならショップIDで遷移
    const ownerLinkParam = l.instructor_id ? `id=${esc(l.instructor_id)}` : `shop=${esc(l.shop_id)}`;
    const ownerBtn = inst
      ? `<button class="instructor-btn" onclick="openInstructorModal('${esc(l.instructor_id)}', event)">${verified}${esc(inst.name || '')}</button>`
      : `<span class="instructor-btn" style="cursor:default;">${esc(ownerShop?.name || 'ショップ')}</span>`;
    return `<a class="listing-card" href="listing.html?${ownerLinkParam}&listing=${esc(l.id)}">
      <div class="listing-thumb">${thumb}<span class="listing-badge ${badgeClass[l.intent]}">${badgeLabel[l.intent]}</span></div>
      <div class="listing-body">
        <span class="listing-category">${esc(l.category)}</span>
        <p class="listing-name">${esc(l.title)}</p>
        <div class="listing-meta">
          <span class="meta-item"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(l.area)}${l.location_detail ? '・' + esc(l.location_detail) : ''}</span>
          ${ratingHtml}
          ${(l.tags || []).slice(0,2).map(t => `<span class="meta-item">${esc(t)}</span>`).join('')}
        </div>
        <div class="listing-footer">
          <p class="listing-price">${l.price ? '¥' + l.price.toLocaleString() : '要相談'}<span>${l.price ? esc(l.price_unit || '') : ''}</span></p>
          ${ownerBtn}
        </div>
      </div>
    </a>`;
  }).join('');
}

// ── URLパラメータで初期絞り込み（ホーム／ピラーページの検索バーから遷移） ──
function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const q = p.get('q');
  const intent = p.get('intent');
  const area = p.get('area');
  const pref = p.get('pref');
  if (q) document.getElementById('searchInput').value = q;
  // 旧リンク互換：?pref= はフリーテキスト検索として扱う
  if (pref && !q) document.getElementById('searchInput').value = pref;
  if (intent && ['try','learn','dive'].includes(intent)) {
    applyIntent(intent);
  }
  // ?area= はホーム／ピラーページの検索バー（都道府県名 or スポット名の自由入力）から来る。
  // 都道府県名と完全一致すれば構造化フィルタ（チップ）として扱い、それ以外はスポット名としてフリーテキスト検索に渡す
  if (area && !q) {
    const isPref = window.FJLocations && FJLocations.PREFECTURES.includes(area);
    if (isPref) {
      currentPref = area; // renderPrefChips()（loadListings→updateCounts経由）がこの値を見てチップのactive状態を反映する
    } else {
      document.getElementById('searchInput').value = area;
    }
  }
  const date = p.get('date');
  if (date) {
    currentDate = date;
    document.getElementById('dateInput').value = date;
    document.getElementById('dateHint').style.display = 'block';
  }
  // ピラーページの人気タグチップから遷移してきた場合（?tag=）：こだわり条件に反映し、無ければチップを追加して開く
  const tag = p.get('tag');
  if (tag) {
    activeTags.add(tag);
    let chip = [...document.querySelectorAll('#conditionChips .chip')].find(c => c.dataset.tag === tag);
    if (!chip) {
      chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.tag = tag;
      chip.textContent = tag;
      chip.addEventListener('click', () => toggleTag(chip));
      document.getElementById('conditionChips').appendChild(chip);
    }
    chip.classList.add('active');
    document.getElementById('advPanel').classList.add('open');
    document.getElementById('advToggle').classList.add('open');
    updateAdvBadge();
  }
}

document.getElementById('dateInput').min = new Date().toISOString().slice(0, 10);
document.getElementById('dateInput').addEventListener('change', e => setDate(e.target.value));
document.getElementById('searchInput').addEventListener('input', () => applyFilters());
// フォーム自体はページ遷移させず、その場のフィルタ更新に留める（各inputは自身のイベントで既に即時反映済み）
document.getElementById('exploreSearchbar').addEventListener('submit', e => { e.preventDefault(); applyFilters(); document.getElementById('searchInput').blur(); });
applyUrlParams();
loadListings();
</script>
