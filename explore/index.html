<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探す — Freediving Japan</title>
<link rel="stylesheet" href="../css/design-system.css">
<style>
.header-icons { display: flex; align-items: center; gap: 16px; }
.search-hero { padding: 36px 20px 28px; text-align: center; position: relative; overflow: hidden; }
.search-hero-glow { position: absolute; top: -60%; left: 50%; width: 120%; height: 100%; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(168,236,232,0.16) 0%, transparent 65%); pointer-events: none; }
.search-hero-inner { position: relative; z-index: 2; }
.search-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--teal-light); margin-bottom: 12px; }
.search-title { font-size: 22px; font-weight: 300; line-height: 1.5; letter-spacing: 0.04em; margin-bottom: 24px; }
.search-title em { font-style: normal; font-weight: 500; color: var(--teal-light); }
.search-bar-wrap { position: relative; max-width: 480px; margin: 0 auto; }
.search-bar { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid var(--hairline); border-radius: 100px; padding: 14px 52px 14px 48px; font-size: 14px; color: var(--on-dark); outline: none; backdrop-filter: blur(8px); transition: border-color 0.2s, background 0.2s; }
.search-bar::placeholder { color: var(--on-dark-soft); }
.search-bar:focus { border-color: rgba(46,196,182,0.5); background: rgba(255,255,255,0.10); }
.search-icon-left { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--teal); pointer-events: none; }
.search-icon-left .icon { width: 18px; height: 18px; }
.search-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: var(--teal); border: none; border-radius: 100px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ocean-deep); transition: background 0.2s; }
.search-btn:hover { background: var(--teal-light); }
.search-btn .icon { width: 16px; height: 16px; stroke-width: 2; }
.main { max-width: 640px; margin: 0 auto; padding: 0 16px 80px; }
.intent-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.intent-tabs::-webkit-scrollbar { display: none; }
.intent-tab { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--hairline); background: var(--glass); cursor: pointer; transition: border-color 0.2s, background 0.2s; min-width: 100px; }
.intent-tab.active { border-color: var(--teal); background: rgba(46,196,182,0.10); }
.intent-tab-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(46,196,182,0.12); display: flex; align-items: center; justify-content: center; color: var(--teal-light); }
.intent-tab.active .intent-tab-icon { background: rgba(46,196,182,0.22); color: var(--teal); }
.intent-tab-icon .icon { width: 16px; height: 16px; }
.intent-tab-label { font-size: 11px; font-weight: 500; color: var(--on-dark-mid); letter-spacing: 0.03em; text-align: center; line-height: 1.4; white-space: nowrap; }
.intent-tab.active .intent-tab-label { color: var(--on-dark); }
.intent-tab-count { font-size: 10px; color: var(--on-dark-soft); font-family: ui-monospace, monospace; }
.intent-tab.active .intent-tab-count { color: var(--teal-light); }
.filter-section { margin-bottom: 20px; }
.filter-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-dark-soft); margin-bottom: 10px; }
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.result-count { font-size: 12px; color: var(--on-dark-soft); }
.result-count span { color: var(--teal-light); font-weight: 600; }
.sort-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-dark-mid); background: none; border: 1px solid var(--hairline); cursor: pointer; padding: 6px 12px; border-radius: 100px; }
.sort-btn .icon { width: 14px; height: 14px; }
.listings { display: flex; flex-direction: column; gap: 12px; }
.listing-card { border-radius: 16px; border: 1px solid var(--hairline); background: var(--glass); overflow: hidden; display: flex; cursor: pointer; transition: border-color 0.2s, background 0.2s; text-decoration: none; color: inherit; }
.listing-card:hover { border-color: rgba(46,196,182,0.3); background: rgba(255,255,255,0.06); }
.listing-thumb { width: 110px; flex-shrink: 0; position: relative; overflow: hidden; }
.listing-thumb img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.9) brightness(0.85); }
.listing-thumb-ph { width: 100%; min-height: 110px; background: var(--ocean-mid); display: flex; align-items: center; justify-content: center; color: var(--on-dark-soft); }
.listing-badge { position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; backdrop-filter: blur(8px); }
.badge-try { background: rgba(249,115,22,0.75); color: #fff; }
.badge-learn { background: rgba(46,196,182,0.75); color: var(--ocean-deep); }
.badge-dive { background: rgba(26,95,130,0.85); color: #fff; }
.listing-body { flex: 1; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.listing-category { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); font-weight: 500; }
.listing-name { font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--on-dark); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.listing-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--on-dark-soft); }
.meta-item .icon { width: 12px; height: 12px; }
.listing-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.listing-price { font-size: 13px; font-weight: 600; color: var(--on-dark); }
.listing-price span { font-size: 11px; font-weight: 400; color: var(--on-dark-soft); }
.instructor-name { font-size: 11px; color: var(--on-dark-mid); display: flex; align-items: center; gap: 3px; }
.skeleton { border-radius: 16px; border: 1px solid var(--hairline); background: var(--glass); overflow: hidden; display: flex; height: 110px; }
.skeleton-thumb { width: 110px; background: rgba(255,255,255,0.04); flex-shrink: 0; }
.skeleton-body { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0%{ background-position: -200% 0 } 100%{ background-position: 200% 0 } }
.empty-state { text-align: center; padding: 60px 24px; }
.empty-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(46,196,182,0.08); border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; color: var(--teal); margin: 0 auto 18px; }
.empty-icon .icon { width: 24px; height: 24px; }
.empty-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.empty-desc { font-size: 12px; color: var(--on-dark-soft); line-height: 1.8; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on-dark-soft); cursor: pointer; background: none; border: none; transition: color 0.2s; }
.nav-item.active { color: var(--teal); }
.nav-item .icon { width: 20px; height: 20px; }
.nav-label { font-size: 10px; letter-spacing: 0.05em; }
@media (max-width: 480px) { .search-title { font-size: 19px; } .listing-thumb { width: 90px; } .listing-name { font-size: 13px; } }

/* ── インストラクター モーダル ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(4,22,31,0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet {
  position: fixed; bottom: 0; left: 50%; z-index: 201;
  transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 640px;
  background: linear-gradient(180deg, #0d3348 0%, #091f2e 100%);
  border-top: 1px solid var(--hairline);
  border-radius: 22px 22px 0 0;
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  max-height: 92dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.modal-sheet.open { transform: translateX(-50%) translateY(0); }
.modal-drag { width: 40px; height: 4px; border-radius: 2px; background: rgba(168,236,232,0.25); margin: 12px auto 0; }
.modal-close {
  position: absolute; top: 14px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 1px solid var(--hairline);
  color: var(--on-dark-mid); display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.modal-close .icon { width: 16px; height: 16px; }
.modal-body { padding: 8px 20px 40px; }

/* プロフィールヘッダー */
.m-profile { display: flex; align-items: center; gap: 16px; padding: 16px 0 20px; border-bottom: 1px solid var(--hairline); }
.m-avatar {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  object-fit: cover; border: 2px solid var(--hairline);
  background: var(--ocean-mid);
}
.m-avatar-ph {
  width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
  background: var(--ocean-mid); border: 2px solid var(--hairline);
  display: flex; align-items: center; justify-content: center; color: var(--teal);
}
.m-avatar-ph .icon { width: 30px; height: 30px; }
.m-info { flex: 1; min-width: 0; }
.m-name {
  font-size: 18px; font-weight: 600; color: var(--on-dark);
  display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
}
.m-verified { display: inline-flex; align-items: center; gap: 3px; background: rgba(46,196,182,0.12); border: 1px solid rgba(46,196,182,0.3); border-radius: 100px; padding: 2px 8px; font-size: 10px; color: var(--teal); font-weight: 500; letter-spacing: 0.05em; flex-shrink: 0; }
.m-verified svg { width: 10px; height: 10px; fill: var(--teal); stroke: none; }
.m-location { font-size: 12px; color: var(--on-dark-mid); display: flex; align-items: center; gap: 5px; }
.m-location .icon { width: 12px; height: 12px; color: var(--teal); }

/* スタッツ */
.m-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--hairline); }
.m-stat { text-align: center; }
.m-stat-val { font-size: 20px; font-weight: 700; color: var(--teal-light); font-family: ui-monospace, monospace; line-height: 1; margin-bottom: 4px; }
.m-stat-label { font-size: 10px; color: var(--on-dark-soft); letter-spacing: 0.08em; }

/* セクション共通 */
.m-section { padding: 18px 0; border-bottom: 1px solid var(--hairline); }
.m-section:last-of-type { border-bottom: none; }
.m-sec-title { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }

/* チップ */
.m-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.m-chip { display: inline-block; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--hairline); font-size: 11px; color: var(--on-dark-mid); background: rgba(255,255,255,0.04); }
.m-chip.cert { border-color: rgba(46,196,182,0.25); color: var(--teal-light); background: rgba(46,196,182,0.07); }

/* エリア */
.m-areas { display: flex; flex-wrap: wrap; gap: 7px; }
.m-area-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--hairline); font-size: 11px; color: var(--on-dark-mid); }
.m-area-badge .icon { width: 11px; height: 11px; color: var(--teal); }

/* bio */
.m-bio { font-size: 13px; color: var(--on-dark-mid); line-height: 1.85; }

/* SNS */
.m-sns { display: flex; gap: 10px; }
.m-sns-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 100px; border: 1px solid var(--hairline); font-size: 11px; color: var(--on-dark-mid); background: transparent; text-decoration: none; transition: border-color 0.2s; }
.m-sns-btn:hover { border-color: rgba(46,196,182,0.4); color: var(--on-dark); }
.m-sns-btn .icon { width: 14px; height: 14px; }

/* CTA */
.m-cta {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px;
  background: var(--teal); color: var(--ocean-deep);
  font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  border-radius: 14px; text-decoration: none;
  margin-top: 20px; border: none; cursor: pointer;
  transition: background 0.2s;
}
.m-cta:hover { background: var(--teal-light); }
.m-cta .icon { width: 16px; height: 16px; }

/* インストラクター名ボタン */
.instructor-btn {
  font-size: 11px; color: var(--on-dark-mid);
  display: inline-flex; align-items: center; gap: 3px;
  background: none; border: none; padding: 4px 0; cursor: pointer;
  text-decoration: underline dotted rgba(168,236,232,0.3);
  text-underline-offset: 2px;
  transition: color 0.15s;
}
.instructor-btn:hover { color: var(--teal-light); }
</style>
</head>
<body>
<header class="header">
  <a href="../index.html" class="logo">FREEDIVING <span>JAPAN</span></a>
  <div class="header-icons">
    <a href="../mypage.html" class="icon-btn" aria-label="マイページ"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>マイページ</a>
  </div>
</header>
<div class="search-hero">
  <div class="search-hero-glow"></div>
  <div class="search-hero-inner">
    <p class="search-eyebrow">Explore the Ocean</p>
    <h1 class="search-title">何を<em>体験</em>したいですか？</h1>
    <div class="search-bar-wrap">
      <div class="search-icon-left">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <input class="search-bar" type="search" placeholder="エリア・スクール・インストラクターを検索" id="searchInput">
      <button class="search-btn" onclick="applyFilters()">
        <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>
</div>
<main class="main">
  <div class="intent-tabs" id="intentTabs">
    <button class="intent-tab active" data-intent="all" onclick="setIntent(this,'all')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <span class="intent-tab-label">すべて</span>
      <span class="intent-tab-count" id="count-all">—</span>
    </button>
    <button class="intent-tab" data-intent="try" onclick="setIntent(this,'try')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <span class="intent-tab-label">やってみたい</span>
      <span class="intent-tab-count" id="count-try">—</span>
    </button>
    <button class="intent-tab" data-intent="learn" onclick="setIntent(this,'learn')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
      <span class="intent-tab-label">ちゃんと学びたい</span>
      <span class="intent-tab-count" id="count-learn">—</span>
    </button>
    <button class="intent-tab" data-intent="dive" onclick="setIntent(this,'dive')">
      <div class="intent-tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22V2m0 0l-4 4m4-4l4 4"/></svg></div>
      <span class="intent-tab-label">もっと潜りたい</span>
      <span class="intent-tab-count" id="count-dive">—</span>
    </button>
  </div>
  <div class="filter-section">
    <p class="filter-label">エリア</p>
    <div class="chip-row" id="areaChips">
      <button class="chip active" data-area="" onclick="toggleArea(this)">全国</button>
      <button class="chip" data-area="沖縄" onclick="toggleArea(this)">沖縄</button>
      <button class="chip" data-area="石垣島" onclick="toggleArea(this)">石垣島</button>
      <button class="chip" data-area="宮古島" onclick="toggleArea(this)">宮古島</button>
      <button class="chip" data-area="伊豆" onclick="toggleArea(this)">伊豆</button>
      <button class="chip" data-area="東京" onclick="toggleArea(this)">東京</button>
      <button class="chip" data-area="紀伊半島" onclick="toggleArea(this)">紀伊半島</button>
      <button class="chip" data-area="瀬戸内" onclick="toggleArea(this)">瀬戸内</button>
      <button class="chip" data-area="北海道" onclick="toggleArea(this)">北海道</button>
    </div>
  </div>
  <div class="filter-section">
    <p class="filter-label">条件</p>
    <div class="chip-row" id="conditionChips">
      <button class="chip" data-tag="当日予約OK" onclick="toggleTag(this)">当日予約OK</button>
      <button class="chip" data-tag="初心者OK" onclick="toggleTag(this)">初心者OK</button>
      <button class="chip" data-tag="資格取得コース" onclick="toggleTag(this)">資格取得コース</button>
      <button class="chip" data-tag="貸切可" onclick="toggleTag(this)">貸切可</button>
      <button class="chip" data-tag="英語対応" onclick="toggleTag(this)">英語対応</button>
      <button class="chip" data-tag="女性インストラクター" onclick="toggleTag(this)">女性インストラクター</button>
      <button class="chip" data-tag="子ども参加OK" onclick="toggleTag(this)">子ども参加OK</button>
    </div>
  </div>
  <div class="filter-section">
    <p class="filter-label">価格帯</p>
    <div class="chip-row" id="priceChips">
      <button class="chip active" data-price="" onclick="togglePrice(this)">すべて</button>
      <button class="chip" data-price="0-5000" onclick="togglePrice(this)">〜¥5,000</button>
      <button class="chip" data-price="5001-15000" onclick="togglePrice(this)">¥5,000〜¥15,000</button>
      <button class="chip" data-price="15001-999999" onclick="togglePrice(this)">¥15,000〜</button>
    </div>
  </div>
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-label" id="intentLabel">すべての体験・スクール</span>
    <div class="divider-line"></div>
  </div>
  <div class="result-header">
    <p class="result-count"><span id="countNum">—</span> 件</p>
    <button class="sort-btn" id="sortBtn" onclick="cycleSort()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
      <span id="sortLabel">おすすめ順</span>
    </button>
  </div>
  <div class="listings" id="listings">
    <div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div></div></div>
    <div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:35%"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:50%"></div></div></div>
    <div class="skeleton"><div class="skeleton-thumb"></div><div class="skeleton-body"><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
  </div>
</main>
<!-- インストラクター詳細モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal-sheet" id="modalSheet">
  <div class="modal-drag"></div>
  <button class="modal-close" onclick="closeModal()">
    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="modal-body" id="modalBody">
    <!-- JS で動的に描画 -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
let allListings = [];
let currentIntent = 'all';
let currentArea = '';
let activeTags = new Set();
let currentPrice = '';
let currentSort = 'recommended'; // recommended | price_asc | price_desc | rating
const SORT_CYCLE = ['recommended','price_asc','price_desc','rating'];
const SORT_LABELS = { recommended:'おすすめ順', price_asc:'価格安い順', price_desc:'価格高い順', rating:'評価順' };
const intentLabels = { all: 'すべての体験・スクール', try: 'やってみたい — 体験・ツアー', learn: 'ちゃんと学びたい — スクール・資格', dive: 'もっと潜りたい — ファンダイブ・アスリート' };
const badgeLabel = { try: '体験', learn: '資格', dive: 'ダイブ' };
const badgeClass = { try: 'badge-try', learn: 'badge-learn', dive: 'badge-dive' };
const instructorCache = {};

// DB由来の値をHTMLへ挿入する前にエスケープ（S4: 属性ブレイクアウトXSS対策）
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// http(s) 以外のスキーム（javascript: 等）を弾く（S5: リンクXSS対策）
function safeUrl(u) {
  if (!u) return '';
  try {
    const parsed = new URL(u, location.href);
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
  } catch { return ''; }
}

/* ── モーダル ── */
async function openInstructorModal(instructorId, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalSheet').classList.add('open');
  document.getElementById('modalBody').innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--on-dark-soft);font-size:13px">読み込み中…</div>`;
  document.body.style.overflow = 'hidden';

  try {
    if (!instructorCache[instructorId]) {
      const { data, error } = await _sb.from('instructors').select('*').eq('id', instructorId).single();
      if (error) throw error;
      instructorCache[instructorId] = data;
    }
    renderModal(instructorCache[instructorId]);
  } catch (err) {
    document.getElementById('modalBody').innerHTML = `<div style="padding:40px 0;text-align:center;color:var(--on-dark-soft);font-size:13px">情報を取得できませんでした</div>`;
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalSheet').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderModal(inst) {
  const areas = (inst.areas || []);
  const certs = (inst.certifications || []);
  const specs = (inst.specialties || []);
  const listingCount = allListings.filter(l => l.instructor_id === inst.id).length;

  const avatarHtml = inst.photo_url
    ? `<img class="m-avatar" src="${esc(inst.photo_url)}" alt="${esc(inst.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="m-avatar-ph" style="display:none"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`
    : `<div class="m-avatar-ph"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;

  const verifiedBadge = inst.is_verified
    ? `<span class="m-verified"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>認定済み</span>` : '';

  const locationParts = esc([inst.prefecture, inst.city].filter(Boolean).join(' '));

  const snsLinks = [
    inst.instagram_url ? { url: inst.instagram_url, label: 'Instagram', icon: '<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>' } : null,
    inst.youtube_url  ? { url: inst.youtube_url,  label: 'YouTube',   icon: '<svg class="icon" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>' } : null,
    inst.website_url  ? { url: inst.website_url,  label: 'ウェブサイト', icon: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' } : null,
  ].filter(Boolean).map(l => {
    const safe = safeUrl(l.url);
    return safe ? `<a class="m-sns-btn" href="${esc(safe)}" target="_blank" rel="noopener">${l.icon}${l.label}</a>` : '';
  });
  const snsHtml = snsLinks.filter(Boolean).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="m-profile">
      ${avatarHtml}
      <div class="m-info">
        <div class="m-name">${esc(inst.name)}${verifiedBadge}</div>
        ${locationParts ? `<div class="m-location"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${locationParts}</div>` : ''}
      </div>
    </div>

    <div class="m-stats">
      <div class="m-stat">
        <div class="m-stat-val">${inst.experience_years != null ? esc(inst.experience_years) : '—'}<span style="font-size:12px;font-weight:400;color:var(--on-dark-soft)"> 年</span></div>
        <div class="m-stat-label">指導歴</div>
      </div>
      <div class="m-stat">
        <div class="m-stat-val">${listingCount}</div>
        <div class="m-stat-label">プラン数</div>
      </div>
      <div class="m-stat">
        <div class="m-stat-val">${certs.length || '—'}</div>
        <div class="m-stat-label">保有資格</div>
      </div>
    </div>

    ${certs.length ? `
    <div class="m-section">
      <p class="m-sec-title">保有資格</p>
      <div class="m-chips">${certs.map(c => `<span class="m-chip cert">${esc(c)}</span>`).join('')}</div>
    </div>` : ''}

    ${specs.length ? `
    <div class="m-section">
      <p class="m-sec-title">専門・得意分野</p>
      <div class="m-chips">${specs.map(s => `<span class="m-chip">${esc(s)}</span>`).join('')}</div>
    </div>` : ''}

    ${areas.length ? `
    <div class="m-section">
      <p class="m-sec-title">活動エリア</p>
      <div class="m-areas">${areas.map(a => `<span class="m-area-badge"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(a)}</span>`).join('')}</div>
    </div>` : ''}

    ${inst.bio ? `
    <div class="m-section">
      <p class="m-sec-title">自己紹介</p>
      <p class="m-bio">${esc(inst.bio)}</p>
    </div>` : ''}

    ${snsHtml ? `
    <div class="m-section">
      <p class="m-sec-title">リンク</p>
      <div class="m-sns">${snsHtml}</div>
    </div>` : ''}

    <a class="m-cta" href="listing.html?id=${esc(inst.id)}" onclick="closeModal()">
      このインストラクターのプランを見る
      <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  `;
}

async function loadListings() {
  try {
    const { data, error } = await _sb.from('listings').select('id, title, category, intent, area, location_detail, price, price_unit, tags, image_url, instructor_id, instructors ( id, name, is_verified, shops ( avg_rating, review_count ) )').eq('is_public', true).order('sort_order', { ascending: true });
    if (error) throw error;
    allListings = data || [];
    updateCounts();
    renderListings();
  } catch (err) {
    console.error(err);
    document.getElementById('listings').innerHTML = '<div class="empty-state"><div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><p class="empty-title">データを読み込めませんでした</p><p class="empty-desc">しばらく経ってから再度お試しください</p></div>';
  }
}

function updateCounts() {
  const counts = { all: allListings.length, try: 0, learn: 0, dive: 0 };
  allListings.forEach(l => { if (counts[l.intent] !== undefined) counts[l.intent]++; });
  document.getElementById('count-all').textContent   = counts.all;
  document.getElementById('count-try').textContent   = counts.try;
  document.getElementById('count-learn').textContent = counts.learn;
  document.getElementById('count-dive').textContent  = counts.dive;
}

function setIntent(el, intent) {
  document.querySelectorAll('.intent-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentIntent = intent;
  document.getElementById('intentLabel').textContent = intentLabels[intent];
  renderListings();
}
function toggleArea(el) {
  document.querySelectorAll('#areaChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentArea = el.dataset.area || '';
  renderListings();
}
function toggleTag(el) {
  const tag = el.dataset.tag;
  if (activeTags.has(tag)) { activeTags.delete(tag); el.classList.remove('active'); }
  else { activeTags.add(tag); el.classList.add('active'); }
  renderListings();
}
function togglePrice(el) {
  document.querySelectorAll('#priceChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentPrice = el.dataset.price || '';
  renderListings();
}
function cycleSort() {
  const idx = SORT_CYCLE.indexOf(currentSort);
  currentSort = SORT_CYCLE[(idx + 1) % SORT_CYCLE.length];
  document.getElementById('sortLabel').textContent = SORT_LABELS[currentSort];
  renderListings();
}
function applyFilters() { renderListings(); }

function renderListings() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = allListings.filter(l => {
    if (currentIntent !== 'all' && l.intent !== currentIntent) return false;
    if (currentArea && l.area !== currentArea) return false;
    if (activeTags.size > 0 && !([...(l.tags || [])].some(t => activeTags.has(t)))) return false;
    if (currentPrice) {
      const [min, max] = currentPrice.split('-').map(Number);
      const p = l.price || 0;
      if (p < min || p > max) return false;
    }
    if (q) {
      const instName = l.instructors?.name || '';
      const haystack = `${l.title} ${l.area} ${l.location_detail || ''} ${l.category} ${instName}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  // ソート
  if (currentSort === 'price_asc')  filtered = [...filtered].sort((a, b) => (a.price || 0) - (b.price || 0));
  if (currentSort === 'price_desc') filtered = [...filtered].sort((a, b) => (b.price || 0) - (a.price || 0));
  if (currentSort === 'rating')     filtered = [...filtered].sort((a, b) => (b.instructors?.shops?.avg_rating || 0) - (a.instructors?.shops?.avg_rating || 0));

  document.getElementById('countNum').textContent = filtered.length;
  const container = document.getElementById('listings');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p class="empty-title">該当する結果がありません</p><p class="empty-desc">条件を変えてもう一度お試しください</p></div>';
    return;
  }
  container.innerHTML = filtered.map(l => {
    const inst = l.instructors;
    const shop = inst?.shops;
    const verified = inst?.is_verified ? '<svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:var(--teal);stroke:none;flex-shrink:0"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' : '';
    const thumb = l.image_url ? `<img src="${esc(l.image_url)}" alt="${esc(l.title)}" loading="lazy">` : '<div class="listing-thumb-ph"><svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M3 9a2 2 0 0 1 2-2h.93a2 2 0 0 0 1.664-.89l.812-1.22A2 2 0 0 1 10.07 4h3.86a2 2 0 0 1 1.664.89l.812 1.22A2 2 0 0 0 18.07 7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg></div>';
    const ratingHtml = shop?.avg_rating
      ? `<span class="meta-item" style="color:var(--warm)">★ ${parseFloat(shop.avg_rating).toFixed(1)}<span style="color:var(--on-dark-soft);margin-left:2px">(${esc(shop.review_count)})</span></span>`
      : '';
    return `<a class="listing-card" href="listing.html?id=${esc(l.instructor_id)}&listing=${esc(l.id)}">
      <div class="listing-thumb">${thumb}<span class="listing-badge ${badgeClass[l.intent]}">${badgeLabel[l.intent]}</span></div>
      <div class="listing-body">
        <span class="listing-category">${esc(l.category)}</span>
        <p class="listing-name">${esc(l.title)}</p>
        <div class="listing-meta">
          <span class="meta-item"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(l.area)}${l.location_detail ? '・' + esc(l.location_detail) : ''}</span>
          ${ratingHtml}
          ${(l.tags || []).slice(0,2).map(t => `<span class="meta-item">${esc(t)}</span>`).join('')}
        </div>
        <div class="listing-footer">
          <p class="listing-price">${l.price ? '¥' + l.price.toLocaleString() : '要相談'}<span>${l.price ? esc(l.price_unit || '') : ''}</span></p>
          <button class="instructor-btn" onclick="openInstructorModal('${esc(l.instructor_id)}', event)">${verified}${esc(inst?.name || '')}</button>
        </div>
      </div>
    </a>`;
  }).join('');
}

// ── URLパラメータで初期絞り込み（ホーム／ピラーページの検索バーから遷移） ──
function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  const q = p.get('q');
  const intent = p.get('intent');
  const area = p.get('area');
  if (q) document.getElementById('searchInput').value = q;
  if (intent && ['try','learn','dive'].includes(intent)) {
    currentIntent = intent;
    document.querySelectorAll('.intent-tab').forEach(t => t.classList.toggle('active', t.dataset.intent === intent));
    const lbl = document.getElementById('intentLabel');
    if (lbl) lbl.textContent = intentLabels[intent];
  }
  if (area) {
    const chip = [...document.querySelectorAll('#areaChips .chip')].find(c => c.dataset.area === area);
    if (chip) {
      document.querySelectorAll('#areaChips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentArea = area;
    }
  }
}

document.getElementById('searchInput').addEventListener('input', () => applyFilters());
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyFilters(); } });
applyUrlParams();
loadListings();
</script>
