<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探す — FreeDive Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --ocean-teal:  #1a7a8a;
  --abyss:       #04161f;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --foam:        #f0f9fb;
  --warm:        #f97316;
  --on-dark:         rgba(255,255,255,0.92);
  --on-dark-mid:     rgba(255,255,255,0.62);
  --on-dark-soft:    rgba(255,255,255,0.38);
  --hairline:        rgba(168,236,232,0.14);
  --glass:           rgba(255,255,255,0.045);
}
html { background: var(--abyss); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: linear-gradient(180deg,
    var(--ocean-mid) 0%,
    var(--ocean-deep) 22%,
    #06283a 55%,
    var(--abyss) 100%);
  background-attachment: fixed;
  color: var(--on-dark);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* ── header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6,32,46,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hairline);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 16px;
  font-weight: 600;
  color: var(--on-dark);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-decoration: none;
}
.logo span { color: var(--teal); }
.header-icons { display: flex; align-items: center; gap: 16px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--hairline);
  color: var(--on-dark-mid);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  text-decoration: none;
}
.icon-btn .icon { width: 18px; height: 18px; }

/* ── search hero ── */
.search-hero {
  padding: 36px 20px 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.search-hero-glow {
  position: absolute;
  top: -60%; left: 50%;
  width: 120%; height: 100%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(168,236,232,0.16) 0%, transparent 65%);
  pointer-events: none;
}
.search-hero-inner { position: relative; z-index: 2; }
.search-eyebrow {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--teal-light);
  margin-bottom: 12px;
}
.search-title {
  font-size: 22px;
  font-weight: 300;
  line-height: 1.5;
  letter-spacing: 0.04em;
  margin-bottom: 24px;
}
.search-title em { font-style: normal; font-weight: 500; color: var(--teal-light); }

/* ── search bar ── */
.search-bar-wrap {
  position: relative;
  max-width: 480px;
  margin: 0 auto;
}
.search-bar {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--hairline);
  border-radius: 100px;
  padding: 14px 52px 14px 48px;
  font-size: 14px;
  color: var(--on-dark);
  outline: none;
  backdrop-filter: blur(8px);
  transition: border-color 0.2s, background 0.2s;
}
.search-bar::placeholder { color: var(--on-dark-soft); }
.search-bar:focus { border-color: rgba(46,196,182,0.5); background: rgba(255,255,255,0.10); }
.search-icon-left {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--teal);
  pointer-events: none;
}
.search-icon-left .icon { width: 18px; height: 18px; }
.search-btn {
  position: absolute;
  right: 6px; top: 50%;
  transform: translateY(-50%);
  background: var(--teal);
  border: none;
  border-radius: 100px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--ocean-deep);
  transition: background 0.2s;
}
.search-btn:hover { background: var(--teal-light); }
.search-btn .icon { width: 16px; height: 16px; stroke-width: 2; }

/* ── main ── */
.main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px 80px;
}

/* ── intent tabs ── */
.intent-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.intent-tabs::-webkit-scrollbar { display: none; }
.intent-tab {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--hairline);
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  min-width: 100px;
}
.intent-tab.active {
  border-color: var(--teal);
  background: rgba(46,196,182,0.10);
}
.intent-tab-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(46,196,182,0.12);
  display: flex; align-items: center; justify-content: center;
  color: var(--teal-light);
}
.intent-tab.active .intent-tab-icon {
  background: rgba(46,196,182,0.22);
  color: var(--teal);
}
.intent-tab-icon .icon { width: 16px; height: 16px; }
.intent-tab-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--on-dark-mid);
  letter-spacing: 0.03em;
  text-align: center;
  line-height: 1.4;
  white-space: nowrap;
}
.intent-tab.active .intent-tab-label { color: var(--on-dark); }
.intent-tab-count {
  font-size: 10px;
  color: var(--on-dark-soft);
  font-family: ui-monospace, 'SF Mono', monospace;
}
.intent-tab.active .intent-tab-count { color: var(--teal-light); }

/* ── filter row ── */
.filter-section { margin-bottom: 20px; }
.filter-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--on-dark-soft);
  margin-bottom: 10px;
}
.chip-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 100px;
  border: 1px solid var(--hairline);
  background: transparent;
  font-size: 12px;
  color: var(--on-dark-mid);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
  white-space: nowrap;
}
.chip:hover { border-color: rgba(46,196,182,0.35); color: var(--on-dark); }
.chip.active {
  border-color: var(--teal);
  background: rgba(46,196,182,0.12);
  color: var(--on-dark);
}

/* ── divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.divider-line { flex: 1; height: 1px; background: var(--hairline); }
.divider-label {
  font-size: 11px;
  color: var(--on-dark-soft);
  letter-spacing: 0.08em;
}

/* ── result header ── */
.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.result-count {
  font-size: 12px;
  color: var(--on-dark-soft);
}
.result-count span { color: var(--teal-light); font-weight: 600; }
.sort-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--on-dark-mid);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 100px;
  border: 1px solid var(--hairline);
}
.sort-btn .icon { width: 14px; height: 14px; }

/* ── listing cards ── */
.listings { display: flex; flex-direction: column; gap: 12px; }

.listing-card {
  border-radius: 16px;
  border: 1px solid var(--hairline);
  background: var(--glass);
  overflow: hidden;
  display: flex;
  gap: 0;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-decoration: none;
  color: inherit;
}
.listing-card:hover {
  border-color: rgba(46,196,182,0.3);
  background: rgba(255,255,255,0.06);
}
.listing-thumb {
  width: 110px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.listing-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: saturate(0.9) brightness(0.85);
}
.listing-badge {
  position: absolute;
  top: 8px; left: 8px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 100px;
  backdrop-filter: blur(8px);
}
.badge-try { background: rgba(249,115,22,0.75); color: #fff; }
.badge-learn { background: rgba(46,196,182,0.75); color: var(--ocean-deep); }
.badge-dive { background: rgba(26,95,130,0.85); color: #fff; }
.badge-athlete { background: rgba(168,236,232,0.2); border: 1px solid rgba(168,236,232,0.4); color: var(--teal-light); }

.listing-body {
  flex: 1;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.listing-category {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--teal);
  font-weight: 500;
}
.listing-name {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--on-dark);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.listing-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--on-dark-soft);
}
.meta-item .icon { width: 12px; height: 12px; }
.listing-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
}
.listing-price {
  font-size: 13px;
  font-weight: 600;
  color: var(--on-dark);
}
.listing-price span { font-size: 11px; font-weight: 400; color: var(--on-dark-soft); }
.listing-rating {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--on-dark-mid);
}
.star-icon { color: #fbbf24; font-size: 12px; }

/* ── empty state ── */
.empty-state {
  text-align: center;
  padding: 60px 24px;
}
.empty-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: rgba(46,196,182,0.08);
  border: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: center;
  color: var(--teal);
  margin: 0 auto 18px;
}
.empty-icon .icon { width: 24px; height: 24px; }
.empty-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.empty-desc { font-size: 12px; color: var(--on-dark-soft); line-height: 1.8; }

/* ── bottom nav ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 90;
  background: rgba(6,32,46,0.85);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--hairline);
  display: flex;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-decoration: none;
  color: var(--on-dark-soft);
  cursor: pointer;
  background: none;
  border: none;
  transition: color 0.2s;
}
.nav-item.active { color: var(--teal); }
.nav-item .icon { width: 20px; height: 20px; }
.nav-label { font-size: 10px; letter-spacing: 0.05em; }

/* ── responsive ── */
@media (max-width: 480px) {
  .search-title { font-size: 19px; }
  .listing-thumb { width: 90px; }
  .listing-name { font-size: 13px; }
}
</style>
</head>

const intentLabels = {
  all: 'すべての体験・スクール',
  try: 'やってみたい — 体験・ツアー',
  learn: 'ちゃんと学びたい — スクール・資格',
  dive: 'もっと潜りたい — ファンダイブ・アスリート',
};
const intentCounts = { all: 42, try: 18, learn: 16, dive: 8 };

let currentIntent = 'all';

function setIntent(el, intent) {
  document.querySelectorAll('.intent-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentIntent = intent;
  document.getElementById('intentLabel').textContent = intentLabels[intent];
  document.getElementById('countNum').textContent = intentCounts[intent];
  renderListings();
}

function toggleChip(el, group) {
  if (group === 'area') {
    document.querySelectorAll('#areaChips .chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  } else {
    el.classList.toggle('active');
  }
  renderListings();
}

function doSearch() {
  renderListings();
}

const badgeClass = { try: 'badge-try', learn: 'badge-learn', dive: 'badge-dive', athlete: 'badge-athlete' };

function renderListings() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = LISTINGS.filter(l => {
    if (currentIntent !== 'all' && l.intent !== currentIntent) return false;
    if (q && !l.name.toLowerCase().includes(q) && !l.area.toLowerCase().includes(q) && !l.category.toLowerCase().includes(q)) return false;
    return true;
  });

  const container = document.getElementById('listings');
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <p class="empty-title">該当する結果がありません</p>
        <p class="empty-desc">条件を変えて<br>もう一度お試しください</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(l => `
    <a class="listing-card" href="#">
      <div class="listing-thumb">
        <img src="${l.image}" alt="${l.name}" loading="lazy">
        <span class="listing-badge ${badgeClass[l.badge]}">${l.badgeLabel}</span>
      </div>
      <div class="listing-body">
        <span class="listing-category">${l.category}</span>
        <p class="listing-name">${l.name}</p>
        <div class="listing-meta">
          <span class="meta-item">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${l.area}・${l.location}
          </span>
          ${l.tags.slice(0,2).map(t => `<span class="meta-item">${t}</span>`).join('')}
        </div>
        <div class="listing-footer">
          <p class="listing-price">¥${l.price.toLocaleString()}<span>${l.unit}</span></p>
          <p class="listing-rating"><span class="star-icon">★</span> ${l.rating} <span style="color:var(--on-dark-soft)">(${l.reviews})</span></p>
        </div>
      </div>
    </a>
  `).join('');
}

// init
renderListings();
</script>
