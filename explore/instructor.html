<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インストラクター詳細 — Freediving Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep:  #0b2d45;
  --ocean-mid:   #0e3d5c;
  --ocean-light: #1a5f82;
  --abyss:       #04161f;
  --teal:        #2ec4b6;
  --teal-light:  #a8ece8;
  --warm:        #f97316;
  --on-dark:         rgba(255,255,255,0.92);
  --on-dark-mid:     rgba(255,255,255,0.62);
  --on-dark-soft:    rgba(255,255,255,0.38);
  --hairline:        rgba(168,236,232,0.14);
  --glass:           rgba(255,255,255,0.045);
}
html { background: var(--abyss); }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: linear-gradient(180deg, var(--ocean-mid) 0%, var(--ocean-deep) 22%, #06283a 55%, var(--abyss) 100%); background-attachment: fixed; color: var(--on-dark); min-height: 100vh; -webkit-font-smoothing: antialiased; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* header */
.header { position: sticky; top: 0; z-index: 100; background: rgba(6,32,46,0.55); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 16px; font-weight: 600; color: var(--on-dark); letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; }
.logo span { color: var(--teal); }
.back-btn { display: flex; align-items: center; gap: 6px; color: var(--on-dark-mid); font-size: 13px; text-decoration: none; background: none; border: none; cursor: pointer; }
.back-btn .icon { width: 16px; height: 16px; }

/* gallery */
.gallery { position: relative; width: 100%; height: 260px; overflow: hidden; background: var(--ocean-mid); }
.gallery img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }
.gallery-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--on-dark-soft); }
.gallery-grad { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, rgba(4,22,31,0.8)); }
.badge-intent { position: absolute; top: 16px; left: 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; backdrop-filter: blur(8px); }
.badge-try { background: rgba(249,115,22,0.85); color: #fff; }
.badge-learn { background: rgba(46,196,182,0.85); color: var(--ocean-deep); }
.badge-dive { background: rgba(26,95,130,0.95); color: #fff; }

/* main */
.main { max-width: 640px; margin: 0 auto; padding: 0 16px 100px; }

/* listing header */
.listing-header { padding: 20px 0 16px; border-bottom: 1px solid var(--hairline); margin-bottom: 20px; }
.listing-category { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); font-weight: 500; margin-bottom: 8px; }
.listing-title { font-size: 20px; font-weight: 500; line-height: 1.45; margin-bottom: 12px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tag { font-size: 11px; padding: 4px 10px; border-radius: 100px; border: 1px solid var(--hairline); color: var(--on-dark-mid); }
.tag.tag-hot { border-color: rgba(249,115,22,0.4); color: var(--warm); }
.price-row { display: flex; align-items: baseline; gap: 6px; }
.price-main { font-size: 24px; font-weight: 700; color: var(--on-dark); }
.price-unit { font-size: 13px; color: var(--on-dark-soft); }

/* info grid */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.info-card { background: var(--glass); border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 14px; }
.info-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--on-dark-soft); margin-bottom: 4px; }
.info-value { font-size: 13px; font-weight: 500; color: var(--on-dark); }

/* section */
.section { margin-bottom: 24px; }
.section-title { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); font-weight: 500; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
.section-text { font-size: 14px; line-height: 1.85; color: var(--on-dark-mid); }

/* timeline (当日の流れ) */
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item { display: flex; gap: 14px; padding-bottom: 20px; position: relative; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-left { display: flex; flex-direction: column; align-items: center; gap: 0; }
.timeline-num { width: 28px; height: 28px; border-radius: 50%; background: rgba(46,196,182,0.15); border: 1px solid var(--teal); color: var(--teal); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.timeline-line { flex: 1; width: 1px; background: var(--hairline); margin-top: 4px; }
.timeline-item:last-child .timeline-line { display: none; }
.timeline-body { flex: 1; padding-top: 4px; }
.timeline-step-title { font-size: 13px; font-weight: 600; color: var(--on-dark); margin-bottom: 4px; }
.timeline-step-desc { font-size: 12px; color: var(--on-dark-mid); line-height: 1.7; }

/* items list */
.items-list { display: flex; flex-direction: column; gap: 6px; }
.items-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--on-dark-mid); line-height: 1.6; list-style: none; }
.items-list li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--teal); margin-top: 7px; flex-shrink: 0; }

/* info table */
.info-table { width: 100%; border-collapse: collapse; }
.info-table tr { border-bottom: 1px solid var(--hairline); }
.info-table tr:last-child { border-bottom: none; }
.info-table td { padding: 10px 0; font-size: 13px; vertical-align: top; }
.info-table td:first-child { color: var(--on-dark-soft); white-space: nowrap; padding-right: 16px; width: 40%; }
.info-table td:last-child { color: var(--on-dark-mid); }

/* instructor card */
.instructor-card { background: var(--glass); border: 1px solid var(--hairline); border-radius: 16px; padding: 16px; display: flex; gap: 14px; margin-bottom: 20px; cursor: pointer; transition: border-color 0.2s; }
.instructor-card:hover { border-color: rgba(46,196,182,0.3); }
.instructor-avatar { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--ocean-mid); }
.instructor-avatar img { width: 100%; height: 100%; object-fit: cover; }
.instructor-avatar-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--on-dark-soft); }
.instructor-info { flex: 1; min-width: 0; }
.instructor-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.instructor-name-text { font-size: 16px; font-weight: 600; }
.verified-badge { font-size: 10px; letter-spacing: 0.1em; background: rgba(46,196,182,0.15); border: 1px solid rgba(46,196,182,0.3); color: var(--teal); padding: 2px 8px; border-radius: 100px; white-space: nowrap; }
.instructor-area { font-size: 12px; color: var(--on-dark-soft); margin-bottom: 8px; }
.instructor-bio { font-size: 13px; color: var(--on-dark-mid); line-height: 1.7; }
.certs-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cert-chip { font-size: 10px; padding: 3px 8px; border-radius: 100px; border: 1px solid var(--hairline); color: var(--on-dark-soft); }

/* other listings */
.other-listings { display: flex; flex-direction: column; gap: 10px; }
.other-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--glass); border: 1px solid var(--hairline); border-radius: 12px; text-decoration: none; color: inherit; transition: border-color 0.2s; }
.other-card:hover { border-color: rgba(46,196,182,0.3); }
.other-card-thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--ocean-mid); }
.other-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.other-card-body { flex: 1; min-width: 0; }
.other-card-title { font-size: 13px; font-weight: 500; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
.other-card-price { font-size: 12px; color: var(--teal-light); font-weight: 600; }
.other-card-arrow { color: var(--on-dark-soft); flex-shrink: 0; }
.other-card-arrow .icon { width: 16px; height: 16px; }

/* ── 予約カレンダー ── */
.booking-section { background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
.booking-section-title { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); font-weight: 500; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }

/* calendar header */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-month-label { font-size: 15px; font-weight: 600; color: var(--on-dark); }
.cal-nav { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid var(--hairline); color: var(--on-dark-mid); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; }
.cal-nav:hover { background: rgba(255,255,255,0.12); }
.cal-nav .icon { width: 16px; height: 16px; }

/* calendar grid */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 10px; letter-spacing: 0.1em; color: var(--on-dark-soft); padding-bottom: 6px; }
.cal-dow.sun { color: rgba(249,115,22,0.7); }
.cal-dow.sat { color: rgba(46,196,182,0.7); }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 8px; cursor: default; transition: background 0.15s; position: relative; }
.cal-cell.has-slot { cursor: pointer; }
.cal-cell.has-slot:hover { background: rgba(46,196,182,0.12); }
.cal-cell.selected { background: rgba(46,196,182,0.20); border: 1px solid rgba(46,196,182,0.5); }
.cal-cell.past { opacity: 0.3; }
.cal-cell.today .cal-day { color: var(--teal); font-weight: 700; }
.cal-day { font-size: 12px; color: var(--on-dark-mid); line-height: 1; }
.cal-cell.sun-col .cal-day { color: rgba(249,115,22,0.8); }
.cal-cell.sat-col .cal-day { color: rgba(46,196,182,0.8); }
.cal-avail { font-size: 10px; line-height: 1; }
.cal-avail.open { color: var(--teal); }
.cal-avail.full { color: var(--on-dark-soft); }

/* time slots */
.time-slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.time-slot-btn { padding: 8px 16px; border-radius: 100px; border: 1px solid rgba(46,196,182,0.3); background: rgba(46,196,182,0.06); color: var(--teal-light); font-size: 13px; cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
.time-slot-btn:hover { background: rgba(46,196,182,0.15); }
.time-slot-btn.selected { background: var(--teal); color: var(--ocean-deep); border-color: var(--teal); font-weight: 600; }
.time-slot-btn.full { border-color: var(--hairline); color: var(--on-dark-soft); background: transparent; cursor: not-allowed; text-decoration: line-through; }

/* legend */
.cal-legend { display: flex; gap: 14px; margin-top: 12px; }
.cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--on-dark-soft); }
.cal-legend-mark { font-size: 11px; }

/* participant count */
.pax-selector { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
.pax-label { font-size: 13px; color: var(--on-dark-mid); }
.pax-controls { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.pax-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hairline); background: rgba(255,255,255,0.06); color: var(--on-dark); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; user-select: none; }
.pax-btn:hover { background: rgba(255,255,255,0.12); }
.pax-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.pax-count { font-size: 20px; font-weight: 700; color: var(--on-dark); min-width: 24px; text-align: center; }

/* booking form overlay */
.bform-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(4,22,31,0.8); backdrop-filter: blur(8px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.bform-overlay.open { opacity: 1; pointer-events: all; }
.bform-sheet { width: 100%; max-width: 640px; background: linear-gradient(180deg, #0d3348 0%, #091f2e 100%); border-top: 1px solid var(--hairline); border-radius: 22px 22px 0 0; padding: 0 0 40px; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,0.72,0,1); max-height: 90dvh; overflow-y: auto; }
.bform-overlay.open .bform-sheet { transform: translateY(0); }
.bform-drag { width: 40px; height: 4px; border-radius: 2px; background: rgba(168,236,232,0.25); margin: 12px auto 0; }
.bform-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--hairline); position: relative; }
.bform-close { position: absolute; top: 12px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--hairline); color: var(--on-dark-mid); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.bform-close .icon { width: 16px; height: 16px; }
.bform-title { font-size: 15px; font-weight: 600; }
.bform-summary { font-size: 12px; color: var(--teal-light); margin-top: 4px; }
.bform-body { padding: 20px 20px 0; }
.bform-group { margin-bottom: 14px; }
.bform-label { font-size: 11px; letter-spacing: 0.1em; color: var(--on-dark-soft); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.bform-label .req { color: var(--warm); font-size: 10px; }
.bform-input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: var(--on-dark); outline: none; transition: border-color 0.2s; font-family: inherit; }
.bform-input::placeholder { color: var(--on-dark-soft); }
.bform-input:focus { border-color: rgba(46,196,182,0.5); }
.bform-price-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); margin-bottom: 16px; }
.bform-price-label { font-size: 13px; color: var(--on-dark-mid); }
.bform-price-val { font-size: 22px; font-weight: 700; color: var(--on-dark); }
.bform-price-note { font-size: 11px; color: var(--on-dark-soft); }
.bform-submit { width: 100%; padding: 17px; background: var(--teal); border: none; border-radius: 14px; font-size: 16px; font-weight: 700; color: var(--ocean-deep); cursor: pointer; transition: background 0.2s; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.bform-submit:hover { background: var(--teal-light); }
.bform-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.bform-stripe-note { text-align: center; font-size: 11px; color: var(--on-dark-soft); margin-top: 10px; }

/* proceed btn */
.proceed-btn { width: 100%; padding: 16px; background: var(--teal); border: none; border-radius: 14px; font-size: 15px; font-weight: 700; color: var(--ocean-deep); cursor: pointer; transition: background 0.2s, opacity 0.2s; letter-spacing: 0.04em; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.proceed-btn:hover { background: var(--teal-light); }
.proceed-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* bottom nav */
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on-dark-soft); cursor: pointer; background: none; border: none; transition: color 0.2s; }
.nav-item.active { color: var(--teal); }
.nav-item .icon { width: 20px; height: 20px; }
.nav-label { font-size: 10px; letter-spacing: 0.05em; }

/* loading */
.page-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 16px; color: var(--on-dark-soft); }
.spinner { width: 32px; height: 32px; border: 2px solid var(--hairline); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } .info-grid { grid-template-columns: 1fr; } }

/* ── インストラクター モーダル ── */
.modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(4,22,31,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet { position: fixed; bottom: 0; left: 50%; z-index: 201; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 640px; background: linear-gradient(180deg, #0d3348 0%, #091f2e 100%); border-top: 1px solid var(--hairline); border-radius: 22px 22px 0 0; transition: transform 0.32s cubic-bezier(0.32,0.72,0,1); max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; }
.modal-sheet.open { transform: translateX(-50%) translateY(0); }
.modal-drag { width: 40px; height: 4px; border-radius: 2px; background: rgba(168,236,232,0.25); margin: 12px auto 0; }
.modal-close { position: absolute; top: 14px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--hairline); color: var(--on-dark-mid); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.modal-close .icon { width: 16px; height: 16px; }
.modal-body { padding: 8px 20px 40px; }
.m-profile { display: flex; align-items: center; gap: 16px; padding: 16px 0 20px; border-bottom: 1px solid var(--hairline); }
.m-avatar { width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0; object-fit: cover; border: 2px solid var(--hairline); background: var(--ocean-mid); }
.m-avatar-ph { width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0; background: var(--ocean-mid); border: 2px solid var(--hairline); display: flex; align-items: center; justify-content: center; color: var(--teal); }
.m-avatar-ph .icon { width: 30px; height: 30px; }
.m-info { flex: 1; min-width: 0; }
.m-name { font-size: 18px; font-weight: 600; color: var(--on-dark); display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.m-verified { display: inline-flex; align-items: center; gap: 3px; background: rgba(46,196,182,0.12); border: 1px solid rgba(46,196,182,0.3); border-radius: 100px; padding: 2px 8px; font-size: 10px; color: var(--teal); font-weight: 500; letter-spacing: 0.05em; flex-shrink: 0; }
.m-verified svg { width: 10px; height: 10px; fill: var(--teal); stroke: none; }
.m-location { font-size: 12px; color: var(--on-dark-mid); display: flex; align-items: center; gap: 5px; }
.m-location .icon { width: 12px; height: 12px; color: var(--teal); }
.m-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--hairline); }
.m-stat { text-align: center; }
.m-stat-val { font-size: 20px; font-weight: 700; color: var(--teal-light); font-family: ui-monospace, monospace; line-height: 1; margin-bottom: 4px; }
.m-stat-label { font-size: 10px; color: var(--on-dark-soft); letter-spacing: 0.08em; }
.m-section { padding: 18px 0; border-bottom: 1px solid var(--hairline); }
.m-section:last-of-type { border-bottom: none; }
.m-sec-title { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }
.m-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.m-chip { display: inline-block; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--hairline); font-size: 11px; color: var(--on-dark-mid); background: rgba(255,255,255,0.04); }
.m-chip.cert { border-color: rgba(46,196,182,0.25); color: var(--teal-light); background: rgba(46,196,182,0.07); }
.m-areas { display: flex; flex-wrap: wrap; gap: 7px; }
.m-area-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--hairline); font-size: 11px; color: var(--on-dark-mid); }
.m-area-badge .icon { width: 11px; height: 11px; color: var(--teal); }
.m-bio { font-size: 13px; color: var(--on-dark-mid); line-height: 1.85; }
.m-sns { display: flex; gap: 10px; flex-wrap: wrap; }
.m-sns-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 100px; border: 1px solid var(--hairline); font-size: 11px; color: var(--on-dark-mid); background: transparent; text-decoration: none; transition: border-color 0.2s; }
.m-sns-btn:hover { border-color: rgba(46,196,182,0.4); color: var(--on-dark); }
.m-sns-btn .icon { width: 14px; height: 14px; }
.m-cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; background: var(--teal); color: var(--ocean-deep); font-size: 14px; font-weight: 700; letter-spacing: 0.04em; border-radius: 14px; text-decoration: none; margin-top: 20px; border: none; cursor: pointer; transition: background 0.2s; }
.m-cta:hover { background: var(--teal-light); }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="back-btn">

<!-- 予約フォーム オーバーレイ -->

  <div class="bform-sheet" id="bformSheet">

    <div class="bform-head">
      <p class="bform-title">予約情報を入力</p>

        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="bform-body">
      <div class="bform-group">
        <label class="bform-label">お名前 <span class="req">*</span></label>

          <p class="bform-price-label" id="bformPriceLabel">合計金額</p>

        クレジットカードで支払う

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
const params = new URLSearchParams(location.search);
const instructorId = params.get('id');
const listingId    = params.get('listing');

if (!instructorId) {
  document.getElementById('pageContent').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--on-dark-soft)">インストラクターが見つかりませんでした。<br><a href="index.html" style="color:var(--teal)">一覧に戻る</a></div>';
} else {
  initPage();
}

async function initPage() {
  try {
    // インストラクター + 全リスティング + レビューを並列取得
    const [instRes, listRes, reviewRes] = await Promise.all([
      _sb.from('instructors').select('*, shops ( id, avg_rating, review_count, shop_type )').eq('id', instructorId).single(),
      _sb.from('listings').select('*').eq('instructor_id', instructorId).eq('is_public', true).order('sort_order'),
      _sb.from('reviews').select('id, rating, body, reviewer_name, created_at').eq('instructor_id', instructorId).eq('is_public', true).order('created_at', { ascending: false }).limit(10)
    ]);
    if (instRes.error) throw instRes.error;
    const instructor = instRes.data;
    const listings   = listRes.data || [];
    const reviews    = reviewRes.data || [];

    // 表示するリスティングを決定
    const activeListing = listingId
      ? listings.find(l => l.id === listingId) || listings[0]
      : listings[0];
    const otherListings = listings.filter(l => l.id !== activeListing?.id);

    window._pageInstructor = instructor;
    window._pageListingsCount = listings.length;
    window._activeListing = activeListing || null;
    renderPage(instructor, activeListing, otherListings, reviews);
    // カレンダー初期化（DOMレンダリング後）
    setTimeout(() => initCalendar(activeListing?.id || null), 0);
  } catch (err) {
    console.error(err);
    document.getElementById('pageContent').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--on-dark-soft)">読み込みに失敗しました。<br><a href="index.html" style="color:var(--teal)">一覧に戻る</a></div>';
  }
}

function renderPage(inst, listing, otherListings, reviews = []) {
  const badgeClass = { try: 'badge-try', learn: 'badge-learn', dive: 'badge-dive' };
  const badgeLabel = { try: '体験', learn: '資格', dive: 'ダイブ' };

  // gallery
  const galleryHtml = listing?.image_url
    ? `<img src="${listing.image_url}" alt="${listing.title}">`
    : `<div class="gallery-placeholder"><svg style="width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1.2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
  const badgeCls = listing ? badgeClass[listing.intent] : '';
  const badgeLbl = listing ? badgeLabel[listing.intent] : '';

  // basic info cards
  const infoCards = [
    listing?.min_age != null ? { label: '参加可能年齢', value: `${listing.min_age}歳〜` } : null,
    listing?.max_participants ? { label: '最大人数', value: `${listing.max_participants}名` } : null,
    listing?.duration_minutes ? { label: '所要時間', value: formatDuration(listing.duration_minutes) } : null,
    listing?.min_participants ? { label: '最少催行人数', value: `${listing.min_participants}名` } : null,
    { label: 'エリア', value: listing?.area || inst.prefecture || '—' },
    { label: '指導歴', value: inst.experience_years ? `${inst.experience_years}年` : '—' },
  ].filter(Boolean);

  // timeline
  const flowSteps = listing?.flow_steps || [];
  const timelineHtml = flowSteps.length > 0
    ? `<div class="timeline">${flowSteps.map((s, i) => `
        <div class="timeline-item">
          <div class="timeline-left">
            <div class="timeline-num">${i + 1}</div>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-body">
            <p class="timeline-step-title">${s.title || ''}</p>
            <p class="timeline-step-desc">${s.desc || ''}</p>
          </div>
        </div>`).join('')}</div>`
    : '';

  // required items
  const itemsHtml = (listing?.required_items || []).length > 0
    ? `<ul class="items-list">${(listing.required_items).map(i => `<li>${i}</li>`).join('')}</ul>`
    : '<p class="section-text" style="color:var(--on-dark-soft)">情報なし</p>';

  // cancellation
  const cancelHtml = listing?.cancellation_policy
    ? `<p class="section-text">${listing.cancellation_policy}</p>`
    : '<p class="section-text" style="color:var(--on-dark-soft)">お問い合わせください</p>';

  // other listings
  const otherHtml = otherListings.length > 0
    ? `<div class="other-listings">${otherListings.map(l => `
        <a class="other-card" href="instructor.html?id=${inst.id}&listing=${l.id}">
          <div class="other-card-thumb">${l.image_url ? `<img src="${l.image_url}" alt="${l.title}">` : ''}</div>
          <div class="other-card-body">
            <p class="other-card-title">${l.title}</p>
            <p class="other-card-price">${l.price ? '¥' + l.price.toLocaleString() + (l.price_unit || '') : '要相談'}</p>
          </div>
          <div class="other-card-arrow"><svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </a>`).join('')}</div>`
    : '<p style="font-size:13px;color:var(--on-dark-soft)">他のプランはありません</p>';

  document.title = `${inst.name} — Freediving Japan`;

  document.getElementById('pageContent').innerHTML = `
    <!-- gallery -->
    <div class="gallery">
      ${galleryHtml}
      <div class="gallery-grad"></div>
      ${listing ? `<span class="badge-intent ${badgeCls}">${badgeLbl}</span>` : ''}
    </div>

    <div class="main">
      <!-- listing header -->
      ${listing ? `
      <div class="listing-header">
        <p class="listing-category">${listing.category}</p>
        <h1 class="listing-title">${listing.title}</h1>
        ${(listing.tags || []).length > 0 ? `<div class="tag-row">${listing.tags.map(t => `<span class="tag${t.includes('OK') ? ' tag-hot' : ''}">${t}</span>`).join('')}</div>` : ''}
        <div class="price-row">
          <span class="price-main">${listing.price ? '¥' + listing.price.toLocaleString() : '要相談'}</span>
          ${listing.price ? `<span class="price-unit">${listing.price_unit || ''}</span>` : ''}
        </div>
      </div>` : ''}

      <!-- basic info grid -->
      ${infoCards.length > 0 ? `
      <div class="info-grid">
        ${infoCards.map(c => `<div class="info-card"><p class="info-label">${c.label}</p><p class="info-value">${c.value}</p></div>`).join('')}
      </div>` : ''}

      <!-- description -->
      ${listing?.description ? `
      <div class="section">
        <p class="section-title">このプランについて</p>
        <p class="section-text">${listing.description.replace(/\n/g, '<br>')}</p>
      </div>` : ''}

      <!-- timeline -->
      ${flowSteps.length > 0 ? `
      <div class="section">
        <p class="section-title">当日の流れ</p>
        ${timelineHtml}
      </div>` : ''}

      <!-- meeting location -->
      ${listing?.meeting_location ? `
      <div class="section">
        <p class="section-title">集合場所</p>
        <table class="info-table">
          <tr><td>集合場所</td><td>${listing.meeting_location}</td></tr>
        </table>
      </div>` : ''}

      <!-- required items -->
      <div class="section">
        <p class="section-title">持ち物・服装</p>
        ${itemsHtml}
      </div>

      <!-- notes -->
      ${listing?.notes ? `
      <div class="section">
        <p class="section-title">注意事項</p>
        <p class="section-text">${listing.notes.replace(/\n/g, '<br>')}</p>
      </div>` : ''}

      <!-- cancellation -->
      <div class="section">
        <p class="section-title">キャンセルポリシー</p>
        ${cancelHtml}
      </div>

      <!-- instructor -->
      <div class="section">
        <p class="section-title">インストラクター</p>
        <div class="instructor-card" onclick="openInstructorModal(event)" role="button" aria-label="${inst.name} のプロフィールを見る">
          <div class="instructor-avatar">
            ${inst.photo_url
              ? `<img src="${inst.photo_url}" alt="${inst.name}">`
              : `<div class="instructor-avatar-ph"><svg style="width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.4" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`}
          </div>
          <div class="instructor-info">
            <div class="instructor-name-row">
              <span class="instructor-name-text">${inst.name}</span>
              ${inst.is_verified ? '<span class="verified-badge">✓ 認証済み</span>' : ''}
            </div>
            <p class="instructor-area">${[inst.prefecture, inst.city].filter(Boolean).join(' ')}${(inst.areas || []).length ? ' ／ ' + inst.areas.join('・') : ''}</p>
            ${inst.bio ? `<p class="instructor-bio">${inst.bio}</p>` : ''}
            ${(inst.certifications || []).length > 0 ? `<div class="certs-row">${inst.certifications.map(c => `<span class="cert-chip">${c}</span>`).join('')}</div>` : ''}
          </div>
        </div>
      </div>

      <!-- other listings -->
      ${otherListings.length > 0 ? `
      <div class="section">
        <p class="section-title">${inst.name} の他のプラン</p>
        ${otherHtml}
      </div>` : ''}

      <!-- reviews -->
      <div class="section" id="reviewsSection">
        <p class="section-title">レビュー${inst.shops?.avg_rating ? ` ★ ${parseFloat(inst.shops.avg_rating).toFixed(1)}（${inst.shops.review_count}件）` : ''}</p>
        ${reviews.length > 0
          ? `<div style="display:flex;flex-direction:column;gap:12px">
              ${reviews.map(r => `
                <div style="background:var(--glass);border:1px solid var(--hairline);border-radius:12px;padding:14px">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                    <span style="color:var(--warm);font-size:14px">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                    <span style="font-size:11px;color:var(--on-dark-soft)">${r.reviewer_name || '匿名'}</span>
                    <span style="font-size:11px;color:var(--on-dark-soft);margin-left:auto">${new Date(r.created_at).toLocaleDateString('ja-JP')}</span>
                  </div>
                  ${r.body ? `<p style="font-size:13px;color:var(--on-dark-mid);line-height:1.7">${r.body}</p>` : ''}
                </div>`).join('')}
            </div>`
          : `<p style="font-size:13px;color:var(--on-dark-soft)">まだレビューがありません</p>`}
      </div>

      <!-- booking calendar -->
      <div class="booking-section" id="bookingSection">
        <p class="booking-section-title">日程・空き状況</p>

        <!-- calendar -->
        <div class="cal-header">
          <button class="cal-nav" id="calPrev" onclick="calShift(-1)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="cal-nav" id="calNext" onclick="calShift(1)">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <div class="cal-legend-item"><span class="cal-legend-mark" style="color:var(--teal)">○</span> 空きあり</div>
          <div class="cal-legend-item"><span class="cal-legend-mark" style="color:var(--on-dark-soft)">×</span> 満席</div>
          <div class="cal-legend-item"><span class="cal-legend-mark" style="color:var(--on-dark-soft)">—</span> 設定なし</div>
        </div>

        <!-- time slots（日付選択後に表示） -->
        <div id="timeSlotsWrap" style="display:none">
          <p style="font-size:11px;letter-spacing:0.12em;color:var(--on-dark-soft);margin-top:18px;margin-bottom:6px">開始時間を選択</p>
          <div class="time-slots" id="timeSlots"></div>
        </div>

        <!-- participant count（スロット選択後に表示） -->
        <div id="paxWrap" style="display:none">
          <div class="pax-selector">
            <span class="pax-label">参加人数</span>
            <div class="pax-controls">
              <button class="pax-btn" id="paxMinus" onclick="changePax(-1)">−</button>
              <span class="pax-count" id="paxCount">1</span>
              <button class="pax-btn" id="paxPlus"  onclick="changePax(1)">＋</button>
            </div>
          </div>
          <button class="proceed-btn" onclick="openBookingForm()">
            予約手続きへ進む
            <svg style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>

    </div><!-- /main -->
  `;

}

/* ── インストラクター モーダル ── */
function openInstructorModal(e) {
  if (e) { e.stopPropagation(); }
  const inst = window._pageInstructor;
  if (!inst) return;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalSheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderModal(inst);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalSheet').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderModal(inst) {
  const areas = (inst.areas || []);
  const certs = (inst.certifications || []);
  const specs = (inst.specialties || []);
  const listingCount = window._pageListingsCount || 0;

  const avatarHtml = inst.photo_url
    ? `<img class="m-avatar" src="${inst.photo_url}" alt="${inst.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` +
      `<div class="m-avatar-ph" style="display:none"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`
    : `<div class="m-avatar-ph"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;

  const verifiedBadge = inst.is_verified
    ? `<span class="m-verified"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>認定済み</span>` : '';

  const locationParts = [inst.prefecture, inst.city].filter(Boolean).join(' ');

  const snsHtml = [
    inst.instagram_url ? `<a class="m-sns-btn" href="${inst.instagram_url}" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Instagram</a>` : '',
    inst.youtube_url  ? `<a class="m-sns-btn" href="${inst.youtube_url}" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>YouTube</a>` : '',
    inst.website_url  ? `<a class="m-sns-btn" href="${inst.website_url}" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>ウェブサイト</a>` : '',
  ].filter(Boolean).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="m-profile">
      ${avatarHtml}
      <div class="m-info">
        <div class="m-name">${inst.name}${verifiedBadge}</div>
        ${locationParts ? `<div class="m-location"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${locationParts}</div>` : ''}
      </div>
    </div>
    <div class="m-stats">
      <div class="m-stat">
        <div class="m-stat-val">${inst.experience_years != null ? inst.experience_years : '—'}<span style="font-size:12px;font-weight:400;color:var(--on-dark-soft)"> 年</span></div>
        <div class="m-stat-label">指導歴</div>
      </div>
      <div class="m-stat">
        <div class="m-stat-val">${listingCount}</div>
        <div class="m-stat-label">プラン数</div>
      </div>
      <div class="m-stat">
        <div class="m-stat-val">${certs.length || '—'}</div>
        <div class="m-stat-label">保有資格</div>
      </div>
    </div>
    ${certs.length ? `<div class="m-section"><p class="m-sec-title">保有資格</p><div class="m-chips">${certs.map(c => `<span class="m-chip cert">${c}</span>`).join('')}</div></div>` : ''}
    ${specs.length ? `<div class="m-section"><p class="m-sec-title">専門・得意分野</p><div class="m-chips">${specs.map(s => `<span class="m-chip">${s}</span>`).join('')}</div></div>` : ''}
    ${areas.length ? `<div class="m-section"><p class="m-sec-title">活動エリア</p><div class="m-areas">${areas.map(a => `<span class="m-area-badge"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${a}</span>`).join('')}</div></div>` : ''}
    ${inst.bio ? `<div class="m-section"><p class="m-sec-title">自己紹介</p><p class="m-bio">${inst.bio}</p></div>` : ''}
    ${snsHtml ? `<div class="m-section"><p class="m-sec-title">リンク</p><div class="m-sns">${snsHtml}</div></div>` : ''}
    <button class="m-cta" onclick="closeModal(); document.getElementById('bookingSection').scrollIntoView({behavior:'smooth'})">
      体験を予約する
      <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  `;
}


function formatDuration(minutes) {
  if (minutes < 60) return `${minutes}分`;
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m > 0 ? `${h}時間${m}分` : `${h}時間`;
}

/* ══════════════════════════════════════════════
   予約カレンダー
══════════════════════════════════════════════ */
let _calYear, _calMonth;       // 表示中の年月
let _slotsMap = {};            // { 'YYYY-MM-DD': [slot, ...] }
let _selectedDate = null;
let _selectedSlot = null;
let _paxCount = 1;

async function initCalendar(listingId) {
  const now = new Date();
  _calYear  = now.getFullYear();
  _calMonth = now.getMonth(); // 0-based

  // Supabase から2ヶ月分の空き枠を取得
  const from = `${_calYear}-${String(_calMonth + 1).padStart(2,'0')}-01`;
  const toDate = new Date(_calYear, _calMonth + 2, 1);
  const to = toDate.toISOString().slice(0,10);

  let query = _sb.from('availability_slots')
    .select('*')
    .gte('slot_date', from)
    .lt('slot_date', to)
    .eq('is_active', true)
    .order('slot_date')
    .order('start_time');

  if (listingId) query = query.eq('listing_id', listingId);
  else query = query.eq('instructor_id', instructorId);

  const { data, error } = await query;
  if (error) { console.error('slots fetch error', error); }

  _slotsMap = {};
  (data || []).forEach(s => {
    (_slotsMap[s.slot_date] = _slotsMap[s.slot_date] || []).push(s);
  });

  renderCal();
}

function renderCal() {
  const DAYS = ['日','月','火','水','木','金','土'];
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  document.getElementById('calMonthLabel').textContent =
    `${_calYear}年 ${monthNames[_calMonth]}`;

  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(_calYear, _calMonth, 1).getDay();
  const daysInMonth = new Date(_calYear, _calMonth + 1, 0).getDate();

  let html = DAYS.map((d,i) =>
    `<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${d}</div>`).join('');

  // 空白セル
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(_calYear, _calMonth, d);
    const dateStr = date.toISOString().slice(0,10);
    const dow = date.getDay();
    const isPast = date < today;
    const isToday = date.getTime() === today.getTime();
    const slots = _slotsMap[dateStr] || [];
    const available = slots.filter(s => s.booked_count < s.max_participants);
    const hasSlot = slots.length > 0;
    const isFull  = hasSlot && available.length === 0;
    const isSelected = dateStr === _selectedDate;

    const dowClass = dow === 0 ? ' sun-col' : dow === 6 ? ' sat-col' : '';
    const stateClass = isPast ? ' past' : hasSlot ? ' has-slot' : '';
    const todayCls = isToday ? ' today' : '';
    const selCls   = isSelected ? ' selected' : '';
    const onclick  = (!isPast && hasSlot) ? `onclick="selectDate('${dateStr}')"` : '';

    const availMark = !hasSlot ? '' : isFull
      ? `<span class="cal-avail full">×</span>`
      : `<span class="cal-avail open">○</span>`;

    html += `<div class="cal-cell${stateClass}${dowClass}${todayCls}${selCls}" ${onclick}>
      <span class="cal-day">${d}</span>${availMark}
    </div>`;
  }

  document.getElementById('calGrid').innerHTML = html;

  // 月移動ボタンの制御（過去月には戻れない）
  const now = new Date();
  document.getElementById('calPrev').disabled =
    (_calYear === now.getFullYear() && _calMonth <= now.getMonth());
}

function calShift(delta) {
  _calMonth += delta;
  if (_calMonth < 0)  { _calMonth = 11; _calYear--; }
  if (_calMonth > 11) { _calMonth = 0;  _calYear++; }
  _selectedDate = null;
  _selectedSlot = null;
  document.getElementById('timeSlotsWrap').style.display = 'none';
  document.getElementById('paxWrap').style.display = 'none';
  renderCal();

  // 新しい月のスロットを追加取得
  fetchMonthSlots(_calYear, _calMonth);
}

async function fetchMonthSlots(year, month) {
  const from = `${year}-${String(month + 1).padStart(2,'0')}-01`;
  const to = new Date(year, month + 1, 1).toISOString().slice(0,10);

  const lid = window._activeListing?.id;
  let query = _sb.from('availability_slots')
    .select('*').gte('slot_date', from).lt('slot_date', to)
    .eq('is_active', true).order('slot_date').order('start_time');
  if (lid) query = query.eq('listing_id', lid);
  else query = query.eq('instructor_id', instructorId);

  const { data } = await query;
  (data || []).forEach(s => {
    (_slotsMap[s.slot_date] = _slotsMap[s.slot_date] || []).push(s);
  });
  renderCal();
}

function selectDate(dateStr) {
  _selectedDate = dateStr;
  _selectedSlot = null;
  _paxCount = 1;
  document.getElementById('paxWrap').style.display = 'none';
  renderCal();
  renderTimeSlots(dateStr);
}

function renderTimeSlots(dateStr) {
  const slots = _slotsMap[dateStr] || [];
  const wrap = document.getElementById('timeSlotsWrap');
  const container = document.getElementById('timeSlots');

  if (!slots.length) { wrap.style.display = 'none'; return; }

  container.innerHTML = slots.map(s => {
    const isFull = s.booked_count >= s.max_participants;
    const remaining = s.max_participants - s.booked_count;
    const label = `${s.start_time.slice(0,5)}〜${s.end_time.slice(0,5)}`;
    const subLabel = isFull ? '満席' : `残${remaining}名`;
    const cls = isFull ? 'full' : (_selectedSlot?.id === s.id ? 'selected' : '');
    return `<button class="time-slot-btn ${cls}" ${isFull ? 'disabled' : ''} onclick="selectSlot('${s.id}')">
      ${label}<br><span style="font-size:10px;opacity:0.7">${subLabel}</span>
    </button>`;
  }).join('');

  wrap.style.display = 'block';
}

function selectSlot(slotId) {
  const dateStr = _selectedDate;
  _selectedSlot = (_slotsMap[dateStr] || []).find(s => s.id === slotId);
  if (!_selectedSlot) return;
  _paxCount = 1;
  document.getElementById('paxCount').textContent = _paxCount;
  document.getElementById('paxMinus').disabled = true;
  document.getElementById('paxPlus').disabled = (_selectedSlot.max_participants - _selectedSlot.booked_count) <= 1;
  document.getElementById('paxWrap').style.display = 'block';
  renderTimeSlots(dateStr); // re-render to show selected state
}

function changePax(delta) {
  if (!_selectedSlot) return;
  const max = _selectedSlot.max_participants - _selectedSlot.booked_count;
  _paxCount = Math.max(1, Math.min(max, _paxCount + delta));
  document.getElementById('paxCount').textContent = _paxCount;
  document.getElementById('paxMinus').disabled = _paxCount <= 1;
  document.getElementById('paxPlus').disabled  = _paxCount >= max;
}

/* ── 予約フォーム ── */
function openBookingForm() {
  if (!_selectedSlot) return;
  const listing = window._activeListing;
  const price = listing?.price || 0;
  const total = price * _paxCount;
  const d = new Date(_selectedDate + 'T00:00:00');
  const dateLabel = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const timeLabel = `${_selectedSlot.start_time.slice(0,5)}〜${_selectedSlot.end_time.slice(0,5)}`;

  document.getElementById('bformSummary').textContent =
    `${dateLabel} ${timeLabel} ／ ${_paxCount}名`;
  document.getElementById('bformPriceLabel').textContent =
    `¥${price.toLocaleString()} × ${_paxCount}名`;
  document.getElementById('bformPriceVal').textContent =
    total > 0 ? `¥${total.toLocaleString()}` : '要相談';

  document.getElementById('bformOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeBookingForm() {
  document.getElementById('bformOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeBformOnBg(e) {
  if (e.target === document.getElementById('bformOverlay')) closeBookingForm();
}

async function proceedToCheckout() {
  const name  = document.getElementById('bf-name').value.trim();
  const email = document.getElementById('bf-email').value.trim();
  if (!name || !email) { alert('お名前とメールアドレスを入力してください。'); return; }

  const btn = document.getElementById('bformSubmit');
  btn.disabled = true;
  btn.textContent = '処理中...';

  try {
    const res = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slotId:           _selectedSlot.id,
        listingId:        window._activeListing?.id || null,
        instructorId:     instructorId,
        guestName:        name,
        guestEmail:       email,
        guestPhone:       document.getElementById('bf-phone').value.trim() || null,
        notes:            document.getElementById('bf-notes').value.trim() || null,
        participantCount: _paxCount,
      }),
    });
    const { url, error } = await res.json();
    if (error) throw new Error(error);
    window.location.href = url; // Stripe Checkout へリダイレクト
  } catch (err) {
    console.error(err);
    alert('エラーが発生しました。もう一度お試しください。');
    btn.disabled = false;
    btn.innerHTML = '<svg style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> クレジットカードで支払う';
  }
}
</script>
