<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロフィール — Freediving Japan</title>
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/home.css">
<style>
* { box-sizing: border-box; }
body { min-height: 100vh; }

/* header */
.header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.back-btn { display: flex; align-items: center; gap: 6px; color: var(--ink-mid); font-size: 13px; font-weight: 600; text-decoration: none; background: none; border: none; cursor: pointer; transition: color 0.15s; }
.back-btn:hover { color: var(--ink); }
.back-btn .icon { width: 16px; height: 16px; }

.main { max-width: 640px; margin: 0 auto; padding: 0 16px 80px; }

/* cover + avatar */
.cover { width: 100%; height: 180px; background: #f0f0f2; position: relative; overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); background: linear-gradient(135deg, rgba(31,111,120,0.10), rgba(31,111,120,0.04)); }
.hero { padding: 0 16px; margin-bottom: 24px; }
.hero-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; gap: 16px; margin-top: -36px; position: relative; }
.avatar { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #fff; background: #f0f0f2; flex-shrink: 0; overflow: hidden; box-shadow: var(--shadow-card); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--teal-deep); font-size: 28px; font-weight: 700; }
.hero-meta { flex: 1; min-width: 0; padding-bottom: 4px; }
.type-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal-deep); font-weight: 700; margin-bottom: 4px; }
.hero-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero-name { font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.verified-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; background: rgba(31,111,120,0.10); border: 1px solid rgba(31,111,120,0.3); color: var(--teal-deep); padding: 2px 8px; border-radius: 100px; white-space: nowrap; }
.hero-location { font-size: 12px; color: var(--ink-soft); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.hero-location .icon { width: 12px; height: 12px; color: var(--teal-deep); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
.stat { text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; }
.stat-val { font-size: 18px; font-weight: 700; color: var(--teal-deep); font-family: ui-monospace, monospace; line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.04em; }

/* section */
.section { margin: 0 0 24px; }
.section-title { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal-deep); font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.section-text { font-size: 14px; line-height: 1.85; color: var(--ink-mid); white-space: pre-wrap; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip-item { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 100px; border: 1px solid var(--line); font-size: 11px; color: var(--ink-mid); }
.chip-item.cert { border-color: rgba(31,111,120,0.28); color: var(--teal-deep); background: rgba(31,111,120,0.06); }
.chip-item .icon { width: 11px; height: 11px; color: var(--teal-deep); }

/* roster / course cards (people list style, shared) */
.people-list { display: flex; flex-direction: column; gap: 12px; }
.person-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 14px; text-decoration: none; color: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
.person-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); }
.person-avatar { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #f0f0f2; }
.person-avatar img { width: 100%; height: 100%; object-fit: cover; }
.person-avatar-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); }
.person-info { flex: 1; min-width: 0; }
.person-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.person-name { font-size: 14px; font-weight: 700; color: var(--ink); }
.person-area { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
.person-bio { font-size: 12px; color: var(--ink-mid); line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* course cards */
.course-list { display: flex; flex-direction: column; gap: 10px; }
.course-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
.course-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); }
.course-thumb { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: #f0f0f2; }
.course-thumb img { width: 100%; height: 100%; object-fit: cover; }
.course-body { flex: 1; min-width: 0; }
.course-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
.course-price { font-size: 12px; color: var(--teal-deep); font-weight: 700; }
.course-arrow { color: var(--ink-soft); flex-shrink: 0; }
.course-arrow .icon { width: 16px; height: 16px; }

.sns-row { display: flex; gap: 10px; flex-wrap: wrap; }
.sns-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 100px; border: 1px solid var(--line-strong); font-size: 11px; color: var(--ink-mid); background: transparent; text-decoration: none; transition: border-color 0.2s, color 0.2s; }
.sns-btn:hover { border-color: var(--ink); color: var(--ink); }
.sns-btn .icon { width: 14px; height: 14px; }

.empty-text { font-size: 13px; color: var(--ink-soft); }

.page-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 16px; color: var(--ink-soft); }
.spinner { width: 32px; height: 32px; border: 2px solid var(--line); border-top-color: var(--teal-deep); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <a href="shops.html" class="back-btn">
    <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    ショップ・インストラクターを探す
  </a>
  <a href="../index.html" class="logo">FREEDIVING <span>JAPAN</span></a>
</header>

<div id="pageContent">
  <div class="page-loading">
    <div class="spinner"></div>
    <span>読み込み中...</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
const params      = new URLSearchParams(location.search);
const instructorId = params.get('id');
const shopId        = !instructorId ? params.get('shop') : null;
const isShopOwner    = !instructorId && !!shopId;

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escNl(s) { return esc(s).replace(/\n/g, '<br>'); }
function safeUrl(u) {
  if (!u) return '';
  try {
    const parsed = new URL(u, location.href);
    return (parsed.protocol === 'http:' || parsed.protocol === 'https:') ? parsed.href : '';
  } catch { return ''; }
}

// listing.html へのリンク用クエリ（このオーナー名義で特定コースを見る）
function listingQuery(listingId) {
  const owner = isShopOwner ? `shop=${esc(shopId)}` : `id=${esc(instructorId)}`;
  return `listing.html?${owner}&listing=${esc(listingId)}`;
}
function profileQuery(id) { return `profile.html?id=${esc(id)}`; }

if (!instructorId && !shopId) {
  document.getElementById('pageContent').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--ink-soft)">インストラクター・ショップが見つかりませんでした。<br><a href="shops.html" style="color:var(--teal-deep)">一覧に戻る</a></div>';
} else {
  initPage();
}

async function initPage() {
  try {
    const [ownerRes, listRes, reviewRes, rosterRes] = isShopOwner
      ? await Promise.all([
          _sb.from('shops').select('*').eq('id', shopId).single(),
          _sb.from('listings').select('*').eq('shop_id', shopId).eq('is_public', true).order('sort_order'),
          _sb.from('reviews').select('id, rating, body, reviewer_name, created_at').eq('shop_id', shopId).eq('is_public', true).order('created_at', { ascending: false }).limit(10),
          _sb.from('instructor_shops').select('instructors ( id, name, bio, photo_url, areas, prefecture, city, is_verified )').eq('shop_id', shopId),
        ])
      : await Promise.all([
          _sb.from('instructors').select('*, shops ( id, avg_rating, review_count )').eq('id', instructorId).single(),
          _sb.from('listings').select('*').eq('instructor_id', instructorId).eq('is_public', true).order('sort_order'),
          _sb.from('reviews').select('id, rating, body, reviewer_name, created_at').eq('instructor_id', instructorId).eq('is_public', true).order('created_at', { ascending: false }).limit(10),
          _sb.from('instructor_shops').select('shops ( id, name, logo_url, areas, prefecture, city, bio, is_verified, avg_rating, review_count )').eq('instructor_id', instructorId),
        ]);
    if (ownerRes.error) throw ownerRes.error;

    const raw = ownerRes.data;
    const owner = isShopOwner
      ? {
          type: 'shop', id: raw.id, name: raw.name, photo: raw.logo_url, cover: raw.cover_url, coverPosition: raw.cover_position || '50% 50%',
          is_verified: raw.is_verified, prefecture: raw.prefecture, city: raw.city,
          areas: raw.areas || [], bio: raw.bio,
          website_url: raw.website_url, instagram_url: raw.instagram_url, youtube_url: raw.youtube_url,
          avg_rating: raw.avg_rating, review_count: raw.review_count,
        }
      : {
          type: 'instructor', id: raw.id, name: raw.name, photo: raw.photo_url, cover: null,
          is_verified: raw.is_verified, prefecture: raw.prefecture, city: raw.city,
          areas: raw.areas || [], bio: raw.bio,
          certifications: raw.certifications || [], specialties: raw.specialties || [],
          experience_years: raw.experience_years,
          website_url: raw.website_url, instagram_url: raw.instagram_url, youtube_url: raw.youtube_url,
          avg_rating: raw.shops?.avg_rating, review_count: raw.shops?.review_count,
        };

    const listings = listRes.data || [];
    const reviews  = reviewRes.data || [];
    const roster   = isShopOwner
      ? (rosterRes?.data || []).map(r => r.instructors).filter(Boolean)
      : (rosterRes?.data || []).map(r => r.shops).filter(Boolean);

    renderPage(owner, listings, reviews, roster);
  } catch (err) {
    console.error(err);
    document.getElementById('pageContent').innerHTML = '<div class="main" style="padding-top:40px;text-align:center;color:var(--ink-soft)">読み込みに失敗しました。<br><a href="shops.html" style="color:var(--teal-deep)">一覧に戻る</a></div>';
  }
}

function renderPage(owner, listings, reviews, roster) {
  document.title = `${owner.name} — Freediving Japan`;

  const coverHtml = owner.cover
    ? `<img src="${esc(owner.cover)}" alt="${esc(owner.name)}" style="object-position:${esc(owner.coverPosition || '50% 50%')};">`
    : `<div class="cover-placeholder"><svg style="width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;

  const avatarHtml = owner.photo
    ? `<img src="${esc(owner.photo)}" alt="${esc(owner.name)}">`
    : `<div class="avatar-ph">${esc((owner.name || '?').charAt(0))}</div>`;

  const verifiedBadge = owner.is_verified
    ? `<span class="verified-badge">✓ 認証済み</span>` : '';

  const locationParts = esc([owner.prefecture, owner.city].filter(Boolean).join(' '));

  const statsHtml = owner.type === 'instructor'
    ? `
      <div class="stat"><div class="stat-val">${owner.experience_years != null ? esc(owner.experience_years) : '—'}</div><div class="stat-label">指導歴（年）</div></div>
      <div class="stat"><div class="stat-val">${listings.length}</div><div class="stat-label">プラン数</div></div>
      <div class="stat"><div class="stat-val">${(owner.certifications || []).length || '—'}</div><div class="stat-label">保有資格</div></div>`
    : `
      <div class="stat"><div class="stat-val">${listings.length}</div><div class="stat-label">取り扱いコース</div></div>
      <div class="stat"><div class="stat-val">${roster.length}</div><div class="stat-label">在籍インストラクター</div></div>
      <div class="stat"><div class="stat-val">${owner.avg_rating ? parseFloat(owner.avg_rating).toFixed(1) : '—'}</div><div class="stat-label">評価</div></div>`;

  const certsHtml = (owner.certifications || []).length
    ? `<div class="section"><p class="section-title">保有資格</p><div class="chips">${owner.certifications.map(c => `<span class="chip-item cert">${esc(c)}</span>`).join('')}</div></div>` : '';
  const specsHtml = (owner.specialties || []).length
    ? `<div class="section"><p class="section-title">専門・得意分野</p><div class="chips">${owner.specialties.map(s => `<span class="chip-item">${esc(s)}</span>`).join('')}</div></div>` : '';
  const areasHtml = (owner.areas || []).length
    ? `<div class="section"><p class="section-title">活動エリア</p><div class="chips">${owner.areas.map(a => `<span class="chip-item"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(a)}</span>`).join('')}</div></div>` : '';

  const snsLinks = [
    owner.instagram_url ? { url: owner.instagram_url, label: 'Instagram', icon: '<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>' } : null,
    owner.youtube_url  ? { url: owner.youtube_url,  label: 'YouTube',   icon: '<svg class="icon" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>' } : null,
    owner.website_url  ? { url: owner.website_url,  label: 'ウェブサイト', icon: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' } : null,
  ].filter(Boolean).map(l => {
    const safe = safeUrl(l.url);
    return safe ? `<a class="sns-btn" href="${esc(safe)}" target="_blank" rel="noopener">${l.icon}${l.label}</a>` : '';
  }).join('');
  const snsHtml = snsLinks ? `<div class="section"><p class="section-title">リンク</p><div class="sns-row">${snsLinks}</div></div>` : '';

  // 在籍インストラクター（ショップ）／ 所属ショップ（インストラクター）
  const rosterTitle = owner.type === 'shop' ? '在籍インストラクター' : '所属ショップ';
  const rosterHtml = roster.length
    ? `<div class="section"><p class="section-title">${rosterTitle}</p><div class="people-list">${roster.map(p => `
        <a class="person-card" href="${owner.type === 'shop' ? profileQuery(p.id) : `profile.html?shop=${esc(p.id)}`}">
          <div class="person-avatar">${(p.photo_url || p.logo_url)
            ? `<img src="${esc(p.photo_url || p.logo_url)}" alt="${esc(p.name)}">`
            : `<div class="person-avatar-ph"><svg style="width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.4" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`}</div>
          <div class="person-info">
            <div class="person-name-row">
              <span class="person-name">${esc(p.name)}</span>
              ${p.is_verified ? '<span class="verified-badge">✓ 認証済み</span>' : ''}
            </div>
            <p class="person-area">${esc([p.prefecture, p.city].filter(Boolean).join(' '))}${(p.areas || []).length ? ' ／ ' + esc(p.areas.join('・')) : ''}</p>
            ${p.bio ? `<p class="person-bio">${esc(p.bio)}</p>` : ''}
          </div>
        </a>`).join('')}</div></div>`
    : '';

  // 取り扱いコース一覧
  const coursesHtml = listings.length
    ? `<div class="section"><p class="section-title">取り扱いコース一覧</p><div class="course-list">${listings.map(l => `
        <a class="course-card" href="${listingQuery(l.id)}">
          <div class="course-thumb">${l.image_url ? `<img src="${esc(l.image_url)}" alt="${esc(l.title)}">` : ''}</div>
          <div class="course-body">
            <p class="course-title">${esc(l.title)}</p>
            <p class="course-price">${l.price ? '¥' + l.price.toLocaleString() + esc(l.price_unit || '') : '要相談'}</p>
          </div>
          <div class="course-arrow"><svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </a>`).join('')}</div></div>`
    : `<div class="section"><p class="section-title">取り扱いコース一覧</p><p class="empty-text">まだコースの登録がありません</p></div>`;

  const reviewsHtml = `<div class="section" id="reviewsSection">
    <p class="section-title">レビュー${owner.avg_rating ? ` ★ ${parseFloat(owner.avg_rating).toFixed(1)}（${esc(owner.review_count || 0)}件）` : ''}</p>
    ${reviews.length > 0
      ? `<div style="display:flex;flex-direction:column;gap:12px">
          ${reviews.map(r => `
            <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span style="color:#f97316;font-size:14px">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                <span style="font-size:11px;color:var(--ink-soft)">${esc(r.reviewer_name || '匿名')}</span>
                <span style="font-size:11px;color:var(--ink-soft);margin-left:auto">${new Date(r.created_at).toLocaleDateString('ja-JP')}</span>
              </div>
              ${r.body ? `<p style="font-size:13px;color:var(--ink-mid);line-height:1.7">${esc(r.body)}</p>` : ''}
            </div>`).join('')}
        </div>`
      : `<p class="empty-text">まだレビューがありません</p>`}
  </div>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="cover">${coverHtml}</div>
    <div class="hero">
      <div class="hero-inner">
        <div class="avatar">${avatarHtml}</div>
        <div class="hero-meta">
          <p class="type-label">${owner.type === 'shop' ? 'ショップ' : 'インストラクター'}</p>
          <div class="hero-name-row">
            <span class="hero-name">${esc(owner.name)}</span>
            ${verifiedBadge}
          </div>
          ${locationParts ? `<p class="hero-location"><svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${locationParts}</p>` : ''}
        </div>
      </div>
    </div>

    <div class="main">
      <div class="stats">${statsHtml}</div>

      ${owner.bio ? `<div class="section"><p class="section-title">自己紹介</p><p class="section-text">${escNl(owner.bio)}</p></div>` : ''}
      ${certsHtml}
      ${specsHtml}
      ${areasHtml}
      ${snsHtml}
      ${rosterHtml}
      ${coursesHtml}
      ${reviewsHtml}
    </div>
  `;
}
</script>
</body>
</html>
