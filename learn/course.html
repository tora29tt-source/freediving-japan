<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講座詳細 — フリーダイビングを学ぶ — Freediving Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep: #0b2d45;
  --ocean-mid:  #0e3d5c;
  --abyss:      #04161f;
  --teal:       #1f6f78;
  --teal-light: #2ec4b6;
  --foam:       #f0f9fb;
  --warm:       #f97316;
  --on-dark:        #222226;
  --on-dark-mid:    #5b5b60;
  --on-dark-soft:   #8b8b90;
  --hairline:       #e7e7ea;
  --glass:          #ffffff;

  --c-beginner: #1f6f78;
  --c-mid:      #4338ca;
  --c-comp:     #be123c;
  --c-inst:     #a16207;
}
html { background: #ffffff; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #ffffff;
  color: var(--on-dark);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* ── header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.94);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid #e7e7ea;
  padding: 0 20px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-size: 19px; font-weight: 700;
  color: #222226; letter-spacing: -0.01em;
  white-space: nowrap; text-decoration: none;
}
.logo span { color: #1f6f78; font-weight: 400; }
.header-icons { display: flex; align-items: center; gap: 16px; }
.icon-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px 7px 10px; border-radius: 100px;
  background: #fff; border: 1px solid #d8d8dc;
  color: #222226; font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; text-decoration: none; cursor: pointer;
  box-shadow: 0 3px 14px rgba(20,20,30,0.10);
  transition: border-color 0.2s;
}
.icon-btn:hover { border-color: #222226; }
.icon-btn .icon { width: 16px; height: 16px; }

.container { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--on-dark-soft); text-decoration: none; font-size: 13px;
  margin-bottom: 24px; transition: color 0.2s;
}
.back-link:hover { color: var(--teal); }

/* ── level badge / cat badge ── */
.level-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
}
.level-beginner { background: rgba(46,196,182,0.15); color: var(--c-beginner); }
.level-mid      { background: rgba(124,158,248,0.15); color: var(--c-mid); }
.level-comp     { background: rgba(251,113,133,0.15); color: var(--c-comp); }
.level-inst     { background: rgba(251,191,36,0.15);  color: var(--c-inst); }

/* ── hero ── */
.course-hero {
  background: #ffffff;
  border: 1px solid var(--hairline);
  box-shadow: 0 6px 24px rgba(20,20,30,0.08);
  border-radius: 16px; padding: 28px; margin-bottom: 28px;
}
.course-thumb {
  width: 100%; aspect-ratio: 16/9; border-radius: 12px; margin-bottom: 20px;
  background: linear-gradient(135deg, rgba(14,61,92,0.8), rgba(4,22,31,0.9));
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.course-thumb .play-circle {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(46,196,182,0.15); border: 1px solid rgba(46,196,182,0.3);
  display: flex; align-items: center; justify-content: center;
}
.course-thumb .play-circle svg { width: 24px; height: 24px; color: var(--teal); margin-left: 3px; }
.course-title { font-size: 24px; font-weight: 700; line-height: 1.35; margin: 14px 0 10px; }
.course-author {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--on-dark-mid); margin-bottom: 14px;
}
.author-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(46,196,182,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--teal); flex-shrink: 0;
}
.course-meta { display: flex; gap: 16px; font-size: 12px; color: var(--on-dark-soft); margin-bottom: 18px; flex-wrap: wrap; }
.course-meta-item { display: flex; align-items: center; gap: 5px; }
.course-meta-item svg { width: 13px; height: 13px; }
.course-desc { font-size: 14px; line-height: 1.8; color: var(--on-dark-mid); margin-bottom: 20px; }

.course-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 18px; border-top: 1px solid var(--hairline);
}
.course-price { font-size: 22px; font-weight: 700; }
.course-price small { font-size: 12px; color: var(--on-dark-soft); font-weight: 400; margin-left: 3px; }
.btn-buy {
  padding: 11px 24px; border-radius: 10px;
  background: var(--teal); color: #fff;
  font-size: 13px; font-weight: 700; border: none; cursor: pointer;
  letter-spacing: 0.04em; transition: opacity 0.2s;
}
.btn-buy:hover { opacity: 0.85; }
.btn-buy:disabled, .btn-buy.soon {
  background: #f0f0f2; color: var(--on-dark-soft);
  cursor: default; opacity: 1;
}

/* ── syllabus ── */
.section-heading {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; margin-top: 36px;
}
.sh-line { flex: 1; height: 1px; background: var(--hairline); }
.sh-label {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--on-dark-soft); font-weight: 500; white-space: nowrap;
}
.chapter-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
.chapter-row {
  display: grid; grid-template-columns: 40px 1fr;
  gap: 0 14px; padding: 16px 18px;
  background: #ffffff;
  border-bottom: 1px solid var(--hairline);
  align-items: start;
}
.chapter-row:last-child { border-bottom: none; }
.chapter-num {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: rgba(46,196,182,0.12); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-top: 1px;
}
.chapter-body { flex: 1; min-width: 0; }
.chapter-title { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; }
.chapter-hook { font-size: 12px; color: var(--on-dark-mid); line-height: 1.6; margin-bottom: 5px; }
.chapter-status { font-size: 11px; color: var(--on-dark-soft); }
.chapter-status.ready { color: var(--teal); }

/* ── sticky buy CTA ── */
.buy-cta-bar {
  position: sticky; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--hairline);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; z-index: 50;
  max-width: 760px; margin: 0 auto;
}
.buy-cta-price { font-size: 20px; font-weight: 700; }
.buy-cta-price small { font-size: 11px; color: var(--on-dark-soft); font-weight: 400; margin-left: 2px; }

/* ── inline player ── */
.player-wrap {
  position: relative; width: 100%; aspect-ratio: 16/9;
  background: #12181d; border-radius: 12px; overflow: hidden;
  margin-bottom: 0;
  display: flex; align-items: center; justify-content: center;
}
.player-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
.player-loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.55); font-size: 13px; pointer-events: none;
}
.player-error { text-align: center; color: #f87171; font-size: 13px; padding: 20px; }
.now-playing { font-size: 12px; color: var(--on-dark-soft); margin-top: 8px; margin-bottom: 4px; min-height: 18px; }

.chapter-row.clickable { cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.chapter-row.clickable:hover { border-color: var(--teal); background: rgba(31,111,120,0.05); }
.chapter-row.active { border-color: var(--teal) !important; background: rgba(31,111,120,0.08) !important; }
.chapter-row.not-ready { opacity: 0.5; cursor: default; }

/* ── state screens ── */
.state-screen {
  text-align: center; padding: 80px 20px; color: var(--on-dark-mid);
}
.state-screen h2 { font-size: 18px; margin-bottom: 10px; color: var(--on-dark); }
.state-screen p { font-size: 13px; line-height: 1.7; }
.state-screen a { color: var(--teal); }

/* ── footer ── */
.learn-footer {
  text-align: center; padding: 32px 20px;
  border-top: 1px solid var(--hairline); margin-top: 60px;
  font-size: 12px; color: var(--on-dark-soft);
}
.learn-footer a { color: var(--teal); text-decoration: none; }

@media (max-width: 480px) {
  .course-footer { flex-direction: column; align-items: stretch; gap: 14px; }
  .btn-buy { width: 100%; }
}
</style>
</head>

const T = (key, ja) => (window.I18N ? I18N.t(currentLang, key, ja) || ja : ja);
LangSwitcher.init(function(lang){
  if (window.I18N) I18N.apply(lang);
  currentLang = lang;

  <a href="../index.html" class="logo">FREEDIVING <span>JAPAN</span></a>
  <div class="header-icons">
    <a href="../mypage.html" class="icon-btn">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span data-i18n="nav_mypage">マイページ</span>
    </a>
  </div>
</header>

<div class="container" id="pageRoot">
  <a href="index.html" class="back-link">
    <svg class="icon" style="width:14px;height:14px" viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M15 19l-7-7 7-7"/></svg>

  <!-- Supabaseからの読み込み結果をここに描画する -->

  </div>
</div>

<footer class="learn-footer">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/video-progress.js"></script>
<script>
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

const LEVEL_LABEL_CLASS = { beginner: 'level-beginner', mid: 'level-mid', comp: 'level-comp', inst: 'level-inst' };
const CAT_JP = { beginner: '初心者', mid: '中級', comp: '競技', inst: 'インストラクター' };

function renderState(title, body) {
  document.getElementById('courseContent').innerHTML =
    '<div class="state-screen"><h2>' + esc(title) + '</h2><p>' + body + '</p></div>';
}

let currentCourse   = null;
let currentSession  = null;
let hlsInstance     = null;
let chaptersData    = [];

// ─── HLS プレイヤー ────────────────────────────────────────────────────────
function selectChapter(el, ch) {
  if (!ch.video_path) return;
  document.querySelectorAll('.chapter-row').forEach(function(r) { r.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('nowPlaying').textContent = T('ch_prefix', '第{n}回：').replace('{n}', ch.chapter_num) + ch.title;
  loadVideoToken(ch);
}

async function loadVideoToken(ch) {
  const wrap = document.getElementById('playerWrap');
  if (!wrap) return;
  VideoProgress.detach();
  wrap.innerHTML = '<video id="videoEl" controls playsinline></video><div class="player-loading" id="playerLoading">' + T('loading', '読み込み中…') + '</div>';

  try {
    const res = await fetch(
      '/api/video-token?courseId=' + encodeURIComponent(currentCourse.id) +
      '&chapterId=' + encodeURIComponent(ch.id), {
      headers: { 'Authorization': 'Bearer ' + currentSession.access_token }
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'トークン取得失敗');
    const src = json.workerUrl + '/' + json.videoPath + '?token=' + encodeURIComponent(json.token);
    startHLS(src, ch);
  } catch (err) {
    if (wrap) wrap.innerHTML = '<div class="player-error">' + T('player_err_load', '動画の読み込みに失敗しました。ページを再読み込みしてください。') + '</div>';
    console.error('video-token error:', err);
  }
}

async function startHLS(src, chapter) {
  const videoEl = document.getElementById('videoEl');
  const loading = document.getElementById('playerLoading');
  if (!videoEl) return;
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

  const savedPos = chapter ? await VideoProgress.restore(chapter.id) : 0;

  function onReady() {
    if (loading) loading.style.display = 'none';
    if (savedPos > 5) {
      videoEl.currentTime = savedPos;
      const m = Math.floor(savedPos / 60), s = Math.floor(savedPos % 60);
      const label = m > 0 ? m + T('unit_min', '分') + s + T('unit_sec', '秒') : s + T('unit_sec', '秒');
      const toast = document.createElement('div');
      toast.textContent = T('resume_from', '前回の続き（{t}）から再生しています').replace('{t}', label);
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f6f78;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:999;white-space:nowrap;';
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 4000);
    }
    videoEl.play().catch(function() {});
    if (chapter) VideoProgress.attach(videoEl, chapter.id);
  }

  if (Hls.isSupported()) {
    const hls = new Hls({ enableWorker: true });
    hls.loadSource(src);
    hls.attachMedia(videoEl);
    hls.on(Hls.Events.MANIFEST_PARSED, onReady);
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        const wrap = document.getElementById('playerWrap');
        if (wrap) wrap.innerHTML = '<div class="player-error">' + T('player_err_play', '動画の再生に失敗しました。ページを再読み込みしてください。') + '</div>';
      }
    });
    hlsInstance = hls;
  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    videoEl.src = src;
    videoEl.addEventListener('loadedmetadata', onReady, { once: true });
  } else {
    const wrap = document.getElementById('playerWrap');
    if (wrap) wrap.innerHTML = '<div class="player-error">' + T('player_err_browser', 'お使いのブラウザは動画再生に対応していません。') + '</div>';
  }
}

// ─── メイン ────────────────────────────────────────────────────────────────
async function loadCourse() {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) {
    renderState(T('course_notfound', '講座が見つかりません'), '<a href="index.html">' + T('course_list', '講座一覧') + '</a>' + T('course_notfound_sub', 'からお探しください。'));
    return;
  }

  const { data: course, error } = await _sb.from('courses').select('*').eq('slug', slug).single();
  if (error || !course) {
    renderState(T('course_unpublished', 'この講座はまだ公開されていません'), T('course_unpublished_sub', '公開まで今しばらくお待ちください。') + '<br><a href="index.html">' + T('course_list', '講座一覧') + '</a>');
    return;
  }
  currentCourse = course;

  const { data: chapters } = await _sb
    .from('course_chapters')
    .select('id, chapter_num, title, hook, video_path')
    .eq('course_id', course.id)
    .order('chapter_num', { ascending: true });
  chaptersData = chapters || [];

  const hasContent = chaptersData.some(function(ch) { return !!ch.video_path; });

  let purchaseStatus = null;
  const { data: { session } } = await _sb.auth.getSession();
  currentSession = session;
  if (session && hasContent) {
    const { data: purchase } = await _sb
      .from('course_purchases').select('status')
      .eq('course_id', course.id).eq('user_id', session.user.id).maybeSingle();
    purchaseStatus = purchase?.status || null;
  }

  const isPaid = purchaseStatus === 'paid';
  const levelClass = LEVEL_LABEL_CLASS[course.category] || 'level-beginner';
  const catJp = CAT_JP[course.category] || '';

  // ── サムネイル or プレイヤーエリア ──
  let thumbContent;
  if (isPaid) {
    // 購入済み：インラインプレイヤー
    thumbContent = '<div class="player-wrap" id="playerWrap"><div class="player-loading">' + T('course_pick_chapter', 'チャプターを選んで再生') + '</div></div>';
  } else if (course.preview_video_url) {
    const poster = course.thumbnail_url ? ' poster="' + esc(course.thumbnail_url) + '"' : '';
    thumbContent =
      '<video controls playsinline preload="metadata"' + poster +
      ' style="position:absolute;inset:0;width:100%;height:100%;border-radius:12px;background:#000;">' +
      '<source src="' + esc(course.preview_video_url) + '" type="video/mp4">' +
      '</video>';
  } else if (course.thumbnail_url) {
    thumbContent =
      '<img src="' + esc(course.thumbnail_url) + '" alt="" ' +
      'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;">';
  } else {
    thumbContent = '<div class="play-circle"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>';
  }

  // ── チャプター行 ──
  const chapterRows = chaptersData.map(function(ch, i) {
    const ready = !!ch.video_path;
    if (isPaid) {
      const cls = 'chapter-row' + (ready ? ' clickable' : ' not-ready') + (i === 0 && ready ? ' active' : '');
      const onclick = ready ? ' onclick="selectChapter(this, chaptersData[' + i + '])"' : '';
      return '<div class="' + cls + '" data-num="' + ch.chapter_num + '"' + onclick + '>' +
        '<div class="chapter-num">' + ch.chapter_num + '</div>' +
        '<div class="chapter-body">' +
          '<div class="chapter-title">' + esc(ch.title) + '</div>' +
          (ch.hook ? '<div class="chapter-hook">' + esc(ch.hook) + '</div>' : '') +
          '<div class="chapter-status' + (ready ? ' ready' : '') + '">' + (ready ? '▶ ' + T('learn_watch', '視聴する') : T('learn_coming_soon', '準備中')) + '</div>' +
        '</div>' +
      '</div>';
    } else {
      return '<div class="chapter-row">' +
        '<div class="chapter-num">' + ch.chapter_num + '</div>' +
        '<div class="chapter-body">' +
          '<div class="chapter-title">' + esc(ch.title) + '</div>' +
          (ch.hook ? '<div class="chapter-hook">' + esc(ch.hook) + '</div>' : '') +
          '<div class="chapter-status' + (ready ? ' ready' : '') + '">' + (ready ? '▶ ' + T('course_watchable_after', '視聴可能（購入後）') : T('learn_coming_soon', '準備中')) + '</div>' +
        '</div>' +
      '</div>';
    }
  }).join('');

  // ── CTA バー ──
  let buyButtonHtml;
  if (isPaid) {
    buyButtonHtml = '<span style="font-size:13px;color:var(--teal);font-weight:600;">✓ ' + T('course_purchased', '購入済み') + '</span>';
  } else if (hasContent) {
    buyButtonHtml = '<button class="btn-buy" id="buyBtn" onclick="purchaseCourse()">' + T('learn_buy', '購入する') + '</button>';
  } else {
    buyButtonHtml = '<button class="btn-buy soon" disabled>' + T('learn_coming_soon', '準備中') + '</button>';
  }

  document.getElementById('courseContent').innerHTML =
    '<div class="course-hero">' +
      '<div class="course-thumb" ' + (isPaid ? 'style="background:#000;aspect-ratio:16/9;border-radius:12px;overflow:hidden;"' : '') + '>' +
        thumbContent +
      '</div>' +
      (isPaid ? '<p class="now-playing" id="nowPlaying"></p>' : '') +
      '<span class="level-badge ' + levelClass + '">' + esc(catJp) + (course.level_label ? ' ・ ' + esc(course.level_label) : '') + '</span>' +
      '<h1 class="course-title">' + esc(course.title) + '</h1>' +
      '<div class="course-author">' +
        '<span>' + esc(course.instructor_name) + (course.instructor_title ? '（' + esc(course.instructor_title) + '）' : '') + '</span>' +
      '</div>' +
      '<div class="course-meta">' +
        (chaptersData.length ? '<span class="course-meta-item">' + T('learn_total_prefix', '全') + chaptersData.length + T('learn_lessons_suffix', 'レッスン') + '</span>' : '') +
        (course.target_level ? '<span class="course-meta-item">' + esc(course.target_level) + '</span>' : '') +
      '</div>' +
      (course.description ? '<p class="course-desc">' + esc(course.description) + '</p>' : '') +
    '</div>' +
    (chapterRows ? (
      '<div class="section-heading"><div class="sh-line"></div><div class="sh-label" data-i18n="course_curriculum">カリキュラム</div><div class="sh-line"></div></div>' +
      '<div class="chapter-list">' + chapterRows + '</div>'
    ) : '') +
    '<div style="height:80px"></div>' +
    '<div class="buy-cta-bar">' +
      '<div class="buy-cta-price">¥' + Number(course.price).toLocaleString('ja-JP') + '<small>' + T('tax_incl', '（税込）') + '</small></div>' +
      buyButtonHtml +
    '</div>';

  // 購入済み：進捗を確認して最後に見ていたチャプターから再開
  if (isPaid) {
    const readyChapters = chaptersData.filter(function(c) { return !!c.video_path; });
    if (readyChapters.length) {
      const progressMap = await VideoProgress.restoreAll(course.id);
      let startCh = readyChapters[0];
      const inProgress = readyChapters.find(function(c) {
        return progressMap[c.id] && !progressMap[c.id].completed && progressMap[c.id].position_seconds > 5;
      });
      if (inProgress) startCh = inProgress;
      // アクティブ行を更新
      document.querySelectorAll('.chapter-row').forEach(function(r) {
        r.classList.toggle('active', r.dataset && r.dataset.num == startCh.chapter_num);
      });
      const nowEl = document.getElementById('nowPlaying');
      if (nowEl) nowEl.textContent = T('ch_prefix', '第{n}回：').replace('{n}', startCh.chapter_num) + startCh.title;
      loadVideoToken(startCh);
    }
  }
}

async function purchaseCourse() {
  if (!currentCourse) return;
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    location.href = '../auth.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  const btn = document.getElementById('buyBtn');
  if (btn) { btn.disabled = true; btn.textContent = T('processing', '処理中...'); }
  try {
    const res = await fetch('/api/create-course-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ courseId: currentCourse.id }),
    });
    const json = await res.json();
    if (!res.ok) {
      if (json.alreadyPurchased) { location.href = location.href; return; }
      alert(json.error || T('purchase_err', '購入処理でエラーが発生しました'));
      if (btn) { btn.disabled = false; btn.textContent = T('learn_buy', '購入する'); }
      return;
    }
    location.href = json.url;
  } catch (e) {
    alert(T('network_err', '通信エラーが発生しました。もう一度お試しください'));
    if (btn) { btn.disabled = false; btn.textContent = T('learn_buy', '購入する'); }
  }
}

loadCourse();
</script>
