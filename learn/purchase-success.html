<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>購入完了 — Freediving Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep: #0b2d45; --ocean-mid: #0e3d5c; --abyss: #04161f;
  --teal: #1f6f78; --teal-light: #2ec4b6; --warm: #f97316;
  --on-dark: #222226; --on-dark-mid: #5b5b60;
  --on-dark-soft: #8b8b90; --hairline: #e7e7ea;
}
html { background: #ffffff; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #ffffff;
  color: var(--on-dark); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px; -webkit-font-smoothing: antialiased; }
.card { background: #ffffff; border: 1px solid var(--hairline); box-shadow: 0 6px 24px rgba(20,20,30,0.08);
  border-radius: 24px; padding: 40px 28px; max-width: 480px; width: 100%; text-align: center; }
.icon-wrap { width: 72px; height: 72px; border-radius: 50%; background: rgba(31,111,120,0.10);
  border: 2px solid rgba(31,111,120,0.3); display: flex; align-items: center;
  justify-content: center; margin: 0 auto 24px; }
.check-icon { width: 36px; height: 36px; stroke: var(--teal); fill: none; stroke-width: 2.5; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
.sub { font-size: 14px; color: var(--on-dark-mid); line-height: 1.8; margin-bottom: 32px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  padding: 15px; background: var(--teal); border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; color: #fff; text-decoration: none;
  cursor: pointer; transition: background 0.2s; letter-spacing: 0.03em; }
.btn:hover { background: var(--teal-light); }
.btn-ghost { background: transparent; border: 1px solid var(--hairline); color: var(--on-dark-mid);
  margin-top: 10px; font-weight: 400; }
.btn-ghost:hover { background: #f5f5f7; }
.header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.94); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid #e7e7ea; padding: 0 20px; height: 56px; display: flex; align-items: center; }
.logo { font-size: 19px; font-weight: 700; color: #222226; letter-spacing: -0.01em; white-space: nowrap; text-decoration: none; }
.logo span { color: #1f6f78; font-weight: 400; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--hairline);
  border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <a href="../index.html" class="logo">FREEDIVING <span>JAPAN</span></a>
</header>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

const params = new URLSearchParams(location.search);
const slug   = params.get('slug');

function renderError(msg) {
  document.getElementById('card').innerHTML =
    '<div style="font-size:40px;margin-bottom:16px">⚠️</div>' +
    '<h1 style="margin-bottom:12px">エラー</h1>' +
    '<p class="sub">' + msg + '</p>' +
    '<a href="index.html" class="btn btn-ghost">講座一覧へ戻る</a>';
}

async function pollPurchase() {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    renderError('ログイン状態が確認できませんでした。<br><a href="../auth.html">ログイン</a>し直してから、マイページでご確認ください。');
    return;
  }
  if (!slug) {
    renderError('講座情報が見つかりませんでした。');
    return;
  }

  const { data: course } = await _sb.from('courses').select('id, title').eq('slug', slug).single();
  if (!course) {
    renderError('講座情報が見つかりませんでした。');
    return;
  }

  // webhook反映に多少ラグがあるため、最大5回（約7.5秒）ポーリングする
  for (let i = 0; i < 5; i++) {
    const { data: purchase } = await _sb
      .from('course_purchases')
      .select('status')
      .eq('course_id', course.id)
      .eq('user_id', session.user.id)
      .maybeSingle();

    if (purchase?.status === 'paid') {
      document.getElementById('card').innerHTML =
        '<div class="icon-wrap"><svg class="check-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>' +
        '<h1>購入が完了しました！</h1>' +
        '<p class="sub"><strong>' + esc(course.title) + '</strong><br>マイページからいつでも視聴できます。</p>' +
        '<a href="../mypage.html" class="btn">マイページへ</a>' +
        '<a href="index.html" class="btn btn-ghost">他の講座を見る</a>';
      return;
    }
    await new Promise(r => setTimeout(r, 1500));
  }

  // まだ反映されていない場合（webhook遅延 or 失敗）
  document.getElementById('card').innerHTML =
    '<h1 style="margin-bottom:12px">お支払いを確認中です</h1>' +
    '<p class="sub">決済の反映に少し時間がかかっています。<br>数分待ってからマイページをご確認ください。反映されない場合はお問い合わせください。</p>' +
    '<a href="../mypage.html" class="btn btn-ghost">マイページへ</a>';
}

pollPurchase();
</script>
</body>
</html>
