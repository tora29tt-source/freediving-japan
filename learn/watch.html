<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画を見る — フリーダイビングを学ぶ — Freediving Japan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ocean-deep: #0b2d45; --ocean-mid: #0e3d5c; --abyss: #04161f;
  --teal: #1f6f78; --teal-light: #2ec4b6; --warm: #f97316;
  --on-dark: #222226; --on-dark-mid: #5b5b60;
  --on-dark-soft: #8b8b90; --hairline: #e7e7ea;
  --glass: #ffffff;
}
html { background: #ffffff; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #ffffff;
  color: var(--on-dark); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.94);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid #e7e7ea;
  padding: 0 20px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-size: 19px; font-weight: 700;
  color: #222226; letter-spacing: -0.01em;
  white-space: nowrap; text-decoration: none;
}
.logo span { color: #1f6f78; font-weight: 400; }
.icon-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px 7px 10px; border-radius: 100px;
  background: #fff; border: 1px solid #d8d8dc;
  color: #222226; font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; text-decoration: none; cursor: pointer;
  box-shadow: 0 3px 14px rgba(20,20,30,0.10);
  transition: border-color 0.2s;
}
.icon-btn .icon { width: 16px; height: 16px; }

.container { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--on-dark-soft); text-decoration: none; font-size: 13px; margin-bottom: 20px;
}
.back-link:hover { color: var(--teal); }

.course-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.course-sub { font-size: 12px; color: var(--on-dark-soft); margin-bottom: 24px; }

.player-wrap {
  position: relative; width: 100%; aspect-ratio: 16/9;
  background: #12181d; border: 1px solid var(--hairline); border-radius: 14px;
  overflow: hidden; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center;
}
.player-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
.player-empty { text-align: center; color: rgba(255,255,255,0.55); font-size: 13px; padding: 20px; }
.player-loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5); font-size: 13px; pointer-events: none;
}
.player-error { text-align: center; color: #f87171; font-size: 13px; padding: 20px; }
.now-playing { font-size: 13px; color: var(--on-dark-mid); margin-bottom: 28px; }

.section-heading { display: flex; align-items: center; gap: 10px; margin: 8px 0 16px; }
.sh-line { flex: 1; height: 1px; background: var(--hairline); }
.sh-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-dark-soft); font-weight: 500; white-space: nowrap; }

.chapter-list { display: flex; flex-direction: column; gap: 8px; }
.chapter-row {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 10px;
  background: #ffffff; border: 1px solid var(--hairline);
  cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.chapter-row.ready:hover { border-color: var(--teal); background: rgba(31,111,120,0.06); }
.chapter-row.active { border-color: var(--teal); background: rgba(31,111,120,0.1); }
.chapter-row.disabled { cursor: default; opacity: 0.55; }
.chapter-num {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: rgba(31,111,120,0.12); color: var(--teal);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
}
.chapter-body { flex: 1; min-width: 0; }
.chapter-title { font-size: 13px; font-weight: 600; }
.chapter-status { font-size: 11px; color: var(--on-dark-soft); margin-top: 2px; }

.state-screen { text-align: center; padding: 80px 20px; color: var(--on-dark-mid); }
.state-screen h2 { font-size: 18px; margin-bottom: 10px; color: var(--on-dark); }
.state-screen p { font-size: 13px; line-height: 1.7; }
.state-screen a { color: var(--teal); }
</style>
</head>
<body>

<header class="header">
  <a href="../index.html" class="logo">FREEDIVING <span>JAPAN</span></a>
  <a href="../mypage.html" class="icon-btn">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    マイページ
  </a>
</header>

<div class="container">
  <a href="../mypage.html" class="back-link">
    <svg class="icon" style="width:14px;height:14px" viewBox="0 0 24 24" stroke="currentColor" fill="none"><path d="M15 19l-7-7 7-7"/></svg>
    マイページへ戻る
  </a>

  <div id="watchContent"><div class="state-screen">読み込み中...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script>
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

let chaptersData  = [];
let currentCourse = null;
let currentSession = null;
let hlsInstance   = null;

// ─── プレイヤー ────────────────────────────────────────────────────────────
function renderPlayer(chapter) {
  const wrap = document.getElementById('playerWrap');
  const now  = document.getElementById('nowPlaying');
  if (!wrap) return;

  if (!chapter || !chapter.video_path) {
    wrap.innerHTML = '<div class="player-empty">この講座の動画は現在準備中です。<br>撮影・編集が完了次第、順次公開します。</div>';
    if (now) now.textContent = '';
    return;
  }

  // ローディング表示
  wrap.innerHTML = '<video id="videoEl" controls playsinline></video><div class="player-loading" id="playerLoading">読み込み中…</div>';
  if (now) now.textContent = '第' + chapter.chapter_num + '回：' + esc(chapter.title);

  // チャプター行のアクティブ状態を更新
  document.querySelectorAll('.chapter-row').forEach(function(row) {
    row.classList.toggle('active', row.dataset.num == chapter.chapter_num);
  });

  loadVideoToken(chapter);
}

async function loadVideoToken(chapter) {
  const wrap = document.getElementById('playerWrap');

  try {
    const res = await fetch(
      '/api/video-token?courseId=' + encodeURIComponent(currentCourse.id) +
      '&chapterId=' + encodeURIComponent(chapter.id), {
      headers: { 'Authorization': 'Bearer ' + currentSession.access_token }
    });

    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'トークン取得失敗');

    const { token, videoPath, workerUrl } = json;
    const src = workerUrl + '/' + videoPath + '?token=' + encodeURIComponent(token);

    startHLS(src);

  } catch (err) {
    if (wrap) {
      wrap.innerHTML = '<div class="player-error">動画の読み込みに失敗しました。<br>ページを再読み込みしてください。</div>';
    }
    console.error('video-token error:', err);
  }
}

function startHLS(src) {
  const videoEl = document.getElementById('videoEl');
  const loading = document.getElementById('playerLoading');

  if (!videoEl) return;

  // 既存の hls インスタンスを破棄
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

  if (Hls.isSupported()) {
    const hls = new Hls({ enableWorker: true });
    hls.loadSource(src);
    hls.attachMedia(videoEl);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      if (loading) loading.style.display = 'none';
      videoEl.play().catch(() => {});  // 自動再生（ブラウザが許可しない場合は無視）
    });
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        console.error('HLS fatal error:', data);
        const wrap = document.getElementById('playerWrap');
        if (wrap) wrap.innerHTML = '<div class="player-error">動画の再生に失敗しました。ページを再読み込みしてください。</div>';
      }
    });
    hlsInstance = hls;

  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari はネイティブ HLS をサポート
    videoEl.src = src;
    videoEl.addEventListener('loadedmetadata', function() {
      if (loading) loading.style.display = 'none';
      videoEl.play().catch(() => {});
    }, { once: true });
  } else {
    const wrap = document.getElementById('playerWrap');
    if (wrap) wrap.innerHTML = '<div class="player-error">お使いのブラウザは動画再生に対応していません。</div>';
  }
}

function selectChapter(num) {
  const ch = chaptersData.find(function(c) { return c.chapter_num == num; });
  if (!ch || !ch.video_path) return;
  renderPlayer(ch);
}

// ─── 状態画面 ──────────────────────────────────────────────────────────────
function renderState(title, body) {
  document.getElementById('watchContent').innerHTML =
    '<div class="state-screen"><h2>' + esc(title) + '</h2><p>' + body + '</p></div>';
}

// ─── メインロード ──────────────────────────────────────────────────────────
async function loadWatch() {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) {
    renderState('講座が見つかりません', '<a href="index.html">講座一覧</a>からお探しください。');
    return;
  }

  const { data: { session } } = await _sb.auth.getSession();
  if (!session) {
    location.href = '../auth.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  currentSession = session;

  const { data: course, error: courseErr } = await _sb
    .from('courses')
    .select('id, slug, title, instructor_name')
    .eq('slug', slug)
    .single();

  if (courseErr || !course) {
    renderState('講座が見つかりません', '<a href="index.html">講座一覧</a>からお探しください。');
    return;
  }
  currentCourse = course;

  const { data: purchase } = await _sb
    .from('course_purchases')
    .select('status')
    .eq('course_id', course.id)
    .eq('user_id', session.user.id)
    .maybeSingle();

  if (purchase?.status !== 'paid') {
    renderState('この講座はまだ購入されていません',
      '<a href="course.html?slug=' + encodeURIComponent(slug) + '">講座詳細ページ</a>から購入してください。');
    return;
  }

  const { data: chapters } = await _sb
    .from('course_chapters')
    .select('id, chapter_num, title, video_path')
    .eq('course_id', course.id)
    .order('chapter_num', { ascending: true });

  chaptersData = chapters || [];

  const chapterRows = chaptersData.map(function(ch) {
    const ready = !!ch.video_path;
    return '<div class="chapter-row ' + (ready ? 'ready' : 'disabled') + '" data-num="' + ch.chapter_num + '"' +
      (ready ? ' onclick="selectChapter(' + ch.chapter_num + ')"' : '') + '>' +
      '<div class="chapter-num">' + ch.chapter_num + '</div>' +
      '<div class="chapter-body">' +
        '<div class="chapter-title">' + esc(ch.title) + '</div>' +
        '<div class="chapter-status">' + (ready ? '▶ 再生する' : '動画準備中') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('watchContent').innerHTML =
    '<div class="course-title">' + esc(course.title) + '</div>' +
    '<div class="course-sub">' + esc(course.instructor_name || '') + '</div>' +
    '<div class="player-wrap" id="playerWrap"><div class="player-empty">左のリストからチャプターを選択してください。</div></div>' +
    '<div class="now-playing" id="nowPlaying"></div>' +
    (chaptersData.length ? (
      '<div class="section-heading"><div class="sh-line"></div><div class="sh-label">カリキュラム</div><div class="sh-line"></div></div>' +
      '<div class="chapter-list">' + chapterRows + '</div>'
    ) : '');

  // 最初の視聴可能チャプターを自動再生
  const firstReady = chaptersData.find(function(c) { return !!c.video_path; });
  if (firstReady) renderPlayer(firstReady);
}

loadWatch();
</script>
</body>
</html>
