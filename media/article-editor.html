<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>記事エディター — Freediving Japan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<style>
:root {
  --ocean-deep: #0b2d45;
  --ocean-mid:  #0e3d5c;
  --ocean-light:#1a5f82;
  --teal:       #2ec4b6;
  --teal-light: #a8ece8;
  --foam:       #f0f9fb;
  --warm:       #f97316;
  --sand:       #fdf8f2;
  --text:       #1a2b38;
  --text-mid:   #3d5166;
  --text-light: #6b8091;
  --danger:     #ef4444;
  --success:    #10b981;
  --font: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: #f0f4f7; color: var(--text); min-height: 100vh; }

/* ── AUTH GATE ── */
#authGate {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 20px; text-align: center;
}
#authGate h2 { font-size: 18px; color: var(--ocean-deep); margin-bottom: 8px; }
#authGate p  { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
.btn-login {
  display: inline-block; background: var(--teal); color: white;
  padding: 13px 28px; border-radius: 8px; font-size: 15px; font-weight: 600;
  text-decoration: none; border: none; cursor: pointer; font-family: var(--font);
}

/* ── HEADER ── */
.header {
  background: var(--ocean-deep); padding: 0 16px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; background: var(--teal); border-radius: 50%; }
.header-title { color: white; font-size: 14px; font-weight: 600; }
.header-user  { color: rgba(255,255,255,.5); font-size: 11px; }
.btn-signout {
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.7);
  border: none; border-radius: 6px; padding: 5px 10px;
  font-size: 11px; font-family: var(--font); cursor: pointer;
}

/* ── TABS ── */
.tabs {
  display: flex; background: white;
  border-bottom: 1px solid #e4eaf0; position: sticky; top: 52px; z-index: 90;
}
.tab-btn {
  flex: 1; padding: 12px 8px; border: none; background: none;
  font-size: 13px; font-weight: 500; font-family: var(--font);
  color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }

/* ── PANELS ── */
.panel { display: none; padding: 16px; padding-bottom: 80px; }
.panel.active { display: block; }

/* ── ARTICLE LIST ── */
.list-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.list-header h3 { font-size: 14px; font-weight: 600; color: var(--ocean-deep); }
.badge-count {
  background: var(--foam); color: var(--ocean-light);
  font-size: 11px; padding: 3px 8px; border-radius: 10px;
}
.filter-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid #dde3ea; background: white;
  font-size: 11px; font-family: var(--font); font-weight: 500;
  cursor: pointer; color: #5a6a7a; white-space: nowrap;
}
.filter-chip.active { background: var(--ocean-deep); border-color: var(--ocean-deep); color: white; }

.article-card {
  background: white; border-radius: var(--radius); padding: 14px;
  margin-bottom: 8px; box-shadow: 0 1px 3px rgba(11,45,69,.06);
  border-left: 3px solid transparent;
}
.article-card.published { border-left-color: var(--teal); }
.article-card.draft     { border-left-color: #dde3ea; }
.article-card.review    { border-left-color: var(--warm); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--ocean-deep); line-height: 1.45; flex: 1; }
.status-badge {
  flex-shrink: 0; padding: 3px 9px; border-radius: 20px;
  font-size: 10px; font-weight: 600;
}
.s-draft    { background: #f1f5f9; color: #64748b; }
.s-review   { background: #fef3c7; color: #d97706; }
.s-published{ background: #ccfbf1; color: #0e9488; }
.card-meta { font-size: 11px; color: var(--text-light); display: flex; gap: 10px; flex-wrap: wrap; }
.card-actions { display: flex; gap: 6px; margin-top: 10px; }
.btn-sm {
  padding: 6px 12px; border-radius: 6px; border: none;
  font-size: 12px; font-family: var(--font); font-weight: 600; cursor: pointer;
}
.btn-edit   { background: var(--foam); color: var(--ocean-light); }
.btn-delete { background: #fef2f2; color: var(--danger); }
.btn-pub    { background: var(--teal); color: white; }
.btn-unpub  { background: #fef3c7; color: #d97706; }
.empty-state { text-align: center; padding: 48px 16px; color: var(--text-light); font-size: 14px; }

/* ── EDITOR FORM ── */
.form-section {
  background: white; border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(11,45,69,.06);
}
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ocean-light); margin-bottom: 12px;
}
.form-row { margin-bottom: 12px; }
.form-row:last-child { margin-bottom: 0; }
.form-row label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text-light); margin-bottom: 5px; letter-spacing: .04em;
}
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid #dde3ea; border-radius: 8px;
  font-size: 14px; font-family: var(--font); color: var(--text);
  outline: none; transition: border-color .15s; -webkit-appearance: none;
  background: white;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  border-color: var(--teal);
}
.form-row textarea { resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.char-hint { font-size: 10px; color: var(--text-light); margin-top: 3px; }

/* content editor */
.content-area {
  width: 100%; min-height: 280px; padding: 12px;
  border: 1.5px solid #dde3ea; border-radius: 8px;
  font-size: 13px; font-family: 'Menlo', 'Courier New', monospace;
  color: var(--text); outline: none; resize: vertical;
  transition: border-color .15s; background: #fafbfc;
  line-height: 1.6;
}
.content-area:focus { border-color: var(--teal); }
.content-toolbar {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
}
.toolbar-btn {
  padding: 5px 10px; border-radius: 6px;
  background: var(--foam); border: 1px solid #d4e8f0;
  font-size: 11px; font-family: var(--font); color: var(--ocean-mid);
  cursor: pointer; white-space: nowrap;
}
.toolbar-btn:hover { background: var(--teal-light); }

/* preview */
.preview-toggle {
  display: flex; gap: 8px; margin-bottom: 10px;
}
.preview-tab {
  padding: 7px 14px; border-radius: 6px; border: 1.5px solid #dde3ea;
  font-size: 12px; font-family: var(--font); font-weight: 600;
  cursor: pointer; background: white; color: var(--text-light);
}
.preview-tab.active { background: var(--ocean-deep); border-color: var(--ocean-deep); color: white; }
#previewArea {
  display: none; min-height: 280px; padding: 16px;
  border: 1.5px solid #dde3ea; border-radius: 8px;
  background: white; overflow-y: auto;
  font-size: 15px; line-height: 1.85; color: var(--text);
}
#previewArea.visible { display: block; }
#previewArea h2 { font-size: 20px; color: var(--ocean-deep); margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--teal-light); }
#previewArea h3 { font-size: 16px; color: var(--ocean-mid); margin: 20px 0 10px; }
#previewArea p  { margin-bottom: 16px; }
#previewArea strong { color: var(--ocean-deep); }
#previewArea table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
#previewArea th { background: var(--ocean-deep); color: white; padding: 10px; text-align: left; font-size: 12px; }
#previewArea td { padding: 10px; border-bottom: 1px solid #eef2f6; color: var(--text-mid); }
#previewArea tr:nth-child(odd) td { background: var(--foam); }

/* FAB */
.fab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: white; border-top: 1px solid #e4eaf0;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; z-index: 200;
}
.btn-save-draft {
  flex: 1; padding: 13px; border-radius: 8px; border: 1.5px solid var(--ocean-light);
  background: white; color: var(--ocean-deep);
  font-size: 14px; font-family: var(--font); font-weight: 600; cursor: pointer;
}
.btn-publish {
  flex: 2; padding: 13px; border-radius: 8px; border: none;
  background: var(--teal); color: white;
  font-size: 14px; font-family: var(--font); font-weight: 600; cursor: pointer;
}
.btn-publish:disabled { opacity: .5; }

/* TOAST */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--ocean-deep); color: white; padding: 10px 20px;
  border-radius: 20px; font-size: 13px; z-index: 400;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.loading { text-align: center; padding: 32px; color: var(--text-light); font-size: 14px; }
</style>
</head>
<body>

<!-- AUTH GATE -->
<div id="authGate" style="display:none">
  <h2>ログインが必要です</h2>
  <p>記事の作成・編集にはログインが必要です</p>
  <a href="../auth.html" class="btn-login">ログインする</a>
</div>

<!-- APP -->
<div id="app" style="display:none">

<header class="header">
  <div class="header-left">
    <div class="dot"></div>
    <span class="header-title">記事エディター</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="header-user" id="headerUser"></span>
    <button class="btn-signout" onclick="signOut()">ログアウト</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('list', this)">記事一覧</button>
  <button class="tab-btn" onclick="switchTab('editor', this)">新規作成</button>
</div>

<!-- ── LIST PANEL ── -->
<div class="panel active" id="panel-list">
  <div class="list-header">
    <h3>すべての記事</h3>
    <span class="badge-count" id="articleCount">0 本</span>
  </div>
  <div class="filter-row" id="statusFilter">
    <button class="filter-chip active" onclick="setFilter('all',this)">すべて</button>
    <button class="filter-chip" onclick="setFilter('draft',this)">下書き</button>
    <button class="filter-chip" onclick="setFilter('review',this)">レビュー待ち</button>
    <button class="filter-chip" onclick="setFilter('published',this)">公開済み</button>
  </div>
  <div id="articleList"><div class="loading">読み込み中…</div></div>
</div>

<!-- ── EDITOR PANEL ── -->
<div class="panel" id="panel-editor">
  <input type="hidden" id="editingId">

  <!-- メタ情報 -->
  <div class="form-section">
    <div class="section-title">基本情報</div>
    <div class="form-row">
      <label>タイトル *</label>
      <input type="text" id="f_title" placeholder="記事タイトルを入力" oninput="autoSlug()">
    </div>
    <div class="form-row">
      <label>スラッグ（URL）*</label>
      <input type="text" id="f_slug" placeholder="article-slug-en">
      <div class="char-hint">例: what-is-freediving　※英数字とハイフンのみ</div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>カテゴリ *</label>
        <select id="f_category">
          <option value="A">A. 入門・体験</option>
          <option value="B">B. 身体・科学</option>
          <option value="C">C. 海・スポット</option>
          <option value="D">D. 競技・大会</option>
          <option value="E">E. インタビュー</option>
          <option value="P" selected>P. 人物メディア</option>
          <option value="Q">Q. 業界×期待感</option>
          <option value="S">S. シリーズ連載</option>
          <option value="T">T. エンタメ</option>
        </select>
      </div>
      <div class="form-row">
        <label>読了時間（分）</label>
        <input type="number" id="f_read_time" placeholder="例: 8" min="1" max="60">
      </div>
    </div>
  </div>

  <!-- 著者情報 -->
  <div class="form-section">
    <div class="section-title">著者</div>
    <div class="form-grid">
      <div class="form-row">
        <label>著者タイプ *</label>
        <select id="f_author_type">
          <option value="編集部">Freediving Japan 編集部</option>
          <option value="寺島拓哉">寺島拓哉</option>
          <option value="取材・文：寺島拓哉">取材・文：寺島拓哉</option>
          <option value="取材・撮影：寺島拓哉">取材・撮影：寺島拓哉</option>
          <option value="ゲスト">ゲストライター</option>
        </select>
      </div>
      <div class="form-row">
        <label>著者名（ゲスト時）</label>
        <input type="text" id="f_author_name" placeholder="氏名">
      </div>
    </div>
  </div>

  <!-- リード文 -->
  <div class="form-section">
    <div class="section-title">リード文</div>
    <div class="form-row">
      <textarea id="f_lead" rows="3" placeholder="記事冒頭のリード文。100〜150字程度。"></textarea>
    </div>
  </div>

  <!-- 本文 -->
  <div class="form-section">
    <div class="section-title">本文 HTML</div>
    <div class="preview-toggle">
      <button class="preview-tab active" onclick="showEditor(this)">編集</button>
      <button class="preview-tab" onclick="showPreview(this)">プレビュー</button>
    </div>
    <div class="content-toolbar">
      <button class="toolbar-btn" onclick="insertSnippet('h2')">H2見出し</button>
      <button class="toolbar-btn" onclick="insertSnippet('h3')">H3見出し</button>
      <button class="toolbar-btn" onclick="insertSnippet('pullquote')">引用</button>
      <button class="toolbar-btn" onclick="insertSnippet('info')">情報BOX</button>
      <button class="toolbar-btn" onclick="insertSnippet('table')">表</button>
    </div>
    <textarea class="content-area" id="f_content" placeholder="ClaudeがHTMLを生成したら、ここにペーストしてください。&#10;&#10;<h2>見出し</h2>&#10;<p>本文…</p>"></textarea>
    <div id="previewArea"></div>
  </div>

  <!-- タグ・サムネ -->
  <div class="form-section">
    <div class="section-title">タグ・画像</div>
    <div class="form-row">
      <label>タグ（カンマ区切り）</label>
      <input type="text" id="f_tags" placeholder="例: フリーダイビング基礎, 初心者, 始め方">
    </div>
    <div class="form-row">
      <label>サムネイル画像URL</label>
      <input type="text" id="f_thumbnail" placeholder="https://...">
    </div>
  </div>

</div><!-- /panel-editor -->

<!-- FAB: エディター表示中のみ -->
<div class="fab-bar" id="fabBar" style="display:none">
  <button class="btn-save-draft" onclick="saveArticle('draft')">下書き保存</button>
  <button class="btn-publish"    onclick="saveArticle('published')">公開する</button>
</div>

</div><!-- /app -->

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL      = 'https://bbhqvbpsuccbdcnhnobm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaHF2YnBzdWNjYmRjbmhub2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyODQwMzksImV4cCI6MjA5NTg2MDAzOX0.MexR8_hY56m3XRff0EJOQM3uQShXr2L9kGyYXLSzKbs';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const CAT_LABELS = { A:'入門・体験', B:'身体・科学', C:'海・スポット', D:'競技・大会', E:'インタビュー', P:'人物メディア', Q:'業界×期待感', S:'シリーズ連載', T:'エンタメ' };
let currentUser = null;
let userRole    = null; // 'admin' | 'staff' | 'editor' | null
let currentFilter = 'all';
let articles = [];

// ── AUTH ──
async function init() {
  if (!sb) { document.getElementById('authGate').style.display = 'flex'; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('authGate').style.display = 'flex';
    return;
  }
  currentUser = session.user;
  document.getElementById('headerUser').textContent = session.user.email;

  // ロール取得（user_roles テーブル）
  const { data: roleRow } = await sb
    .from('user_roles')
    .select('role')
    .eq('user_id', currentUser.id)
    .maybeSingle();
  userRole = roleRow?.role || null;

  document.getElementById('app').style.display = 'block';
  updateFabForRole();
  loadArticles();
}

async function signOut() {
  await sb.auth.signOut();
  location.href = '../auth.html';
}

// ── TABS ──
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('fabBar').style.display = tab === 'editor' ? 'flex' : 'none';
  if (tab === 'list') loadArticles();
}

function openEditor(id = null) {
  resetForm();
  document.getElementById('editingId').value = id || '';
  if (id) {
    const a = articles.find(x => x.id === id);
    if (a) fillForm(a);
  }
  // タブ切り替え
  document.querySelectorAll('.tab-btn')[1].click();
  window.scrollTo(0, 0);
}

// ── ROLE UI ──
function updateFabForRole() {
  if (userRole !== 'editor') return; // admin/staff はデフォルト（公開する）のまま
  document.getElementById('fabBar').innerHTML = `
    <button class="btn-save-draft" onclick="saveArticle('draft')">下書き保存</button>
    <button class="btn-publish"    onclick="saveArticle('review')">承認依頼を送る</button>
  `;
}

// ── ARTICLES LIST ──
async function loadArticles() {
  if (!sb) return;
  const { data, error } = await sb.from('articles').select('*').order('created_at', { ascending: false });
  if (error) { showToast('読み込みエラー: ' + error.message); return; }
  articles = data || [];
  renderList();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const filtered = currentFilter === 'all' ? articles
    : articles.filter(a => a.status === currentFilter);
  document.getElementById('articleCount').textContent = filtered.length + ' 本';

  if (!filtered.length) {
    document.getElementById('articleList').innerHTML = '<div class="empty-state">記事がありません</div>';
    return;
  }

  document.getElementById('articleList').innerHTML = filtered.map(a => `
    <div class="article-card ${a.status}">
      <div class="card-top">
        <div class="card-title">${esc(a.title)}</div>
        <span class="status-badge s-${a.status}">${statusLabel(a.status)}</span>
      </div>
      <div class="card-meta">
        <span>${CAT_LABELS[a.category] || a.category}</span>
        <span>${esc(a.author_type)}</span>
        <span>${a.published_at ? new Date(a.published_at).toLocaleDateString('ja-JP') : new Date(a.created_at).toLocaleDateString('ja-JP')}</span>
        ${a.read_time_min ? '<span>約' + a.read_time_min + '分</span>' : ''}
      </div>
      <div class="card-actions">
        <button class="btn-sm btn-edit" onclick="openEditor('${a.id}')">編集</button>
        ${userRole === 'editor'
          ? '' // editor: 公開・削除ボタンなし
          : `
            ${a.status === 'review'
              ? `<button class="btn-sm btn-pub"   onclick="approveArticle('${a.id}')">✓ 承認・公開</button>
                 <button class="btn-sm btn-unpub" onclick="rejectArticle('${a.id}')">差し戻す</button>`
              : (a.is_published
                  ? `<button class="btn-sm btn-unpub" onclick="togglePublish('${a.id}', false)">非公開に</button>`
                  : `<button class="btn-sm btn-pub"   onclick="togglePublish('${a.id}', true)">公開する</button>`
                )
            }
            <button class="btn-sm btn-delete" onclick="deleteArticle('${a.id}')">削除</button>
          `}
        ${a.is_published ? `<a class="btn-sm btn-edit" href="article.html?slug=${a.slug}" target="_blank" style="text-decoration:none">表示 ↗</a>` : ''}
      </div>
      ${a.review_comment ? `<div style="margin-top:8px;padding:8px 10px;background:#fef3c7;border-radius:6px;font-size:11px;color:#92400e;">💬 差し戻しコメント：${esc(a.review_comment)}</div>` : ''}
    </div>
  `).join('');
}

function statusLabel(s) {
  return { draft: '下書き', review: 'レビュー待ち', published: '公開済み' }[s] || s;
}

// ── FORM ──
function resetForm() {
  ['f_title','f_slug','f_lead','f_content','f_tags','f_thumbnail','f_author_name','f_read_time'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_category').value = 'P';
  document.getElementById('f_author_type').value = '編集部';
  document.getElementById('editingId').value = '';
  // editor mode
  document.getElementById('f_content').style.display = 'block';
  document.getElementById('previewArea').classList.remove('visible');
  document.querySelectorAll('.preview-tab')[0].classList.add('active');
  document.querySelectorAll('.preview-tab')[1].classList.remove('active');
}

function fillForm(a) {
  document.getElementById('f_title').value       = a.title || '';
  document.getElementById('f_slug').value        = a.slug || '';
  document.getElementById('f_category').value    = a.category || 'P';
  document.getElementById('f_author_type').value = a.author_type || '編集部';
  document.getElementById('f_author_name').value = a.author_name || '';
  document.getElementById('f_lead').value        = a.lead_text || '';
  document.getElementById('f_content').value     = a.content || '';
  document.getElementById('f_tags').value        = (a.tags || []).join(', ');
  document.getElementById('f_thumbnail').value   = a.thumbnail_url || '';
  document.getElementById('f_read_time').value   = a.read_time_min || '';
}

function autoSlug() {
  const id = document.getElementById('editingId').value;
  if (id) return; // 編集中はスラッグ変更しない
  const t = document.getElementById('f_title').value;
  if (!document.getElementById('f_slug').dataset.manual) {
    const ts = Date.now();
    // タイトルから簡易スラッグ生成（英数字があれば使用、なければタイムスタンプ）
    const en = t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    document.getElementById('f_slug').value = en || 'article-' + ts;
  }
}

document.getElementById('f_slug').addEventListener('input', function() {
  this.dataset.manual = '1';
});

// ── SAVE ──
async function saveArticle(publishStatus) {
  const title   = document.getElementById('f_title').value.trim();
  const slug    = document.getElementById('f_slug').value.trim();
  const content = document.getElementById('f_content').value.trim();
  if (!title) { showToast('タイトルを入力してください'); document.getElementById('f_title').focus(); return; }
  if (!slug)  { showToast('スラッグを入力してください'); document.getElementById('f_slug').focus(); return; }

  const tagsRaw = document.getElementById('f_tags').value;
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const isPublished = publishStatus === 'published';

  const payload = {
    title,
    slug,
    category:      document.getElementById('f_category').value,
    author_type:   document.getElementById('f_author_type').value,
    author_name:   document.getElementById('f_author_name').value.trim() || null,
    lead_text:     document.getElementById('f_lead').value.trim() || null,
    content:       content || null,
    tags,
    read_time_min: parseInt(document.getElementById('f_read_time').value) || null,
    thumbnail_url: document.getElementById('f_thumbnail').value.trim() || null,
    status:        publishStatus,
    is_published:  isPublished,
    published_at:  isPublished ? new Date().toISOString() : null,
  };

  const editingId = document.getElementById('editingId').value;
  let error;

  if (editingId) {
    const res = await sb.from('articles').update(payload).eq('id', editingId);
    error = res.error;
  } else {
    payload.created_by = currentUser.id;
    const res = await sb.from('articles').insert(payload);
    error = res.error;
  }

  if (error) { showToast('保存エラー: ' + error.message); return; }

  showToast(isPublished ? '公開しました！' : '下書きを保存しました');
  resetForm();
  document.querySelectorAll('.tab-btn')[0].click();
}

// ── APPROVE / REJECT ──
async function approveArticle(id) {
  if (!confirm('この記事を承認して公開しますか？')) return;
  const { error } = await sb.from('articles').update({
    is_published:   true,
    status:         'published',
    published_at:   new Date().toISOString(),
    review_comment: null,
  }).eq('id', id);
  if (error) { showToast('エラー: ' + error.message); return; }
  showToast('承認・公開しました');
  loadArticles();
}

async function rejectArticle(id) {
  const reason = prompt('差し戻しコメント（任意。editor に表示されます）:') ?? null;
  const { error } = await sb.from('articles').update({
    status:         'draft',
    review_comment: reason || null,
  }).eq('id', id);
  if (error) { showToast('エラー: ' + error.message); return; }
  showToast('下書きに差し戻しました');
  loadArticles();
}

// ── TOGGLE PUBLISH ──
async function togglePublish(id, publish) {
  const { error } = await sb.from('articles').update({
    is_published: publish,
    status: publish ? 'published' : 'draft',
    published_at: publish ? new Date().toISOString() : null,
  }).eq('id', id);
  if (error) { showToast('エラー: ' + error.message); return; }
  showToast(publish ? '公開しました' : '非公開にしました');
  loadArticles();
}

// ── DELETE ──
async function deleteArticle(id) {
  if (!confirm('この記事を削除しますか？\nこの操作は取り消せません。')) return;
  const { error } = await sb.from('articles').delete().eq('id', id);
  if (error) { showToast('削除エラー: ' + error.message); return; }
  showToast('削除しました');
  loadArticles();
}

// ── PREVIEW ──
function showEditor(btn) {
  document.querySelectorAll('.preview-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('f_content').style.display = 'block';
  document.getElementById('previewArea').classList.remove('visible');
}
function showPreview(btn) {
  document.querySelectorAll('.preview-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('f_content').style.display = 'none';
  const html = document.getElementById('f_content').value;
  document.getElementById('previewArea').innerHTML = html || '<p style="color:#999">本文がありません</p>';
  document.getElementById('previewArea').classList.add('visible');
}

// ── SNIPPETS ──
const SNIPPETS = {
  h2: '<h2>見出しを入力</h2>\n',
  h3: '<h3>小見出しを入力</h3>\n',
  pullquote: `<div class="pullquote">\n  <p>「引用テキストをここに」</p>\n  <cite>— 氏名</cite>\n</div>\n`,
  info: `<div class="info-box">\n  <div class="info-box-title">💡 タイトル</div>\n  <p>内容を入力</p>\n</div>\n`,
  table: `<table class="compare-table">\n  <thead><tr><th>項目</th><th>A</th><th>B</th></tr></thead>\n  <tbody>\n    <tr><td class="label-col">比較1</td><td>内容A</td><td>内容B</td></tr>\n  </tbody>\n</table>\n`,
};
function insertSnippet(type) {
  const ta = document.getElementById('f_content');
  const pos = ta.selectionStart;
  const before = ta.value.substring(0, pos);
  const after  = ta.value.substring(pos);
  ta.value = before + SNIPPETS[type] + after;
  ta.focus();
  ta.setSelectionRange(pos + SNIPPETS[type].length, pos + SNIPPETS[type].length);
}

// ── UTILS ──
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

init();
</script>
