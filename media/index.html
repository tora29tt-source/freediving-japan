<script src="../js/home.js"></script>
<script>
// ── Supabase 動的読み込み ──
const _SURL = 'https://bbhqvbpsuccbdcnhnobm.supabase.co';
const _SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaHF2YnBzdWNjYmRjbmhub2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyODQwMzksImV4cCI6MjA5NTg2MDAzOX0.MexR8_hY56m3XRff0EJOQM3uQShXr2L9kGyYXLSzKbs';

const CAT_LABELS = { A:'入門・体験', B:'身体・科学', C:'海・スポット', D:'競技・大会', E:'インタビュー', P:'人物メディア', Q:'業界×期待感', S:'シリーズ連載', T:'エンタメ' };

// カテゴリ → フィルタータブのマッピング
const CAT_TO_TAB = { E:'interview', P:'interview', D:'news', Q:'news', A:'tips', B:'tips', C:'tips', S:'tips', T:'tips' };

const FALLBACK_IMG = '../images/hero_cnf_dive.jpg';

async function loadArticlesFromDB() {
  try {
    const { createClient } = window.supabase;
    if (!createClient) return; // ライブラリ未読み込み時はスキップ
    const sb = createClient(_SURL, _SKEY);
    const { data, error } = await sb
      .from('articles')
      .select('id, title, slug, category, author_type, lead_text, read_time_min, thumbnail_url, published_at, tags')
      .eq('is_published', true)
      .order('published_at', { ascending: false })
      .limit(20);

    if (error || !data || data.length === 0) {
      document.getElementById('empty-state').style.display = '';
      return;
    }

    renderDBArticles(data);
  } catch(e) {
    console.warn('DB読み込みスキップ:', e);
  }
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'.') : '';
}

function renderDBArticles(articles) {
  if (articles.length === 0) {
    document.getElementById('empty-state').style.display = '';
    return;
  }

  // 最新1件を看板記事に
  const featured = articles[0];
  const rest = articles.slice(1);

  const featuredSection = document.getElementById('section-featured');
  if (featuredSection) {
    featuredSection.style.display = '';
    featuredSection.dataset.hasData = '1';
    const tab = CAT_TO_TAB[featured.category] || 'tips';
    const dateStr = fmtDate(featured.published_at);
    const readTime = featured.read_time_min ? featured.read_time_min + '分' : '';
    document.getElementById('featured-card').href = `article.html?slug=${featured.slug}`;
    featuredSection.dataset.category = tab;
    document.getElementById('featured-img').src = featured.thumbnail_url || FALLBACK_IMG;
    document.getElementById('featured-badge').textContent = CAT_LABELS[featured.category] || '注目の記事';
    document.getElementById('featured-title').textContent = featured.title;
    document.getElementById('featured-excerpt').textContent = featured.lead_text || '';
    const metaBits = [readTime, dateStr, featured.author_type].filter(Boolean);
    document.getElementById('featured-meta').textContent = metaBits.join(' ・ ');
  }

  // 残り記事をカテゴリに振り分けてリストに追加
  const lists = { interview: document.getElementById('list-interview'), news: document.getElementById('list-news'), tips: document.getElementById('list-tips') };
  Object.values(lists).forEach(el => { if(el) el.innerHTML = ''; });
  const sections = { interview: document.getElementById('section-interview'), news: document.getElementById('section-news'), tips: document.getElementById('section-tips') };
  const shownSections = new Set();

  rest.forEach(a => {
    const tab = CAT_TO_TAB[a.category] || 'tips';
    const catLabel = CAT_LABELS[a.category] || a.category;
    const dateStr = fmtDate(a.published_at);
    const readTime = a.read_time_min ? a.read_time_min + '分' : '';
    const thumb = a.thumbnail_url || FALLBACK_IMG;
    const url = `article.html?slug=${a.slug}`;

    // セクションを初回表示
    if (!shownSections.has(tab)) {
      shownSections.add(tab);
      if (sections[tab]) { sections[tab].style.display = ''; sections[tab].dataset.hasData = '1'; }
    }

    if (tab === 'news') {
      const el = document.getElementById('list-news');
      if (el) el.insertAdjacentHTML('beforeend', `
        <a class="lcard" href="${escHtml(url)}">
          <div class="lcard-media"><img class="lcard-img" src="${escHtml(thumb)}" alt=""><span class="lcard-badge">${escHtml(catLabel)}</span></div>
          <div class="lcard-body">
            <p class="lcard-title">${escHtml(a.title)}</p>
            <p class="lcard-meta">${dateStr}</p>
            <p class="lcard-foot">${readTime ? escHtml(readTime) + ' ・ ' : ''}${escHtml(a.author_type || '')}</p>
          </div>
        </a>`);
    } else {
      const listId = tab === 'interview' ? 'list-interview' : 'list-tips';
      const el = document.getElementById(listId);
      if (el) el.insertAdjacentHTML('beforeend', `
        <a class="arow" href="${escHtml(url)}">
          <img class="arow-thumb" src="${escHtml(thumb)}" alt="">
          <div class="arow-body">
            <h3>${escHtml(a.title)}</h3>
            <p>${escHtml(a.lead_text || catLabel)}</p>
          </div>
          <span class="arow-arrow"><svg class="icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>`);
    }
  });
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── フィルター ──
function filterArticles(category, btn) {
  document.querySelectorAll('.chip[data-cat]').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const featuredSection = document.getElementById('section-featured');
  const sections = {
    interview: document.getElementById('section-interview'),
    news:      document.getElementById('section-news'),
    tips:      document.getElementById('section-tips'),
  };
  if (category === 'all') {
    if (featuredSection && featuredSection.dataset.hasData === '1') featuredSection.style.display = '';
    Object.values(sections).forEach(s => { if (s && s.dataset.hasData === '1') s.style.display = ''; });
  } else {
    if (featuredSection) featuredSection.style.display = (category === 'interview' && featuredSection.dataset.hasData === '1') ? '' : 'none';
    Object.entries(sections).forEach(([key, s]) => {
      if (!s) return;
      s.style.display = (key === category && s.dataset.hasData === '1') ? '' : 'none';
    });
  }
}

document.addEventListener('DOMContentLoaded', loadArticlesFromDB);
</script>
