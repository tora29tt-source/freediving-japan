<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Planner — Freediving Japan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+JP:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #090B0F; --bg3: #161b22; --border: #1e2530;
  --accent: #5AB4E8; --accent2: #2ec4b6; --warn: #f97316;
  --text: #e8edf3; --muted: #6b7a8d; --card: #111620;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; min-height: 100vh; }

.header {
  padding: 16px 20px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0;
  background: rgba(9,11,15,0.95); backdrop-filter: blur(10px); z-index: 100;
}
.header-back { color: var(--accent); text-decoration: none; font-size: 20px; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 18px; }
.header-badge {
  margin-left: auto; font-family: 'Space Mono', monospace; font-size: 10px;
  color: var(--accent); border: 1px solid var(--accent); padding: 2px 8px; border-radius: 3px;
}

.container { padding: 20px 20px 100px; max-width: 600px; margin: 0 auto; }
.section { margin-bottom: 24px; }
.section-label {
  font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.15em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
}
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.card-inner { padding: 16px; }

.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.field input, .field textarea, .field select {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300; font-size: 14px; padding: 10px 12px; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 70px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* URL fields */
.url-row { display: flex; gap: 8px; align-items: center; }
.url-row input { flex: 1; }
.url-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  font-size: 18px; width: 42px; height: 42px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: border-color 0.2s;
}
.url-btn:hover { border-color: var(--accent); }
.map-preview { display: none; margin-top: 8px; }
.map-preview.show { display: block; }
.map-open-btn {
  display: flex; align-items: center; gap: 10px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  color: var(--accent); text-decoration: none; font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
}

/* Timeline */
.tl-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
}
.tl-item:last-child { border-bottom: none; }
.tl-time { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent); min-width: 50px; padding-top: 2px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
.tl-body { flex: 1; }
.tl-label { font-size: 14px; font-weight: 400; }
.tl-note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
.tl-del:hover { color: #ef4444; }
.tl-empty { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
.add-tl {
  width: 100%; background: none; border: 1px dashed var(--border);
  border-radius: 0 0 12px 12px; color: var(--muted); padding: 12px;
  font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
}
.add-tl:hover { border-color: var(--accent); color: var(--accent); }

/* Participants */
.ptags { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; min-height: 52px; }
.ptag {
  display: flex; align-items: center; gap: 6px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px 5px 8px; font-size: 13px;
}
.ptag .av {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #000;
}
.ptag-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; }
.padd-row { display: flex; gap: 8px; padding: 0 16px 16px; }
.padd-row input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px; padding: 8px 12px; outline: none;
}
.padd-row button {
  background: var(--accent); border: none; border-radius: 8px;
  color: #000; font-size: 18px; width: 36px; cursor: pointer;
}

/* Spots */
.spot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 16px; }
.spot-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 12px;
  padding: 10px 12px; cursor: pointer; text-align: left;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  transition: border-color 0.15s, background 0.15s;
}
.spot-btn.active { border-color: var(--accent); background: rgba(90,180,232,0.08); color: var(--accent); }
.spot-name { font-weight: 500; font-size: 13px; }
.spot-pref { font-size: 10px; color: var(--muted); margin-top: 2px; }
.spot-btn.active .spot-pref { color: var(--accent); opacity: 0.7; }

/* Windy map */
.windy-wrap { position: relative; width: 100%; padding-bottom: 56%; background: var(--bg3); }
.windy-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.windy-ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }

/* Wind stats */
.wind-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); }
.wind-stat { background: var(--card); padding: 14px 10px; text-align: center; }
.wind-val { font-family: 'Space Mono', monospace; font-size: 22px; color: var(--accent); }
.wind-unit { font-size: 10px; color: var(--muted); margin-top: 1px; }
.wind-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }
.wind-chart-wrap { padding: 12px 16px 16px; }

/* Tide */
.tide-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tide-tag { font-family: 'Space Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
.tide-tag.h { border-color: var(--accent); color: var(--accent); }
.tide-tag.l { border-color: var(--accent2); color: var(--accent2); }

/* Loading */
.ld { display: flex; align-items: center; gap: 8px; padding: 16px; color: var(--muted); font-size: 13px; }
.spin { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { padding: 16px; color: var(--warn); font-size: 13px; }

/* Share */
.share-url { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); word-break: break-all; min-height: 40px; margin-bottom: 10px; }
.share-acts { display: flex; gap: 8px; }
.sbtn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--text); font-size: 13px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; }
.sbtn.p { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 500; }

/* Modal */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: flex-end; justify-content: center; }
.overlay.open { display: flex; }
.sheet { background: var(--bg3); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 600px; animation: up 0.25s ease; }
@keyframes up { from { transform: translateY(100%); } }
.sh { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
.sheet-title { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 16px; }
.macts { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; border: none; font-weight: 500; }
.btn-g { background: var(--border); color: var(--text); }
.btn-p { background: var(--accent); color: #000; }

/* Save bar */
.save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9,11,15,0.97); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 12px 20px; z-index: 100; }
.save-bar button { width: 100%; padding: 13px; border-radius: 10px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; cursor: pointer; border: none; background: var(--accent); color: #000; }

/* Toast */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 1px solid var(--accent); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 300; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div style="background:#1a1200;border-bottom:1px solid #f9731640;padding:10px 20px;font-size:12px;color:#f97316;font-family:'Space Mono',monospace;letter-spacing:0.05em;">
  ⚠ この機能は開発継続を検討中です
</div>

<div class="header">
  <a href="../mypage.html" class="header-back">‹</a>
  <div class="header-title">Session Planner</div>
  <div class="header-badge">BETA</div>
</div>

<div class="container">

  <!-- 基本情報 -->
  <div class="section">
    <div class="section-label">基本情報</div>
    <div class="card"><div class="card-inner">
      <div class="field">
        <div class="field-label">セッション名</div>
        <input type="text" id="sName" placeholder="例：鹿児島 朝潜り" />
      </div>
      <div class="field-row">
        <div class="field">
          <div class="field-label">日付</div>
          <input type="date" id="sDate" />
        </div>
        <div class="field">
          <div class="field-label">タイプ</div>
          <select id="sType">
            <option value="buddy">🤿 バディトレーニング</option>
            <option value="coaching">🎯 コーチングセッション</option>
            <option value="fun">🌊 ファンダイビング</option>
            <option value="lesson">📚 講習</option>
          </select>
        </div>
      </div>
      <div class="field">
        <div class="field-label">集合場所（Google Maps URL）</div>
        <div class="url-row">
          <input type="url" id="sMeet" placeholder="https://maps.app.goo.gl/..." />
          <button class="url-btn" onclick="openMap('sMeet')">📍</button>
        </div>
        <div class="map-preview" id="meetPreview"></div>
      </div>
      <div class="field">
        <div class="field-label">駐車場（Google Maps URL）</div>
        <div class="url-row">
          <input type="url" id="sPark" placeholder="https://maps.app.goo.gl/..." />
          <button class="url-btn" onclick="openMap('sPark')">🅿️</button>
        </div>
        <div class="map-preview" id="parkPreview"></div>
      </div>
      <div class="field">
        <div class="field-label">メモ</div>
        <textarea id="sNote" placeholder="持ち物・注意事項など"></textarea>
      </div>
    </div></div>
  </div>

  <!-- タイムライン -->
  <div class="section">
    <div class="section-label">タイムライン</div>
    <div class="card">
      <div id="tlList"></div>
      <button class="add-tl" onclick="openTlModal()">＋ 時刻を追加</button>
    </div>
  </div>

  <!-- 参加者 -->
  <div class="section">
    <div class="section-label">参加者</div>
    <div class="card">
      <div class="ptags" id="ptags"></div>
      <div class="padd-row">
        <input type="text" id="pInput" placeholder="名前を入力..." />
        <button onclick="addP()">＋</button>
      </div>
    </div>
  </div>

  <!-- スポット -->
  <div class="section">
    <div class="section-label">スポット（天気・潮汐データ取得）</div>
    <div class="card">
      <div class="spot-grid" id="spotGrid"></div>
    </div>
  </div>

  <!-- 風・波 -->
  <div class="section">
    <div class="section-label">風・波</div>
    <div class="card">
      <div style="padding:12px 12px 0">
        <div class="windy-wrap" id="windyWrap">
          <div class="windy-ph" id="windyPh">
            <span style="font-size:32px">🌊</span>
            <span>スポットを選択してください</span>
          </div>
        </div>
      </div>
      <div id="windStats"></div>
    </div>
  </div>

  <!-- 潮汐 -->
  <div class="section">
    <div class="section-label">潮汐</div>
    <div class="card"><div class="card-inner">
      <div class="tide-meta" id="tideMeta">
        <span style="color:var(--muted);font-size:13px">スポットを選択すると表示されます</span>
      </div>
      <canvas id="tideChart" height="120"></canvas>
    </div></div>
  </div>

  <!-- 共有 -->
  <div class="section">
    <div class="section-label">共有リンク</div>
    <div class="card"><div class="card-inner">
      <div class="share-url" id="shareUrl">セッションを保存すると共有リンクが発行されます</div>
      <div class="share-acts">
        <button class="sbtn" onclick="copyLink()">📋 コピー</button>
        <button class="sbtn p" onclick="save()">🔗 保存 &amp; リンク発行</button>
      </div>
    </div></div>
  </div>

</div>

<!-- Timeline Modal -->
<div class="overlay" id="tlModal" onclick="if(event.target===this)closeTlModal()">
  <div class="sheet">
    <div class="sh"></div>
    <div class="sheet-title">時刻を追加</div>
    <div class="field">
      <div class="field-label">時刻</div>
      <input type="time" id="tlTime" />
    </div>
    <div class="field">
      <div class="field-label">内容</div>
      <input type="text" id="tlLabel" placeholder="例：集合、入水、昼食..." />
    </div>
    <div class="field">
      <div class="field-label">メモ（任意）</div>
      <input type="text" id="tlNote" placeholder="補足" />
    </div>
    <div class="macts">
      <button class="btn btn-g" onclick="closeTlModal()">キャンセル</button>
      <button class="btn btn-p" onclick="addTl()">追加</button>
    </div>
  </div>
</div>

<div class="save-bar"><button onclick="save()">保存する</button></div>
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
const SPOTS = [
  { id:'kagoshima', name:'鹿児島湾',     pref:'鹿児島県', lat:31.5966, lon:130.5571, pc:'46', hc:'4601' },
  { id:'tanegashima',name:'種子島',      pref:'鹿児島県', lat:30.4413, lon:130.9665, pc:'46', hc:'4611' },
  { id:'yakushima', name:'屋久島',       pref:'鹿児島県', lat:30.3623, lon:130.6566, pc:'46', hc:'4615' },
  { id:'amami',     name:'奄美大島',     pref:'鹿児島県', lat:28.3742, lon:129.4950, pc:'46', hc:'4621' },
  { id:'okinawa',   name:'那覇',         pref:'沖縄県',   lat:26.2124, lon:127.6792, pc:'47', hc:'4701' },
  { id:'miyako',    name:'宮古島',       pref:'沖縄県',   lat:24.8055, lon:125.2812, pc:'47', hc:'4720' },
  { id:'ishigaki',  name:'石垣島',       pref:'沖縄県',   lat:24.3448, lon:124.1572, pc:'47', hc:'4730' },
  { id:'izu',       name:'伊豆海洋公園', pref:'静岡県',   lat:34.8755, lon:139.1082, pc:'22', hc:'2205' },
  { id:'tateyama',  name:'館山',         pref:'千葉県',   lat:34.9971, lon:139.8693, pc:'12', hc:'1201' },
  { id:'manazuru',  name:'真鶴',         pref:'神奈川県', lat:35.1472, lon:139.1398, pc:'14', hc:'1401' },
];

let spot = null;
let tlItems = [];
let tlId = 0;
let parts = [];
let tideChart = null;
let windChart = null;

// ===== INIT =====
(function init() {
  const today = new Date();
  document.getElementById('sDate').value =
    `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  renderSpots();
  renderTl();
  renderParts();

  document.getElementById('pInput').addEventListener('keydown', e => { if(e.key==='Enter') addP(); });

  // URL入力のリアルタイムプレビュー
  document.getElementById('sMeet').addEventListener('input', () => updateMapPreview('sMeet','meetPreview'));
  document.getElementById('sPark').addEventListener('input', () => updateMapPreview('sPark','parkPreview'));

  loadLocal();
})();

// ===== MAP PREVIEW =====
function updateMapPreview(inputId, previewId) {
  const url = document.getElementById(inputId).value.trim();
  const el = document.getElementById(previewId);
  if (!url || !url.startsWith('http')) {
    el.className = 'map-preview';
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `<a href="${url}" target="_blank" class="map-open-btn">📍 Google Mapsで開く ›</a>`;
  el.className = 'map-preview show';
}

function openMap(id) {
  const url = document.getElementById(id).value.trim();
  if (!url) { toast('URLを入力してください'); return; }
  window.open(url, '_blank');
}

// ===== SPOTS =====
function renderSpots() {
  const grid = document.getElementById('spotGrid');
  grid.innerHTML = '';
  SPOTS.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'spot-btn' + (spot?.id === s.id ? ' active' : '');
    btn.innerHTML = `<div class="spot-name">${s.name}</div><div class="spot-pref">${s.pref}</div>`;

    // スクロールと誤タップを区別
    let startY = 0, startTime = 0;
    btn.addEventListener('touchstart', e => {
      startY = e.touches[0].clientY;
      startTime = Date.now();
    }, { passive: true });
    btn.addEventListener('touchend', e => {
      const dy = Math.abs(e.changedTouches[0].clientY - startY);
      const dt = Date.now() - startTime;
      if (dy < 10 && dt < 300) {
        e.preventDefault();
        selectSpot(s.id);
      }
    });
    btn.addEventListener('click', () => selectSpot(s.id));

    grid.appendChild(btn);
  });
}

function selectSpot(id) {
  spot = SPOTS.find(s => s.id === id);
  renderSpots();
  updateWindyMap();
  fetchWind();
  fetchTide();
}

// ===== WINDY MAP =====
function updateWindyMap() {
  const wrap = document.getElementById('windyWrap');
  const ph = document.getElementById('windyPh');
  if (ph) ph.remove();
  const old = wrap.querySelector('iframe');
  if (old) old.remove();

  const { lat, lon } = spot;
  const iframe = document.createElement('iframe');
  iframe.src = `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}&zoom=9&level=surface&overlay=wind&product=ecmwf&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=true&metricWind=m%2Fs&metricTemp=%C2%B0C&radarRange=-1`;
  iframe.allowFullscreen = true;
  wrap.appendChild(iframe);
}

// ===== WIND DATA =====
async function fetchWind() {
  const el = document.getElementById('windStats');
  el.innerHTML = '<div class="ld"><div class="spin"></div>風データを取得中...</div>';

  const { lat, lon } = spot;

  try {
    // 風（Open-Meteo）
    const wRes = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=2`
    );
    if (!wRes.ok) throw new Error(`HTTP ${wRes.status}`);
    const wData = await wRes.json();

    // 波（Marine API、失敗してもOK）
    let waveArr = [];
    try {
      const mRes = await fetch(
        `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height&timezone=Asia%2FTokyo&forecast_days=2`
      );
      if (mRes.ok) {
        const mData = await mRes.json();
        waveArr = mData?.hourly?.wave_height || [];
      }
    } catch(_) {}

    renderWind(wData, waveArr);
  } catch(e) {
    el.innerHTML = `<div class="err">⚠️ 取得失敗: ${e.message}</div>`;
  }
}

function renderWind(wData, waveArr) {
  const el = document.getElementById('windStats');
  const times  = wData?.hourly?.time || [];
  const speeds = wData?.hourly?.wind_speed_10m || [];
  const dirs   = wData?.hourly?.wind_direction_10m || [];

  if (!times.length) {
    el.innerHTML = '<div class="err">データが取得できませんでした</div>';
    return;
  }

  // 現在に最も近いインデックス
  const now = Date.now();
  let idx = 0, minDiff = Infinity;
  times.forEach((t, i) => {
    const diff = Math.abs(new Date(t).getTime() - now);
    if (diff < minDiff) { minDiff = diff; idx = i; }
  });

  const speed = parseFloat(speeds[idx] ?? 0);
  const dir   = parseFloat(dirs[idx] ?? 0);
  const wave  = waveArr[idx] != null ? parseFloat(waveArr[idx]) : null;
  const DIRS  = ['N','NE','E','SE','S','SW','W','NW'];
  const dirLbl = DIRS[Math.round(dir / 45) % 8];

  el.innerHTML = `
    <div class="wind-stats">
      <div class="wind-stat">
        <div class="wind-val">${speed.toFixed(1)}</div>
        <div class="wind-unit">m/s</div>
        <div class="wind-lbl">風速</div>
      </div>
      <div class="wind-stat">
        <div class="wind-val">${dirLbl}</div>
        <div class="wind-unit"></div>
        <div class="wind-lbl">風向</div>
      </div>
      <div class="wind-stat">
        <div class="wind-val">${wave != null ? wave.toFixed(1) : '—'}</div>
        <div class="wind-unit">m</div>
        <div class="wind-lbl">波高</div>
      </div>
    </div>
    <div class="wind-chart-wrap"><canvas id="windChart" height="80"></canvas></div>
  `;

  // グラフ（次8時間）
  const slice = 8;
  const lbls  = times.slice(idx, idx+slice).map(t => `${new Date(t).getHours()}:00`);
  const spds  = speeds.slice(idx, idx+slice).map(v => +parseFloat(v ?? 0).toFixed(1));
  const wavs  = waveArr.length
    ? waveArr.slice(idx, idx+slice).map(v => v != null ? +parseFloat(v).toFixed(2) : null)
    : [];

  if (windChart) windChart.destroy();
  const ctx = document.getElementById('windChart');
  const datasets = [{
    label: '風速 m/s',
    data: spds,
    borderColor: '#5AB4E8',
    backgroundColor: 'rgba(90,180,232,0.1)',
    borderWidth: 2, tension: 0.4, pointRadius: 3, fill: true, yAxisID: 'y'
  }];
  if (wavs.length) datasets.push({
    label: '波高 m',
    data: wavs,
    borderColor: '#2ec4b6',
    backgroundColor: 'transparent',
    borderWidth: 2, tension: 0.4, pointRadius: 3, borderDash: [4,4], yAxisID: 'y1'
  });

  windChart = new Chart(ctx, {
    type: 'line',
    data: { labels: lbls, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#6b7a8d', font: { size: 11 }, boxWidth: 14 } } },
      scales: {
        x:  { ticks: { color: '#6b7a8d', font: { size: 10 } }, grid: { color: '#1e2530' } },
        y:  { ticks: { color: '#5AB4E8', font: { size: 10 } }, grid: { color: '#1e2530' }, position: 'left' },
        y1: { ticks: { color: '#2ec4b6', font: { size: 10 } }, grid: { display: false }, position: 'right' }
      }
    }
  });
}

// ===== TIDE =====
async function fetchTide() {
  document.getElementById('tideMeta').innerHTML = '<div class="ld"><div class="spin"></div>潮汐データを取得中...</div>';
  if (tideChart) { tideChart.destroy(); tideChart = null; }
  document.getElementById('tideChart').getContext('2d').clearRect(0,0,9999,9999);

  const dateStr = document.getElementById('sDate').value || new Date().toISOString().slice(0,10);
  const [yr, mn, dy] = dateStr.split('-');
  const { pc, hc, name } = spot;

  try {
    const res = await fetch(`https://api.tide736.net/get_tide.php?pc=${pc}&hc=${hc}&yr=${yr}&mn=${mn}&dy=${dy}&rg=1`);
    const data = await res.json();
    if (data.status !== 1) throw new Error('status=0');
    renderTide(data);
  } catch(e) {
    document.getElementById('tideMeta').innerHTML = `<span class="tide-tag">⚠️ 潮汐データ取得失敗 (CORS制限の可能性)</span>`;
  }
}

function renderTide(data) {
  const chart = data.tide?.chart || {};
  const key = Object.keys(chart)[0];
  const day = chart[key] || {};
  const pts    = day.tide   || [];
  const floods = day.flood  || [];
  const edds   = day.edd    || [];
  const moon   = day.moon   || {};

  document.getElementById('tideMeta').innerHTML = [
    ...floods.map(f => `<span class="tide-tag h">▲ 満潮 ${f.time} (${f.cm}cm)</span>`),
    ...edds.map(e   => `<span class="tide-tag l">▽ 干潮 ${e.time} (${e.cm}cm)</span>`),
    moon.title ? `<span class="tide-tag">🌕 ${moon.title}</span>` : ''
  ].join('');

  if (!pts.length) return;
  const labels = pts.map(p => p.time);
  const values = pts.map(p => parseInt(p.cm));

  if (tideChart) tideChart.destroy();
  tideChart = new Chart(document.getElementById('tideChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: '#5AB4E8',
        backgroundColor: 'rgba(90,180,232,0.08)',
        borderWidth: 2, tension: 0.4, pointRadius: 0, fill: true
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.parsed.y} cm` } } },
      scales: {
        x: { ticks: { color: '#6b7a8d', font: { size: 9 }, maxTicksLimit: 8, maxRotation: 0 }, grid: { color: '#1e2530' } },
        y: { ticks: { color: '#6b7a8d', font: { size: 10 }, callback: v => `${v}cm` }, grid: { color: '#1e2530' } }
      }
    }
  });
}

// ===== TIMELINE =====
function renderTl() {
  const el = document.getElementById('tlList');
  if (!tlItems.length) {
    el.innerHTML = '<div class="tl-empty">まだ予定がありません</div>';
    return;
  }
  const sorted = [...tlItems].sort((a,b) => a.time.localeCompare(b.time));
  el.innerHTML = sorted.map(item => `
    <div class="tl-item">
      <div class="tl-time">${item.time}</div>
      <div class="tl-dot"></div>
      <div class="tl-body">
        <div class="tl-label">${item.label}</div>
        ${item.note ? `<div class="tl-note">${item.note}</div>` : ''}
      </div>
      <button class="tl-del" onclick="delTl(${item.id})">×</button>
    </div>
  `).join('');
}
function openTlModal() {
  document.getElementById('tlTime').value = '';
  document.getElementById('tlLabel').value = '';
  document.getElementById('tlNote').value = '';
  document.getElementById('tlModal').classList.add('open');
}
function closeTlModal() { document.getElementById('tlModal').classList.remove('open'); }
function addTl() {
  const t = document.getElementById('tlTime').value;
  const l = document.getElementById('tlLabel').value.trim();
  if (!t || !l) return;
  tlItems.push({ id: tlId++, time: t, label: l, note: document.getElementById('tlNote').value.trim() });
  renderTl();
  closeTlModal();
}
function delTl(id) { tlItems = tlItems.filter(i => i.id !== id); renderTl(); }

// ===== PARTICIPANTS =====
function renderParts() {
  const el = document.getElementById('ptags');
  el.innerHTML = parts.length
    ? parts.map((p,i) => `<div class="ptag"><div class="av">${p[0]}</div>${p}<button class="ptag-del" onclick="delP(${i})">×</button></div>`).join('')
    : '<span style="color:var(--muted);font-size:13px">参加者を追加してください</span>';
}
function addP() {
  const el = document.getElementById('pInput');
  const n = el.value.trim();
  if (!n || parts.includes(n)) { el.value=''; return; }
  parts.push(n); el.value='';
  renderParts();
}
function delP(i) { parts.splice(i,1); renderParts(); }

// ===== SAVE / SHARE =====
function getData() {
  return {
    name: document.getElementById('sName').value,
    date: document.getElementById('sDate').value,
    type: document.getElementById('sType').value,
    meet: document.getElementById('sMeet').value,
    park: document.getElementById('sPark').value,
    note: document.getElementById('sNote').value,
    tl: tlItems, parts,
    spot: spot?.id || null,
    token: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)
  };
}
function save() {
  const d = getData();
  localStorage.setItem('fdj_session', JSON.stringify(d));
  const enc = btoa(unescape(encodeURIComponent(JSON.stringify(d))));
  const url = `${location.origin}/session-view.html?d=${enc}`;
  document.getElementById('shareUrl').textContent = url;
  toast('✅ 保存しました');
}
function copyLink() {
  const t = document.getElementById('shareUrl').textContent;
  if (t.includes('保存すると')) { toast('先に保存してください'); return; }
  navigator.clipboard.writeText(t).then(() => toast('📋 コピーしました'));
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem('fdj_session') || 'null');
    if (!d) return;
    if (d.name) document.getElementById('sName').value = d.name;
    if (d.date) document.getElementById('sDate').value = d.date;
    if (d.type) document.getElementById('sType').value = d.type;
    if (d.meet) { document.getElementById('sMeet').value = d.meet; updateMapPreview('sMeet','meetPreview'); }
    if (d.park) { document.getElementById('sPark').value = d.park; updateMapPreview('sPark','parkPreview'); }
    if (d.note) document.getElementById('sNote').value = d.note;
    if (d.tl)   { tlItems = d.tl; tlId = tlItems.length; renderTl(); }
    if (d.parts){ parts = d.parts; renderParts(); }
    if (d.spot) selectSpot(d.spot);
  } catch(_) {}
}

// ===== TOAST =====
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
